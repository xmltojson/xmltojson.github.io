<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Geometry Dash</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Segoe UI', Tahoma, sans-serif;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
    }

    html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
    }

    body {
        background: linear-gradient(135deg, #1a1a2e, #16213e);
        display: flex;
        justify-content: center;
        align-items: center;
    }

    #gameContainer {
        position: relative;
        width: 100vw;
        height: 100vh;
        max-width: 100vw;
        max-height: 100vh;
        background: #000;
        overflow: hidden;
    }

    canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: #000;
        touch-action: none;
    }

    #ui {
        position: absolute;
        top: 10px;
        left: 10px;
        color: #fff;
        font-size: clamp(12px, 3vw, 18px);
        text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        z-index: 10;
        pointer-events: none;
    }

    #ui div { margin-bottom: 4px; }

    .progress-bar {
        position: absolute;
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
        width: min(60vw, 300px);
        height: 16px;
        background: rgba(0,0,0,0.4);
        border-radius: 10px;
        overflow: hidden;
        border: 2px solid rgba(255,255,255,0.3);
        z-index: 10;
        pointer-events: none;
    }

    .progress-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #00ffcc, #00ccff);
        transition: width 0.1s linear;
    }

    .progress-text {
        position: absolute;
        top: 0; left: 0;
        width: 100%; text-align: center;
        color: #fff; font-size: 11px; line-height: 16px;
        font-weight: bold; text-shadow: 1px 1px 2px #000;
    }

    #menu {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: rgba(10, 10, 30, 0.95);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        z-index: 20;
        padding: 4vh 4vw;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
    }

    #menu h1 {
        font-size: clamp(28px, 8vw, 48px);
        background: linear-gradient(90deg, #00ffcc, #00ccff, #ff00cc);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 6px;
        text-align: center;
    }

    #menu p.subtitle {
        color: #aaa;
        margin-bottom: 20px;
        font-size: clamp(12px, 3.5vw, 16px);
        text-align: center;
    }

    .levels-grid {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 2vw;
        width: 100%;
        max-width: 700px;
    }

    .level-card {
        aspect-ratio: 0.85;
        border-radius: 10px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: transform 0.2s, box-shadow 0.2s;
        position: relative;
        color: #fff;
        border: 3px solid rgba(255,255,255,0.2);
        padding: 4px;
    }

    .level-card:active {
        transform: scale(0.95);
    }
    @media (hover: hover) {
        .level-card:hover {
            transform: scale(1.08);
            box-shadow: 0 0 20px rgba(0, 200, 255, 0.7);
        }
    }

    .level-card .num {
        font-size: clamp(20px, 5vw, 36px);
        font-weight: bold;
    }

    .level-card .name {
        font-size: clamp(8px, 2vw, 11px);
        margin-top: 4px;
        text-align: center;
        line-height: 1.1;
    }

    .level-card .best {
        font-size: clamp(7px, 1.8vw, 10px);
        margin-top: 4px;
        color: #ffe600;
    }

    .level-card.locked {
        opacity: 0.4;
        cursor: not-allowed;
        filter: grayscale(1);
    }

    .level-card.completed::after {
        content: '★';
        position: absolute;
        top: 3px; right: 5px;
        color: #ffe600;
        font-size: clamp(12px, 3vw, 20px);
    }

    #overlay {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: rgba(0,0,0,0.8);
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 15;
        color: #fff;
        padding: 20px;
        text-align: center;
    }

    #overlay h2 {
        font-size: clamp(28px, 7vw, 42px);
        margin-bottom: 12px;
    }

    #overlay p {
        font-size: clamp(14px, 4vw, 20px);
        margin-bottom: 20px;
    }

    .btn-row {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px;
    }

    button {
        background: linear-gradient(90deg, #00ccff, #0088ff);
        color: #fff;
        border: none;
        padding: 12px 24px;
        font-size: clamp(14px, 4vw, 18px);
        border-radius: 8px;
        cursor: pointer;
        transition: transform 0.15s;
        font-weight: bold;
    }

    button:active { transform: scale(0.95); }

    .reset-btn {
        background: linear-gradient(90deg, #ff5555, #cc0000);
        margin-top: 22px;
        padding: 8px 20px;
        font-size: clamp(12px, 3vw, 14px);
    }

    .attempt-badge {
        position: absolute;
        bottom: 10px; right: 10px;
        color: #fff; font-size: clamp(12px, 3vw, 16px);
        text-shadow: 1px 1px 3px #000;
        z-index: 10;
        pointer-events: none;
    }

    .hint {
        position: absolute;
        bottom: 35%; left: 50%;
        transform: translateX(-50%);
        color: rgba(255,255,255,0.8);
        font-size: clamp(14px, 4vw, 22px);
        z-index: 5;
        animation: pulse 1.5s infinite;
        text-align: center;
        width: 90%;
        pointer-events: none;
    }

    @keyframes pulse {
        0%,100% { opacity: 0.4; }
        50% { opacity: 1; }
    }
</style>
</head>
<body>
<div id="gameContainer">
    <canvas id="game"></canvas>

    <div id="ui">
        <div id="levelName">Level 1</div>
        <div id="modeInfo"></div>
    </div>

    <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
        <div class="progress-text" id="progressText">0%</div>
    </div>

    <div class="attempt-badge" id="attemptBadge">Attempt 1</div>
    <div class="hint" id="hint">Tap / SPACE to Jump</div>

    <div id="menu">
        <h1>GEOMETRY DASH</h1>
        <p class="subtitle">Jump, Fly, Survive — 10 Levels Await</p>
        <div class="levels-grid" id="levelsGrid"></div>
        <button class="reset-btn" onclick="game.resetProgress()">Reset Progress</button>
    </div>

    <div id="overlay">
        <h2 id="overlayTitle">Game Over</h2>
        <p id="overlayText"></p>
        <div class="btn-row">
            <button onclick="game.retry()">Retry</button>
            <button onclick="game.nextLevel()" id="nextBtn" style="display:none">Next</button>
            <button onclick="game.toMenu()">Menu</button>
        </div>
    </div>
</div>

<script>
// ============ GAME STATE / STORAGE ============
const STORAGE_KEY = 'geometryDashState';

function defaultState() {
    return {
        unlocked: 1,
        completed: {},
        best: {},
        attempts: {},
        currentLevel: null
    };
}

function loadState() {
    try {
        const s = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (s && typeof s === 'object') {
            const d = defaultState();
            return {
                unlocked: (typeof s.unlocked === 'number' && s.unlocked >= 1) ? s.unlocked : 1,
                completed: s.completed || d.completed,
                best: s.best || d.best,
                attempts: s.attempts || d.attempts,
                currentLevel: (s.currentLevel !== undefined) ? s.currentLevel : null
            };
        }
    } catch(e){}
    return defaultState();
}

function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

let state = loadState();

// ============ LEVEL DEFINITIONS ============
const THEMES = [
    {name:"Stereo Madness", bg:["#1e3c72","#2a5298"], player:"#00ffcc", ground:"#0a1a3a"},
    {name:"Back On Track",  bg:["#8e2de2","#4a00e0"], player:"#ffcc00", ground:"#2a0a4a"},
    {name:"Polargeist",     bg:["#134e5e","#71b280"], player:"#ff5e62", ground:"#0a3a2a"},
    {name:"Dry Out",        bg:["#c94b4b","#4b134f"], player:"#00ffff", ground:"#3a0a2a"},
    {name:"Base After Base",bg:["#ff512f","#dd2476"], player:"#00ff88", ground:"#4a1a0a"},
    {name:"Cant Let Go",    bg:["#2b5876","#4e4376"], player:"#ffee00", ground:"#0a1a3a"},
    {name:"Jumper",         bg:["#eb3349","#f45c43"], player:"#00ccff", ground:"#4a0a1a"},
    {name:"Time Machine",   bg:["#141e30","#243b55"], player:"#ff44cc", ground:"#0a0a2a"},
    {name:"Cycles",         bg:["#0f0c29","#302b63"], player:"#44ffaa", ground:"#141230"},
    {name:"xStep Fury",     bg:["#000428","#004e92"], player:"#ff2200", ground:"#000a2a"},
];

const GAME_W = 800;
const GAME_H = 500;
const GROUND_Y = 420;
const TILE = 40;

// ---- EASIER LEVEL GENERATION ----
// Bigger, more consistent gaps; fewer stacked obstacles; single spikes mostly.
function generateLevel(idx) {
    const rng = mulberry32(idx * 9999 + 12345);
    const objects = [];
    const difficulty = idx;
    let x = 700; // more runway before first obstacle
    const length = 4200 + idx * 600;

    // Base safe gap is large; only shrinks slightly with difficulty
    const baseGap = 340 - difficulty * 6;

    while (x < length) {
        const r = rng();
        // Generous gap so player always has time to react/land
        const gap = baseGap + rng() * 120;

        if (idx >= 5 && r < 0.10) {
            // Flight section — obstacles spaced wide & centered
            objects.push({type:'portal', mode:'fly', x:x});
            let fx = x + 160;
            const flyLen = 700 + rng()*400;
            while (fx < x + flyLen) {
                // gaps are wide and openings are large
                objects.push({type:'block', x:fx, y: GROUND_Y - 60 - rng()*60, w:TILE, h:TILE});
                fx += 260 + rng()*120;
            }
            objects.push({type:'portal', mode:'cube', x:fx});
            x = fx + 320;
        } else if (r < 0.40) {
            // Single spike (easy jump)
            objects.push({type:'spike', x:x, y:GROUND_Y});
            x += gap;
        } else if (r < 0.62) {
            // Low block to jump onto/over
            const h = TILE; // always single height = easy
            objects.push({type:'block', x:x, y:GROUND_Y - h, w:TILE, h:h});
            x += gap;
        } else if (r < 0.80 && idx > 1) {
            // Jump orb — clearly separated, no spike trap right after
            objects.push({type:'orb', x:x, y:GROUND_Y - 110});
            x += gap;
        } else if (r < 0.92) {
            // Double spike only from mid levels, still one jump
            objects.push({type:'spike', x:x, y:GROUND_Y});
            if (idx > 4) objects.push({type:'spike', x:x+TILE, y:GROUND_Y});
            x += gap + 40;
        } else {
            // Small 2-step stair (easy)
            objects.push({type:'block', x:x, y:GROUND_Y-TILE, w:TILE, h:TILE});
            objects.push({type:'block', x:x+TILE, y:GROUND_Y-TILE*2, w:TILE, h:TILE*2});
            x += gap + TILE*2;
        }
    }
    return {length: length + 500, objects, theme: THEMES[idx]};
}

function mulberry32(a){
    return function(){
        a |= 0; a = a + 0x6D2B79F5 | 0;
        let t = Math.imul(a ^ a >>> 15, 1 | a);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
    }
}

// ============ GAME ENGINE ============
class Game {
    constructor() {
        this.canvas = document.getElementById('game');
        this.ctx = this.canvas.getContext('2d');
        this.W = GAME_W;
        this.H = GAME_H;
        this.running = false;
        this.levelIdx = 0;
        this.particles = [];
        this.bgOffset = 0;
        this.pressing = false;
        this.jumpBuffer = 0;   // frames remaining to auto-jump after press
        this.coyote = 0;       // frames still allowed to jump after leaving ground

        this.setupCanvas();
        window.addEventListener('resize', () => this.setupCanvas());
        window.addEventListener('orientationchange', () => setTimeout(()=>this.setupCanvas(), 200));

        this.setupInput();
        this.buildMenu();
        this.loop = this.loop.bind(this);
        requestAnimationFrame(this.loop);
    }

    setupCanvas() {
        const container = document.getElementById('gameContainer');
        const cw = container.clientWidth;
        const ch = container.clientHeight;
        const dpr = window.devicePixelRatio || 1;

        this.canvas.width = Math.floor(cw * dpr);
        this.canvas.height = Math.floor(ch * dpr);
        this.canvas.style.width = cw + 'px';
        this.canvas.style.height = ch + 'px';

        const scale = Math.min(cw / GAME_W, ch / GAME_H);
        this.scale = scale * dpr;
        this.offsetX = (cw * dpr - GAME_W * this.scale) / 2;
        this.offsetY = (ch * dpr - GAME_H * this.scale) / 2;
    }

    buildMenu() {
        const grid = document.getElementById('levelsGrid');
        grid.innerHTML = '';
        for (let i=0;i<10;i++){
            const card = document.createElement('div');
            card.className = 'level-card';
            const th = THEMES[i];
            card.style.background = `linear-gradient(135deg, ${th.bg[0]}, ${th.bg[1]})`;
            const unlocked = (i + 1) <= state.unlocked;
            if (!unlocked) card.classList.add('locked');
            if (state.completed[i]) card.classList.add('completed');
            const best = state.best[i] || 0;
            card.innerHTML = `<div class="num">${i+1}</div>
                <div class="name">${th.name}</div>
                <div class="best">${unlocked ? 'Best '+best+'%' : '🔒'}</div>`;
            if (unlocked) {
                card.onclick = () => this.startLevel(i);
            }
            grid.appendChild(card);
        }
    }

    startLevel(idx) {
        this.levelIdx = idx;
        this.level = generateLevel(idx);
        state.currentLevel = idx;
        if (state.attempts[idx] === undefined) state.attempts[idx] = 0;
        saveState();
        document.getElementById('menu').style.display = 'none';
        document.getElementById('overlay').style.display = 'none';
        this.resetRun();
    }

    resetRun() {
        state.attempts[this.levelIdx] = (state.attempts[this.levelIdx]||0)+1;
        saveState();
        this.player = {
            x: 120, y: GROUND_Y - TILE, vy: 0, size: TILE-4,
            onGround: true, rotation: 0, mode: 'cube', dead: false
        };
        this.camX = 0;
        // SLOWER speed = easier, small ramp per level
        this.speed = 4.2 + this.levelIdx * 0.15;
        this.progress = 0;
        this.particles = [];
        this.running = true;
        this.won = false;
        this.jumpBuffer = 0;
        this.coyote = 0;
        document.getElementById('levelName').textContent = `Lvl ${this.levelIdx+1}: ${this.level.theme.name}`;
        document.getElementById('attemptBadge').textContent = `Attempt ${state.attempts[this.levelIdx]}`;
        document.getElementById('hint').style.display = 'block';
    }

    setupInput() {
        const press = () => {
            if (this.running && this.player && !this.player.dead) {
                this.pressing = true;
                this.jumpBuffer = 8; // buffer jump for a few frames
                this.tryJump();
            }
        };
        window.addEventListener('keydown', (e)=>{
            if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); press(); }
        });
        window.addEventListener('keyup', (e)=>{
            if (e.code === 'Space' || e.code === 'ArrowUp') this.pressing=false;
        });

        const container = document.getElementById('gameContainer');
        container.addEventListener('pointerdown', (e)=>{
            if (e.target.tagName === 'BUTTON' || e.target.closest('#menu') || e.target.closest('#overlay')) return;
            press();
        });
        container.addEventListener('pointerup', ()=>{ this.pressing=false; });
        container.addEventListener('pointercancel', ()=>{ this.pressing=false; });
        container.addEventListener('pointerleave', ()=>{ this.pressing=false; });
    }

    // Try to jump respecting orb / coyote-time / buffering
    tryJump() {
        const p = this.player;
        document.getElementById('hint').style.display = 'none';
        if (p.mode !== 'cube') return;

        // Orb activation (larger detection radius = more forgiving)
        for (const o of this.level.objects) {
            if (o.type==='orb') {
                if (Math.abs(o.x - this.camX - p.x) < 60 && Math.abs(o.y - (p.y+p.size/2)) < 90) {
                    p.vy = -13.5;
                    p.onGround = false;
                    this.coyote = 0;
                    this.jumpBuffer = 0;
                    this.spawnParticles(p.x, p.y, '#ffff00', 12);
                    return;
                }
            }
        }
        // Ground jump with coyote time
        if (p.onGround || this.coyote > 0) {
            p.vy = -13.5;
            p.onGround = false;
            this.coyote = 0;
            this.jumpBuffer = 0;
        }
    }

    update() {
        if (!this.running) return;
        const p = this.player;
        if (p.dead) return;

        this.camX += this.speed;
        p.x = 120;

        // timers
        if (this.jumpBuffer > 0) this.jumpBuffer--;
        if (this.coyote > 0) this.coyote--;

        if (p.mode === 'cube') {
            // Slightly lower gravity = floatier, easier timing
            p.vy += 0.62;
            p.y += p.vy;
            if (!p.onGround) p.rotation += this.speed * 0.9;
        } else {
            if (this.pressing) p.vy -= 0.5; else p.vy += 0.45;
            p.vy = Math.max(-7, Math.min(7, p.vy));
            p.y += p.vy;
            p.rotation = p.vy * 2;
        }

        const groundTop = GROUND_Y - p.size;
        const wasOnGround = p.onGround;
        if (p.y >= groundTop && p.mode==='cube') {
            p.y = groundTop; p.vy = 0;
            if (!p.onGround) { p.rotation = Math.round(p.rotation/90)*90; }
            p.onGround = true;
            // auto-jump if a jump was buffered right before landing
            if (this.jumpBuffer > 0) this.tryJump();
        } else if (p.mode==='cube') {
            if (wasOnGround) this.coyote = 6; // grant coyote frames on leaving ground
            p.onGround = false;
        }
        if (p.mode==='fly') {
            if (p.y < 40) { p.y=40; p.vy=0; }
            if (p.y > groundTop) { p.y=groundTop; p.vy=0; }
        }

        // ---- FORGIVING COLLISION ----
        const px = p.x, py = p.y, ps = p.size;
        // shrink hitbox for fairness
        const pad = 8;
        const hx1 = px + pad, hx2 = px + ps - pad;
        const hy1 = py + pad, hy2 = py + ps - pad;

        for (const o of this.level.objects) {
            const ox = o.x - this.camX;
            if (ox < -100 || ox > this.W+100) continue;

            if (o.type === 'portal') {
                if (Math.abs(ox - px) < 30 && p.mode !== o.mode) {
                    p.mode = o.mode;
                    p.vy = 0;
                    this.spawnParticles(px, py, o.mode==='fly'?'#00ffff':'#ffaa00', 20);
                }
            } else if (o.type === 'spike') {
                // Small triangular hitbox near the tip only -> very forgiving
                const cx = ox + TILE/2;
                const spikeHitW = TILE * 0.4;
                const spikeTop = o.y - TILE * 0.65;
                if (hx2 > cx - spikeHitW/2 && hx1 < cx + spikeHitW/2) {
                    if (hy2 > spikeTop) {
                        this.die();
                    }
                }
            } else if (o.type === 'block') {
                const bx=ox, by=o.y, bw=o.w, bh=o.h;
                if (hx2 > bx && hx1 < bx+bw && hy2 > by && hy1 < by+bh) {
                    // generous top-landing allowance
                    if (p.vy >= 0 && py + ps - p.vy <= by + 16) {
                        p.y = by - ps; p.vy=0; p.onGround=true;
                        if (p.mode==='cube') p.rotation = Math.round(p.rotation/90)*90;
                        if (this.jumpBuffer > 0) this.tryJump();
                    } else {
                        // Only kill on real side impact (deeper overlap)
                        if (hx1 < bx + bw - 6 && hx2 > bx + 6 && hy2 > by + 8) {
                            this.die();
                        }
                    }
                }
            }
        }

        this.progress = Math.min(100, Math.floor((this.camX / (this.level.length - this.W)) * 100));
        document.getElementById('progressFill').style.width = this.progress + '%';
        document.getElementById('progressText').textContent = this.progress + '%';

        if (this.camX >= this.level.length - this.W) {
            this.win();
        }

        for (const pt of this.particles) {
            pt.x += pt.vx; pt.y += pt.vy; pt.vy += 0.2; pt.life--;
        }
        this.particles = this.particles.filter(p=>p.life>0);

        if (Math.random()<0.7)
            this.particles.push({x:px, y:py+ps/2, vx:-this.speed*0.3, vy:(Math.random()-0.5)*1.5,
                life:20, color:this.level.theme.player, size:5});
    }

    die() {
        const p = this.player;
        p.dead = true;
        this.running = false;
        this.spawnParticles(p.x, p.y, this.level.theme.player, 40);
        if (this.progress > (state.best[this.levelIdx]||0)) {
            state.best[this.levelIdx] = this.progress;
        }
        saveState();
        setTimeout(()=>{
            document.getElementById('overlayTitle').textContent = 'Game Over';
            document.getElementById('overlayText').textContent =
                `Reached ${this.progress}%  |  Best ${state.best[this.levelIdx]||0}%`;
            document.getElementById('nextBtn').style.display = 'none';
            document.getElementById('overlay').style.display = 'flex';
        }, 600);
    }

    win() {
        this.running = false;
        this.won = true;
        state.completed[this.levelIdx] = true;
        state.best[this.levelIdx] = 100;
        if (this.levelIdx+1 >= state.unlocked && this.levelIdx < 9) {
            state.unlocked = this.levelIdx + 2;
        }
        saveState();
        document.getElementById('overlayTitle').textContent = '🎉 Complete!';
        document.getElementById('overlayText').textContent =
            `${this.level.theme.name} cleared in ${state.attempts[this.levelIdx]} attempts!`;
        document.getElementById('nextBtn').style.display =
            (this.levelIdx < 9) ? 'inline-block' : 'none';
        document.getElementById('overlay').style.display = 'flex';
    }

    spawnParticles(x,y,color,n) {
        for (let i=0;i<n;i++){
            const a = Math.random()*Math.PI*2;
            const s = Math.random()*6+2;
            this.particles.push({x,y,vx:Math.cos(a)*s, vy:Math.sin(a)*s,
                life:30+Math.random()*20, color, size:Math.random()*6+3});
        }
    }

    retry() {
        document.getElementById('overlay').style.display='none';
        this.resetRun();
    }
    nextLevel() {
        if (this.levelIdx < 9) this.startLevel(this.levelIdx+1);
    }
    toMenu() {
        this.running=false;
        state.currentLevel=null;
        saveState();
        document.getElementById('overlay').style.display='none';
        this.buildMenu();
        document.getElementById('menu').style.display='flex';
    }

    resetProgress() {
        if (confirm('Reset all progress? This cannot be undone.')) {
            state = defaultState();
            saveState();
            this.buildMenu();
        }
    }

    draw() {
        const ctx = this.ctx;
        const th = this.level ? this.level.theme : THEMES[0];

        ctx.setTransform(1,0,0,1,0,0);
        ctx.fillStyle = '#000';
        ctx.fillRect(0,0,this.canvas.width,this.canvas.height);

        ctx.setTransform(this.scale, 0, 0, this.scale, this.offsetX, this.offsetY);

        ctx.save();
        ctx.beginPath();
        ctx.rect(0,0,this.W,this.H);
        ctx.clip();

        const g = ctx.createLinearGradient(0,0,0,this.H);
        g.addColorStop(0, th.bg[0]);
        g.addColorStop(1, th.bg[1]);
        ctx.fillStyle = g;
        ctx.fillRect(0,0,this.W,this.H);

        if (!this.level) { ctx.restore(); return; }

        this.bgOffset -= 0.5;
        ctx.save();
        ctx.globalAlpha = 0.08;
        ctx.fillStyle = '#fff';
        for (let i=0;i<10;i++){
            const bx = ((i*220 + this.bgOffset)%1000+1000)%1000 - 100;
            ctx.fillRect(bx, 60 + (i%3)*90, 120, 120);
        }
        ctx.restore();

        for (const o of this.level.objects) {
            const ox = o.x - this.camX;
            if (ox < -60 || ox > this.W+60) continue;

            if (o.type==='spike') {
                ctx.fillStyle = '#fff';
                ctx.strokeStyle = 'rgba(0,0,0,0.4)';
                ctx.beginPath();
                ctx.moveTo(ox, o.y);
                ctx.lineTo(ox+TILE/2, o.y-TILE);
                ctx.lineTo(ox+TILE, o.y);
                ctx.closePath();
                ctx.fill(); ctx.stroke();
            } else if (o.type==='block') {
                ctx.fillStyle = '#111';
                ctx.fillRect(ox, o.y, o.w, o.h);
                ctx.strokeStyle = th.player;
                ctx.lineWidth = 3;
                ctx.strokeRect(ox+1.5, o.y+1.5, o.w-3, o.h-3);
                ctx.lineWidth = 1;
            } else if (o.type==='orb') {
                const t = Date.now()/200;
                ctx.save();
                ctx.translate(ox, o.y);
                ctx.fillStyle = 'rgba(255,255,0,0.3)';
                ctx.beginPath(); ctx.arc(0,0,20+Math.sin(t)*3,0,7); ctx.fill();
                ctx.fillStyle = '#ffee00';
                ctx.beginPath(); ctx.arc(0,0,12,0,7); ctx.fill();
                ctx.restore();
            } else if (o.type==='portal') {
                ctx.save();
                ctx.translate(ox, GROUND_Y-90);
                const col = o.mode==='fly'?'#00ffff':'#ffaa00';
                ctx.strokeStyle = col; ctx.lineWidth=6;
                ctx.globalAlpha=0.9;
                ctx.beginPath(); ctx.ellipse(0,0,22,55,0,0,7); ctx.stroke();
                ctx.globalAlpha=0.2; ctx.fillStyle=col;
                ctx.beginPath(); ctx.ellipse(0,0,22,55,0,0,7); ctx.fill();
                ctx.restore();
            }
        }

        ctx.fillStyle = th.ground;
        ctx.fillRect(0, GROUND_Y, this.W, this.H-GROUND_Y);
        ctx.strokeStyle = th.player;
        ctx.lineWidth=3;
        ctx.beginPath(); ctx.moveTo(0,GROUND_Y); ctx.lineTo(this.W,GROUND_Y); ctx.stroke();
        ctx.strokeStyle='rgba(255,255,255,0.08)';
        ctx.lineWidth=2;
        for(let i=0;i<20;i++){
            const lx = ((i*60 - this.camX*0.5)%1200+1200)%1200 - 100;
            ctx.beginPath(); ctx.moveTo(lx, GROUND_Y); ctx.lineTo(lx-30, this.H); ctx.stroke();
        }

        for (const pt of this.particles) {
            ctx.globalAlpha = Math.max(0, pt.life/40);
            ctx.fillStyle = pt.color;
            ctx.fillRect(pt.x-pt.size/2, pt.y-pt.size/2, pt.size, pt.size);
        }
        ctx.globalAlpha=1;

        if (this.player && (!this.player.dead || this.won)) {
            const p = this.player;
            ctx.save();
            ctx.translate(p.x + p.size/2, p.y + p.size/2);
            ctx.rotate(p.rotation * Math.PI/180);
            ctx.shadowColor = th.player;
            ctx.shadowBlur = 15;
            ctx.fillStyle = th.player;
            ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size);
            ctx.shadowBlur=0;
            ctx.fillStyle = 'rgba(255,255,255,0.85)';
            ctx.fillRect(-p.size/4, -p.size/4, p.size/2, p.size/2);
            ctx.strokeStyle = '#000';
            ctx.lineWidth=2;
            ctx.strokeRect(-p.size/2, -p.size/2, p.size, p.size);
            ctx.restore();
        }

        ctx.restore();

        document.getElementById('modeInfo').textContent =
            (this.player && this.player.mode==='fly') ? '✈ FLY MODE' : '';
    }

    loop() {
        this.update();
        this.draw();
        requestAnimationFrame(this.loop);
    }
}

const game = new Game();

document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('touchmove', e => { if(e.touches.length>1) e.preventDefault(); }, {passive:false});
</script>
