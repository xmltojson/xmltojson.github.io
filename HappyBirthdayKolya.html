<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>З Днем Народження, Коля! 🎉</title>
<meta name="description" content="Святкова вітальна сторінка до 11-річчя Колі. Теплі побажання, кульки, феєрверки та святковий настрій! / A festive birthday greeting page for Kolya, 11 years old.">
<meta name="keywords" content="день народження, Коля, вітання, 11 років, birthday, Kolya, congratulations">
<meta name="author" content="Happy Birthday Kolya">
<meta name="theme-color" content="#2b6cff">
<!-- Open Graph -->
<meta property="og:title" content="З Днем Народження, Коля! 🎉">
<meta property="og:description" content="Святкова вітальна сторінка до 11-річчя Колі з кульками, феєрверками та теплими побажаннями!">
<meta property="og:type" content="website">
<!-- Favicon: star SVG -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><polygon points='50,5 61,38 96,38 68,59 79,92 50,72 21,92 32,59 4,38 39,38' fill='%23ffd93d' stroke='%23ff9500' stroke-width='3'/><circle cx='50' cy='50' r='8' fill='%232b6cff'/></svg>">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html { font-size: 13.5px; }

  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(135deg, #0f2027 0%, #203a43 25%, #2c5364 50%, #1e5799 75%, #2b6cff 100%);
    background-size: 400% 400%;
    animation: gradientShift 15s ease infinite;
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  @keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .container {
    max-width: 600px;
    margin: 0 auto;
    padding: 12px;
    position: relative;
    z-index: 10;
  }

  .lang-switcher {
    position: fixed;
    top: 12px;
    right: 12px;
    z-index: 100;
    display: flex;
    gap: 6px;
    background: rgba(255,255,255,0.85);
    padding: 5px;
    border-radius: 25px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.25);
  }

  .lang-btn {
    border: none;
    background: transparent;
    padding: 5px 11px;
    border-radius: 20px;
    cursor: pointer;
    font-weight: 600;
    font-size: 0.85rem;
    color: #1e5799;
    transition: all 0.3s;
  }

  .lang-btn.active {
    background: linear-gradient(135deg, #2b6cff, #00c6ff);
    color: white;
  }

  .card {
    background: rgba(255,255,255,0.94);
    border-radius: 22px;
    padding: 24px 24px;
    margin-top: 46px;
    box-shadow: 0 20px 60px rgba(43, 108, 255, 0.35);
    text-align: center;
    backdrop-filter: blur(10px);
    animation: cardIn 1s ease;
    border: 2px solid rgba(255,255,255,0.6);
    position: relative;
    overflow: hidden;
  }

  /* Shimmering light sweep on card */
  .card::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -60%;
    width: 40%;
    height: 200%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent);
    transform: rotate(25deg);
    animation: shimmer 5s ease-in-out infinite;
    pointer-events: none;
  }

  @keyframes shimmer {
    0% { left: -60%; }
    50% { left: 130%; }
    100% { left: 130%; }
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(40px) scale(0.95); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* Card celebration shake */
  .card.party {
    animation: partyShake 0.6s ease;
  }

  @keyframes partyShake {
    0%, 100% { transform: rotate(0) scale(1); }
    20% { transform: rotate(-1.5deg) scale(1.02); }
    40% { transform: rotate(1.5deg) scale(1.02); }
    60% { transform: rotate(-1deg) scale(1.01); }
    80% { transform: rotate(1deg) scale(1.01); }
  }

  .flower-crown {
    font-size: 2rem;
    margin-bottom: 6px;
    animation: sway 4s ease-in-out infinite;
    position: relative;
    z-index: 2;
  }

  @keyframes sway {
    0%, 100% { transform: rotate(-5deg); }
    50% { transform: rotate(5deg); }
  }

  .age-badge {
    display: inline-block;
    font-size: 2.6rem;
    font-weight: 900;
    background: linear-gradient(135deg, #ffd93d, #ff9500, #ff5e62);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: pop 2.5s ease-in-out infinite;
    position: relative;
    z-index: 2;
    margin: 2px 0;
    cursor: pointer;
    filter: drop-shadow(0 0 8px rgba(255,150,0,0.5));
  }

  @keyframes pop {
    0%, 100% { transform: scale(1) rotate(-3deg); }
    50% { transform: scale(1.15) rotate(3deg); }
  }

  h1 {
    font-size: clamp(1.5rem, 4.5vw, 2.3rem);
    background: linear-gradient(135deg, #2b6cff, #00c6ff, #0072ff, #00e0ff);
    background-size: 300% 300%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 12px;
    line-height: 1.2;
    font-weight: 800;
    animation: textGradient 5s ease infinite;
    position: relative;
    z-index: 2;
  }

  @keyframes textGradient {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .name {
    display: inline-block;
    animation: bounce 2s ease-in-out infinite, glow 2.5s ease-in-out infinite;
  }

  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-7px); }
  }

  @keyframes glow {
    0%, 100% { filter: drop-shadow(0 0 3px rgba(43,108,255,0.4)); }
    50% { filter: drop-shadow(0 0 14px rgba(0,198,255,0.9)); }
  }

  .message {
    font-size: clamp(0.9rem, 2.3vw, 1.1rem);
    color: #1a3c5e;
    line-height: 1.55;
    margin: 12px 0;
    position: relative;
    z-index: 2;
  }

  .message p {
    margin: 8px 0;
    opacity: 0;
    animation: fadeUp 0.8s ease forwards;
  }

  .message p:nth-child(1) { animation-delay: 0.3s; }
  .message p:nth-child(2) { animation-delay: 0.6s; }
  .message p:nth-child(3) { animation-delay: 0.9s; }
  .message p:nth-child(4) { animation-delay: 1.2s; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .flowers-row {
    font-size: 1.7rem;
    margin: 13px 0;
    display: flex;
    justify-content: center;
    gap: 7px;
    flex-wrap: wrap;
    position: relative;
    z-index: 2;
  }

  .flowers-row span {
    display: inline-block;
    animation: grow 3s ease-in-out infinite;
    cursor: pointer;
    transition: transform 0.2s;
  }

  .flowers-row span:hover {
    transform: scale(1.5) rotate(20deg) !important;
  }

  .flowers-row span:nth-child(even) { animation-delay: 0.5s; }
  .flowers-row span:nth-child(3n) { animation-delay: 1s; }

  @keyframes grow {
    0%, 100% { transform: scale(1) rotate(0); }
    50% { transform: scale(1.2) rotate(10deg); }
  }

  .buttons {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 8px;
    position: relative;
    z-index: 2;
  }

  .btn {
    background: linear-gradient(135deg, #2b6cff, #00c6ff);
    color: white;
    border: none;
    padding: 10px 22px;
    font-size: 0.92rem;
    border-radius: 24px;
    cursor: pointer;
    font-weight: 700;
    box-shadow: 0 8px 20px rgba(43, 108, 255, 0.45);
    transition: transform 0.2s, box-shadow 0.2s;
    position: relative;
    z-index: 2;
    overflow: hidden;
  }

  .btn::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 0;
    height: 0;
    background: rgba(255,255,255,0.4);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    transition: width 0.5s, height 0.5s;
  }

  .btn:active::after {
    width: 300px;
    height: 300px;
    transition: 0s;
  }

  .btn:hover {
    transform: translateY(-3px) scale(1.05);
    box-shadow: 0 12px 28px rgba(0, 198, 255, 0.6);
  }

  .btn:active { transform: scale(0.97); }

  .counter {
    font-size: 0.95rem;
    color: #1e5799;
    margin-top: 12px;
    font-weight: 600;
    position: relative;
    z-index: 2;
  }

  .counter .count-num {
    display: inline-block;
    transition: transform 0.2s;
  }

  .counter .count-num.bump {
    animation: countBump 0.4s ease;
  }

  @keyframes countBump {
    0% { transform: scale(1); }
    50% { transform: scale(1.6); color: #ff5e62; }
    100% { transform: scale(1); }
  }

  .heart {
    color: #ff3b6b;
    display: inline-block;
    animation: heartbeat 1.2s ease-in-out infinite;
  }

  @keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    25% { transform: scale(1.25); }
    50% { transform: scale(1); }
  }

  /* Confetti */
  .confetti {
    position: fixed;
    width: 12px;
    height: 12px;
    top: -20px;
    z-index: 5;
    pointer-events: none;
  }

  @keyframes fall {
    to { transform: translateY(110vh) rotate(720deg); opacity: 0; }
  }

  /* Floating background items */
  .bg-flower {
    position: fixed;
    font-size: 2rem;
    opacity: 0.4;
    pointer-events: none;
    z-index: 1;
    animation: floatUp linear infinite;
  }

  @keyframes floatUp {
    from { transform: translateY(105vh) rotate(0); }
    to { transform: translateY(-10vh) rotate(360deg); }
  }

  /* Sparkles */
  .sparkle {
    position: fixed;
    pointer-events: none;
    z-index: 6;
    font-size: 1rem;
    animation: sparkleAnim 1.2s ease forwards;
  }

  @keyframes sparkleAnim {
    0% { transform: scale(0) rotate(0); opacity: 1; }
    50% { transform: scale(1.4) rotate(180deg); opacity: 1; }
    100% { transform: scale(0) rotate(360deg); opacity: 0; }
  }

  /* Balloons */
  .balloon {
    position: fixed;
    bottom: -120px;
    font-size: 3rem;
    z-index: 4;
    pointer-events: none;
    animation: balloonRise linear forwards;
  }

  @keyframes balloonRise {
    0% { transform: translateY(0) translateX(0); opacity: 1; }
    100% { transform: translateY(-115vh) translateX(var(--drift)); opacity: 0.9; }
  }

  /* Firework particles */
  .firework-particle {
    position: fixed;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    z-index: 5;
    pointer-events: none;
  }

  /* Firework rocket trail */
  .rocket {
    position: fixed;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    z-index: 5;
    pointer-events: none;
    box-shadow: 0 0 10px 2px currentColor;
  }

  /* Twinkling stars background */
  .star {
    position: fixed;
    color: #fff;
    pointer-events: none;
    z-index: 1;
    animation: twinkle ease-in-out infinite;
  }

  @keyframes twinkle {
    0%, 100% { opacity: 0.2; transform: scale(0.8); }
    50% { opacity: 1; transform: scale(1.3); }
  }

  /* Big flash overlay on celebrate */
  .flash-overlay {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle, rgba(255,255,255,0.9), transparent 70%);
    z-index: 20;
    pointer-events: none;
    opacity: 0;
  }

  .flash-overlay.active {
    animation: flashPulse 0.5s ease;
  }

  @keyframes flashPulse {
    0% { opacity: 0; }
    30% { opacity: 0.8; }
    100% { opacity: 0; }
  }

  /* Wish text card */
  #wishText {
    margin-top: 12px;
    font-size: 1rem;
    font-weight: 700;
    color: #1e5799;
    background: linear-gradient(135deg, rgba(0,198,255,0.18), rgba(43,108,255,0.15));
    padding: 11px 15px;
    border-radius: 15px;
    position: relative;
    z-index: 2;
    animation: fadeUp 0.6s ease, wishPulse 2.5s ease-in-out infinite;
    border: 1.5px dashed #2b6cff;
  }

  @keyframes wishPulse {
    0%, 100% { box-shadow: 0 0 0 rgba(43,108,255,0); }
    50% { box-shadow: 0 0 20px rgba(0,198,255,0.5); }
  }

  /* Horizontal orientation */
  @media (orientation: landscape) and (max-height: 620px) {
    .card { margin-top: 44px; padding: 18px 24px; }
    .flower-crown { font-size: 1.6rem; margin-bottom: 3px; }
    .age-badge { font-size: 2rem; }
    h1 { margin-bottom: 8px; }
    .flowers-row { font-size: 1.4rem; margin: 8px 0; }
    .message { font-size: 0.85rem; margin: 8px 0; }
    .message p { margin: 5px 0; }
    .counter { margin-top: 8px; }
  }

  @media (max-width: 480px) {
    .card { padding: 22px 16px; }
    .lang-btn { padding: 5px 10px; font-size: 0.8rem; }
    .btn { padding: 9px 16px; font-size: 0.88rem; }
  }
</style>
</head>
<body>

<div class="flash-overlay" id="flashOverlay"></div>

<div class="lang-switcher">
  <button class="lang-btn active" data-lang="uk">🇺🇦 UA</button>
  <button class="lang-btn" data-lang="en">🇬🇧 EN</button>
</div>

<div class="container">
  <div class="card" id="card">
    <div class="flower-crown">🎈🎂🎉🎁🎊</div>
    <div class="age-badge">11</div>
    <h1 id="title"></h1>
    <div class="flowers-row">
      <span>⚽</span><span>🚀</span><span>🎮</span><span>🎸</span><span>🏆</span><span>🌟</span>
    </div>
    <div class="message" id="message"></div>
    <div class="flowers-row">
      <span>🎂</span><span>🎈</span><span>🎁</span><span>🎊</span><span>🎉</span>
    </div>
    <div class="buttons">
      <button class="btn" id="celebrateBtn"></button>
      <button class="btn" id="wishBtn"></button>
      <button class="btn" id="balloonBtn"></button>
    </div>
    <div class="counter" id="counter"></div>
  </div>
</div>

<script>
  const translations = {
    uk: {
      title: "З Днем Народження,<br><span class='name'>Коля!</span> 🎉",
      message: [
        "🎉 Дорогий Коля! Вітаємо тебе з твоїм 11-річчям!",
        "🚀 Нехай ці 11 років стануть початком найяскравіших пригод та відкриттів!",
        "⚽ Бажаємо тобі багато енергії, вірних друзів та цікавих захоплень!",
        "🎂 Хай збуваються всі мрії, а кожен день дарує радість та усмішки! <span class='heart'>❤️</span>"
      ],
      celebrate: "🎊 Святкувати!",
      wish: "🌟 Побажання",
      balloon: "🎈 Кульки",
      counter: "Кількість вітань: ",
      wishes: [
        "🚀 Нехай мрії злітають високо, як ракета!",
        "⚽ Багато перемог у спорті та в житті!",
        "🎮 Хай кожен день буде цікавим, як улюблена гра!",
        "🏆 Успіхів у навчанні та нових досягнень!",
        "🌟 Ти найкращий — рости сильним та розумним!",
        "🎸 Хай життя грає найкращими мелодіями!",
        "🦸 Будь сміливим героєм своїх пригод!",
        "💪 Здоров'я, сили та невичерпної енергії!",
        "🎯 Хай усі цілі влучають прямо в яблучко!",
        "🌈 Багато яскравих та щасливих днів попереду!",
        "📚 Розуму, знань та цікавих відкриттів!",
        "🎁 Нехай кожен день приносить приємні сюрпризи!",
        "🚴 Швидкості, драйву та веселих пригод!",
        "🌍 Хай попереду чекає багато цікавих подорожей!",
        "⭐ Здійснення найзаповітніших бажань!",
        "🎉 Класних друзів та веселих канікул!"
      ]
    },
    en: {
      title: "Happy Birthday,<br><span class='name'>Kolya!</span> 🎉",
      message: [
        "🎉 Dear Kolya! Congratulations on your 11th birthday!",
        "🚀 May these 11 years be the start of the brightest adventures and discoveries!",
        "⚽ We wish you lots of energy, loyal friends and exciting hobbies!",
        "🎂 May all your dreams come true and every day bring joy and smiles! <span class='heart'>❤️</span>"
      ],
      celebrate: "🎊 Celebrate!",
      wish: "🌟 A Wish",
      balloon: "🎈 Balloons",
      counter: "Number of wishes: ",
      wishes: [
        "🚀 May your dreams fly high like a rocket!",
        "⚽ Many victories in sports and in life!",
        "🎮 May every day be as fun as your favorite game!",
        "🏆 Success in studies and new achievements!",
        "🌟 You're the best — grow strong and smart!",
        "🎸 May life play the best melodies!",
        "🦸 Be a brave hero of your adventures!",
        "💪 Health, strength and endless energy!",
        "🎯 May all your goals hit the bullseye!",
        "🌈 Many bright and happy days ahead!",
        "📚 Wisdom, knowledge and exciting discoveries!",
        "🎁 May every day bring pleasant surprises!",
        "🚴 Speed, drive and fun adventures!",
        "🌍 May many exciting journeys await you!",
        "⭐ Fulfillment of your most cherished wishes!",
        "🎉 Cool friends and fun holidays!"
      ]
    }
  };

  // State
  let state = {
    lang: 'uk',
    celebrations: 0,
    lastWishIdx: null
  };

  function loadState() {
    const saved = localStorage.getItem('kolyaBirthdayState');
    if (saved) {
      try {
        state = { ...state, ...JSON.parse(saved) };
      } catch(e) {}
    }
  }

  function saveState() {
    localStorage.setItem('kolyaBirthdayState', JSON.stringify(state));
  }

  function render() {
    const t = translations[state.lang];
    document.getElementById('title').innerHTML = t.title;
    document.getElementById('message').innerHTML =
      t.message.map(m => `<p>${m}</p>`).join('');
    document.getElementById('celebrateBtn').textContent = t.celebrate;
    document.getElementById('wishBtn').textContent = t.wish;
    document.getElementById('balloonBtn').textContent = t.balloon;
    updateCounter();
    document.querySelectorAll('.lang-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.lang === state.lang);
    });
    document.documentElement.lang = state.lang;
    if (state.lastWishIdx !== null && typeof state.lastWishIdx === 'number') {
      showWishText(t.wishes[state.lastWishIdx]);
    }
  }

  function updateCounter(bump) {
    const t = translations[state.lang];
    const counter = document.getElementById('counter');
    counter.innerHTML = t.counter + `<span class="count-num">${state.celebrations}</span>`;
    if (bump) {
      const num = counter.querySelector('.count-num');
      num.classList.add('bump');
      setTimeout(() => num.classList.remove('bump'), 400);
    }
  }

  // Confetti — improved with more variety & spin
  function launchConfetti(amount = 70) {
    const colors = ['#2b6cff','#00c6ff','#ffd93d','#ff9500','#ff5e62','#00e0ff','#ff3b6b','#a06bff'];
    const emojis = ['🎈','🎉','🎊','🎁','⭐','🚀','⚽','🎮','🏆','✨','🥳','🎂'];
    for (let i = 0; i < amount; i++) {
      const c = document.createElement('div');
      const useEmoji = Math.random() > 0.45;
      if (useEmoji) {
        c.textContent = emojis[Math.floor(Math.random()*emojis.length)];
        c.style.fontSize = (15 + Math.random()*26) + 'px';
      } else {
        c.className = 'confetti';
        c.style.background = colors[Math.floor(Math.random()*colors.length)];
        c.style.width = (6 + Math.random()*10) + 'px';
        c.style.height = (6 + Math.random()*14) + 'px';
        c.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
      }
      c.style.position = 'fixed';
      c.style.left = Math.random()*100 + 'vw';
      c.style.top = '-30px';
      c.style.zIndex = 50;
      c.style.pointerEvents = 'none';
      const dur = 2 + Math.random()*3.5;
      const drift = (Math.random()*160 - 80);
      document.body.appendChild(c);
      c.animate([
        { transform: 'translate(0,0) rotate(0)', opacity: 1 },
        { transform: `translate(${drift}px, 110vh) rotate(${720 + Math.random()*720}deg)`, opacity: 0 }
      ], { duration: dur*1000, easing: 'cubic-bezier(0.3,0.1,0.4,1)' });
      setTimeout(() => c.remove(), dur*1000);
    }
  }

  // Fireworks with rocket launch + big burst
  function launchFirework(x, y) {
    const colors = ['#2b6cff','#00c6ff','#ffd93d','#ff9500','#ff5e62','#00e0ff','#ff3b6b','#ffffff','#a06bff'];
    const color = colors[Math.floor(Math.random()*colors.length)];
    const particles = 32;
    for (let i = 0; i < particles; i++) {
      const p = document.createElement('div');
      p.className = 'firework-particle';
      p.style.left = x + 'px';
      p.style.top = y + 'px';
      const pColor = Math.random() > 0.3 ? color : colors[Math.floor(Math.random()*colors.length)];
      p.style.background = pColor;
      p.style.boxShadow = `0 0 10px ${pColor}`;
      document.body.appendChild(p);
      const angle = (Math.PI * 2 * i) / particles + Math.random()*0.2;
      const velocity = 70 + Math.random()*110;
      const tx = Math.cos(angle) * velocity;
      const ty = Math.sin(angle) * velocity;
      p.animate([
        { transform: 'translate(0,0) scale(1.2)', opacity: 1 },
        { transform: `translate(${tx*0.6}px, ${ty*0.6}px) scale(1)`, opacity: 1, offset: 0.4 },
        { transform: `translate(${tx}px, ${ty + 40}px) scale(0.2)`, opacity: 0 }
      ], { duration: 1000 + Math.random()*500, easing: 'cubic-bezier(0.12,0.6,0.3,1)' });
      setTimeout(() => p.remove(), 1600);
    }
  }

  // Rocket that flies up then bursts into firework
  function launchRocket() {
    const colors = ['#ffd93d','#00c6ff','#ff5e62','#a06bff','#00e0ff'];
    const color = colors[Math.floor(Math.random()*colors.length)];
    const startX = window.innerWidth * (0.15 + Math.random()*0.7);
    const startY = window.innerHeight;
    const endY = window.innerHeight * (0.12 + Math.random()*0.35);
    const rocket = document.createElement('div');
    rocket.className = 'rocket';
    rocket.style.left = startX + 'px';
    rocket.style.top = startY + 'px';
    rocket.style.color = color;
    rocket.style.background = color;
    document.body.appendChild(rocket);
    const anim = rocket.animate([
      { transform: 'translateY(0)', opacity: 1 },
      { transform: `translateY(${endY - startY}px)`, opacity: 1 }
    ], { duration: 700 + Math.random()*300, easing: 'cubic-bezier(0.2,0.7,0.4,1)' });
    anim.onfinish = () => {
      launchFirework(startX, endY);
      rocket.remove();
    };
  }

  function launchFireworksShow() {
    for (let i = 0; i < 8; i++) {
      setTimeout(launchRocket, i * 280);
    }
  }

  // Balloons — improved with wobble
  function launchBalloons(amount = 16) {
    const balloonEmojis = ['🎈','🎈','🎈','🎀','🎉','🥳'];
    for (let i = 0; i < amount; i++) {
      const b = document.createElement('div');
      b.className = 'balloon';
      b.textContent = balloonEmojis[Math.floor(Math.random()*balloonEmojis.length)];
      b.style.left = Math.random()*100 + 'vw';
      b.style.fontSize = (2.5 + Math.random()*2.5) + 'rem';
      b.style.setProperty('--drift', (Math.random()*140 - 70) + 'px');
      const dur = 5 + Math.random()*4;
      b.style.animationDuration = dur + 's';
      document.body.appendChild(b);
      setTimeout(() => b.remove(), dur*1000);
    }
  }

  // Sparkles that follow clicks
  function sparkleBurst(x, y) {
    const sparkleEmojis = ['✨','⭐','💫','🌟','🎉','🥳'];
    for (let i = 0; i < 10; i++) {
      const s = document.createElement('div');
      s.className = 'sparkle';
      s.textContent = sparkleEmojis[Math.floor(Math.random()*sparkleEmojis.length)];
      s.style.left = x + 'px';
      s.style.top = y + 'px';
      const angle = (Math.PI * 2 * i) / 10;
      const dist = 40 + Math.random()*50;
      document.body.appendChild(s);
      const tx = Math.cos(angle) * dist;
      const ty = Math.sin(angle) * dist;
      s.animate([
        { transform: 'translate(0,0) scale(0)', opacity: 1 },
        { transform: `translate(${tx}px, ${ty}px) scale(1.4)`, opacity: 1, offset: 0.5 },
        { transform: `translate(${tx*1.5}px, ${ty*1.5}px) scale(0)`, opacity: 0 }
      ], { duration: 1000, easing: 'ease-out' });
      setTimeout(() => s.remove(), 1000);
    }
  }

  // Flash overlay
  function triggerFlash() {
    const overlay = document.getElementById('flashOverlay');
    overlay.classList.remove('active');
    void overlay.offsetWidth;
    overlay.classList.add('active');
  }

  // Card shake
  function shakeCard() {
    const card = document.getElementById('card');
    card.classList.remove('party');
    void card.offsetWidth;
    card.classList.add('party');
    setTimeout(() => card.classList.remove('party'), 600);
  }

  // FULL celebration combo!
  function bigCelebration(x, y) {
    triggerFlash();
    launchConfetti(90);
    launchFireworksShow();
    launchBalloons(10);
    shakeCard();
    if (x && y) sparkleBurst(x, y);
  }

  function showWishText(text) {
    let wishEl = document.getElementById('wishText');
    if (!wishEl) {
      wishEl = document.createElement('div');
      wishEl.id = 'wishText';
      document.getElementById('counter').after(wishEl);
    }
    wishEl.textContent = text;
  }

  // Floating background items
  function createBgFlowers() {
    const items = ['🎈','🎉','🎊','⭐','🚀','⚽','🎮','🏆','🎁','🌟'];
    for (let i = 0; i < 14; i++) {
      const f = document.createElement('div');
      f.className = 'bg-flower';
      f.textContent = items[Math.floor(Math.random()*items.length)];
      f.style.left = Math.random()*100 + 'vw';
      f.style.animationDuration = (10 + Math.random()*15) + 's';
      f.style.animationDelay = -(Math.random()*15) + 's';
      f.style.fontSize = (1.5 + Math.random()*1.5) + 'rem';
      document.body.appendChild(f);
    }
  }

  // Twinkling stars
  function createStars() {
    for (let i = 0; i < 40; i++) {
      const s = document.createElement('div');
      s.className = 'star';
      s.textContent = '✦';
      s.style.left = Math.random()*100 + 'vw';
      s.style.top = Math.random()*100 + 'vh';
      s.style.fontSize = (0.5 + Math.random()*1) + 'rem';
      s.style.animationDuration = (1.5 + Math.random()*3) + 's';
      s.style.animationDelay = -(Math.random()*4) + 's';
      document.body.appendChild(s);
    }
  }

  // Event listeners
  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      state.lang = btn.dataset.lang;
      saveState();
      render();
    });
  });

  document.getElementById('celebrateBtn').addEventListener('click', (e) => {
    state.celebrations++;
    saveState();
    updateCounter(true);
    bigCelebration(e.clientX, e.clientY);
  });

  document.getElementById('wishBtn').addEventListener('click', (e) => {
    const t = translations[state.lang];
    const wishes = t.wishes;
    let idx;
    do {
      idx = Math.floor(Math.random()*wishes.length);
    } while (wishes.length > 1 && idx === state.lastWishIdx);
    state.lastWishIdx = idx;
    saveState();
    showWishText(wishes[idx]);
    sparkleBurst(e.clientX, e.clientY);
    launchFirework(e.clientX, e.clientY);
  });

  document.getElementById('balloonBtn').addEventListener('click', (e) => {
    launchBalloons();
    sparkleBurst(e.clientX, e.clientY);
  });

  // Sparkle + firework on tapping icons
  document.querySelectorAll('.flowers-row span').forEach(span => {
    span.addEventListener('click', (e) => {
      sparkleBurst(e.clientX, e.clientY);
      launchFirework(e.clientX, e.clientY);
    });
  });

  // Full celebration when clicking the age badge
  document.querySelector('.age-badge').addEventListener('click', (e) => {
    bigCelebration(e.clientX, e.clientY);
  });

  // Init
  loadState();
  render();
  createStars();
  createBgFlowers();
  setTimeout(() => bigCelebration(), 600);
</script>
</body>
</html>
