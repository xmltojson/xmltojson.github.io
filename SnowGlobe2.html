<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Snow Globe">
    <meta name="theme-color" content="#0c1445">
    <link rel="icon" type="image/x-icon" href="favicon.ico"/>
    <title>✨ Snow Globe ✨</title>
    <style>
        :root {
            --globe-size: clamp(260px, 74vmin, 420px);
            --glass: rgba(255, 255, 255, 0.10);
            --glass-brd: rgba(255, 255, 255, 0.22);
            --ink: #eaf2ff;
            --accent: #9ed4ff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body { height: 100%; }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: clamp(10px, 3vh, 28px);
            padding: 24px 16px 150px;
            background:
                radial-gradient(1200px 700px at 50% 110%, #4457b8 0%, transparent 60%),
                linear-gradient(180deg, #05071c 0%, #0c1445 35%, #1b2570 70%, #2a3697 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--ink);
            overflow: hidden;
            cursor: grab;
        }

        body:active { cursor: grabbing; }

        body.night {
            background:
                radial-gradient(1200px 700px at 50% 110%, #1b2354 0%, transparent 60%),
                linear-gradient(180deg, #01030c 0%, #060a24 40%, #0b1138 75%, #121a4d 100%);
        }

        /* ---------- Ambient background ---------- */
        .aurora {
            position: fixed;
            inset: -20%;
            z-index: -3;
            pointer-events: none;
            filter: blur(70px);
            opacity: 0.55;
        }

        .aurora span {
            position: absolute;
            border-radius: 50%;
            mix-blend-mode: screen;
            animation: drift 22s ease-in-out infinite alternate;
        }

        .aurora span:nth-child(1) {
            width: 55vw; height: 40vh; left: 5%; top: 12%;
            background: radial-gradient(circle, rgba(96, 214, 255, .55), transparent 70%);
        }
        .aurora span:nth-child(2) {
            width: 45vw; height: 35vh; right: 2%; top: 4%;
            background: radial-gradient(circle, rgba(168, 130, 255, .5), transparent 70%);
            animation-duration: 28s;
        }
        .aurora span:nth-child(3) {
            width: 60vw; height: 38vh; left: 20%; bottom: 0%;
            background: radial-gradient(circle, rgba(120, 255, 214, .35), transparent 70%);
            animation-duration: 34s;
        }

        @keyframes drift {
            from { transform: translate3d(-4%, -3%, 0) scale(1); }
            to   { transform: translate3d(6%, 5%, 0) scale(1.15); }
        }

        .stars {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: -2;
        }

        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            animation: twinkle 3s ease-in-out infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: .25; transform: scale(1); }
            50%      { opacity: 1;   transform: scale(1.35); }
        }

        /* ---------- Header ---------- */
        header { text-align: center; }

        .title {
            font-size: clamp(1.6rem, 5.5vw, 2.6rem);
            font-weight: 600;
            letter-spacing: .06em;
            background: linear-gradient(180deg, #ffffff 0%, #bcd8ff 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 0 18px rgba(160, 200, 255, .55));
            animation: glow 3.5s ease-in-out infinite alternate;
        }

        .subtitle {
            margin-top: 6px;
            font-size: clamp(.7rem, 2.6vw, .82rem);
            letter-spacing: .28em;
            text-transform: uppercase;
            color: rgba(220, 234, 255, .55);
        }

        @keyframes glow {
            from { filter: drop-shadow(0 0 12px rgba(160, 200, 255, .35)); }
            to   { filter: drop-shadow(0 0 28px rgba(180, 215, 255, .8)); }
        }

        /* ---------- Globe ---------- */
        .snow-globe-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .globe-glow {
            position: absolute;
            top: 2%;
            left: 50%;
            width: calc(var(--globe-size) * 1.25);
            height: calc(var(--globe-size) * 1.25);
            transform: translateX(-50%);
            border-radius: 50%;
            background: radial-gradient(circle, rgba(130, 190, 255, .35) 0%, transparent 62%);
            filter: blur(24px);
            pointer-events: none;
            animation: breathe 6s ease-in-out infinite;
        }

        @keyframes breathe {
            0%, 100% { opacity: .65; transform: translateX(-50%) scale(1); }
            50%      { opacity: 1;   transform: translateX(-50%) scale(1.05); }
        }

        .globe {
            position: relative;
            width: var(--globe-size);
            height: var(--globe-size);
            border-radius: 50%;
            background:
                radial-gradient(120% 120% at 26% 20%, rgba(255,255,255,.42) 0%, rgba(255,255,255,.08) 30%, transparent 60%),
                radial-gradient(circle at 50% 42%, #2c5f88 0%, #163651 55%, #0a1b2b 100%);
            box-shadow:
                inset 0 0 70px rgba(140, 200, 255, .18),
                inset 16px 20px 60px rgba(255, 255, 255, .10),
                inset -22px -30px 70px rgba(0, 0, 0, .55),
                0 26px 55px -8px rgba(0, 0, 0, .65),
                0 0 90px rgba(120, 170, 255, .22);
            overflow: hidden;
            transition: background .6s ease;
        }

        /* Snow bank at the bottom of the glass */
        .globe::after {
            content: '';
            position: absolute;
            bottom: -2%;
            left: -2%;
            right: -2%;
            height: 30%;
            background: linear-gradient(180deg, transparent 0%, rgba(255,255,255,.85) 45%, #fff 100%);
            border-radius: 50% 50% 0 0 / 60% 60% 0 0;
            z-index: 5;
        }

        /* Glass gloss + rim light (above the snow) */
        .glass-shine, .glass-rim {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            pointer-events: none;
            z-index: 200;
        }

        .glass-shine {
            background:
                radial-gradient(ellipse 34% 20% at 26% 14%, rgba(255,255,255,.65) 0%, transparent 70%),
                radial-gradient(ellipse 12% 8% at 74% 78%, rgba(255,255,255,.30) 0%, transparent 70%),
                linear-gradient(140deg, rgba(255,255,255,.14) 0%, transparent 45%);
        }

        .glass-rim {
            box-shadow:
                inset 0 0 0 1px rgba(255,255,255,.35),
                inset 0 6px 22px rgba(255,255,255,.20),
                inset 0 -10px 30px rgba(90, 150, 220, .25);
        }

        /* Moon */
        .moon {
            position: absolute;
            top: 14%;
            right: 20%;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #fffdf3 0%, #ffe9b8 70%, #f5d894 100%);
            box-shadow: 0 0 30px rgba(255, 235, 180, .75), 0 0 70px rgba(255, 225, 150, .35);
            z-index: 1;
            transition: opacity .6s ease, transform .6s ease;
            opacity: .55;
        }

        .globe.night-mode .moon { opacity: 1; transform: scale(1.08); }

        /* Distant mountains */
        .mountain {
            position: absolute;
            bottom: 28%;
            background: linear-gradient(180deg, #e6f2ff 0%, #a7c6e4 55%, #7ea6c9 100%);
            clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
            opacity: .45;
            z-index: 2;
        }

        .mountain-1 { left: 6%;  width: 48%; height: 21%; }
        .mountain-2 { right: 4%; width: 40%; height: 16%; opacity: .32; }

        .scene {
            position: absolute;
            bottom: 30%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 4;
        }

        /* Ground/Snow */
        .ground {
            position: absolute;
            bottom: 25%;
            left: 4%;
            right: 4%;
            height: 15%;
            background: linear-gradient(180deg, #eef7fc 0%, #fff 100%);
            border-radius: 50% 50% 0 0;
            z-index: 3;
        }

        .ground::before {
            content: '';
            position: absolute;
            top: -10px;
            left: 10%;
            right: 10%;
            height: 20px;
            background: linear-gradient(180deg, transparent 0%, rgba(255, 255, 255, 0.5) 100%);
            border-radius: 50%;
        }

        /* Cabin */
        .cabin {
            position: relative;
            width: 80px;
            height: 60px;
            margin: 0 auto;
        }

        .cabin-body {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 70px;
            height: 45px;
            background: linear-gradient(135deg, #8b4513 0%, #654321 100%);
            border-radius: 3px;
            box-shadow: 0 6px 14px rgba(0,0,0,.35);
        }

        .cabin-body::before {
            content: '';
            position: absolute;
            top: 5px;
            left: 5px;
            right: 5px;
            bottom: 5px;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 8px,
                rgba(0, 0, 0, 0.2) 8px,
                rgba(0, 0, 0, 0.2) 9px
            );
        }

        .roof {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 45px solid transparent;
            border-right: 45px solid transparent;
            border-bottom: 35px solid #5d4037;
        }

        .roof::before {
            content: '';
            position: absolute;
            top: 35px;
            left: -45px;
            width: 90px;
            height: 8px;
            background: linear-gradient(180deg, #fff 0%, #e0e0e0 100%);
            border-radius: 0 0 3px 3px;
        }

        .roof-snow {
            position: absolute;
            bottom: 70px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 15px;
            background: #fff;
            border-radius: 50% 50% 0 0;
            z-index: 1;
        }

        .door {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 18px;
            height: 28px;
            background: linear-gradient(135deg, #3e2723 0%, #2d1b14 100%);
            border-radius: 10px 10px 0 0;
        }

        .door::after {
            content: '';
            position: absolute;
            top: 12px;
            right: 3px;
            width: 4px;
            height: 4px;
            background: #ffd700;
            border-radius: 50%;
        }

        .window {
            position: absolute;
            width: 14px;
            height: 14px;
            background: linear-gradient(135deg, #fff9c4 0%, #ffeb3b 100%);
            border: 2px solid #5d4037;
            border-radius: 2px;
            box-shadow: 0 0 10px rgba(255, 235, 59, 0.8), inset 0 0 5px rgba(255, 235, 59, 0.5);
            animation: candle 4s ease-in-out infinite;
        }

        @keyframes candle {
            0%, 100% { box-shadow: 0 0 9px rgba(255,225,90,.7), inset 0 0 5px rgba(255,235,59,.5); }
            50%      { box-shadow: 0 0 18px rgba(255,225,90,1), inset 0 0 7px rgba(255,235,59,.7); }
        }

        .window-left  { top: 10px; left: 8px; }
        .window-right { top: 10px; right: 8px; animation-delay: 1.4s; }

        .window::before, .window::after {
            content: '';
            position: absolute;
            background: #5d4037;
        }

        .window::before {
            top: 50%;
            left: 0;
            right: 0;
            height: 2px;
            transform: translateY(-50%);
        }

        .window::after {
            left: 50%;
            top: 0;
            bottom: 0;
            width: 2px;
            transform: translateX(-50%);
        }

        .chimney {
            position: absolute;
            bottom: 65px;
            right: 5px;
            width: 15px;
            height: 25px;
            background: linear-gradient(90deg, #8b4513 0%, #654321 100%);
        }

        .chimney::before {
            content: '';
            position: absolute;
            top: -5px;
            left: -3px;
            width: 21px;
            height: 8px;
            background: #fff;
            border-radius: 2px;
        }

        /* Smoke */
        .smoke-container {
            position: absolute;
            bottom: 85px;
            right: 8px;
            z-index: 10;
        }

        .smoke {
            position: absolute;
            width: 8px;
            height: 8px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            filter: blur(1px);
            animation: smoke 3.4s ease-out infinite;
        }

        .smoke:nth-child(2) { animation-delay: 1.1s; left: 5px; }
        .smoke:nth-child(3) { animation-delay: 2.2s; left: -3px; }

        @keyframes smoke {
            0%   { opacity: .75; transform: translateY(0) scale(1); }
            100% { opacity: 0;   transform: translateY(-46px) translateX(12px) scale(2.4); }
        }

        /* Pine Trees */
        .tree { position: absolute; bottom: 0; filter: drop-shadow(0 4px 6px rgba(0,0,0,.3)); }

        .tree-left       { left: -60px; }
        .tree-right      { right: -55px; }
        .tree-far-left   { left: -100px; transform: scale(.7); }
        .tree-far-right  { right: -95px; transform: scale(.8); }

        .tree-trunk {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 10px;
            height: 15px;
            background: linear-gradient(90deg, #5d4037 0%, #4e342e 100%);
        }

        .tree-top { position: relative; }

        .tree-layer {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: solid transparent;
            border-right: solid transparent;
            border-bottom: solid;
        }

        .tree-layer-1 {
            bottom: 55px;
            border-left-width: 20px;
            border-right-width: 20px;
            border-bottom-width: 25px;
            border-bottom-color: #1b5e20;
        }

        .tree-layer-2 {
            bottom: 35px;
            border-left-width: 25px;
            border-right-width: 25px;
            border-bottom-width: 30px;
            border-bottom-color: #2e7d32;
        }

        .tree-layer-3 {
            bottom: 10px;
            border-left-width: 30px;
            border-right-width: 30px;
            border-bottom-width: 35px;
            border-bottom-color: #388e3c;
        }

        /* Snowman */
        .snowman { position: absolute; bottom: 0; left: 60px; filter: drop-shadow(0 4px 6px rgba(0,0,0,.3)); }

        .snowman-bottom, .snowman-middle, .snowman-head {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            background: radial-gradient(circle at 30% 30%, #fff 0%, #e3ecf3 100%);
            border-radius: 50%;
        }

        .snowman-bottom { bottom: 0;    width: 35px; height: 35px; }
        .snowman-middle { bottom: 25px; width: 28px; height: 28px; }
        .snowman-head   { bottom: 47px; width: 22px; height: 22px; }

        .snowman-hat {
            position: absolute;
            bottom: 65px;
            left: 50%;
            transform: translateX(-50%);
            width: 24px;
            height: 5px;
            background: #1a1a1a;
            border-radius: 2px;
        }

        .snowman-hat::before {
            content: '';
            position: absolute;
            bottom: 5px;
            left: 50%;
            transform: translateX(-50%);
            width: 16px;
            height: 15px;
            background: linear-gradient(90deg, #1a1a1a 0%, #333 100%);
            border-radius: 2px 2px 0 0;
        }

        .snowman-hat::after {
            content: '';
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 16px;
            height: 4px;
            background: #c62828;
        }

        .snowman-nose {
            position: absolute;
            bottom: 53px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-top: 3px solid transparent;
            border-bottom: 3px solid transparent;
            border-left: 12px solid #ff6d00;
        }

        .snowman-eye {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #1a1a1a;
            border-radius: 50%;
            bottom: 58px;
        }

        .snowman-eye-left  { left: calc(50% - 5px); }
        .snowman-eye-right { left: calc(50% + 2px); }

        .snowman-button {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 4px;
            background: #1a1a1a;
            border-radius: 50%;
        }

        .snowman-button-1 { bottom: 32px; }
        .snowman-button-2 { bottom: 38px; }
        .snowman-button-3 { bottom: 44px; }

        .snowman-arm {
            position: absolute;
            bottom: 35px;
            width: 25px;
            height: 3px;
            background: #5d4037;
            border-radius: 2px;
        }

        .snowman-arm-left  { left: -8px;  transform: rotate(-30deg); }
        .snowman-arm-right { right: -8px; transform: rotate(30deg); }

        .snowman-scarf {
            position: absolute;
            bottom: 45px;
            left: 50%;
            transform: translateX(-50%);
            width: 30px;
            height: 6px;
            background: #c62828;
            border-radius: 3px;
        }

        .snowman-scarf::after {
            content: '';
            position: absolute;
            top: 6px;
            right: 0;
            width: 8px;
            height: 15px;
            background: #c62828;
            border-radius: 0 0 3px 3px;
        }

        /* Snow Particles */
        .snow-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 50;
            pointer-events: none;
            border-radius: 50%;
        }

        /* ---------- Globe Base ---------- */
        .base {
            position: relative;
            width: calc(var(--globe-size) * 0.62);
            height: calc(var(--globe-size) * 0.22);
            margin-top: calc(var(--globe-size) * -0.055);
            z-index: 10;
            filter: drop-shadow(0 18px 26px rgba(0, 0, 0, .55));
        }

        .base-top, .base-middle, .base-plate {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }

        .base-top {
            top: 0;
            width: 100%;
            height: 26%;
            background: linear-gradient(180deg, #f3d795 0%, #c9a04a 45%, #8a6a24 100%);
            border-radius: 50%;
            box-shadow: 0 4px 12px rgba(0,0,0,.35);
        }

        .base-top::before {
            content: '';
            position: absolute;
            top: 12%;
            left: 12%;
            right: 12%;
            height: 30%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent);
            border-radius: 50%;
        }

        .base-middle {
            top: 14%;
            width: 88%;
            height: 78%;
            background: linear-gradient(180deg, #6b4a26 0%, #4a3016 55%, #2c1b0c 100%);
            border-radius: 10px 10px 46% 46% / 10px 10px 30% 30%;
            box-shadow: inset 0 2px 6px rgba(255,255,255,.16);
        }

        .base-plate {
            top: 42%;
            width: 66%;
            height: 34%;
            background: linear-gradient(180deg, #f0d492 0%, #c8a24e 60%, #9a7628 100%);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: clamp(8px, 2.1vw, 11px);
            letter-spacing: .18em;
            text-transform: uppercase;
            color: rgba(60, 40, 10, .75);
            text-shadow: 0 1px 0 rgba(255, 255, 255, .35);
            box-shadow: inset 0 1px 2px rgba(255,255,255,.5), inset 0 -2px 4px rgba(0,0,0,.25);
        }

        /* ---------- Hint chip ---------- */
        .hint {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 18px;
            font-size: clamp(11px, 2.8vw, 13px);
            color: rgba(234, 242, 255, .85);
            background: var(--glass);
            border: 1px solid var(--glass-brd);
            border-radius: 999px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 8px 24px rgba(0,0,0,.25);
            transition: opacity .6s ease, transform .6s ease;
            animation: floaty 4s ease-in-out infinite;
        }

        .hint.hidden { opacity: 0; transform: translateY(8px); pointer-events: none; }

        @keyframes floaty {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-4px); }
        }

        /* ---------- Controls ---------- */
        .controls {
            position: fixed;
            bottom: max(18px, env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 10px 14px;
            background: linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,.06));
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 999px;
            border: 1px solid var(--glass-brd);
            box-shadow: 0 18px 40px rgba(0, 0, 0, .35), inset 0 1px 0 rgba(255,255,255,.3);
            z-index: 1000;
        }

        .control-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            width: 62px;
            background: none;
            border: none;
            color: var(--ink);
            cursor: pointer;
            padding: 8px 4px;
            border-radius: 18px;
            transition: background .25s ease, transform .2s ease, box-shadow .25s ease;
        }

        .control-btn span { font-size: clamp(18px, 5vw, 23px); line-height: 1; }

        .control-btn small {
            font-size: 9.5px;
            letter-spacing: .09em;
            text-transform: uppercase;
            opacity: .7;
        }

        .control-btn:hover, .control-btn:focus-visible {
            background: rgba(255, 255, 255, .18);
            transform: translateY(-3px);
            box-shadow: 0 8px 18px rgba(0,0,0,.28);
            outline: none;
        }

        .control-btn:active { transform: scale(.94); }

        .control-btn.primary {
            background: linear-gradient(180deg, rgba(158, 212, 255, .35), rgba(90, 150, 235, .28));
            box-shadow: inset 0 1px 0 rgba(255,255,255,.4), 0 6px 16px rgba(60, 120, 220, .35);
        }

        .divider {
            width: 1px;
            height: 32px;
            background: rgba(255, 255, 255, .18);
            margin: 0 4px;
        }

        .meter {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            padding: 0 4px;
            min-width: 58px;
        }

        .meter small {
            font-size: 9.5px;
            letter-spacing: .09em;
            text-transform: uppercase;
            opacity: .7;
        }

        .meter-bars { display: flex; gap: 3px; align-items: flex-end; height: 20px; }

        .meter-bars i {
            display: block;
            width: 5px;
            border-radius: 3px;
            background: rgba(255, 255, 255, .18);
            transition: background .3s ease, box-shadow .3s ease;
        }

        .meter-bars i:nth-child(1) { height: 8px; }
        .meter-bars i:nth-child(2) { height: 11px; }
        .meter-bars i:nth-child(3) { height: 14px; }
        .meter-bars i:nth-child(4) { height: 17px; }
        .meter-bars i:nth-child(5) { height: 20px; }

        .meter-bars i.on {
            background: linear-gradient(180deg, #eaf6ff, var(--accent));
            box-shadow: 0 0 10px rgba(158, 212, 255, .8);
        }

        /* Shake Animation */
        .globe.shaking { animation: shake .55s cubic-bezier(.36,.07,.19,.97); }

        @keyframes shake {
            0%, 100% { transform: translateX(0) rotate(0); }
            10% { transform: translateX(-10px) rotate(-3deg); }
            20% { transform: translateX(10px) rotate(3deg); }
            30% { transform: translateX(-10px) rotate(-3deg); }
            40% { transform: translateX(9px) rotate(2.5deg); }
            50% { transform: translateX(-6px) rotate(-1.5deg); }
            60% { transform: translateX(5px) rotate(1deg); }
            70% { transform: translateX(-3px) rotate(0); }
            85% { transform: translateX(2px) rotate(0); }
        }

        /* Night mode look */
        .globe.night-mode {
            background:
                radial-gradient(120% 120% at 26% 20%, rgba(255,255,255,.28) 0%, rgba(255,255,255,.05) 30%, transparent 62%),
                radial-gradient(circle at 50% 42%, #143148 0%, #08192a 55%, #030a12 100%);
        }

        .globe.night-mode .mountain { opacity: .22; }

        @media (max-width: 520px) {
            body { padding-bottom: 130px; gap: 12px; }
            .control-btn { width: 52px; }
            .controls { gap: 2px; padding: 8px 10px; }
            .meter { min-width: 48px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: .001s !important;
                animation-iteration-count: 1 !important;
            }
        }
    </style>
</head>
<body>
    <!-- Ambient background -->
    <div class="aurora" aria-hidden="true"><span></span><span></span><span></span></div>
    <div class="stars" id="stars" aria-hidden="true"></div>

    <header>
        <h1 class="title">✨ Snow Globe ✨</h1>
        <p class="subtitle">A tiny winter world</p>
    </header>

    <div class="snow-globe-container">
        <div class="globe-glow" aria-hidden="true"></div>

        <div class="globe" id="globe" role="img" aria-label="Interactive snow globe with a cabin, pine trees and a snowman">
            <!-- Sky details -->
            <div class="moon" aria-hidden="true"></div>
            <div class="mountain mountain-1" aria-hidden="true"></div>
            <div class="mountain mountain-2" aria-hidden="true"></div>

            <!-- Snow Canvas -->
            <canvas class="snow-canvas" id="snowCanvas"></canvas>

            <!-- Ground -->
            <div class="ground"></div>

            <!-- Scene -->
            <div class="scene">
                <div class="tree tree-far-left">
                    <div class="tree-trunk"></div>
                    <div class="tree-top">
                        <div class="tree-layer tree-layer-1"></div>
                        <div class="tree-layer tree-layer-2"></div>
                        <div class="tree-layer tree-layer-3"></div>
                    </div>
                </div>

                <div class="tree tree-left">
                    <div class="tree-trunk"></div>
                    <div class="tree-top">
                        <div class="tree-layer tree-layer-1"></div>
                        <div class="tree-layer tree-layer-2"></div>
                        <div class="tree-layer tree-layer-3"></div>
                    </div>
                </div>

                <!-- Cabin -->
                <div class="cabin">
                    <div class="roof-snow"></div>
                    <div class="chimney"></div>
                    <div class="smoke-container">
                        <div class="smoke"></div>
                        <div class="smoke"></div>
                        <div class="smoke"></div>
                    </div>
                    <div class="roof"></div>
                    <div class="cabin-body">
                        <div class="window window-left"></div>
                        <div class="window window-right"></div>
                        <div class="door"></div>
                    </div>
                </div>

                <div class="tree tree-right">
                    <div class="tree-trunk"></div>
                    <div class="tree-top">
                        <div class="tree-layer tree-layer-1"></div>
                        <div class="tree-layer tree-layer-2"></div>
                        <div class="tree-layer tree-layer-3"></div>
                    </div>
                </div>

                <div class="tree tree-far-right">
                    <div class="tree-trunk"></div>
                    <div class="tree-top">
                        <div class="tree-layer tree-layer-1"></div>
                        <div class="tree-layer tree-layer-2"></div>
                        <div class="tree-layer tree-layer-3"></div>
                    </div>
                </div>

                <!-- Snowman -->
                <div class="snowman">
                    <div class="snowman-bottom"></div>
                    <div class="snowman-middle"></div>
                    <div class="snowman-scarf"></div>
                    <div class="snowman-head"></div>
                    <div class="snowman-hat"></div>
                    <div class="snowman-nose"></div>
                    <div class="snowman-eye snowman-eye-left"></div>
                    <div class="snowman-eye snowman-eye-right"></div>
                    <div class="snowman-button snowman-button-1"></div>
                    <div class="snowman-button snowman-button-2"></div>
                    <div class="snowman-button snowman-button-3"></div>
                    <div class="snowman-arm snowman-arm-left"></div>
                    <div class="snowman-arm snowman-arm-right"></div>
                </div>
            </div>

            <!-- Glass overlays -->
            <div class="glass-shine" aria-hidden="true"></div>
            <div class="glass-rim" aria-hidden="true"></div>
        </div>

        <!-- Base -->
        <div class="base">
            <div class="base-top"></div>
            <div class="base-middle"></div>
            <div class="base-plate">❄ Winter ❄</div>
        </div>
    </div>

    <!-- Hint -->
    <div class="hint" id="hint">
        <span aria-hidden="true">🖱️</span>
        <span>Drag the globe, shake your phone, or press <b>Space</b></span>
    </div>

    <!-- Controls -->
    <div class="controls" role="toolbar" aria-label="Snow globe controls">
        <button class="control-btn primary" id="shakeBtn" title="Shake the globe (Space)" aria-label="Shake the globe">
            <span aria-hidden="true">🌨️</span>
            <small>Shake</small>
        </button>

        <div class="divider" aria-hidden="true"></div>

        <button class="control-btn" id="intensityDownBtn" title="Less snow (←)" aria-label="Less snow">
            <span aria-hidden="true">➖</span>
            <small>Less</small>
        </button>

        <div class="meter" title="Snow intensity">
            <div class="meter-bars" id="meterBars" aria-hidden="true">
                <i></i><i></i><i></i><i></i><i></i>
            </div>
            <small>Snow</small>
        </div>

        <button class="control-btn" id="intensityUpBtn" title="More snow (→)" aria-label="More snow">
            <span aria-hidden="true">➕</span>
            <small>More</small>
        </button>

        <div class="divider" aria-hidden="true"></div>

        <button class="control-btn" id="nightModeBtn" title="Toggle night mode (N)" aria-label="Toggle night mode">
            <span aria-hidden="true">🌙</span>
            <small>Night</small>
        </button>
    </div>

    <script>
        // ============================================
        // Snow Globe Application
        // ============================================

        class SnowGlobe {
            constructor() {
                // DOM Elements
                this.globe = document.getElementById('globe');
                this.canvas = document.getElementById('snowCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.hint = document.getElementById('hint');
                this.meterBars = Array.from(document.querySelectorAll('#meterBars i'));

                // Control buttons
                this.shakeBtn = document.getElementById('shakeBtn');
                this.intensityDownBtn = document.getElementById('intensityDownBtn');
                this.intensityUpBtn = document.getElementById('intensityUpBtn');
                this.nightModeBtn = document.getElementById('nightModeBtn');

                // Snowflakes
                this.snowflakes = [];

                // State
                this.state = this.loadState();

                // Physics
                this.gravity = 0.02;
                this.friction = 0.99;
                this.turbulence = 0;
                this.maxTurbulence = 5;

                // Interaction
                this.isDragging = false;
                this.lastX = 0;
                this.lastY = 0;
                this.velocity = { x: 0, y: 0 };
                this.lastShakeTime = 0;

                this.init();
            }

            loadState() {
                const defaultState = { intensity: 50, nightMode: false };
                try {
                    const saved = localStorage.getItem('snowGlobeState');
                    if (saved) return { ...defaultState, ...JSON.parse(saved) };
                } catch (e) {
                    console.warn('Could not load state:', e);
                }
                return defaultState;
            }

            saveState() {
                try {
                    localStorage.setItem('snowGlobeState', JSON.stringify({
                        intensity: this.state.intensity,
                        nightMode: this.state.nightMode
                    }));
                } catch (e) {
                    console.warn('Could not save state:', e);
                }
            }

            init() {
                this.setupCanvas();
                this.createStars();
                this.createInitialSnowflakes();
                this.setupEventListeners();
                this.applyState();
                this.animate();

                // Gently hide the hint after a while
                this.hintTimer = setTimeout(() => this.hideHint(), 9000);
            }

            setupCanvas() {
                const rect = this.globe.getBoundingClientRect();
                const dpr = Math.min(window.devicePixelRatio || 1, 2);

                this.canvas.width = Math.round(rect.width * dpr);
                this.canvas.height = Math.round(rect.height * dpr);
                this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

                this.width = rect.width;
                this.height = rect.height;
                this.centerX = this.width / 2;
                this.centerY = this.height / 2;
                this.radius = Math.min(this.width, this.height) / 2 - 5;
            }

            createStars() {
                const starsContainer = document.getElementById('stars');
                const frag = document.createDocumentFragment();
                for (let i = 0; i < 110; i++) {
                    const star = document.createElement('div');
                    const size = Math.random() * 2.4 + 0.8;
                    star.className = 'star';
                    star.style.left = Math.random() * 100 + '%';
                    star.style.top = Math.random() * 100 + '%';
                    star.style.width = size + 'px';
                    star.style.height = size + 'px';
                    star.style.opacity = (Math.random() * 0.6 + 0.2).toFixed(2);
                    star.style.animationDelay = (Math.random() * 3).toFixed(2) + 's';
                    star.style.animationDuration = (2.4 + Math.random() * 2.6).toFixed(2) + 's';
                    frag.appendChild(star);
                }
                starsContainer.appendChild(frag);
            }

            createInitialSnowflakes() {
                const count = Math.floor(this.state.intensity * 2);
                for (let i = 0; i < count; i++) this.createSnowflake(true);
            }

            createSnowflake(settled = false) {
                const angle = Math.random() * Math.PI * 2;
                const distance = Math.random() * this.radius * 0.9;

                let x, y;
                if (settled) {
                    x = this.centerX + Math.cos(angle) * distance;
                    y = this.centerY + Math.random() * this.radius * 0.3 + this.radius * 0.5;
                    const dx = x - this.centerX;
                    const dy = y - this.centerY;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist > this.radius * 0.9) {
                        const scale = (this.radius * 0.9) / dist;
                        x = this.centerX + dx * scale;
                        y = this.centerY + dy * scale;
                    }
                } else {
                    x = this.centerX + (Math.random() - 0.5) * this.radius * 1.5;
                    y = this.centerY - this.radius * 0.8 + Math.random() * 20;
                }

                this.snowflakes.push({
                    x, y,
                    vx: (Math.random() - 0.5) * 0.5,
                    vy: Math.random() * 0.5 + 0.2,
                    radius: Math.random() * 2.6 + 1,
                    opacity: Math.random() * 0.5 + 0.5,
                    rotation: Math.random() * Math.PI * 2,
                    rotationSpeed: (Math.random() - 0.5) * 0.02,
                    type: Math.floor(Math.random() * 3)
                });
            }

            setupEventListeners() {
                // Pointer (mouse + touch + pen)
                this.globe.addEventListener('pointerdown', (e) => this.startDrag(e));
                window.addEventListener('pointermove', (e) => this.drag(e));
                window.addEventListener('pointerup', () => this.endDrag());
                window.addEventListener('pointercancel', () => this.endDrag());
                this.globe.addEventListener('touchstart', (e) => e.preventDefault(), { passive: false });

                // Device motion
                if (window.DeviceMotionEvent) {
                    window.addEventListener('devicemotion', (e) => this.handleDeviceMotion(e));
                }

                // Buttons
                this.shakeBtn.addEventListener('click', () => this.triggerShake());
                this.intensityDownBtn.addEventListener('click', () => this.adjustIntensity(-10));
                this.intensityUpBtn.addEventListener('click', () => this.adjustIntensity(10));
                this.nightModeBtn.addEventListener('click', () => this.toggleNightMode());

                // Keyboard shortcuts
                window.addEventListener('keydown', (e) => {
                    if (e.target.tagName === 'INPUT') return;
                    switch (e.key) {
                        case ' ':
                        case 'Enter':
                            if (document.activeElement && document.activeElement.tagName === 'BUTTON') return;
                            e.preventDefault();
                            this.triggerShake();
                            break;
                        case 'ArrowLeft':
                        case '-': this.adjustIntensity(-10); break;
                        case 'ArrowRight':
                        case '+':
                        case '=': this.adjustIntensity(10); break;
                        case 'n':
                        case 'N': this.toggleNightMode(); break;
                    }
                });

                window.addEventListener('resize', () => this.setupCanvas());
            }

            hideHint() {
                clearTimeout(this.hintTimer);
                this.hint.classList.add('hidden');
            }

            startDrag(e) {
                this.isDragging = true;
                this.lastX = e.clientX;
                this.lastY = e.clientY;
            }

            drag(e) {
                if (!this.isDragging) return;

                const deltaX = e.clientX - this.lastX;
                const deltaY = e.clientY - this.lastY;

                this.velocity.x = deltaX * 0.3;
                this.velocity.y = deltaY * 0.3;

                const speed = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
                if (speed > 10) this.addTurbulence(speed * 0.1);

                this.lastX = e.clientX;
                this.lastY = e.clientY;
            }

            endDrag() {
                if (this.isDragging && (Math.abs(this.velocity.x) > 2 || Math.abs(this.velocity.y) > 2)) {
                    this.triggerShake();
                }
                this.isDragging = false;
                this.velocity.x = this.velocity.y = 0;
            }

            handleDeviceMotion(e) {
                const a = e.accelerationIncludingGravity;
                if (!a) return;

                const total = Math.sqrt((a.x || 0) ** 2 + (a.y || 0) ** 2 + (a.z || 0) ** 2);
                if (total > 20) this.triggerShake();
            }

            triggerShake() {
                const now = Date.now();
                if (now - this.lastShakeTime < 280) return; // debounce
                this.lastShakeTime = now;

                this.hideHint();

                this.globe.classList.remove('shaking');
                void this.globe.offsetWidth; // restart animation
                this.globe.classList.add('shaking');
                setTimeout(() => this.globe.classList.remove('shaking'), 600);

                this.addTurbulence(this.maxTurbulence);

                this.snowflakes.forEach(flake => {
                    flake.vx += (Math.random() - 0.5) * 8;
                    flake.vy += (Math.random() - 0.5) * 8 - 3;
                });

                const newFlakes = Math.floor(this.state.intensity / 5);
                for (let i = 0; i < newFlakes; i++) this.createSnowflake(false);
            }

            addTurbulence(amount) {
                this.turbulence = Math.min(this.turbulence + amount, this.maxTurbulence);
            }

            adjustIntensity(delta) {
                const before = this.state.intensity;
                this.state.intensity = Math.max(20, Math.min(100, this.state.intensity + delta));
                if (before === this.state.intensity) return;

                this.saveState();
                this.updateMeter();

                const targetCount = Math.floor(this.state.intensity * 2);
                while (this.snowflakes.length < targetCount) this.createSnowflake(Math.random() > 0.5);
                while (this.snowflakes.length > targetCount) this.snowflakes.pop();
            }

            toggleNightMode() {
                this.state.nightMode = !this.state.nightMode;
                this.saveState();
                this.applyState();
            }

            applyState() {
                this.globe.classList.toggle('night-mode', this.state.nightMode);
                document.body.classList.toggle('night', this.state.nightMode);

                this.nightModeBtn.querySelector('span').textContent = this.state.nightMode ? '☀️' : '🌙';
                this.nightModeBtn.querySelector('small').textContent = this.state.nightMode ? 'Day' : 'Night';

                this.updateMeter();
            }

            updateMeter() {
                const level = Math.round(this.state.intensity / 20); // 1..5
                this.meterBars.forEach((bar, i) => bar.classList.toggle('on', i < level));
            }

            updateSnowflakes() {
                const groundY = this.centerY + this.radius * 0.55;

                this.snowflakes.forEach(flake => {
                    if (this.turbulence > 0) {
                        flake.vx += (Math.random() - 0.5) * this.turbulence * 0.2;
                        flake.vy += (Math.random() - 0.5) * this.turbulence * 0.2;
                    }

                    flake.vy += this.gravity;
                    flake.vx *= this.friction;
                    flake.vy *= this.friction;
                    flake.vx += Math.sin(Date.now() * 0.001 + flake.x) * 0.01;

                    flake.x += flake.vx;
                    flake.y += flake.vy;
                    flake.rotation += flake.rotationSpeed;

                    const dx = flake.x - this.centerX;
                    const dy = flake.y - this.centerY;
                    const distance = Math.sqrt(dx * dx + dy * dy) || 0.0001;

                    if (distance > this.radius - flake.radius - 5) {
                        const nx = dx / distance;
                        const ny = dy / distance;
                        const dot = flake.vx * nx + flake.vy * ny;

                        flake.vx -= 2 * dot * nx * 0.5;
                        flake.vy -= 2 * dot * ny * 0.5;

                        const overlap = distance - (this.radius - flake.radius - 5);
                        flake.x -= nx * overlap;
                        flake.y -= ny * overlap;
                    }

                    if (flake.y > groundY && Math.abs(flake.vy) < 0.5) {
                        flake.y = groundY + (Math.random() - 0.5) * 10;
                        flake.vy = 0;
                        flake.vx *= 0.5;
                    }
                });

                this.turbulence *= 0.98;
                if (this.turbulence < 0.01) this.turbulence = 0;

                if (Math.random() < 0.05 && this.snowflakes.length < this.state.intensity * 2.5) {
                    this.createSnowflake(false);
                }

                while (this.snowflakes.length > this.state.intensity * 3) this.snowflakes.shift();
            }

            drawSnowflakes() {
                this.ctx.clearRect(0, 0, this.width, this.height);

                this.ctx.save();
                this.ctx.beginPath();
                this.ctx.arc(this.centerX, this.centerY, this.radius - 2, 0, Math.PI * 2);
                this.ctx.clip();

                this.ctx.shadowColor = 'rgba(200, 230, 255, .8)';
                this.ctx.shadowBlur = 6;

                this.snowflakes.forEach(flake => {
                    this.ctx.save();
                    this.ctx.translate(flake.x, flake.y);
                    this.ctx.rotate(flake.rotation);
                    this.ctx.globalAlpha = flake.opacity;

                    if (flake.type === 0) {
                        this.ctx.beginPath();
                        this.ctx.arc(0, 0, flake.radius, 0, Math.PI * 2);
                        this.ctx.fillStyle = '#fff';
                        this.ctx.fill();
                    } else if (flake.type === 1) {
                        this.drawStar(0, 0, flake.radius, 6);
                    } else {
                        this.drawCrystal(0, 0, flake.radius);
                    }

                    this.ctx.restore();
                });

                this.ctx.restore();
            }

            drawStar(x, y, radius, points) {
                this.ctx.beginPath();
                for (let i = 0; i < points * 2; i++) {
                    const r = i % 2 === 0 ? radius : radius * 0.4;
                    const angle = (i * Math.PI) / points - Math.PI / 2;
                    const px = x + Math.cos(angle) * r;
                    const py = y + Math.sin(angle) * r;
                    i === 0 ? this.ctx.moveTo(px, py) : this.ctx.lineTo(px, py);
                }
                this.ctx.closePath();
                this.ctx.fillStyle = '#fff';
                this.ctx.fill();
            }

            drawCrystal(x, y, radius) {
                this.ctx.strokeStyle = 'rgba(255,255,255,.95)';
                this.ctx.lineWidth = 1;

                for (let i = 0; i < 6; i++) {
                    const angle = (i * Math.PI) / 3;
                    this.ctx.beginPath();
                    this.ctx.moveTo(x, y);
                    this.ctx.lineTo(x + Math.cos(angle) * radius * 2, y + Math.sin(angle) * radius * 2);
                    this.ctx.stroke();

                    const bx = x + Math.cos(angle) * radius;
                    const by = y + Math.sin(angle) * radius;

                    this.ctx.beginPath();
                    this.ctx.moveTo(bx, by);
                    this.ctx.lineTo(
                        bx + Math.cos(angle + Math.PI / 4) * radius * 0.5,
                        by + Math.sin(angle + Math.PI / 4) * radius * 0.5
                    );
                    this.ctx.stroke();

                    this.ctx.beginPath();
                    this.ctx.moveTo(bx, by);
                    this.ctx.lineTo(
                        bx + Math.cos(angle - Math.PI / 4) * radius * 0.5,
                        by + Math.sin(angle - Math.PI / 4) * radius * 0.5
                    );
                    this.ctx.stroke();
                }
            }

            animate() {
                this.updateSnowflakes();
                this.drawSnowflakes();
                requestAnimationFrame(() => this.animate());
            }
        }

        document.addEventListener('DOMContentLoaded', () => new SnowGlobe());
    </script>
</body>
</html>
