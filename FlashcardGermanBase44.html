<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Флешкартки - Вивчення Німецької</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6C5CE7;
            --primary-light: #A29BFE;
            --primary-dark: #5A4BD1;
            --secondary: #00CEC9;
            --accent: #FD79A8;
            --success: #00B894;
            --warning: #FDCB6E;
            --danger: #E17055;
            --info: #74B9FF;
            --bg: #0F0F1A;
            --bg-card: #1A1A2E;
            --bg-elevated: #222240;
            --text: #EEEEF0;
            --text-secondary: #9999AA;
            --border: #333355;
            --shadow: rgba(0, 0, 0, 0.3);
            --glow: rgba(108, 92, 231, 0.3);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(ellipse at 20% 20%, rgba(108, 92, 231, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(0, 206, 201, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(253, 121, 168, 0.04) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .app-container {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 16px;
            min-height: 100vh;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            background: var(--bg-card);
            border-radius: 16px;
            border: 1px solid var(--border);
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.4em;
            font-weight: 800;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .logo-text {
            background: linear-gradient(135deg, var(--primary-light), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-stats {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .stat-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            background: var(--bg-elevated);
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 500;
        }

        .stat-badge .stat-icon {
            font-size: 1.1em;
        }

        .stat-badge .stat-value {
            color: var(--primary-light);
            font-weight: 700;
        }

        /* Navigation */
        .nav-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .nav-tab {
            padding: 10px 20px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.9em;
            font-weight: 500;
            transition: all 0.3s;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-tab:hover {
            border-color: var(--primary);
            color: var(--text);
        }

        .nav-tab.active {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border-color: var(--primary);
            color: white;
            box-shadow: 0 4px 15px var(--glow);
        }

        /* Page sections */
        .page {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .page.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Decks Grid */
        .decks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }

        .deck-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .deck-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            border-radius: 16px 16px 0 0;
        }

        .deck-card.level-a1::before { background: linear-gradient(90deg, var(--info), #A29BFE); }
        .deck-card.level-a2::before { background: linear-gradient(90deg, var(--secondary), #81ECEC); }
        .deck-card.level-b1::before { background: linear-gradient(90deg, var(--success), #55EFC4); }
        .deck-card.level-b2::before { background: linear-gradient(90deg, var(--warning), #F9CA24); }
        .deck-card.level-c1::before { background: linear-gradient(90deg, var(--danger), #FF7675); }
        .deck-card.custom::before { background: linear-gradient(90deg, var(--primary), var(--secondary)); }

        .deck-card:hover {
            transform: translateY(-4px);
            border-color: var(--primary);
            box-shadow: 0 8px 30px var(--shadow);
        }

        .deck-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .deck-title {
            font-size: 1.1em;
            font-weight: 700;
        }

        .deck-level {
            padding: 3px 10px;
            border-radius: 8px;
            font-size: 0.75em;
            font-weight: 700;
            text-transform: uppercase;
        }

        .level-a1 .deck-level { background: rgba(116, 185, 255, 0.2); color: var(--info); }
        .level-a2 .deck-level { background: rgba(0, 206, 201, 0.2); color: var(--secondary); }
        .level-b1 .deck-level { background: rgba(0, 184, 148, 0.2); color: var(--success); }
        .level-b2 .deck-level { background: rgba(253, 203, 110, 0.2); color: var(--warning); }
        .level-c1 .deck-level { background: rgba(225, 112, 85, 0.2); color: var(--danger); }
        .custom .deck-level { background: rgba(108, 92, 231, 0.2); color: var(--primary-light); }

        .deck-description {
            color: var(--text-secondary);
            font-size: 0.85em;
            margin-bottom: 16px;
            line-height: 1.4;
        }

        .deck-progress {
            margin-bottom: 12px;
        }

        .progress-bar {
            height: 6px;
            background: var(--bg-elevated);
            border-radius: 3px;
            overflow: hidden;
            margin-top: 6px;
        }

        .progress-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.5s ease;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
        }

        .progress-text {
            display: flex;
            justify-content: space-between;
            font-size: 0.8em;
            color: var(--text-secondary);
        }

        .deck-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .deck-count {
            font-size: 0.85em;
            color: var(--text-secondary);
        }

        .deck-actions {
            display: flex;
            gap: 8px;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 0.85em;
            font-weight: 600;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            box-shadow: 0 4px 12px var(--glow);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px var(--glow);
        }

        .btn-secondary {
            background: var(--bg-elevated);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            border-color: var(--primary);
        }

        .btn-success {
            background: linear-gradient(135deg, var(--success), #55EFC4);
            color: #1A1A2E;
        }

        .btn-danger {
            background: linear-gradient(135deg, var(--danger), #FF7675);
            color: white;
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 0.8em;
        }

        .btn-icon {
            width: 36px;
            height: 36px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
        }

        /* Flashcard Study Area */
        .study-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
        }

        .study-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .study-title {
            font-size: 1.2em;
            font-weight: 700;
        }

        .study-progress-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .card-counter {
            font-size: 0.9em;
            color: var(--text-secondary);
        }

        .flashcard-container {
            perspective: 1200px;
            width: 100%;
            max-width: 500px;
            height: 320px;
            margin-bottom: 24px;
            cursor: pointer;
        }

        .flashcard {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .flashcard.flipped {
            transform: rotateY(180deg);
        }

        .flashcard-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px;
            text-align: center;
            border: 1px solid var(--border);
        }

        .flashcard-front {
            background: linear-gradient(145deg, var(--bg-card), var(--bg-elevated));
            box-shadow: 0 10px 40px var(--shadow);
        }

        .flashcard-back {
            background: linear-gradient(145deg, #1E1E3A, #2A2A4A);
            transform: rotateY(180deg);
            box-shadow: 0 10px 40px var(--shadow);
        }

        .flashcard-word {
            font-size: 2em;
            font-weight: 800;
            margin-bottom: 12px;
            background: linear-gradient(135deg, var(--text), var(--primary-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .flashcard-phonetic {
            font-size: 0.95em;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .flashcard-hint {
            font-size: 0.85em;
            color: var(--primary-light);
            margin-top: 16px;
        }

        .flashcard-translation {
            font-size: 1.8em;
            font-weight: 700;
            margin-bottom: 10px;
            color: var(--secondary);
        }

        .flashcard-example {
            font-size: 0.9em;
            color: var(--text-secondary);
            line-height: 1.5;
            font-style: italic;
        }

        .flip-indicator {
            font-size: 0.8em;
            color: var(--text-secondary);
            margin-top: auto;
            display: flex;
            align-items: center;
            gap: 6px;
            opacity: 0.7;
        }

        /* Rating buttons */
        .rating-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 20px;
        }

        .rating-btn {
            padding: 12px 20px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 0.85em;
            font-weight: 600;
            transition: all 0.3s;
            min-width: 100px;
        }

        .rating-btn.again {
            background: linear-gradient(135deg, #E17055, #D63031);
            color: white;
        }

        .rating-btn.hard {
            background: linear-gradient(135deg, #FDCB6E, #E17055);
            color: #1A1A2E;
        }

        .rating-btn.good {
            background: linear-gradient(135deg, #00B894, #00CEC9);
            color: #1A1A2E;
        }

        .rating-btn.easy {
            background: linear-gradient(135deg, #6C5CE7, #A29BFE);
            color: white;
        }

        .rating-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px var(--shadow);
        }

        .rating-btn .rating-label {
            display: block;
            font-size: 0.75em;
            opacity: 0.8;
            margin-top: 2px;
        }

        /* Stats Page */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
        }

        .stat-card-icon {
            font-size: 2em;
            margin-bottom: 8px;
        }

        .stat-card-value {
            font-size: 2em;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary-light), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-card-label {
            font-size: 0.85em;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        /* Word list */
        .word-list {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
        }

        .word-list-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .word-list-title {
            font-weight: 700;
            font-size: 1.1em;
        }

        .filter-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 5px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 0.8em;
            transition: all 0.3s;
        }

        .filter-btn.active {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        .word-item {
            display: flex;
            align-items: center;
            padding: 12px 20px;
            border-bottom: 1px solid rgba(51, 51, 85, 0.5);
            transition: background 0.2s;
        }

        .word-item:hover {
            background: var(--bg-elevated);
        }

        .word-item:last-child {
            border-bottom: none;
        }

        .word-english {
            font-weight: 600;
            min-width: 140px;
        }

        .word-translation {
            color: var(--text-secondary);
            flex: 1;
        }

        .word-level-badge {
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 0.7em;
            font-weight: 700;
            margin-right: 12px;
        }

        .word-level-badge.a1 { background: rgba(116, 185, 255, 0.2); color: var(--info); }
        .word-level-badge.a2 { background: rgba(0, 206, 201, 0.2); color: var(--secondary); }
        .word-level-badge.b1 { background: rgba(0, 184, 148, 0.2); color: var(--success); }
        .word-level-badge.b2 { background: rgba(253, 203, 110, 0.2); color: var(--warning); }
        .word-level-badge.c1 { background: rgba(225, 112, 85, 0.2); color: var(--danger); }

        .word-mastery {
            display: flex;
            align-items: center;
            gap: 6px;
            min-width: 80px;
            justify-content: flex-end;
        }

        .mastery-dots {
            display: flex;
            gap: 3px;
        }

        .mastery-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--bg-elevated);
        }

        .mastery-dot.filled {
            background: var(--success);
        }

        /* Create Deck Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
            backdrop-filter: blur(4px);
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 28px;
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            animation: modalIn 0.3s ease;
        }

        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal-title {
            font-size: 1.3em;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            font-size: 0.85em;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-secondary);
        }

        .form-input, .form-textarea, .form-select {
            width: 100%;
            padding: 10px 14px;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 0.9em;
            transition: border-color 0.3s;
        }

        .form-input:focus, .form-textarea:focus, .form-select:focus {
            outline: none;
            border-color: var(--primary);
        }

        .form-textarea {
            min-height: 80px;
            resize: vertical;
        }

        .form-select {
            cursor: pointer;
        }

        .form-select option {
            background: var(--bg-card);
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
        }

        /* Session Complete */
        .session-complete {
            text-align: center;
            padding: 40px 20px;
        }

        .session-complete-icon {
            font-size: 4em;
            margin-bottom: 16px;
        }

        .session-complete h2 {
            font-size: 1.5em;
            margin-bottom: 8px;
        }

        .session-complete p {
            color: var(--text-secondary);
            margin-bottom: 24px;
        }

        .session-stats {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .session-stat {
            text-align: center;
        }

        .session-stat-value {
            font-size: 1.8em;
            font-weight: 800;
            color: var(--primary-light);
        }

        .session-stat-label {
            font-size: 0.8em;
            color: var(--text-secondary);
        }

        /* Streak calendar */
        .streak-section {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .streak-title {
            font-weight: 700;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .streak-days {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .streak-day {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: var(--bg-elevated);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7em;
            color: var(--text-secondary);
        }

        .streak-day.active {
            background: var(--primary);
            color: white;
        }

        .streak-day.today {
            border: 2px solid var(--secondary);
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .empty-state-icon {
            font-size: 3em;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .app-container {
                padding: 10px;
            }

            .header {
                padding: 12px 16px;
            }

            .logo {
                font-size: 1.1em;
            }

            .flashcard-container {
                height: 280px;
            }

            .flashcard-word {
                font-size: 1.6em;
            }

            .flashcard-translation {
                font-size: 1.4em;
            }

            .rating-buttons {
                gap: 6px;
            }

            .rating-btn {
                padding: 10px 14px;
                min-width: 75px;
                font-size: 0.8em;
            }

            .word-item {
                flex-wrap: wrap;
                gap: 4px;
            }

            .word-english {
                min-width: 120px;
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 480px) {
            .header-stats {
                width: 100%;
                justify-content: center;
            }

            .nav-tabs {
                gap: 6px;
            }

            .nav-tab {
                padding: 8px 14px;
                font-size: 0.8em;
            }

            .decks-grid {
                grid-template-columns: 1fr;
            }

            .flashcard-container {
                height: 260px;
            }
        }

        /* Landscape adjustments */
        @media (orientation: landscape) and (max-height: 500px) {
            .flashcard-container {
                height: 220px;
            }

            .flashcard-word {
                font-size: 1.4em;
            }

            .flashcard-translation {

        // ==================== SPACED REPETITION ====================
        function getCardProgress(cardKey) {
            if (!state.cardProgress[cardKey]) {
                state.cardProgress[cardKey] = {
                    interval: 0,
                    easeFactor: 2.5,
                    repetitions: 0,
                    nextReview: Date.now(),
                    lastReview: null
                };
            }
            return state.cardProgress[cardKey];
        }

        function updateCardProgress(cardKey, quality) {
            // quality: 0 = again, 1 = hard, 2 = good, 3 = easy
            const progress = getCardProgress(cardKey);
            const now = Date.now();

            // SM-2 algorithm adaptation
            if (quality < 2) {
                // Failed - reset
                progress.repetitions = 0;
                progress.interval = 1;
            } else {
                if (progress.repetitions === 0) {
                    progress.interval = 1;
                } else if (progress.repetitions === 1) {
                    progress.interval = 6;
                } else {
                    progress.interval = Math.round(progress.interval * progress.easeFactor);
                }
                progress.repetitions++;
            }

            // Update ease factor
            const q = quality;
            progress.easeFactor = Math.max(1.3,
                progress.easeFactor + (0.1 - (3 - q) * (0.08 + (3 - q) * 0.02))
            );

            // Adjust interval based on quality
            if (quality === 3) progress.interval = Math.round(progress.interval * 1.3);
            if (quality === 1) progress.interval = Math.max(1, Math.round(progress.interval * 0.6));

            progress.nextReview = now + progress.interval * 24 * 60 * 60 * 1000;
            progress.lastReview = now;

            state.cardProgress[cardKey] = progress;

            // Update stats
            state.sessionStats.studied++;
            if (quality >= 2) state.sessionStats.correct++;
            else state.sessionStats.wrong++;

            state.todayStudied++;
            state.lastStudyDate = new Date().toDateString();

            // Add to history
            const today = new Date().toDateString();
            let todayHistory = state.studyHistory.find(h => h.date === today);
            if (!todayHistory) {
                todayHistory = { date: today, cardsStudied: 0, correct: 0 };
                state.studyHistory.push(todayHistory);
            }
            todayHistory.cardsStudied++;
            if (quality >= 2) todayHistory.correct++;

            saveState();
            updateHeaderStats();
        }

        function getCardsDueForReview(deck) {
            const now = Date.now();
            return deck.cards.filter(card => {
                const key = `${deck.id}_${card.front}`;
                const progress = getCardProgress(key);
                return progress.nextReview <= now;
            });
        }

        function getNewCards(deck) {
            return deck.cards.filter(card => {
                const key = `${deck.id}_${card.front}`;
                return !state.cardProgress[key] || state.cardProgress[key].lastReview === null;
            });
        }

        function getMasteryLevel(cardKey) {
            const progress = state.cardProgress[cardKey];
            if (!progress || progress.lastReview === null) return 0;
            if (progress.repetitions >= 5) return 5;
            return Math.min(5, progress.repetitions);
        }

        // ==================== STREAK ====================
        function updateStreak() {
            const today = new Date().toDateString();
            const yesterday = new Date(Date.now() - 86400000).toDateString();

            if (state.lastStudyDate === today) {
                // Already studied today, streak is current
            } else if (state.lastStudyDate === yesterday) {
                // Studied yesterday, streak continues
            } else if (state.lastStudyDate && state.lastStudyDate !== today) {
                // Missed a day, check how many days ago
                const lastDate = new Date(state.lastStudyDate);
                const diff = Math.floor((Date.now() - lastDate.getTime()) / 86400000);
                if (diff > 1) {
                    state.streak = 0;
                }
            }

            // Calculate streak from history
            let streak = 0;
            const sortedHistory = [...state.studyHistory].sort((a, b) => new Date(b.date) - new Date(a.date));

            for (let i = 0; i < sortedHistory.length; i++) {
                const expectedDate = new Date(Date.now() - i * 86400000).toDateString();
                if (sortedHistory.find(h => h.date === expectedDate)) {
                    streak++;
                } else {
                    break;
                }
            }

            state.streak = streak;
            saveState();
        }

        function updateTodayCount() {
            const today = new Date().toDateString();
            const todayHistory = state.studyHistory.find(h => h.date === today);
            state.todayStudied = todayHistory ? todayHistory.cardsStudied : 0;
        }

            let learned = 0;
            for (const key in state.cardProgress) {
                if (state.cardProgress[key].repetitions >= 3) learned++;
            }
            document.getElementById('learnedCount').textContent = learned;

            const grid = document.getElementById('decksGrid');

            state.decks.forEach(deck => {
                const totalCards = deck.cards.length;
                const dueCards = getCardsDueForReview(deck).length;

                let masteredCount = 0;
                deck.cards.forEach(card => {
                    const key = `${deck.id}_${card.front}`;
                    if (getMasteryLevel(key) >= 3) masteredCount++;
                });

                const progress = totalCards > 0 ? Math.round((masteredCount / totalCards) * 100) : 0;

                const levelClass = deck.isDefault ? `level-${deck.level}` : 'custom';

                const el = document.createElement('div');
                el.className = `deck-card ${levelClass}`;
                el.innerHTML = `
                    ${!deck.isDefault ? `<button class="delete-deck-btn" onclick="event.stopPropagation();deleteDeck('${deck.id}')" title="Видалити">🗑</button>` : ''}
                    <div class="deck-header">
                        <div class="deck-title">${deck.name}</div>
                        <div class="deck-level">${deck.level.toUpperCase()}</div>
                    </div>
                    <div class="deck-description">${deck.description}</div>
                    <div class="deck-progress">
                        <div class="progress-text">
                            <span>Прогрес: ${progress}%</span>
                            <span>${masteredCount}/${totalCards}</span>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width:${progress}%"></div>
                        </div>
                    </div>
                    <div class="deck-footer">
                        <div class="deck-count">
                            📋 ${totalCards} карток · 🔄 ${dueCards} на повтор · ✨ ${newCards} нових
                        </div>
                    </div>
                `;
                el.addEventListener('click', () => startStudy(deck.id));
                grid.appendChild(el);
            });
        }

        // ==================== CREATE DECK ====================
        function showCreateDeckModal() {
            document.getElementById('createDeckModal').classList.add('active');
            document.getElementById('deckName').value = '';
            document.getElementById('deckDescription').value = '';
            document.getElementById('deckCards').value = '';
        }

        function closeCreateDeckModal() {
            document.getElementById('createDeckModal').classList.remove('active');
        }

        function createDeck() {
            const name = document.getElementById('deckName').value.trim();
            const description = document.getElementById('deckDescription').value.trim();
            const level = document.getElementById('deckLevel').value;
            const cardsText = document.getElementById('deckCards').value.trim();

            if (!name) {
                showToast('⚠️ Введіть назву колоди');
                return;
            }

            const cards = [];
            if (cardsText) {
                cardsText.split('\n').forEach(line => {
                    const parts = line.split('|').map(s => s.trim());
                    if (parts.length >= 2 && parts[0] && parts[1]) {
                        cards.push({
                            front: parts[0],
                            back: parts[1],
                            example: parts[2] || '',
                            level: level
                        });
                    }
                });
            }

            const deck = {
                id: 'custom_' + Date.now(),
                name,
                description: description || 'Власна колода',
                level,
                cards,
                isDefault: false,
                createdAt: Date.now()
            };

            state.decks.push(deck);
            saveState();
            closeCreateDeckModal();
            renderDecks();
            showToast(`✅ Колоду "${name}" створено!`);
        }

        function deleteDeck(deckId) {
            if (confirm('Видалити цю колоду?')) {
                state.decks = state.decks.filter(d => d.id !== deckId);
                // Clean up progress for this deck
                for (const key in state.cardProgress) {
                    if (key.startsWith(deckId + '_')) {
                        delete state.cardProgress[key];
                    }
                }
                saveState();
                renderDecks();
                showToast('🗑 Колоду видалено');
            }
        }

        // ==================== STUDY PAGE ====================
        let studyQueue = [];
        let currentStudyDeck = null;
        let isFlipped = false;

        function startStudy(deckId) {
            const deck = state.decks.find(d => d.id === deckId);
            if (!deck) return;

            currentStudyDeck = deck;
            state.currentDeck = deckId;
            state.sessionStats = { studied: 0, correct: 0, wrong: 0 };

            // Build study queue: due cards first, then new cards (limit 20 new per session)
            const dueCards = getCardsDueForReview(deck);
            const newCards = getNewCards(deck).slice(0, 20);

            studyQueue = [...dueCards, ...newCards];

            // Shuffle
            for (let i = studyQueue.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [studyQueue[i], studyQueue[j]] = [studyQueue[j], studyQueue[i]];
            }

            state.currentCardIndex = 0;
            isFlipped = false;

            // Switch to study tab
            document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelector('[data-page="study"]').classList.add('active');
            document.getElementById('page-study').classList.add('active');

            renderStudyPage();
            saveState();
        }

        function renderStudyPage() {
            const content = document.getElementById('studyContent');

            if (!currentStudyDeck) {
                content.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📚</div>
                        <h3>Оберіть колоду для навчання</h3>
                        <p style="margin-top:8px;color:var(--text-secondary)">Перейдіть на вкладку "Колоди" та оберіть колоду</p>
                        <button class="btn btn-primary" style="margin-top:16px" onclick="document.querySelector('[data-page=decks]').click()">
                            📚 До колод
                        </button>
                    </div>
                `;
                return;
            }

            if (studyQueue.length === 0) {
                content.innerHTML = `
                    <div class="no-cards-msg">
                        <div class="emoji">🎉</div>
                        <h3>Всі картки вивчені!</h3>
                        <p style="margin-top:8px;color:var(--text-secondary)">Поверніться пізніше для повторення</p>
                        <button class="btn btn-primary" style="margin-top:16px" onclick="document.querySelector('[data-page=decks]').click()">
                            📚 До колод
                        </button>
                    </div>
                `;
                return;
            }

            if (state.currentCardIndex >= studyQueue.length) {
                renderSessionComplete();
                return;
            }

            const card = studyQueue[state.currentCardIndex];
            const cardKey = `${currentStudyDeck.id}_${card.front}`;
            const mastery = getMasteryLevel(cardKey);
            const progress = getCardProgress(cardKey);
            const isNew = progress.lastReview === null;

            content.innerHTML = `
                <div class="study-area">
                    <div class="study-header">
                        <div>
                            <div class="study-title">${currentStudyDeck.name}</div>
                            <div class="card-counter" style="margin-top:4px;">
                                Картка ${state.currentCardIndex + 1} з ${studyQueue.length}
                                ${isNew ? ' · <span style="color:var(--secondary)">✨ Нова</span>' : ' · <span style="color:var(--primary-light)">🔄 Повторення</span>'}
                            </div>
                        </div>
                        <div style="display:flex;gap:8px;align-items:center;">
                            <div class="mastery-dots" title="Рівень засвоєння: ${mastery}/5">
                                ${[1,2,3,4,5].map(i => `<div class="mastery-dot ${i <= mastery ? 'filled' : ''}"></div>`).join('')}
                            </div>
                            <button class="btn btn-secondary btn-small" onclick="document.querySelector('[data-page=decks]').click()">✕</button>
                        </div>
                    </div>

                    <div class="progress-bar" style="width:100%;max-width:500px;margin-bottom:20px;">
                        <div class="progress-fill" style="width:${((state.currentCardIndex) / studyQueue.length) * 100}%"></div>
                    </div>

                    <div class="flashcard-container" onclick="flipCard()">
                        <div class="flashcard ${isFlipped ? 'flipped' : ''}" id="flashcard">
                            <div class="flashcard-face flashcard-front">
                                <div class="flashcard-word">${card.front}</div>
                                ${card.level ? `<div class="flashcard-phonetic">${card.level.toUpperCase()}</div>` : ''}
                                <div class="flip-indicator">👆 Натисніть, щоб перевернути</div>
                            </div>
                            <div class="flashcard-face flashcard-back">
                                <div class="flashcard-translation">${card.back}</div>
                                ${card.example ? `<div class="flashcard-example">"${card.example}"</div>` : ''}
                                <div class="flip-indicator">Оцініть свою відповідь ⬇️</div>
                            </div>
                        </div>
                    </div>

                    <div class="rating-buttons" id="ratingButtons" style="display:${isFlipped ? 'flex' : 'none'}">
                        <button class="rating-btn again" onclick="rateCard(0)">
                            😟 Знову
                            <span class="rating-label">&lt; 1 хв</span>
                        </button>
                        <button class="rating-btn hard" onclick="rateCard(1)">
                            😐 Важко
                            <span class="rating-label">~1 день</span>
                        </button>
                        <button class="rating-btn good" onclick="rateCard(2)">
                            😊 Добре
                            <span class="rating-label">~${getNextInterval(cardKey, 2)} дн</span>
                        </button>
                        <button class="rating-btn easy" onclick="rateCard(3)">
                            🤩 Легко
                            <span class="rating-label">~${getNextInterval(cardKey, 3)} дн</span>
                        </button>
                    </div>
                </div>
            `;
        }

        function getNextInterval(cardKey, quality) {
            const progress = { ...getCardProgress(cardKey) };
            if (quality < 2) return 1;
            if (progress.repetitions === 0) return 1;
            if (progress.repetitions === 1) return 6;
            let interval = Math.round(progress.interval * progress.easeFactor);
            if (quality === 3) interval = Math.round(interval * 1.3);
            return Math.max(1, interval);
        }

        function flipCard() {
            isFlipped = !isFlipped;
            const flashcard = document.getElementById('flashcard');
            const ratingButtons = document.getElementById('ratingButtons');

            if (flashcard) {
                flashcard.classList.toggle('flipped', isFlipped);
            }
            if (ratingButtons) {
                ratingButtons.style.display = isFlipped ? 'flex' : 'none';
            }
        }

        function rateCard(quality) {
            const card = studyQueue[state.currentCardIndex];
            const cardKey = `${currentStudyDeck.id}_${card.front}`;

            updateCardProgress(cardKey, quality);

            // If failed, add card back to queue
            if (quality === 0) {
                const reinsertPos = Math.min(
                    state.currentCardIndex + 3 + Math.floor(Math.random() * 3),
                    studyQueue.length
                );
                studyQueue.splice(reinsertPos, 0, card);
            }

            state.currentCardIndex++;
            isFlipped = false;
            renderStudyPage();
        }

        function renderSessionComplete() {
            const content = document.getElementById('studyContent');
            const { studied, correct, wrong } = state.sessionStats;
            const accuracy = studied > 0 ? Math.round((correct / studied) * 100) : 0;

            content.innerHTML = `
                <div class="session-complete">
                    <div class="session-complete-icon">🎉</div>
                    <h2>Сесію завершено!</h2>
                    <p>Чудова робота! Ось ваші результати:</p>
                    <div class="session-stats">
                        <div class="session-stat">
                            <div class="session-stat-value">${studied}</div>
                            <div class="session-stat-label">Вивчено</div>
                        </div>
                        <div class="session-stat">
                            <div class="session-stat-value" style="color:var(--success)">${correct}</div>
                            <div class="session-stat-label">Правильно</div>
                        </div>
                        <div class="session-stat">
                            <div class="session-stat-value" style="color:var(--danger)">${wrong}</div>
                            <div class="session-stat-label">На повтор</div>
                        </div>
                        <div class="session-stat">
                            <div class="session-stat-value">${accuracy}%</div>
                            <div class="session-stat-label">Точність</div>
                        </div>
                    </div>
                    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
                        <button class="btn btn-primary" onclick="startStudy('${currentStudyDeck.id}')">
                            🔄 Ще раз
                        </button>
                        <button class="btn btn-secondary" onclick="document.querySelector('[data-page=decks]').click()">
                            📚 До колод
                        </button>
                    </div>
                </div>
            `;

            updateStreak();
            updateHeaderStats();
        }

        // Keyboard support
        document.addEventListener('keydown', (e) => {
            if (!document.getElementById('page-study').classList.contains('active')) return;
            if (!currentStudyDeck || state.currentCardIndex >= studyQueue.length) return;

            if (e.code === 'Space' || e.code === 'Enter') {
                e.preventDefault();
                if (!isFlipped) {
                    flipCard();
                }
            } else if (isFlipped) {
                switch (e.key) {
                    case '1': rateCard(0); break;
                    case '2': rateCard(1); break;
                    case '3': rateCard(2); break;
                    case '4': rateCard(3); break;
                }
            }
        });

        // ==================== WORDS PAGE ====================
        let currentFilter = 'all';

        function renderWordList() {
            const content = document.getElementById('wordListContent');
            let allCards = [];

            state.decks.forEach(deck => {
                deck.cards.forEach(card => {
                    const key = `${deck.id}_${card.front}`;
                    allCards.push({
                        ...card,
                        deckId: deck.id,
                        deckName: deck.name,
                        key,
                        mastery: getMasteryLevel(key)
                    });
                });
            });

            // Remove duplicates by front word
            const seen = new Set();
            allCards = allCards.filter(c => {
                if (seen.has(c.front)) return false;
                seen.add(c.front);
                return true;
            });

            if (currentFilter !== 'all') {
                allCards = allCards.filter(c => c.level === currentFilter);
            }

            // Sort: least mastered first
            allCards.sort((a, b) => a.mastery - b.mastery);

            if (allCards.length === 0) {
                content.innerHTML = '<div style="padding:40px;text-align:center;color:var(--text-secondary)">Немає слів для відображення</div>';
                return;
            }

            content.innerHTML = allCards.map(card => `
                <div class="word-item">
                    <span class="word-level-badge ${card.level}">${card.level.toUpperCase()}</span>
                    <span class="word-english">${card.front}</span>
                    <span class="word-translation">${card.back}</span>
                    <div class="word-mastery">
                        <div class="mastery-dots">
                            ${[1,2,3,4,5].map(i => `<div class="mastery-dot ${i <= card.mastery ? 'filled' : ''}"></div>`).join('')}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Filter buttons
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                renderWordList();
            });
        });

        // ==================== STATS PAGE ====================
        function renderStats() {
            // Calculate stats
            let totalCards = 0;
            let masteredCards = 0;
            let reviewedCards = 0;
            let totalReviews = 0;

            state.decks.forEach(deck => {
                deck.cards.forEach(card => {
                    totalCards++;
                    const key = `${deck.id}_${card.front}`;
                    const progress = state.cardProgress[key];
                    if (progress && progress.lastReview !== null) {
                        reviewedCards++;
                        totalReviews += progress.repetitions;
                        if (progress.repetitions >= 3) masteredCards++;
                    }
                });
            });

            const totalDays = state.studyHistory.length;
            const totalStudied = state.studyHistory.reduce((sum, h) => sum + h.cardsStudied, 0);
            const totalCorrect = state.studyHistory.reduce((sum, h) => sum + h.correct, 0);
            const avgAccuracy = totalStudied > 0 ? Math.round((totalCorrect / totalStudied) * 100) : 0;

            // Stats grid
            document.getElementById('statsGrid').innerHTML = `
                <div class="stat-card">
                    <div class="stat-card-icon">📚</div>
                    <div class="stat-card-value">${totalCards}</div>
                    <div class="stat-card-label">Всього карток</div>
                </div>
                <div class="stat-card">
                    <div class="stat-card-icon">✅</div>
                    <div class="stat-card-value">${masteredCards}</div>
                    <div class="stat-card-label">Вивчено</div>
                </div>
                <div class="stat-card">
                    <div class="stat-card-icon">🔄</div>
                    <div class="stat-card-value">${reviewedCards}</div>
                    <div class="stat-card-label">Переглянуто</div>
                </div>
                <div class="stat-card">
                    <div class="stat-card-icon">🔥</div>
                    <div class="stat-card-value">${state.streak}</div>
                    <div class="stat-card-label">Серія днів</div>
                </div>
                <div class="stat-card">
                    <div class="stat-card-icon">📊</div>
                    <div class="stat-card-value">${avgAccuracy}%</div>
                    <div class="stat-card-label">Точність</div>
                </div>
                <div class="stat-card">
                    <div class="stat-card-icon">📅</div>
                    <div class="stat-card-value">${totalDays}</div>
                    <div class="stat-card-label">Днів навчання</div>
                </div>
            `;

            // Streak calendar (last 30 days)
            const streakDays = document.getElementById('streakDays');
            const days = [];
            for (let i = 29; i >= 0; i--) {
                const date = new Date(Date.now() - i * 86400000);
                const dateStr = date.toDateString();
                const hasStudy = state.studyHistory.some(h => h.date === dateStr);
                const isToday = i === 0;
                days.push(`
                    <div class="streak-day ${hasStudy ? 'active' : ''} ${isToday ? 'today' : ''}" 
                         title="${date.toLocaleDateString('uk-UA')}">
                        ${date.getDate()}
                    </div>
                `);
            }
            streakDays.innerHTML = days.join('');

            // Level progress
            const levelStats = {
                a1: { total: 0, mastered: 0 },
                a2: { total: 0, mastered: 0 },
                b1: { total: 0, mastered: 0 },
                b2: { total: 0, mastered: 0 },
                c1: { total: 0, mastered: 0 }
            };

            state.decks.forEach(deck => {
                if (!deck.isDefault) return;
                deck.cards.forEach(card => {
                    const level = card.level || deck.level;
                    if (levelStats[level]) {
                        levelStats[level].total++;
                        const key = `${deck.id}_${card.front}`;
                        if (getMasteryLevel(key) >= 3) levelStats[level].mastered++;
                    }
                });
            });

            const levelColors = {
                a1: 'var(--info)',
                a2: 'var(--secondary)',
                b1: 'var(--success)',
                b2: 'var(--warning)',
                c1: 'var(--danger)'
            };
            const levelNames = {
                a1: 'A1 - Початковий',
                a2: 'A2 - Елементарний',
                b1: 'B1 - Середній',
                b2: 'B2 - Вище середнього',
                c1: 'C1 - Просунутий'
            };

            document.getElementById('levelProgress').innerHTML = Object.entries(levelStats).map(([level, stats]) => {
                const pct = stats.total > 0 ? Math.round((stats.mastered / stats.total) * 100) : 0;
                return `
                    <div class="word-item" style="flex-direction:column;align-items:stretch;gap:8px;">
                        <div style="display:flex;justify-content:space-between;align-items:center;">
                            <span style="font-weight:600;">${levelNames[level]}</span>
                            <span style="color:var(--text-secondary);font-size:0.85em;">${stats.mastered}/${stats.total} (${pct}%)</span>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width:${pct}%;background:${levelColors[level]}"></div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // ==================== TOUCH SUPPORT ====================
        let touchStartX = 0;
        let touchStartY = 0;

        document.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }, { passive: true });

        document.addEventListener('touchend', (e) => {
            if (!document.getElementById('page-study').classList.contains('active')) return;
            if (!currentStudyDeck || state.currentCardIndex >= studyQueue.length) return;

            const touchEndX = e.changedTouches[0].clientX;
            const touchEndY = e.changedTouches[0].clientY;
            const diffX = touchEndX - touchStartX;
            const diffY = touchEndY - touchStartY;

            // Only handle horizontal swipes when card is flipped
            if (isFlipped && Math.abs(diffX) > 80 && Math.abs(diffX) > Math.abs(diffY)) {
                if (diffX > 0) {
                    rateCard(2); // Swipe right = good
                } else {
                    rateCard(0); // Swipe left = again
                }
            }
        }, { passive: true });

        // ==================== MODAL CLOSE ON OVERLAY CLICK ====================
        document.getElementById('createDeckModal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('createDeckModal')) {
                closeCreateDeckModal();
            }
        });

        // ==================== INIT ====================
        function init() {
            loadState();
            updateHeaderStats();
            renderDecks();
        }

        init();
    </script>
</body>
</html>
