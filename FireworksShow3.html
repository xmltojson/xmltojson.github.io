<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <meta name="theme-color" content="#0c0c1e">
    <meta name="description" content="Fireworks Show">
    <title>🎆 Fireworks Show</title>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            color-scheme: dark;
        }

        body {
            overflow: hidden;
            background: #050510;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            touch-action: manipulation;
            user-select: none;
        }

        #canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            background: #050510;
            touch-action: manipulation;
        }

        .stars {
            display: none;
        }

        .cityscape {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 155px;
            z-index: 3;
            pointer-events: none;
        }

        .title {
            position: fixed;
            top: 50%;
            left: 50%;
            z-index: 50;
            color: #fff;
            text-align: center;
            pointer-events: none;
            transform: translate(-50%, -50%);
            transition: opacity 0.8s ease;
        }

        .title.hidden { opacity: 0; }

        .title h1 {
            margin-bottom: 10px;
            font-size: clamp(32px, 5vw, 52px);
            text-shadow:
                0 0 24px rgba(255, 107, 107, 0.85),
                0 0 55px rgba(79, 172, 254, 0.45);
            animation: glow 3s ease-in-out infinite alternate;
        }

        .title p {
            font-size: clamp(13px, 2vw, 18px);
            opacity: 0.75;
        }

        @keyframes glow {
            from {
                text-shadow:
                    0 0 24px rgba(255, 107, 107, 0.85),
                    0 0 55px rgba(255, 107, 107, 0.4);
            }
            to {
                text-shadow:
                    0 0 32px rgba(79, 172, 254, 0.85),
                    0 0 65px rgba(79, 172, 254, 0.4);
            }
        }

        .controls {
            position: fixed;
            z-index: 100;
            bottom: 18px;
            left: 50%;
            display: flex;
            gap: 9px;
            width: max-content;
            max-width: 95vw;
            padding: 13px 20px;
            flex-wrap: wrap;
            justify-content: center;
            transform: translateX(-50%);
            border: 1px solid rgba(255,255,255,0.14);
            border-radius: 50px;
            background: rgba(12, 12, 28, 0.74);
            box-shadow: 0 8px 32px rgba(0,0,0,0.48);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
        }

        button {
            font: inherit;
            -webkit-tap-highlight-color: transparent;
        }

        .btn {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 11px 19px;
            border: 1px solid transparent;
            border-radius: 24px;
            color: #fff;
            cursor: pointer;
            font-size: 14px;
            font-weight: 650;
            transition: transform 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
        }

        .btn:hover { transform: translateY(-2px); }
        .btn:active { transform: translateY(0) scale(0.98); }

        .btn-primary {
            background: linear-gradient(135deg, #ff6b6b, #ff8e53);
            box-shadow: 0 4px 14px rgba(255,107,107,0.38);
        }

        .btn-secondary {
            border-color: rgba(255,255,255,0.18);
            background: rgba(255,255,255,0.1);
        }

        .btn-secondary:hover {
            background: rgba(255,255,255,0.19);
        }

        .btn-secondary.active {
            border-color: transparent;
            background: linear-gradient(135deg, #4facfe, #00d8e8);
            box-shadow: 0 4px 14px rgba(79,172,254,0.45);
        }

        .settings-backdrop {
            position: fixed;
            inset: 0;
            z-index: 9998;
            opacity: 0;
            pointer-events: none;
            background: rgba(5,5,16,0);
            transition: opacity 0.25s ease, background 0.25s ease;
        }

        .settings-backdrop.open {
            opacity: 1;
            pointer-events: auto;
            background: rgba(5,5,16,0.58);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        .settings-panel {
            position: fixed;
            top: 50%;
            left: 50%;
            z-index: 9999;
            width: 340px;
            max-width: calc(100vw - 30px);
            max-height: 86vh;
            overflow-y: auto;
            padding: 24px;
            color: #fff;
            opacity: 0;
            pointer-events: none;
            border: 1px solid rgba(255,255,255,0.24);
            border-radius: 22px;
            background: rgba(18,18,38,0.97);
            box-shadow: 0 20px 70px rgba(0,0,0,0.8), 0 0 40px rgba(79,172,254,0.13);
            transform: translate(-50%, -50%) scale(0.9);
            transition: transform 0.25s ease, opacity 0.2s ease;
        }

        .settings-panel.open {
            opacity: 1;
            pointer-events: auto;
            transform: translate(-50%, -50%) scale(1);
        }

        .settings-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 13px;
            margin-bottom: 18px;
            border-bottom: 1px solid rgba(255,255,255,0.14);
        }

        .settings-header h3 {
            font-size: 19px;
        }

        .close-btn {
            display: grid;
            width: 32px;
            height: 32px;
            border: 1px solid rgba(255,255,255,0.24);
            border-radius: 50%;
            place-items: center;
            color: #fff;
            cursor: pointer;
            background: rgba(255,255,255,0.1);
            font-size: 18px;
            transition: transform 0.2s ease, background 0.2s ease;
        }

        .close-btn:hover {
            background: rgba(255,90,90,0.7);
            transform: rotate(90deg);
        }

        .setting-group {
            padding: 14px 15px;
            margin-bottom: 14px;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 14px;
            background: rgba(255,255,255,0.05);
        }

        .setting-group > label {
            display: block;
            margin-bottom: 10px;
            font-size: 13px;
            font-weight: 650;
        }

        .setting-group label span {
            color: #4facfe;
        }

        input[type="range"] {
            width: 100%;
            height: 6px;
            accent-color: #ff7660;
            cursor: pointer;
        }

        .toggle-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 13px;
            font-size: 13px;
            font-weight: 600;
        }

        .toggle-row:last-child { margin-bottom: 0; }

        .switch {
            position: relative;
            width: 46px;
            height: 26px;
            flex: 0 0 auto;
        }

        .switch input {
            width: 0;
            height: 0;
            opacity: 0;
        }

        .slider-toggle {
            position: absolute;
            inset: 0;
            cursor: pointer;
            border-radius: 20px;
            background: rgba(255,255,255,0.24);
            transition: background 0.2s ease;
        }

        .slider-toggle::before {
            position: absolute;
            bottom: 3px;
            left: 3px;
            width: 20px;
            height: 20px;
            content: "";
            border-radius: 50%;
            background: #fff;
            transition: transform 0.2s ease;
        }

        .switch input:checked + .slider-toggle {
            background: linear-gradient(135deg, #4facfe, #00e8f2);
        }

        .switch input:checked + .slider-toggle::before {
            transform: translateX(20px);
        }

        .color-options,
        .pattern-select {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .color-btn {
            width: 31px;
            height: 31px;
            border: 2px solid rgba(255,255,255,0.28);
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.18s ease, border-color 0.18s ease;
        }

        .color-btn:hover,
        .color-btn.active {
            border-color: #fff;
            transform: scale(1.16);
            box-shadow: 0 0 12px rgba(255,255,255,0.68);
        }

        .pattern-btn {
            padding: 7px 10px;
            border: 1px solid rgba(255,255,255,0.18);
            border-radius: 8px;
            color: #fff;
            cursor: pointer;
            font-size: 12px;
            background: rgba(255,255,255,0.1);
        }

        .pattern-btn:hover { background: rgba(255,255,255,0.18); }

        .pattern-btn.active {
            border-color: transparent;
            background: linear-gradient(135deg, #4facfe, #00d8e8);
        }

        @media (max-width: 768px) {
            .controls {
                bottom: 9px;
                gap: 7px;
                padding: 9px 12px;
            }

            .btn {
                padding: 9px 13px;
                font-size: 12px;
            }

            .cityscape {
                height: 105px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .title h1 { animation: none; }
            * { scroll-behavior: auto !important; }
        }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>
    <canvas id="canvas"></canvas>

    <svg class="cityscape" viewBox="0 0 1920 150" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
        <defs>
            <linearGradient id="buildingGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#1a1a34"/>
                <stop offset="100%" stop-color="#080810"/>
            </linearGradient>
        </defs>
        <path fill="url(#buildingGrad)" d="M0,150V100h50V80h30V60h20v20h50V50h20V30h20v20h30v20h60V40h20V20h20v20h30v20h50v30h50V50h30v20h40V45h20V25h20v20h40v35h50V55h30V35h20v20h50v20h50V40h30v20h50V30h20V15h20v15h40v35h40V45h40v25h60V35h30v20h50V25h20V10h20v15h40v35h40v20h50V50h50v20h50V40h30v20h40v25h60V55h40v20h60V45h40v20h60V50h40v30h60V60h40v90Z"/>
        <g fill="#ffeb3b" opacity="0.32">
            <rect x="55" y="85" width="4" height="5"/><rect x="65" y="85" width="4" height="5"/>
            <rect x="155" y="55" width="4" height="5"/><rect x="175" y="35" width="4" height="5"/>
            <rect x="285" y="45" width="4" height="5"/><rect x="305" y="25" width="4" height="5"/>
            <rect x="455" y="55" width="4" height="5"/><rect x="545" y="30" width="4" height="5"/>
            <rect x="905" y="20" width="4" height="5"/><rect x="1205" y="15" width="4" height="5"/>
        </g>
    </svg>

    <div class="title" id="title">
        <h1>🎆 Fireworks Show</h1>
        <p>Click anywhere to launch • Press Space, M, A, F</p>
    </div>

    <div class="settings-backdrop" id="settingsBackdrop"></div>

    <div class="settings-panel" id="settingsPanel" role="dialog" aria-modal="true" aria-label="Fireworks settings">
        <div class="settings-header">
            <h3>⚙️ Settings</h3>
            <button class="close-btn" id="closeSettingsBtn" type="button" aria-label="Close settings">✕</button>
        </div>

        <div class="setting-group">
            <label for="particleSize">Particle Count: <span id="particleSizeLabel">120</span></label>
            <input type="range" id="particleSize" min="30" max="300" value="120">
        </div>

        <div class="setting-group">
            <label for="explosionSize">Explosion Size: <span id="explosionSizeLabel">1.0</span></label>
            <input type="range" id="explosionSize" min="0.5" max="2.5" step="0.1" value="1">
        </div>

        <div class="setting-group">
            <label for="trailLength">Trail Length: <span id="trailLengthLabel">0.15</span></label>
            <input type="range" id="trailLength" min="0.03" max="0.5" step="0.01" value="0.15">
        </div>

        <div class="setting-group">
            <label for="autoSpeed">Auto Launch Speed: <span id="autoSpeedLabel">1000</span>ms</label>
            <input type="range" id="autoSpeed" min="200" max="3000" step="100" value="1000">
        </div>

        <div class="setting-group">
            <label for="gravity">Gravity: <span id="gravityLabel">0.05</span></label>
            <input type="range" id="gravity" min="0.01" max="0.15" step="0.01" value="0.05">
        </div>

        <div class="setting-group">
            <div class="toggle-row">
                <label for="glitterToggle">✨ Glitter Trails</label>
                <label class="switch">
                    <input type="checkbox" id="glitterToggle" checked>
                    <span class="slider-toggle"></span>
                </label>
            </div>
            <div class="toggle-row">
                <label for="flashToggle">🌈 Screen Flash</label>
                <label class="switch">
                    <input type="checkbox" id="flashToggle" checked>
                    <span class="slider-toggle"></span>
                </label>
            </div>
            <div class="toggle-row">
                <label for="soundToggle">🔊 Sound FX</label>
                <label class="switch">
                    <input type="checkbox" id="soundToggle">
                    <span class="slider-toggle"></span>
                </label>
            </div>
        </div>

        <div class="setting-group">
            <label>Colors</label>
            <div class="color-options" id="colorOptions">
                <button class="color-btn active" type="button" data-color="rainbow" aria-label="Rainbow" style="background:linear-gradient(45deg,red,orange,yellow,green,blue,purple)"></button>
                <button class="color-btn" type="button" data-color="red" aria-label="Red" style="background:linear-gradient(45deg,#ff4444,#ff8888)"></button>
                <button class="color-btn" type="button" data-color="blue" aria-label="Blue" style="background:linear-gradient(45deg,#4444ff,#8888ff)"></button>
                <button class="color-btn" type="button" data-color="green" aria-label="Green" style="background:linear-gradient(45deg,#44ff44,#88ff88)"></button>
                <button class="color-btn" type="button" data-color="gold" aria-label="Gold" style="background:linear-gradient(45deg,#ffd700,#ffeb3b)"></button>
                <button class="color-btn" type="button" data-color="purple" aria-label="Purple" style="background:linear-gradient(45deg,#9c27b0,#e91e63)"></button>
                <button class="color-btn" type="button" data-color="pastel" aria-label="Pastel" style="background:linear-gradient(45deg,#ffb3ba,#bae1ff,#baffc9)"></button>
                <button class="color-btn" type="button" data-color="fire" aria-label="Fire" style="background:linear-gradient(45deg,#ff0000,#ff8800,#ffdd00)"></button>
                <button class="color-btn" type="button" data-color="ice" aria-label="Ice" style="background:linear-gradient(45deg,#00ffff,#0088ff,#fff)"></button>
                <button class="color-btn" type="button" data-color="white" aria-label="White" style="background:linear-gradient(45deg,#fff,#ddd)"></button>
            </div>
        </div>

        <div class="setting-group">
            <label>Explosion Pattern</label>
            <div class="pattern-select" id="patternSelect">
                <button class="pattern-btn active" type="button" data-pattern="circle">Circle</button>
                <button class="pattern-btn" type="button" data-pattern="heart">Heart</button>
                <button class="pattern-btn" type="button" data-pattern="star">Star</button>
                <button class="pattern-btn" type="button" data-pattern="ring">Ring</button>
                <button class="pattern-btn" type="button" data-pattern="double">Double</button>
                <button class="pattern-btn" type="button" data-pattern="willow">Willow</button>
                <button class="pattern-btn" type="button" data-pattern="chrysanthemum">Chrysanth</button>
                <button class="pattern-btn" type="button" data-pattern="palm">Palm</button>
                <button class="pattern-btn" type="button" data-pattern="spiral">Spiral</button>
                <button class="pattern-btn" type="button" data-pattern="random">Random</button>
            </div>
        </div>
    </div>

    <div class="controls">
        <button class="btn btn-primary" id="launchBtn" type="button">🚀 Launch</button>
        <button class="btn btn-secondary" id="autoBtn" type="button">🔄 Auto Mode</button>
        <button class="btn btn-secondary" id="multiBtn" type="button">💥 Multi Shot</button>
        <button class="btn btn-secondary" id="finaleBtn" type="button">🎇 Finale</button>
        <button class="btn btn-secondary" id="settingsBtn" type="button">⚙️ Settings</button>
        <button class="btn btn-secondary" id="clearBtn" type="button">🗑️ Clear</button>
    </div>

    <script>
        "use strict";

        /*
         * Performance improvements:
         * - Reduced canvas render resolution on high-DPR screens.
         * - Particle object pooling to reduce garbage collection during finales.
         * - Fixed-size particle trails instead of allocating/shifting trail arrays.
         * - Fast fillRect particle rendering instead of multiple arcs/shadows per particle.
         * - Global adaptive particle budget based on device and measured frame time.
         * - Static canvas stars instead of 160 animated DOM nodes.
         * - Reused audio noise buffer instead of creating a new buffer on every explosion.
         */

        const canvas = document.getElementById("canvas");
        const isMobile = matchMedia("(max-width: 768px), (pointer: coarse)").matches;
        const ctx = canvas.getContext("2d", {
            alpha: false,
            desynchronized: true
        });

        const TWO_PI = Math.PI * 2;
        const FRAME_60 = 1000 / 60;
        const BASE_MAX_PARTICLES = isMobile ? 1800 : 4200;
        const MAX_FIREWORKS = isMobile ? 14 : 28;
        const MAX_POOL_SIZE = isMobile ? 2200 : 5000;

        const FLAG_GLITTER = 1;
        const FLAG_WILLOW = 2;
        const FLAG_FLICKER = 4;

        let dpr = 1;
        let viewW = innerWidth;
        let viewH = innerHeight;
        let quality = 1;
        let frameAverage = 16.7;
        let frameCounter = 0;
        let running = true;
        let lastTime = performance.now();

        const skyStars = Array.from(
            { length: isMobile ? 65 : 120 },
            () => ({
                x: Math.random(),
                y: Math.random() * 0.68,
                r: Math.random() * 1.3 + 0.35,
                a: Math.random() * 0.55 + 0.18
            })
        );

        function paintSky() {
            ctx.globalCompositeOperation = "source-over";
            ctx.globalAlpha = 1;

            const gradient = ctx.createLinearGradient(0, 0, 0, viewH);
            gradient.addColorStop(0, "#050510");
            gradient.addColorStop(0.34, "#0a0a24");
            gradient.addColorStop(0.66, "#14143a");
            gradient.addColorStop(1, "#29295c");
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, viewW, viewH);

            for (let i = 0; i < skyStars.length; i++) {
                const star = skyStars[i];
                ctx.globalAlpha = star.a;
                ctx.fillStyle = "#ffffff";
                ctx.fillRect(star.x * viewW, star.y * viewH, star.r, star.r);
            }

            ctx.globalAlpha = 1;
        }

        function resizeCanvas() {
            viewW = innerWidth;
            viewH = innerHeight;

            // Lower backing-store resolution substantially reduces fill-rate cost.
            const deviceDpr = window.devicePixelRatio || 1;
            const maxDpr = isMobile ? 1.25 : 1.5;
            dpr = Math.min(deviceDpr, maxDpr);

            canvas.width = Math.max(1, Math.floor(viewW * dpr));
            canvas.height = Math.max(1, Math.floor(viewH * dpr));
            canvas.style.width = viewW + "px";
            canvas.style.height = viewH + "px";

            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctx.imageSmoothingEnabled = false;
            paintSky();
        }

        resizeCanvas();
        addEventListener("resize", resizeCanvas, { passive: true });

        const defaultState = {
            launchCount: 0,
            settings: {
                particleCount: 120,
                explosionSize: 1,
                trailLength: 0.15,
                autoSpeed: 1000,
                gravity: 0.05,
                colorScheme: "rainbow",
                pattern: "circle",
                glitter: true,
                flash: true,
                sound: false
            }
        };

        function loadState() {
            try {
                const saved = localStorage.getItem("fireworksState");
                if (!saved) return structuredClone(defaultState);

                const parsed = JSON.parse(saved);
                return {
                    ...defaultState,
                    ...parsed,
                    settings: {
                        ...defaultState.settings,
                        ...(parsed.settings || {})
                    }
                };
            } catch {
                return JSON.parse(JSON.stringify(defaultState));
            }
        }

        let state = loadState();
        let saveTimer = 0;

        function saveState() {
            if (saveTimer) return;

            saveTimer = setTimeout(() => {
                try {
                    localStorage.setItem("fireworksState", JSON.stringify(state));
                } catch {}
                saveTimer = 0;
            }, 400);
        }

        let audioCtx = null;
        let boomNoiseBuffer = null;
        let lastBoomSound = 0;

        function initAudio() {
            if (!audioCtx) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (!AudioContextClass) return;

                audioCtx = new AudioContextClass();

                const length = (audioCtx.sampleRate * 0.36) | 0;
                boomNoiseBuffer = audioCtx.createBuffer(1, length, audioCtx.sampleRate);
                const noise = boomNoiseBuffer.getChannelData(0);

                for (let i = 0; i < length; i++) {
                    noise[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / length, 2);
                }
            }

            if (audioCtx.state === "suspended") {
                audioCtx.resume().catch(() => {});
            }
        }

        function playLaunchSound() {
            if (!state.settings.sound || !audioCtx) return;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            const now = audioCtx.currentTime;

            osc.type = "sawtooth";
            osc.frequency.setValueAtTime(180, now);
            osc.frequency.exponentialRampToValueAtTime(600, now + 0.45);

            gain.gain.setValueAtTime(0.055, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);

            osc.connect(gain).connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.46);
        }

        function playBoomSound() {
            if (!state.settings.sound || !audioCtx || !boomNoiseBuffer) return;

            const now = audioCtx.currentTime;
            if (now - lastBoomSound < 0.075) return;
            lastBoomSound = now;

            const noise = audioCtx.createBufferSource();
            const filter = audioCtx.createBiquadFilter();
            const gain = audioCtx.createGain();

            noise.buffer = boomNoiseBuffer;
            filter.type = "lowpass";
            filter.frequency.setValueAtTime(900, now);
            filter.frequency.exponentialRampToValueAtTime(130, now + 0.35);

            gain.gain.setValueAtTime(0.28, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.36);

            noise.connect(filter).connect(gain).connect(audioCtx.destination);
            noise.start(now);
        }

        function applySettingsToUI() {
            const s = state.settings;

            document.getElementById("particleSize").value = s.particleCount;
            document.getElementById("particleSizeLabel").textContent = s.particleCount;
            document.getElementById("explosionSize").value = s.explosionSize;
            document.getElementById("explosionSizeLabel").textContent = s.explosionSize;
            document.getElementById("trailLength").value = s.trailLength;
            document.getElementById("trailLengthLabel").textContent = s.trailLength;
            document.getElementById("autoSpeed").value = s.autoSpeed;
            document.getElementById("autoSpeedLabel").textContent = s.autoSpeed;
            document.getElementById("gravity").value = s.gravity;
            document.getElementById("gravityLabel").textContent = s.gravity;

            document.getElementById("glitterToggle").checked = s.glitter;
            document.getElementById("flashToggle").checked = s.flash;
            document.getElementById("soundToggle").checked = s.sound;

            document.querySelectorAll(".color-btn").forEach(button => {
                button.classList.toggle("active", button.dataset.color === s.colorScheme);
            });

            document.querySelectorAll(".pattern-btn").forEach(button => {
                button.classList.toggle("active", button.dataset.pattern === s.pattern);
            });
        }

        let flashAlpha = 0;
        let flashX = 0;
        let flashY = 0;

        function triggerFlash(intensity, x, y) {
            if (!state.settings.flash) return;
            flashAlpha = Math.max(flashAlpha, intensity);
            flashX = x;
            flashY = y;
        }

        const particlePool = [];
        let activeParticles = 0;

        class Particle {
            reset(x, y, color, vx, vy, size, flags) {
                this.x = x;
                this.y = y;
                this.prevX = x;
                this.prevY = y;
                this.vx = vx;
                this.vy = vy;
                this.color = color;
                this.size = size;
                this.drawSize = size;
                this.alpha = 1;
                this.age = 0;
                this.flags = flags;

                const willow = (flags & FLAG_WILLOW) !== 0;
                this.gravity = state.settings.gravity * (willow ? 0.55 : 1);
                this.friction = willow ? 0.986 : 0.982;
                this.decay = willow ? 0.007 : Math.random() * 0.011 + 0.005;

                return this;
            }

            update(dt) {
                this.prevX = this.x;
                this.prevY = this.y;

                const friction = Math.pow(this.friction, dt);
                this.vx *= friction;
                this.vy = this.vy * friction + this.gravity * dt;
                this.x += this.vx * dt;
                this.y += this.vy * dt;
                this.alpha -= this.decay * dt;
                this.age += dt;

                if (this.flags & FLAG_FLICKER) {
                    this.drawSize = this.size * (0.64 + Math.sin(this.age * 1.8) * 0.28);
                }
            }

            draw(drawTrails) {
                const alpha = this.alpha;
                if (alpha <= 0) return;

                const glitter = (this.flags & FLAG_GLITTER) !== 0;

                if (drawTrails && !glitter && this.age > 0.5) {
                    ctx.globalAlpha = alpha * 0.22;
                    ctx.strokeStyle = this.color;
                    ctx.lineWidth = Math.max(1, this.drawSize * 0.45);
                    ctx.beginPath();
                    ctx.moveTo(this.prevX, this.prevY);
                    ctx.lineTo(this.x, this.y);
                    ctx.stroke();
                }

                const size = Math.max(1, this.drawSize);
                ctx.globalAlpha = alpha;
                ctx.fillStyle = this.color;
                ctx.fillRect(
                    (this.x - size * 0.5) | 0,
                    (this.y - size * 0.5) | 0,
                    Math.ceil(size),
                    Math.ceil(size)
                );
            }
        }

        function acquireParticle(x, y, color, vx, vy, size, flags) {
            const particle = particlePool.pop() || new Particle();
            return particle.reset(x, y, color, vx, vy, size, flags);
        }

        function releaseParticle(particle) {
            if (particlePool.length < MAX_POOL_SIZE) {
                particlePool.push(particle);
            }
        }

        class Firework {
            constructor(startX, startY, targetX, targetY) {
                this.x = startX;
                this.y = startY;
                this.prevX = startX;
                this.prevY = startY;
                this.targetX = targetX;
                this.targetY = targetY;

                const angle = Math.atan2(targetY - startY, targetX - startX);
                const speed = 12 + Math.random() * 4;

                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.color = this.getColor();
                this.exploded = false;
                this.particles = [];
            }

            getColor() {
                const random = Math.random;
                const scheme = state.settings.colorScheme;

                switch (scheme) {
                    case "red":
                        return `hsl(${random() * 20}, 100%, 60%)`;
                    case "blue":
                        return `hsl(${200 + random() * 40}, 100%, 60%)`;
                    case "green":
                        return `hsl(${100 + random() * 40}, 100%, 52%)`;
                    case "gold":
                        return `hsl(${40 + random() * 20}, 100%, 55%)`;
                    case "purple":
                        return `hsl(${280 + random() * 40}, 100%, 62%)`;
                    case "pastel":
                        return `hsl(${random() * 360}, 70%, 80%)`;
                    case "fire":
                        return `hsl(${random() * 45}, 100%, ${55 + random() * 15}%)`;
                    case "ice":
                        return `hsl(${180 + random() * 40}, 100%, ${65 + random() * 25}%)`;
                    case "white":
                        return `hsl(0, 0%, ${82 + random() * 18}%)`;
                    default:
                        return `hsl(${random() * 360}, 100%, 62%)`;
                }
            }

            addParticle(color, vx, vy, size, flags = 0) {
                if (activeParticles >= getParticleLimit()) return false;

                this.particles.push(
                    acquireParticle(this.x, this.y, color, vx, vy, size, flags)
                );

                activeParticles++;
                return true;
            }

            update(dt) {
                if (!this.exploded) {
                    this.prevX = this.x;
                    this.prevY = this.y;

                    this.vy += 0.03 * dt;
                    this.x += this.vx * dt;
                    this.y += this.vy * dt;

                    const dx = this.targetX - this.x;
                    const dy = this.targetY - this.y;

                    if (dx * dx + dy * dy < 2500 || this.vy >= 0) {
                        this.explode();
                    }
                }

                const particles = this.particles;

                for (let i = particles.length - 1; i >= 0; i--) {
                    const particle = particles[i];
                    particle.update(dt);

                    if (particle.alpha <= 0 || particle.y > viewH + 60) {
                        particles[i] = particles[particles.length - 1];
                        particles.pop();
                        activeParticles--;
                        releaseParticle(particle);
                    }
                }
            }

            explode() {
                if (this.exploded) return;

                this.exploded = true;
                state.launchCount++;
                saveState();
                playBoomSound();
                triggerFlash(0.14 * state.settings.explosionSize, this.x, this.y);

                let pattern = state.settings.pattern;

                if (pattern === "random") {
                    const patterns = [
                        "circle", "heart", "star", "ring", "double",
                        "willow", "chrysanthemum", "palm", "spiral"
                    ];
                    pattern = patterns[(Math.random() * patterns.length) | 0];
                }

                const available = Math.max(0, getParticleLimit() - activeParticles);
                const requested = Math.floor(state.settings.particleCount * quality);
                const requestedGlitter = state.settings.glitter ? Math.floor(requested * 0.4) : 0;
                const totalRequested = requested + requestedGlitter;

                if (available <= 0 || totalRequested <= 0) return;

                const emissionScale = Math.min(1, available / totalRequested);
                const particleCount = Math.max(1, Math.floor(requested * emissionScale));
                const glitterCount = Math.floor(requestedGlitter * emissionScale);
                const explosionSize = state.settings.explosionSize;

                this.createExplosion(particleCount, explosionSize, pattern);

                for (let i = 0; i < glitterCount; i++) {
                    const angle = Math.random() * TWO_PI;
                    const speed = Math.random() * 3 * explosionSize;

                    this.addParticle(
                        "#ffffff",
                        Math.cos(angle) * speed,
                        Math.sin(angle) * speed,
                        Math.random() * 1.15 + 0.45,
                        FLAG_GLITTER | FLAG_FLICKER
                    );
                }
            }

            createExplosion(count, size, pattern) {
                const half = count * 0.5;
                const ringOuter = count * 0.6;

                for (let i = 0; i < count; i++) {
                    let angle = (i / count) * TWO_PI;
                    let speed = (Math.random() * 4 + 4) * size;
                    let color = this.getColor();
                    let flags = 0;
                    let vx;
                    let vy;

                    switch (pattern) {
                        case "heart": {
                            const t = angle;
                            const hx = 16 * Math.pow(Math.sin(t), 3);
                            const hy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
                            vx = hx * size * 0.08;
                            vy = hy * size * 0.08;
                            break;
                        }

                        case "star":
                            speed = (Math.random() * 2 + 4) * size * (i % 2 === 0 ? 1 : 0.5);
                            vx = Math.cos(angle) * speed;
                            vy = Math.sin(angle) * speed;
                            break;

                        case "ring":
                            speed = (i < ringOuter ? 6 : 3) * size;
                            vx = Math.cos(angle) * speed;
                            vy = Math.sin(angle) * speed;
                            break;

                        case "double":
                            color = i < half ? this.color : this.getColor();
                            speed = (Math.random() * 2 + (i < half ? 5 : 3)) * size;
                            vx = Math.cos(angle + (i < half ? 0 : 0.1)) * speed;
                            vy = Math.sin(angle + (i < half ? 0 : 0.1)) * speed;
                            break;

                        case "willow":
                            flags = FLAG_WILLOW;
                            speed = (Math.random() * 3 + 3) * size;
                            vx = Math.cos(angle) * speed;
                            vy = Math.sin(angle) * speed - 2;
                            break;

                        case "chrysanthemum": {
                            flags = FLAG_WILLOW;
                            const layer = i % 3;
                            const layerCount = Math.ceil(count / 3);
                            angle = ((i / 3) | 0) / layerCount * TWO_PI + layer * 0.15;
                            speed = (3 + layer * 2) * size;
                            vx = Math.cos(angle) * speed;
                            vy = Math.sin(angle) * speed;
                            break;
                        }

                        case "palm": {
                            flags = FLAG_WILLOW;
                            const frond = i % 8;
                            angle = -Math.PI / 2 + (frond - 4) * 0.28 + (Math.random() - 0.5) * 0.1;
                            speed = (5 + Math.random() * 3) * size;
                            color = this.color;
                            vx = Math.cos(angle) * speed;
                            vy = Math.sin(angle) * speed;
                            break;
                        }

                        case "spiral": {
                            const t = i / count;
                            angle = t * TWO_PI * 4;
                            speed = (1 + t * 6) * size;
                            vx = Math.cos(angle) * speed;
                            vy = Math.sin(angle) * speed;
                            break;
                        }

                        default:
                            vx = Math.cos(angle) * speed;
                            vy = Math.sin(angle) * speed;
                    }

                    this.addParticle(
                        color,
                        vx,
                        vy,
                        Math.random() * 2 + 2,
                        flags
                    );
                }
            }

            draw(skipExpensiveEffects) {
                if (!this.exploded) {
                    ctx.globalAlpha = 0.78;
                    ctx.strokeStyle = "#ffd48a";
                    ctx.lineWidth = 2.4;
                    ctx.beginPath();
                    ctx.moveTo(this.prevX, this.prevY);
                    ctx.lineTo(this.x, this.y);
                    ctx.stroke();

                    ctx.globalAlpha = 1;
                    ctx.fillStyle = "#ffffff";
                    ctx.fillRect((this.x - 2) | 0, (this.y - 2) | 0, 4, 4);
                }

                const particles = this.particles;
                const drawTrails = !skipExpensiveEffects;

                for (let i = 0; i < particles.length; i++) {
                    const particle = particles[i];

                    // Glitter is the first effect skipped under sustained frame pressure.
                    if (skipExpensiveEffects && (particle.flags & FLAG_GLITTER)) continue;

                    particle.draw(drawTrails);
                }
            }

            isDead() {
                return this.exploded && this.particles.length === 0;
            }
        }

        let fireworks = [];
        let autoMode = false;
        let autoInterval = 0;
        let finaleInterval = 0;
        const delayedLaunches = new Set();

        function getParticleLimit() {
            return Math.max(450, Math.floor(BASE_MAX_PARTICLES * quality));
        }

        function updateQuality(frameMs) {
            frameAverage = frameAverage * 0.92 + frameMs * 0.08;

            if (++frameCounter % 45 !== 0) return;

            if (frameAverage > 34) quality = 0.45;
            else if (frameAverage > 25) quality = 0.65;
            else if (frameAverage > 20) quality = 0.82;
            else quality = 1;
        }

        function clearFireworks() {
            for (let i = 0; i < fireworks.length; i++) {
                const particles = fireworks[i].particles;

                for (let p = 0; p < particles.length; p++) {
                    releaseParticle(particles[p]);
                }
            }

            fireworks.length = 0;
            activeParticles = 0;

            delayedLaunches.forEach(timer => clearTimeout(timer));
            delayedLaunches.clear();

            clearInterval(finaleInterval);
            finaleInterval = 0;

            paintSky();
        }

        function animate(now) {
            let frameMs = now - lastTime;
            lastTime = now;

            if (frameMs > 100) frameMs = 100;
            updateQuality(frameMs);

            const dt = frameMs / FRAME_60;
            const fade = 1 - Math.pow(1 - state.settings.trailLength, dt);

            ctx.globalCompositeOperation = "source-over";
            ctx.globalAlpha = 1;
            ctx.fillStyle = `rgba(6, 6, 18, ${fade})`;
            ctx.fillRect(0, 0, viewW, viewH);

            ctx.globalCompositeOperation = "lighter";

            const skipExpensiveEffects = quality < 0.7;

            for (let i = fireworks.length - 1; i >= 0; i--) {
                const firework = fireworks[i];
                firework.update(dt);
                firework.draw(skipExpensiveEffects);

                if (firework.isDead()) {
                    fireworks[i] = fireworks[fireworks.length - 1];
                    fireworks.pop();
                }
            }

            if (flashAlpha > 0.001) {
                const radius = Math.max(viewW, viewH) * 0.7;
                const gradient = ctx.createRadialGradient(
                    flashX, flashY, 0,
                    flashX, flashY, radius
                );

                gradient.addColorStop(0, `rgba(255,255,255,${flashAlpha})`);
                gradient.addColorStop(1, "rgba(255,255,255,0)");

                ctx.globalAlpha = 1;
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, viewW, viewH);

                flashAlpha *= Math.pow(0.86, dt);
            }

            ctx.globalCompositeOperation = "source-over";
            ctx.globalAlpha = 1;

            if (running) requestAnimationFrame(animate);
        }

        function launchFirework(x = null, y = null) {
            if (document.hidden || fireworks.length >= MAX_FIREWORKS) return;

            const targetX = x === null
                ? Math.random() * viewW
                : Math.max(10, Math.min(viewW - 10, x));

            const targetY = y === null
                ? Math.random() * (viewH * 0.5) + 50
                : Math.max(30, Math.min(viewH - 90, y));

            const startX = targetX + (Math.random() - 0.5) * 100;

            fireworks.push(
                new Firework(startX, viewH + 8, targetX, targetY)
            );

            playLaunchSound();
            document.getElementById("title").classList.add("hidden");
        }

        function scheduleLaunch(callback, delay) {
            const timer = setTimeout(() => {
                delayedLaunches.delete(timer);
                callback();
            }, delay);

            delayedLaunches.add(timer);
        }

        function launchMultiple() {
            const count = (Math.random() * 4 | 0) + 3;

            for (let i = 0; i < count; i++) {
                scheduleLaunch(() => launchFirework(), i * 100);
            }
        }

        function launchFinale() {
            if (finaleInterval) return;

            document.getElementById("title").classList.add("hidden");

            let bursts = 0;
            finaleInterval = setInterval(() => {
                const count = (Math.random() * 3 | 0) + 2;

                for (let i = 0; i < count; i++) {
                    scheduleLaunch(() => {
                        launchFirework(
                            Math.random() * viewW,
                            Math.random() * (viewH * 0.5) + 40
                        );
                    }, i * 65);
                }

                bursts++;

                if (bursts >= 16) {
                    clearInterval(finaleInterval);
                    finaleInterval = 0;
                }
            }, 260);
        }

        function startAutoMode() {
            clearInterval(autoInterval);

            autoInterval = setInterval(() => {
                if (document.hidden) return;

                if (Math.random() > 0.3) launchFirework();
                if (Math.random() > 0.84) launchMultiple();
            }, state.settings.autoSpeed);
        }

        canvas.addEventListener("click", event => {
            initAudio();
            launchFirework(event.clientX, event.clientY);
        });

        document.getElementById("launchBtn").addEventListener("click", () => {
            initAudio();
            launchFirework();
        });

        document.getElementById("multiBtn").addEventListener("click", () => {
            initAudio();
            launchMultiple();
        });

        document.getElementById("finaleBtn").addEventListener("click", () => {
            initAudio();
            launchFinale();
        });

        document.getElementById("autoBtn").addEventListener("click", function () {
            initAudio();
            autoMode = !autoMode;
            this.classList.toggle("active", autoMode);

            if (autoMode) {
                startAutoMode();
            } else {
                clearInterval(autoInterval);
                autoInterval = 0;
            }
        });

        const settingsPanel = document.getElementById("settingsPanel");
        const settingsBackdrop = document.getElementById("settingsBackdrop");

        function openSettings() {
            settingsPanel.classList.add("open");
            settingsBackdrop.classList.add("open");
        }

        function closeSettings() {
            settingsPanel.classList.remove("open");
            settingsBackdrop.classList.remove("open");
        }

        document.getElementById("settingsBtn").addEventListener("click", () => {
            settingsPanel.classList.contains("open") ? closeSettings() : openSettings();
        });

        document.getElementById("closeSettingsBtn").addEventListener("click", closeSettings);
        settingsBackdrop.addEventListener("click", closeSettings);

        document.getElementById("clearBtn").addEventListener("click", clearFireworks);

        document.getElementById("particleSize").addEventListener("input", function () {
            state.settings.particleCount = Number(this.value);
            document.getElementById("particleSizeLabel").textContent = this.value;
            saveState();
        });

        document.getElementById("explosionSize").addEventListener("input", function () {
            state.settings.explosionSize = Number(this.value);
            document.getElementById("explosionSizeLabel").textContent = this.value;
            saveState();
        });

        document.getElementById("trailLength").addEventListener("input", function () {
            state.settings.trailLength = Number(this.value);
            document.getElementById("trailLengthLabel").textContent = this.value;
            saveState();
        });

        document.getElementById("autoSpeed").addEventListener("input", function () {
            state.settings.autoSpeed = Number(this.value);
            document.getElementById("autoSpeedLabel").textContent = this.value;
            saveState();

            if (autoMode) startAutoMode();
        });

        document.getElementById("gravity").addEventListener("input", function () {
            state.settings.gravity = Number(this.value);
            document.getElementById("gravityLabel").textContent = this.value;
            saveState();
        });

        document.getElementById("glitterToggle").addEventListener("change", function () {
            state.settings.glitter = this.checked;
            saveState();
        });

        document.getElementById("flashToggle").addEventListener("change", function () {
            state.settings.flash = this.checked;
            saveState();
        });

        document.getElementById("soundToggle").addEventListener("change", function () {
            state.settings.sound = this.checked;
            if (this.checked) initAudio();
            saveState();
        });

        document.querySelectorAll(".color-btn").forEach(button => {
            button.addEventListener("click", function () {
                document.querySelectorAll(".color-btn").forEach(item => {
                    item.classList.remove("active");
                });

                this.classList.add("active");
                state.settings.colorScheme = this.dataset.color;
                saveState();
            });
        });

        document.querySelectorAll(".pattern-btn").forEach(button => {
            button.addEventListener("click", function () {
                document.querySelectorAll(".pattern-btn").forEach(item => {
                    item.classList.remove("active");
                });

                this.classList.add("active");
                state.settings.pattern = this.dataset.pattern;
                saveState();
            });
        });

        document.addEventListener("keydown", event => {
            if (event.code === "Escape") {
                closeSettings();
                return;
            }

            if (event.code === "Space") {
                event.preventDefault();
                initAudio();
                launchFirework();
            } else if (event.code === "KeyM") {
                initAudio();
                launchMultiple();
            } else if (event.code === "KeyA") {
                document.getElementById("autoBtn").click();
            } else if (event.code === "KeyF") {
                initAudio();
                launchFinale();
            }
        });

        document.addEventListener("visibilitychange", () => {
            if (document.hidden) {
                running = false;
                return;
            }

            if (!running) {
                running = true;
                lastTime = performance.now();
                requestAnimationFrame(animate);
            }
        });

        applySettingsToUI();
        requestAnimationFrame(animate);

        scheduleLaunch(() => launchFirework(viewW * 0.3, viewH * 0.3), 500);
        scheduleLaunch(() => launchFirework(viewW * 0.7, viewH * 0.4), 800);
        scheduleLaunch(() => launchFirework(viewW * 0.5, viewH * 0.25), 1100);
    </script>
</body>
</html>
