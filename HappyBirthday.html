<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>З Днем Народження, Алена! 🌸</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 25%, #ff9a9e 50%, #fad0c4 75%, #ffd1ff 100%);
    background-size: 400% 400%;
    animation: gradientShift 15s ease infinite;
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  @keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .container {
    max-width: 900px;
    margin: 0 auto;
    padding: 20px;
    position: relative;
    z-index: 10;
  }

  .lang-switcher {
    position: fixed;
    top: 15px;
    right: 15px;
    z-index: 100;
    display: flex;
    gap: 8px;
    background: rgba(255,255,255,0.8);
    padding: 6px;
    border-radius: 25px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.15);
  }

  .lang-btn {
    border: none;
    background: transparent;
    padding: 6px 14px;
    border-radius: 20px;
    cursor: pointer;
    font-weight: 600;
    color: #d6336c;
    transition: all 0.3s;
  }

  .lang-btn.active {
    background: linear-gradient(135deg, #ff6b9d, #c44569);
    color: white;
  }

  .card {
    background: rgba(255,255,255,0.92);
    border-radius: 30px;
    padding: 40px 30px;
    margin-top: 60px;
    box-shadow: 0 20px 60px rgba(196, 69, 105, 0.25);
    text-align: center;
    backdrop-filter: blur(10px);
    animation: cardIn 1s ease;
    border: 2px solid rgba(255,255,255,0.6);
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(40px) scale(0.95); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .flower-crown {
    font-size: 3rem;
    margin-bottom: 10px;
    animation: sway 4s ease-in-out infinite;
  }

  @keyframes sway {
    0%, 100% { transform: rotate(-5deg); }
    50% { transform: rotate(5deg); }
  }

  h1 {
    font-size: clamp(2rem, 6vw, 3.5rem);
    background: linear-gradient(135deg, #ff6b9d, #c44569, #d6336c);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 20px;
    line-height: 1.2;
    font-weight: 800;
  }

  .name {
    display: inline-block;
    animation: bounce 2s ease-in-out infinite;
  }

  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  .message {
    font-size: clamp(1rem, 3vw, 1.3rem);
    color: #6a2c4c;
    line-height: 1.8;
    margin: 20px 0;
  }

  .message p {
    margin: 15px 0;
    opacity: 0;
    animation: fadeUp 0.8s ease forwards;
  }

  .message p:nth-child(1) { animation-delay: 0.3s; }
  .message p:nth-child(2) { animation-delay: 0.6s; }
  .message p:nth-child(3) { animation-delay: 0.9s; }
  .message p:nth-child(4) { animation-delay: 1.2s; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .flowers-row {
    font-size: 2.5rem;
    margin: 25px 0;
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .flowers-row span {
    display: inline-block;
    animation: grow 3s ease-in-out infinite;
  }

  .flowers-row span:nth-child(even) { animation-delay: 0.5s; }
  .flowers-row span:nth-child(3n) { animation-delay: 1s; }

  @keyframes grow {
    0%, 100% { transform: scale(1) rotate(0); }
    50% { transform: scale(1.2) rotate(10deg); }
  }

  .btn {
    background: linear-gradient(135deg, #ff6b9d, #c44569);
    color: white;
    border: none;
    padding: 15px 35px;
    font-size: 1.1rem;
    border-radius: 30px;
    cursor: pointer;
    font-weight: 700;
    margin: 10px;
    box-shadow: 0 8px 20px rgba(196, 69, 105, 0.4);
    transition: transform 0.2s, box-shadow 0.2s;
  }

  .btn:hover {
    transform: translateY(-3px) scale(1.05);
    box-shadow: 0 12px 28px rgba(196, 69, 105, 0.5);
  }

  .btn:active { transform: scale(0.97); }

  .counter {
    font-size: 1.1rem;
    color: #c44569;
    margin-top: 15px;
    font-weight: 600;
  }

  .heart {
    color: #e63977;
  }

  /* Confetti */
  .confetti {
    position: fixed;
    width: 12px;
    height: 12px;
    top: -20px;
    z-index: 5;
    pointer-events: none;
  }

  @keyframes fall {
    to { transform: translateY(110vh) rotate(720deg); opacity: 0; }
  }

  /* Floating flowers background */
  .bg-flower {
    position: fixed;
    font-size: 2rem;
    opacity: 0.4;
    pointer-events: none;
    z-index: 1;
    animation: floatUp linear infinite;
  }

  @keyframes floatUp {
    from { transform: translateY(105vh) rotate(0); }
    to { transform: translateY(-10vh) rotate(360deg); }
  }

  /* Horizontal orientation */
  @media (orientation: landscape) and (max-height: 600px) {
    .card { margin-top: 55px; padding: 25px 30px; }
    .flower-crown { font-size: 2rem; margin-bottom: 5px; }
    .flowers-row { font-size: 1.8rem; margin: 15px 0; }
    .message { font-size: 1rem; }
    .message p { margin: 8px 0; }
  }

  @media (max-width: 480px) {
    .card { padding: 30px 20px; }
    .lang-btn { padding: 5px 10px; font-size: 0.85rem; }
  }
</style>
</head>
<body>

<div class="lang-switcher">
  <button class="lang-btn active" data-lang="uk">🇺🇦 UA</button>
  <button class="lang-btn" data-lang="en">🇬🇧 EN</button>
</div>

<div class="container">
  <div class="card">
    <div class="flower-crown">🌷🌻🌹💐🌼</div>
    <h1 id="title"></h1>
    <div class="flowers-row">
      <span>🌸</span><span>🌺</span><span>🌷</span><span>🌻</span><span>🌹</span><span>💮</span>
    </div>
    <div class="message" id="message"></div>
    <div class="flowers-row">
      <span>💐</span><span>🌼</span><span>🌸</span><span>🏵️</span><span>💐</span>
    </div>
    <button class="btn" id="celebrateBtn"></button>
    <button class="btn" id="wishBtn"></button>
    <div class="counter" id="counter"></div>
  </div>
</div>

<script>
  const translations = {
    uk: {
      title: "З Днем Народження,<br><span class='name'>Алена!</span> 🎉",
      message: [
        "🌷 Дорога Алена! Вітаємо тебе з цим чудовим святом!",
        "🌻 Нехай твоє життя квітне так само яскраво, як твої прекрасні квіти, які ти вирощуєш з любов'ю!",
        "🌹 Твоя доросла донечка, якій вже 20 років — це твій найкращий цвіт, твоя гордість і радість!",
        "💐 Бажаємо тобі міцного здоров'я, щастя, натхнення та безлічі щасливих моментів! <span class='heart'>❤️</span>"
      ],
      celebrate: "🎊 Святкувати!",
      wish: "🌟 Побажання",
      counter: "Кількість вітань: ",
      wishes: [
        "🌸 Нехай кожен день дарує тобі усмішку!",
        "🌻 Хай твої квіти завжди цвітуть пишно!",
        "🌹 Кохання та тепла у твій дім!",
        "💐 Успіху у твоїй квітковій справі!",
        "🌷 Гордися своєю прекрасною донечкою!",
        "🌼 Хай мрії збуваються, як весняні квіти!"
      ]
    },
    en: {
      title: "Happy Birthday,<br><span class='name'>Alena!</span> 🎉",
      message: [
        "🌷 Dear Alena! Congratulations on your wonderful day!",
        "🌻 May your life bloom as brightly as the beautiful flowers you grow with love!",
        "🌹 Your grown-up daughter, who is already 20 years old — is your finest blossom, your pride and joy!",
        "💐 We wish you good health, happiness, inspiration and countless happy moments! <span class='heart'>❤️</span>"
      ],
      celebrate: "🎊 Celebrate!",
      wish: "🌟 A Wish",
      counter: "Number of wishes: ",
      wishes: [
        "🌸 May every day bring you a smile!",
        "🌻 May your flowers always bloom lush!",
        "🌹 Love and warmth to your home!",
        "💐 Success in your flower business!",
        "🌷 Be proud of your beautiful daughter!",
        "🌼 May dreams come true like spring flowers!"
      ]
    }
  };

  // State
  let state = {
    lang: 'uk',
    celebrations: 0,
    lastWish: ''
  };

  // Load state from localStorage
  function loadState() {
    const saved = localStorage.getItem('alenaBirthdayState');
    if (saved) {
      try {
        state = { ...state, ...JSON.parse(saved) };
      } catch(e) {}
    }
  }

  function saveState() {
    localStorage.setItem('alenaBirthdayState', JSON.stringify(state));
  }

  // Render UI
  function render() {
    const t = translations[state.lang];
    document.getElementById('title').innerHTML = t.title;
    document.getElementById('message').innerHTML =
      t.message.map(m => `<p>${m}</p>`).join('');
    document.getElementById('celebrateBtn').textContent = t.celebrate;
    document.getElementById('wishBtn').textContent = t.wish;
    updateCounter();
    // Language buttons
    document.querySelectorAll('.lang-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.lang === state.lang);
    });
    document.documentElement.lang = state.lang;
    // Restore last wish
    if (state.lastWish) {
      showWishText(state.lastWish);
    }
  }

  function updateCounter() {
    const t = translations[state.lang];
    document.getElementById('counter').textContent =
      t.counter + state.celebrations;
  }

  // Confetti
  function launchConfetti() {
    const colors = ['#ff6b9d','#c44569','#ffd1ff','#fcb69f','#ff9a9e','#ffecd2','#e63977'];
    const emojis = ['🌸','🌷','🌹','🌻','💐','🌼','🎉','💖'];
    for (let i = 0; i < 40; i++) {
      const c = document.createElement('div');
      const useEmoji = Math.random() > 0.5;
      if (useEmoji) {
        c.textContent = emojis[Math.floor(Math.random()*emojis.length)];
        c.style.fontSize = (15 + Math.random()*20) + 'px';
      } else {
        c.className = 'confetti';
        c.style.background = colors[Math.floor(Math.random()*colors.length)];
        c.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
      }
      c.style.position = 'fixed';
      c.style.left = Math.random()*100 + 'vw';
      c.style.top = '-30px';
      c.style.zIndex = 50;
      c.style.pointerEvents = 'none';
      const dur = 2 + Math.random()*3;
      c.style.animation = `fall ${dur}s linear forwards`;
      document.body.appendChild(c);
      setTimeout(() => c.remove(), dur*1000);
    }
  }

  function showWishText(text) {
    let wishEl = document.getElementById('wishText');
    if (!wishEl) {
      wishEl = document.createElement('div');
      wishEl.id = 'wishText';
      wishEl.style.cssText = 'margin-top:18px;font-size:1.2rem;font-weight:700;color:#c44569;animation:fadeUp 0.6s ease;';
      document.getElementById('counter').after(wishEl);
    }
    wishEl.textContent = text;
  }

  // Floating background flowers
  function createBgFlowers() {
    const flowers = ['🌸','🌷','🌹','🌻','💐','🌼','🌺'];
    for (let i = 0; i < 12; i++) {
      const f = document.createElement('div');
      f.className = 'bg-flower';
      f.textContent = flowers[Math.floor(Math.random()*flowers.length)];
      f.style.left = Math.random()*100 + 'vw';
      f.style.animationDuration = (10 + Math.random()*15) + 's';
      f.style.animationDelay = -(Math.random()*15) + 's';
      f.style.fontSize = (1.5 + Math.random()*1.5) + 'rem';
      document.body.appendChild(f);
    }
  }

  // Event listeners
  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      state.lang = btn.dataset.lang;
      saveState();
      render();
    });
  });

  document.getElementById('celebrateBtn').addEventListener('click', () => {
    state.celebrations++;
    saveState();
    updateCounter();
    launchConfetti();
  });

  document.getElementById('wishBtn').addEventListener('click', () => {
    const t = translations[state.lang];
    const wishes = t.wishes;
    // store index for language independence
    const idx = Math.floor(Math.random()*wishes.length);
    state.lastWishIdx = idx;
    state.lastWish = wishes[idx];
    saveState();
    showWishText(wishes[idx]);
  });

  // Init
  loadState();
  // Fix lastWish to current language if index stored
  if (typeof state.lastWishIdx === 'number') {
    state.lastWish = translations[state.lang].wishes[state.lastWishIdx];
  }
  render();
  createBgFlowers();
  // Little welcome confetti
  setTimeout(launchConfetti, 500);
</script>
</body>
</html>
