<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>З Днем Народження, Алена! 🌸</title>
<meta name="description" content="Святкова вітальна сторінка до Дня Народження Алени — жінки, яка з любов'ю вирощує та продає прекрасні квіти. Теплі побажання, квіти, кульки та святковий настрій! / A festive birthday greeting page for Alena, who grows and sells beautiful flowers with love.">
<meta name="keywords" content="день народження, Алена, вітання, квіти, birthday, Alena, flowers, congratulations">
<meta name="author" content="Happy Birthday Alena">
<meta name="theme-color" content="#ff6b9d">
<!-- Open Graph -->
<meta property="og:title" content="З Днем Народження, Алена! 🌸">
<meta property="og:description" content="Святкова вітальна сторінка до Дня Народження Алени з квітами, кульками та теплими побажаннями!">
<meta property="og:type" content="website">
<!-- Favicon: flower SVG -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='14' fill='%23ffd93d'/><g fill='%23ff6b9d'><ellipse cx='50' cy='24' rx='11' ry='17'/><ellipse cx='50' cy='76' rx='11' ry='17'/><ellipse cx='24' cy='50' rx='17' ry='11'/><ellipse cx='76' cy='50' rx='17' ry='11'/><ellipse cx='31' cy='31' rx='11' ry='16' transform='rotate(45 31 31)'/><ellipse cx='69' cy='31' rx='11' ry='16' transform='rotate(-45 69 31)'/><ellipse cx='31' cy='69' rx='11' ry='16' transform='rotate(-45 31 69)'/><ellipse cx='69' cy='69' rx='11' ry='16' transform='rotate(45 69 69)'/></g><circle cx='50' cy='50' r='10' fill='%23ffb700'/></svg>">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html { font-size: 13.5px; }

  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 25%, #ff9a9e 50%, #fad0c4 75%, #ffd1ff 100%);
    background-size: 400% 400%;
    animation: gradientShift 15s ease infinite;
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  @keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .container {
    max-width: 600px;
    margin: 0 auto;
    padding: 12px;
    position: relative;
    z-index: 10;
  }

  .lang-switcher {
    position: fixed;
    top: 12px;
    right: 12px;
    z-index: 100;
    display: flex;
    gap: 6px;
    background: rgba(255,255,255,0.8);
    padding: 5px;
    border-radius: 25px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.15);
  }

  .lang-btn {
    border: none;
    background: transparent;
    padding: 5px 11px;
    border-radius: 20px;
    cursor: pointer;
    font-weight: 600;
    font-size: 0.85rem;
    color: #d6336c;
    transition: all 0.3s;
  }

  .lang-btn.active {
    background: linear-gradient(135deg, #ff6b9d, #c44569);
    color: white;
  }

  .card {
    background: rgba(255,255,255,0.92);
    border-radius: 22px;
    padding: 24px 24px;
    margin-top: 46px;
    box-shadow: 0 20px 60px rgba(196, 69, 105, 0.25);
    text-align: center;
    backdrop-filter: blur(10px);
    animation: cardIn 1s ease;
    border: 2px solid rgba(255,255,255,0.6);
    position: relative;
    overflow: hidden;
  }

  /* Shimmering light sweep on card */
  .card::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -60%;
    width: 40%;
    height: 200%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
    transform: rotate(25deg);
    animation: shimmer 6s ease-in-out infinite;
    pointer-events: none;
  }

  @keyframes shimmer {
    0% { left: -60%; }
    50% { left: 130%; }
    100% { left: 130%; }
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(40px) scale(0.95); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .flower-crown {
    font-size: 2rem;
    margin-bottom: 6px;
    animation: sway 4s ease-in-out infinite;
    position: relative;
    z-index: 2;
  }

  @keyframes sway {
    0%, 100% { transform: rotate(-5deg); }
    50% { transform: rotate(5deg); }
  }

  h1 {
    font-size: clamp(1.5rem, 4.5vw, 2.3rem);
    background: linear-gradient(135deg, #ff6b9d, #c44569, #d6336c, #ff9a9e);
    background-size: 300% 300%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 12px;
    line-height: 1.2;
    font-weight: 800;
    animation: textGradient 5s ease infinite;
    position: relative;
    z-index: 2;
  }

  @keyframes textGradient {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .name {
    display: inline-block;
    animation: bounce 2s ease-in-out infinite, glow 2.5s ease-in-out infinite;
  }

  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-7px); }
  }

  @keyframes glow {
    0%, 100% { filter: drop-shadow(0 0 3px rgba(230,57,119,0.4)); }
    50% { filter: drop-shadow(0 0 14px rgba(230,57,119,0.8)); }
  }

  .message {
    font-size: clamp(0.9rem, 2.3vw, 1.1rem);
    color: #6a2c4c;
    line-height: 1.55;
    margin: 12px 0;
    position: relative;
    z-index: 2;
  }

  .message p {
    margin: 8px 0;
    opacity: 0;
    animation: fadeUp 0.8s ease forwards;
  }

  .message p:nth-child(1) { animation-delay: 0.3s; }
  .message p:nth-child(2) { animation-delay: 0.6s; }
  .message p:nth-child(3) { animation-delay: 0.9s; }
  .message p:nth-child(4) { animation-delay: 1.2s; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .flowers-row {
    font-size: 1.7rem;
    margin: 13px 0;
    display: flex;
    justify-content: center;
    gap: 7px;
    flex-wrap: wrap;
    position: relative;
    z-index: 2;
  }

  .flowers-row span {
    display: inline-block;
    animation: grow 3s ease-in-out infinite;
    cursor: pointer;
    transition: transform 0.2s;
  }

  .flowers-row span:hover {
    transform: scale(1.5) rotate(20deg) !important;
  }

  .flowers-row span:nth-child(even) { animation-delay: 0.5s; }
  .flowers-row span:nth-child(3n) { animation-delay: 1s; }

  @keyframes grow {
    0%, 100% { transform: scale(1) rotate(0); }
    50% { transform: scale(1.2) rotate(10deg); }
  }

  .buttons {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 8px;
    position: relative;
    z-index: 2;
  }

  .btn {
    background: linear-gradient(135deg, #ff6b9d, #c44569);
    color: white;
    border: none;
    padding: 10px 22px;
    font-size: 0.92rem;
    border-radius: 24px;
    cursor: pointer;
    font-weight: 700;
    box-shadow: 0 8px 20px rgba(196, 69, 105, 0.4);
    transition: transform 0.2s, box-shadow 0.2s;
    position: relative;
    z-index: 2;
    overflow: hidden;
  }

  .btn::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 0;
    height: 0;
    background: rgba(255,255,255,0.4);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    transition: width 0.5s, height 0.5s;
  }

  .btn:active::after {
    width: 300px;
    height: 300px;
    transition: 0s;
  }

  .btn:hover {
    transform: translateY(-3px) scale(1.05);
    box-shadow: 0 12px 28px rgba(196, 69, 105, 0.5);
  }

  .btn:active { transform: scale(0.97); }

  .counter {
    font-size: 0.95rem;
    color: #c44569;
    margin-top: 12px;
    font-weight: 600;
    position: relative;
    z-index: 2;
  }

  .heart {
    color: #e63977;
    display: inline-block;
    animation: heartbeat 1.2s ease-in-out infinite;
  }

  @keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    25% { transform: scale(1.25); }
    50% { transform: scale(1); }
  }

  /* Confetti */
  .confetti {
    position: fixed;
    width: 12px;
    height: 12px;
    top: -20px;
    z-index: 5;
    pointer-events: none;
  }

  @keyframes fall {
    to { transform: translateY(110vh) rotate(720deg); opacity: 0; }
  }

  /* Floating flowers background */
  .bg-flower {
    position: fixed;
    font-size: 2rem;
    opacity: 0.4;
    pointer-events: none;
    z-index: 1;
    animation: floatUp linear infinite;
  }

  @keyframes floatUp {
    from { transform: translateY(105vh) rotate(0); }
    to { transform: translateY(-10vh) rotate(360deg); }
  }

  /* Sparkles */
  .sparkle {
    position: fixed;
    pointer-events: none;
    z-index: 6;
    font-size: 1rem;
    animation: sparkleAnim 1.2s ease forwards;
  }

  @keyframes sparkleAnim {
    0% { transform: scale(0) rotate(0); opacity: 1; }
    50% { transform: scale(1.4) rotate(180deg); opacity: 1; }
    100% { transform: scale(0) rotate(360deg); opacity: 0; }
  }

  /* Balloons */
  .balloon {
    position: fixed;
    bottom: -120px;
    font-size: 3rem;
    z-index: 4;
    pointer-events: none;
    animation: balloonRise linear forwards;
  }

  @keyframes balloonRise {
    0% { transform: translateY(0) translateX(0); opacity: 1; }
    100% { transform: translateY(-115vh) translateX(var(--drift)); opacity: 0.9; }
  }

  /* Wish text card */
  #wishText {
    margin-top: 12px;
    font-size: 1rem;
    font-weight: 700;
    color: #c44569;
    background: linear-gradient(135deg, rgba(255,209,255,0.5), rgba(252,182,159,0.4));
    padding: 11px 15px;
    border-radius: 15px;
    position: relative;
    z-index: 2;
    animation: fadeUp 0.6s ease, wishPulse 2.5s ease-in-out infinite;
    border: 1.5px dashed #ff9ac0;
  }

  @keyframes wishPulse {
    0%, 100% { box-shadow: 0 0 0 rgba(255,107,157,0); }
    50% { box-shadow: 0 0 20px rgba(255,107,157,0.4); }
  }

  /* Horizontal orientation */
  @media (orientation: landscape) and (max-height: 620px) {
    .card { margin-top: 44px; padding: 18px 24px; }
    .flower-crown { font-size: 1.6rem; margin-bottom: 3px; }
    h1 { margin-bottom: 8px; }
    .flowers-row { font-size: 1.4rem; margin: 8px 0; }
    .message { font-size: 0.85rem; margin: 8px 0; }
    .message p { margin: 5px 0; }
    .counter { margin-top: 8px; }
  }

  @media (max-width: 480px) {
    .card { padding: 22px 16px; }
    .lang-btn { padding: 5px 10px; font-size: 0.8rem; }
    .btn { padding: 9px 16px; font-size: 0.88rem; }
  }
</style>
</head>
<body>

<div class="lang-switcher">
  <button class="lang-btn active" data-lang="uk">🇺🇦 UA</button>
  <button class="lang-btn" data-lang="en">🇬🇧 EN</button>
</div>

<div class="container">
  <div class="card">
    <div class="flower-crown">🌷🌻🌹💐🌼</div>
    <h1 id="title"></h1>
    <div class="flowers-row">
      <span>🌸</span><span>🌺</span><span>🌷</span><span>🌻</span><span>🌹</span><span>💮</span>
    </div>
    <div class="message" id="message"></div>
    <div class="flowers-row">
      <span>💐</span><span>🌼</span><span>🌸</span><span>🏵️</span><span>💐</span>
    </div>
    <div class="buttons">
      <button class="btn" id="celebrateBtn"></button>
      <button class="btn" id="wishBtn"></button>
      <button class="btn" id="balloonBtn"></button>
    </div>
    <div class="counter" id="counter"></div>
  </div>
</div>

<script>
  const translations = {
    uk: {
      title: "З Днем Народження,<br><span class='name'>Алена!</span> 🎉",
      message: [
        "🌷 Дорога Алена! Вітаємо тебе з цим чудовим святом!",
        "🌻 Нехай твоє життя квітне так само яскраво, як твої прекрасні квіти, які ти вирощуєш з любов'ю!",
        "🌹 Твоя чудова донечка — це твій найкращий цвіт, твоя гордість і радість!",
        "💐 Бажаємо тобі міцного здоров'я, щастя, натхнення та безлічі щасливих моментів! <span class='heart'>❤️</span>"
      ],
      celebrate: "🎊 Святкувати!",
      wish: "🌟 Побажання",
      balloon: "🎈 Кульки",
      counter: "Кількість вітань: ",
      wishes: [
        "🌸 Нехай кожен день дарує тобі усмішку!",
        "🌻 Хай твої квіти завжди цвітуть пишно!",
        "🌹 Кохання та тепла у твій дім!",
        "💐 Успіху у твоїй квітковій справі!",
        "🌷 Гордися своєю прекрасною донечкою!",
        "🌼 Хай мрії збуваються, як весняні квіти!",
        "🌺 Нехай доля дарує лише приємні сюрпризи!",
        "💖 Багато радісних та світлих днів попереду!",
        "🌟 Хай у серці завжди буде весна!",
        "🦋 Легкості, натхнення та нових перемог!",
        "🍀 Удачі в кожній справі та задумі!",
        "🌈 Хай життя грає всіма барвами веселки!",
        "☀️ Тепла, затишку та душевної гармонії!",
        "🎁 Нехай кожен день приносить маленьке диво!",
        "💫 Здійснення найзаповітніших мрій!",
        "🌹 Квітучого настрою та вічної молодості душі!"
      ]
    },
    en: {
      title: "Happy Birthday,<br><span class='name'>Alena!</span> 🎉",
      message: [
        "🌷 Dear Alena! Congratulations on your wonderful day!",
        "🌻 May your life bloom as brightly as the beautiful flowers you grow with love!",
        "🌹 Your wonderful daughter — is your finest blossom, your pride and joy!",
        "💐 We wish you good health, happiness, inspiration and countless happy moments! <span class='heart'>❤️</span>"
      ],
      celebrate: "🎊 Celebrate!",
      wish: "🌟 A Wish",
      balloon: "🎈 Balloons",
      counter: "Number of wishes: ",
      wishes: [
        "🌸 May every day bring you a smile!",
        "🌻 May your flowers always bloom lush!",
        "🌹 Love and warmth to your home!",
        "💐 Success in your flower business!",
        "🌷 Be proud of your beautiful daughter!",
        "🌼 May dreams come true like spring flowers!",
        "🌺 May fate bring you only pleasant surprises!",
        "💖 Many joyful and bright days ahead!",
        "🌟 May there always be spring in your heart!",
        "🦋 Lightness, inspiration and new victories!",
        "🍀 Good luck in every endeavor and idea!",
        "🌈 May life play in all the colors of the rainbow!",
        "☀️ Warmth, coziness and inner harmony!",
        "🎁 May every day bring a little miracle!",
        "💫 Fulfillment of your most cherished dreams!",
        "🌹 A blooming mood and eternal youth of the soul!"
      ]
    }
  };

  // State
  let state = {
    lang: 'uk',
    celebrations: 0,
    lastWishIdx: null
  };

  function loadState() {
    const saved = localStorage.getItem('alenaBirthdayState');
    if (saved) {
      try {
        state = { ...state, ...JSON.parse(saved) };
      } catch(e) {}
    }
  }

  function saveState() {
    localStorage.setItem('alenaBirthdayState', JSON.stringify(state));
  }

  function render() {
    const t = translations[state.lang];
    document.getElementById('title').innerHTML = t.title;
    document.getElementById('message').innerHTML =
      t.message.map(m => `<p>${m}</p>`).join('');
    document.getElementById('celebrateBtn').textContent = t.celebrate;
    document.getElementById('wishBtn').textContent = t.wish;
    document.getElementById('balloonBtn').textContent = t.balloon;
    updateCounter();
    document.querySelectorAll('.lang-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.lang === state.lang);
    });
    document.documentElement.lang = state.lang;
    if (state.lastWishIdx !== null && typeof state.lastWishIdx === 'number') {
      showWishText(t.wishes[state.lastWishIdx]);
    }
  }

  function updateCounter() {
    const t = translations[state.lang];
    document.getElementById('counter').textContent =
      t.counter + state.celebrations;
  }

  // Confetti
  function launchConfetti() {
    const colors = ['#ff6b9d','#c44569','#ffd1ff','#fcb69f','#ff9a9e','#ffecd2','#e63977'];
    const emojis = ['🌸','🌷','🌹','🌻','💐','🌼','🎉','💖','⭐','✨'];
    for (let i = 0; i < 50; i++) {
      const c = document.createElement('div');
      const useEmoji = Math.random() > 0.5;
      if (useEmoji) {
        c.textContent = emojis[Math.floor(Math.random()*emojis.length)];
        c.style.fontSize = (15 + Math.random()*22) + 'px';
      } else {
        c.className = 'confetti';
        c.style.background = colors[Math.floor(Math.random()*colors.length)];
        c.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
      }
      c.style.position = 'fixed';
      c.style.left = Math.random()*100 + 'vw';
      c.style.top = '-30px';
      c.style.zIndex = 50;
      c.style.pointerEvents = 'none';
      const dur = 2 + Math.random()*3;
      c.style.animation = `fall ${dur}s linear forwards`;
      document.body.appendChild(c);
      setTimeout(() => c.remove(), dur*1000);
    }
  }

  // Balloons
  function launchBalloons() {
    const balloonEmojis = ['🎈','🎈','🎈','🎀','🎉'];
    for (let i = 0; i < 12; i++) {
      const b = document.createElement('div');
      b.className = 'balloon';
      b.textContent = balloonEmojis[Math.floor(Math.random()*balloonEmojis.length)];
      b.style.left = Math.random()*100 + 'vw';
      b.style.fontSize = (2.5 + Math.random()*2) + 'rem';
      b.style.setProperty('--drift', (Math.random()*120 - 60) + 'px');
      const dur = 5 + Math.random()*4;
      b.style.animationDuration = dur + 's';
      document.body.appendChild(b);
      setTimeout(() => b.remove(), dur*1000);
    }
  }

  // Sparkles that follow clicks
  function sparkleBurst(x, y) {
    const sparkleEmojis = ['✨','⭐','💫','🌟','💖'];
    for (let i = 0; i < 8; i++) {
      const s = document.createElement('div');
      s.className = 'sparkle';
      s.textContent = sparkleEmojis[Math.floor(Math.random()*sparkleEmojis.length)];
      s.style.left = x + 'px';
      s.style.top = y + 'px';
      const angle = (Math.PI * 2 * i) / 8;
      const dist = 40 + Math.random()*40;
      document.body.appendChild(s);
      const tx = Math.cos(angle) * dist;
      const ty = Math.sin(angle) * dist;
      s.animate([
        { transform: 'translate(0,0) scale(0)', opacity: 1 },
        { transform: `translate(${tx}px, ${ty}px) scale(1.4)`, opacity: 1, offset: 0.5 },
        { transform: `translate(${tx*1.5}px, ${ty*1.5}px) scale(0)`, opacity: 0 }
      ], { duration: 1000, easing: 'ease-out' });
      setTimeout(() => s.remove(), 1000);
    }
  }

  function showWishText(text) {
    let wishEl = document.getElementById('wishText');
    if (!wishEl) {
      wishEl = document.createElement('div');
      wishEl.id = 'wishText';
      document.getElementById('counter').after(wishEl);
    }
    wishEl.textContent = text;
  }

  // Floating background flowers
  function createBgFlowers() {
    const flowers = ['🌸','🌷','🌹','🌻','💐','🌼','🌺','🦋'];
    for (let i = 0; i < 14; i++) {
      const f = document.createElement('div');
      f.className = 'bg-flower';
      f.textContent = flowers[Math.floor(Math.random()*flowers.length)];
      f.style.left = Math.random()*100 + 'vw';
      f.style.animationDuration = (10 + Math.random()*15) + 's';
      f.style.animationDelay = -(Math.random()*15) + 's';
      f.style.fontSize = (1.5 + Math.random()*1.5) + 'rem';
      document.body.appendChild(f);
    }
  }

  // Event listeners
  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      state.lang = btn.dataset.lang;
      saveState();
      render();
    });
  });

  document.getElementById('celebrateBtn').addEventListener('click', (e) => {
    state.celebrations++;
    saveState();
    updateCounter();
    launchConfetti();
    sparkleBurst(e.clientX, e.clientY);
  });

  document.getElementById('wishBtn').addEventListener('click', (e) => {
    const t = translations[state.lang];
    const wishes = t.wishes;
    let idx;
    do {
      idx = Math.floor(Math.random()*wishes.length);
    } while (wishes.length > 1 && idx === state.lastWishIdx);
    state.lastWishIdx = idx;
    saveState();
    showWishText(wishes[idx]);
    sparkleBurst(e.clientX, e.clientY);
  });

  document.getElementById('balloonBtn').addEventListener('click', (e) => {
    launchBalloons();
    sparkleBurst(e.clientX, e.clientY);
  });

  // Sparkle on tapping flowers
  document.querySelectorAll('.flowers-row span').forEach(span => {
    span.addEventListener('click', (e) => {
      sparkleBurst(e.clientX, e.clientY);
    });
  });

  // Init
  loadState();
  render();
  createBgFlowers();
  setTimeout(launchConfetti, 500);
  setTimeout(launchBalloons, 800);
</script>
</body>
</html>
