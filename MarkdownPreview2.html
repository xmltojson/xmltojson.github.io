<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<link id="hljs-dark" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<link id="hljs-light" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-light.min.css" disabled>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg-primary: #0f0f1e;
  --bg-secondary: #1a1a2e;
  --bg-tertiary: #252540;
  --accent: #7c3aed;
  --accent-hover: #9333ea;
  --accent-light: #a78bfa;
  --text-primary: #e4e4e7;
  --text-secondary: #a1a1aa;
  --border: #3f3f5f;
  --success: #10b981;
  --gradient: linear-gradient(135deg, #7c3aed 0%, #ec4899 100%);
  --code-bg: #282c34;
  --code-text: #f472b6;
  --shadow: rgba(0, 0, 0, .3);
}

[data-theme="light"] {
  --bg-primary: #f5f5fa;
  --bg-secondary: #fff;
  --bg-tertiary: #f0f0f5;
  --accent: #7c3aed;
  --accent-hover: #6d28d9;
  --accent-light: #6d28d9;
  --text-primary: #1a1a2e;
  --text-secondary: #64748b;
  --border: #e2e8f0;
  --success: #10b981;
  --gradient: linear-gradient(135deg, #7c3aed 0%, #ec4899 100%);
  --code-bg: #f6f8fa;
  --code-text: #d81b60;
  --shadow: rgba(0, 0, 0, .08);
}

body {
  font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
  overflow: hidden;
  transition: background .3s, color .3s;
  background-image:
    radial-gradient(circle at 20% 30%, rgba(124,58,237,.15) 0%, transparent 50%),
    radial-gradient(circle at 80% 70%, rgba(236,72,153,.1) 0%, transparent 50%);
}

[data-theme="light"] body {
  background-image:
    radial-gradient(circle at 20% 30%, rgba(124,58,237,.08) 0%, transparent 50%),
    radial-gradient(circle at 80% 70%, rgba(236,72,153,.06) 0%, transparent 50%);
}

.app { display: flex; flex-direction: column; height: 100vh; }

header {
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--border);
  padding: 12px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
  box-shadow: 0 2px 20px var(--shadow);
}

.logo {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 1.4rem;
  font-weight: 700;
}

.logo-icon {
  width: 38px;
  height: 38px;
  background: var(--gradient);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  box-shadow: 0 4px 12px rgba(124,58,237,.4);
}

.logo-text {
  background: var(--gradient);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.btn {
  background: var(--bg-tertiary);
  color: var(--text-primary);
  border: 1px solid var(--border);
  padding: 8px 14px;
  border-radius: 8px;
  cursor: pointer;
  font-size: .875rem;
  transition: all .2s;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-weight: 500;
  font-family: inherit;
}

.btn:hover {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(124,58,237,.3);
}

.btn.primary { background: var(--gradient); border: none; color: #fff; }
.btn.primary:hover { filter: brightness(1.1); }
.btn.lang-toggle, .btn.theme-toggle { min-width: 44px; justify-content: center; font-weight: 700; }
.btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }

.main { flex: 1; display: flex; overflow: hidden; padding: 16px; gap: 16px; }
.main.vertical { flex-direction: column; }

.panel {
  flex: 1;
  background: var(--bg-secondary);
  border-radius: 12px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  box-shadow: 0 4px 20px var(--shadow);
  border: 1px solid var(--border);
  min-height: 0;
  min-width: 0;
}

.panel-header {
  background: var(--bg-tertiary);
  padding: 10px 16px;
  font-size: .875rem;
  font-weight: 600;
  color: var(--text-secondary);
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.panel-header .badge {
  background: var(--accent);
  color: #fff;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: .7rem;
}

.editor {
  flex: 1;
  width: 100%;
  background: transparent;
  color: var(--text-primary);
  border: none;
  outline: none;
  padding: 20px;
  font-family: "Fira Code", Consolas, monospace;
  font-size: 14px;
  line-height: 1.6;
  resize: none;
}

.preview { flex: 1; padding: 24px; overflow-y: auto; line-height: 1.7; }
.preview h1, .preview h2, .preview h3, .preview h4 { margin-top: 1em; margin-bottom: .5em; color: var(--accent-light); }
.preview h1 { font-size: 2em; border-bottom: 2px solid var(--border); padding-bottom: .3em; }
.preview h2 { font-size: 1.5em; border-bottom: 1px solid var(--border); padding-bottom: .3em; }
.preview h3 { font-size: 1.25em; }
.preview p { margin: .8em 0; }
.preview a { color: var(--accent-light); text-decoration: none; }
.preview a:hover { text-decoration: underline; }
.preview ul, .preview ol { margin: .8em 0; padding-left: 2em; }
.preview li { margin: .3em 0; }

.preview blockquote {
  border-left: 4px solid var(--accent);
  padding: .5em 1em;
  margin: 1em 0;
  background: rgba(124,58,237,.1);
  border-radius: 0 8px 8px 0;
  color: var(--text-secondary);
}

.preview code {
  background: var(--bg-tertiary);
  padding: 2px 6px;
  border-radius: 4px;
  font-family: "Fira Code", monospace;
  font-size: .9em;
  color: var(--code-text);
}

.preview pre {
  background: var(--code-bg);
  padding: 16px;
  border-radius: 8px;
  overflow-x: auto;
  margin: 1em 0;
  border: 1px solid var(--border);
}

.preview pre code { background: transparent; padding: 0; color: inherit; font-size: .9em; }
.preview table { border-collapse: collapse; margin: 1em 0; width: 100%; }
.preview th, .preview td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; }
.preview th { background: var(--bg-tertiary); color: var(--accent-light); }
.preview img { max-width: 100%; border-radius: 8px; margin: 1em 0; }
.preview hr { border: none; border-top: 1px solid var(--border); margin: 2em 0; }

.status-bar {
  background: var(--bg-secondary);
  border-top: 1px solid var(--border);
  padding: 6px 20px;
  font-size: .8rem;
  color: var(--text-secondary);
  display: flex;
  justify-content: space-between;
  gap: 20px;
  flex-wrap: wrap;
}

.status-bar span { display: flex; align-items: center; gap: 6px; }

.status-dot {
  width: 8px;
  height: 8px;
  background: var(--success);
  border-radius: 50%;
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: .4; }
}

.preview::-webkit-scrollbar, .editor::-webkit-scrollbar { width: 10px; }
.preview::-webkit-scrollbar-track, .editor::-webkit-scrollbar-track { background: var(--bg-tertiary); }
.preview::-webkit-scrollbar-thumb, .editor::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 5px; }

.toast {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: var(--gradient);
  color: #fff;
  padding: 12px 20px;
  border-radius: 8px;
  box-shadow: 0 8px 24px rgba(124,58,237,.4);
  transform: translateY(100px);
  opacity: 0;
  transition: all .3s;
  z-index: 1000;
  max-width: 90vw;
}

.toast.show { transform: translateY(0); opacity: 1; }
.toast.error { background: linear-gradient(135deg, #ef4444 0%, #f97316 100%); }

.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.7);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 2000;
  backdrop-filter: blur(4px);
}

.modal-overlay.show { display: flex; }

.modal {
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 24px;
  min-width: 320px;
  max-width: 500px;
  width: 90%;
  box-shadow: 0 20px 60px rgba(0,0,0,.5);
}

.modal h3 { margin-bottom: 16px; color: var(--accent-light); }

.modal input[type="url"] {
  width: 100%;
  background: var(--bg-tertiary);
  border: 1px solid var(--border);
  color: var(--text-primary);
  padding: 10px 14px;
  border-radius: 8px;
  font-size: .9rem;
  outline: none;
  font-family: inherit;
}

.modal input[type="url"]:focus { border-color: var(--accent); }
.modal-buttons { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }

/* PDF document source */
.pdf-source {
  position: absolute;
  left: -20000px;
  top: 0;
  width: 794px;
  padding: 40px;
  background: #fff;
  color: #1a1a2e;
  font-family: "Segoe UI", Tahoma, Arial, sans-serif;
  font-size: 14px;
  line-height: 1.7;
  overflow-wrap: anywhere;
  word-break: break-word;
}

.pdf-source * { max-width: 100%; }

.pdf-source h1, .pdf-source h2, .pdf-source h3, .pdf-source h4 {
  color: #7c3aed;
  margin: .8em 0 .4em;
  break-after: avoid;
  page-break-after: avoid;
}

.pdf-source h1 { font-size: 28px; border-bottom: 2px solid #ddd; padding-bottom: 6px; }
.pdf-source h2 { font-size: 22px; border-bottom: 1px solid #ddd; padding-bottom: 4px; }
.pdf-source h3 { font-size: 18px; }
.pdf-source p { margin: 8px 0; }
.pdf-source a { color: #7c3aed; text-decoration: none; }
.pdf-source ul, .pdf-source ol { padding-left: 28px; margin: 8px 0; }
.pdf-source li { margin: 4px 0; }

.pdf-source blockquote {
  border-left: 4px solid #7c3aed;
  padding: 8px 14px;
  margin: 12px 0;
  background: #f9f5ff;
  color: #555;
}

.pdf-source > code,
.pdf-source p code,
.pdf-source li code,
.pdf-source td code,
.pdf-source th code {
  background: #f4f4f4;
  color: #b4235b;
  padding: 2px 6px;
  border-radius: 4px;
  font-family: Consolas, "Courier New", monospace;
  font-size: 13px;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
}

.pdf-source pre {
  padding: 14px;
  border-radius: 8px;
  margin: 12px 0;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  word-break: break-word;
  break-inside: avoid;
  page-break-inside: avoid;
}

.pdf-source pre code,
.pdf-source pre .hljs {
  display: block;
  width: 100%;
  max-width: 100%;
  background: transparent !important;
  padding: 0 !important;
  border-radius: 0;
  font-family: Consolas, "Courier New", monospace;
  font-size: 12px;
  line-height: 1.55;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  word-break: break-word;
}

.pdf-source table {
  width: 100%;
  border-collapse: collapse;
  table-layout: fixed;
  margin: 12px 0;
  break-inside: avoid;
  page-break-inside: avoid;
}

.pdf-source th, .pdf-source td {
  border: 1px solid #ddd;
  padding: 8px 10px;
  text-align: left;
  vertical-align: top;
  overflow-wrap: anywhere;
  word-break: break-word;
}

.pdf-source th { background: #f4f4f4; color: #7c3aed; }
.pdf-source hr { border: none; border-top: 1px solid #ddd; margin: 20px 0; }
.pdf-source img, .pdf-source svg, .pdf-source video, .pdf-source canvas { display: block; max-width: 100%; height: auto; }
.pdf-source img { margin: 10px 0; }

/*
  PDF syntax themes.
  The theme class is assigned during export, matching the currently selected
  editor theme. These explicit rules do not depend on external stylesheets.
*/

/* Dark / Atom One Dark-like PDF code theme */
.pdf-source.pdf-theme-dark pre {
  background: #282c34 !important;
  color: #abb2bf !important;
}

.pdf-source.pdf-theme-dark pre code,
.pdf-source.pdf-theme-dark pre .hljs,
.pdf-source.pdf-theme-dark .hljs-subst,
.pdf-source.pdf-theme-dark .hljs-params {
  color: #abb2bf !important;
}

.pdf-source.pdf-theme-dark .hljs-comment,
.pdf-source.pdf-theme-dark .hljs-quote { color: #5c6370 !important; font-style: italic; }

.pdf-source.pdf-theme-dark .hljs-doctag,
.pdf-source.pdf-theme-dark .hljs-keyword,
.pdf-source.pdf-theme-dark .hljs-formula,
.pdf-source.pdf-theme-dark .hljs-selector-tag,
.pdf-source.pdf-theme-dark .hljs-literal { color: #c678dd !important; }

.pdf-source.pdf-theme-dark .hljs-section,
.pdf-source.pdf-theme-dark .hljs-name,
.pdf-source.pdf-theme-dark .hljs-selector-id,
.pdf-source.pdf-theme-dark .hljs-selector-class,
.pdf-source.pdf-theme-dark .hljs-deletion { color: #e06c75 !important; }

.pdf-source.pdf-theme-dark .hljs-attribute,
.pdf-source.pdf-theme-dark .hljs-attr,
.pdf-source.pdf-theme-dark .hljs-variable,
.pdf-source.pdf-theme-dark .hljs-template-variable,
.pdf-source.pdf-theme-dark .hljs-class .hljs-title,
.pdf-source.pdf-theme-dark .hljs-type,
.pdf-source.pdf-theme-dark .hljs-built_in,
.pdf-source.pdf-theme-dark .hljs-title.class_ { color: #e5c07b !important; }

.pdf-source.pdf-theme-dark .hljs-number,
.pdf-source.pdf-theme-dark .hljs-regexp,
.pdf-source.pdf-theme-dark .hljs-link,
.pdf-source.pdf-theme-dark .hljs-meta .hljs-string { color: #d19a66 !important; }

.pdf-source.pdf-theme-dark .hljs-string,
.pdf-source.pdf-theme-dark .hljs-symbol,
.pdf-source.pdf-theme-dark .hljs-bullet,
.pdf-source.pdf-theme-dark .hljs-addition { color: #98c379 !important; }

.pdf-source.pdf-theme-dark .hljs-title,
.pdf-source.pdf-theme-dark .hljs-title.function_,
.pdf-source.pdf-theme-dark .hljs-function .hljs-title,
.pdf-source.pdf-theme-dark .hljs-meta { color: #61afef !important; }

.pdf-source.pdf-theme-dark .hljs-meta .hljs-keyword { color: #c678dd !important; }

/* Light / Atom One Light-like PDF code theme */
.pdf-source.pdf-theme-light pre {
  background: #fafafa !important;
  border: 1px solid #e5e7eb;
  color: #383a42 !important;
}

.pdf-source.pdf-theme-light pre code,
.pdf-source.pdf-theme-light pre .hljs,
.pdf-source.pdf-theme-light .hljs-subst,
.pdf-source.pdf-theme-light .hljs-params {
  color: #383a42 !important;
}

.pdf-source.pdf-theme-light .hljs-comment,
.pdf-source.pdf-theme-light .hljs-quote { color: #a0a1a7 !important; font-style: italic; }

.pdf-source.pdf-theme-light .hljs-doctag,
.pdf-source.pdf-theme-light .hljs-keyword,
.pdf-source.pdf-theme-light .hljs-formula,
.pdf-source.pdf-theme-light .hljs-selector-tag,
.pdf-source.pdf-theme-light .hljs-literal { color: #a626a4 !important; }

.pdf-source.pdf-theme-light .hljs-section,
.pdf-source.pdf-theme-light .hljs-name,
.pdf-source.pdf-theme-light .hljs-selector-id,
.pdf-source.pdf-theme-light .hljs-selector-class,
.pdf-source.pdf-theme-light .hljs-deletion { color: #e45649 !important; }

.pdf-source.pdf-theme-light .hljs-attribute,
.pdf-source.pdf-theme-light .hljs-attr,
.pdf-source.pdf-theme-light .hljs-variable,
.pdf-source.pdf-theme-light .hljs-template-variable,
.pdf-source.pdf-theme-light .hljs-class .hljs-title,
.pdf-source.pdf-theme-light .hljs-type,
.pdf-source.pdf-theme-light .hljs-built_in,
.pdf-source.pdf-theme-light .hljs-title.class_ { color: #c18401 !important; }

.pdf-source.pdf-theme-light .hljs-number,
.pdf-source.pdf-theme-light .hljs-regexp,
.pdf-source.pdf-theme-light .hljs-link,
.pdf-source.pdf-theme-light .hljs-meta .hljs-string { color: #986801 !important; }

.pdf-source.pdf-theme-light .hljs-string,
.pdf-source.pdf-theme-light .hljs-symbol,
.pdf-source.pdf-theme-light .hljs-bullet,
.pdf-source.pdf-theme-light .hljs-addition { color: #50a14f !important; }

.pdf-source.pdf-theme-light .hljs-title,
.pdf-source.pdf-theme-light .hljs-title.function_,
.pdf-source.pdf-theme-light .hljs-function .hljs-title,
.pdf-source.pdf-theme-light .hljs-meta { color: #4078f2 !important; }

.pdf-source.pdf-theme-light .hljs-meta .hljs-keyword { color: #a626a4 !important; }

/*
  A capture viewport is created for each PDF page.
  Capturing a separate viewport rather than cropping one very tall canvas
  avoids blank pages and browser canvas-size limits for large Markdown files.
*/
.pdf-capture-stage {
  position: fixed !important;
  left: -30000px !important;
  top: 0 !important;
  padding: 0 !important;
  overflow: hidden !important;
  z-index: -1;
}

.pdf-capture-content {
  position: absolute;
  left: 0;
  width: 794px;
}

@media (max-width: 768px) {
  header { padding: 10px; }
  .logo { font-size: 1.1rem; }
  .btn { padding: 6px 10px; font-size: .8rem; }
  .main { padding: 8px; gap: 8px; }
}
</style>
</head>

<body>
<div class="app">
  <header>
    <div class="logo">
      <div class="logo-icon">📝</div>
      <div class="logo-text" data-i18n="title">Markdown Переглядач</div>
    </div>

    <div class="toolbar">
      <button class="btn lang-toggle" id="langToggle" title="Switch language">UA</button>
      <button class="btn theme-toggle" id="themeToggle" title="Toggle theme">🌙</button>

      <button class="btn" id="toggleOrientation" title="Toggle layout">
        <span id="orientIcon">⬌</span>
        <span data-i18n="layout">Розташування</span>
      </button>

      <button class="btn" id="loadFileBtn">📂 <span data-i18n="loadFile">Файл</span></button>
      <button class="btn" id="loadUrlBtn">🔗 <span data-i18n="loadUrl">URL</span></button>
      <button class="btn" id="clearBtn">🗑 <span data-i18n="clear">Очистити</span></button>
      <button class="btn" id="sampleBtn">✨ <span data-i18n="sample">Приклад</span></button>
      <button class="btn" id="copyBtn">📋 <span data-i18n="copy">Копіювати HTML</span></button>
      <button class="btn" id="exportMd">💾 <span data-i18n="exportMd">MD</span></button>
      <button class="btn" id="exportHtml">🌐 <span data-i18n="exportHtml">HTML</span></button>
      <button class="btn primary" id="exportPdf">📄 <span data-i18n="exportPdf">PDF</span></button>

      <input type="file" id="fileInput" accept=".md,.markdown,.txt" style="display:none">
    </div>
  </header>

  <div class="main" id="mainContainer">
    <div class="panel">
      <div class="panel-header">
        <span data-i18n="editor">✍️ Редактор</span>
        <span class="badge" id="charCount">0</span>
      </div>
      <textarea class="editor" id="editor" spellcheck="false"></textarea>
    </div>

    <div class="panel">
      <div class="panel-header">
        <span data-i18n="preview">👁 Попередній перегляд</span>
        <span class="badge" data-i18n="live">Наживо</span>
      </div>
      <div class="preview" id="preview"></div>
    </div>
  </div>

  <div class="status-bar">
    <span><span class="status-dot"></span> <span data-i18n="autosave">Автозбереження увімкнено</span></span>
    <span id="stats"></span>

const sampleText = {
  uk: `# Ласкаво просимо до Markdown Переглядача! 🎉

let currentLang = localStorage.getItem("md_lang") || "uk";
let orientation = localStorage.getItem("md_orientation") || "horizontal";
let theme = localStorage.getItem("md_theme") || "dark";
let lastUrl = localStorage.getItem("md_last_url") || "";

marked.setOptions({
  breaks: true,
  gfm: true
});

const editor = document.getElementById("editor");
const preview = document.getElementById("preview");
const mainContainer = document.getElementById("mainContainer");
const langToggle = document.getElementById("langToggle");
const themeToggle = document.getElementById("themeToggle");
const charCount = document.getElementById("charCount");
const stats = document.getElementById("stats");
const orientIcon = document.getElementById("orientIcon");
const fileInput = document.getElementById("fileInput");
const urlModal = document.getElementById("urlModal");
const urlInput = document.getElementById("urlInput");
const exportPdfBtn = document.getElementById("exportPdf");
const pdfSource = document.getElementById("pdfSource");

function t(key) {
  return translations[currentLang][key] || key;
}

function highlightCode(container) {
  container.querySelectorAll("pre code").forEach(block => {
    if (!block.classList.contains("hljs")) {
      hljs.highlightElement(block);
    }
  });
}

function applyTranslations() {
  document.documentElement.lang = currentLang;

  document.querySelectorAll("[data-i18n]").forEach(el => {
    el.textContent = t(el.getAttribute("data-i18n"));
  });

  document.title = t("title");
  langToggle.textContent = currentLang === "uk" ? "UA" : "EN";
  updateStats();
}

function toggleLanguage() {
  currentLang = currentLang === "uk" ? "en" : "uk";
  localStorage.setItem("md_lang", currentLang);
  applyTranslations();
}

function applyTheme(newTheme) {
  theme = newTheme;
  document.documentElement.setAttribute("data-theme", newTheme);
  themeToggle.textContent = newTheme === "dark" ? "🌙" : "☀️";

  document.getElementById("hljs-dark").disabled = newTheme !== "dark";
  document.getElementById("hljs-light").disabled = newTheme === "dark";

  localStorage.setItem("md_theme", newTheme);

  const metaTheme = document.querySelector('meta[name="theme-color"]');
  if (metaTheme) {
    metaTheme.content = newTheme === "dark" ? "#0f0f1e" : "#f5f5fa";
  }
}

function toggleTheme() {
  applyTheme(theme === "dark" ? "light" : "dark");
}

function updatePreview() {
  preview.innerHTML = marked.parse(editor.value);
  highlightCode(preview);
  updateStats();
  localStorage.setItem("md_content", editor.value);
}

function updateStats() {
  const text = editor.value;
  const chars = text.length;
  const words = text.trim() ? text.trim().split(/\s+/).length : 0;
  const lines = text ? text.split("\n").length : 0;

  charCount.textContent = chars;
  stats.textContent = `${words} ${t("words")} · ${chars} ${t("chars")} · ${lines} ${t("lines")}`;
}

function setOrientation(orient) {
  orientation = orient;

  if (orient === "vertical") {
    mainContainer.classList.add("vertical");
    orientIcon.textContent = "⬍";
  } else {
    mainContainer.classList.remove("vertical");
    orientIcon.textContent = "⬌";
  }

  localStorage.setItem("md_orientation", orient);
}

function showToast(message, isError = false) {
  const toast = document.getElementById("toast");

  toast.textContent = message;
  toast.classList.toggle("error", isError);
  toast.classList.add("show");

  clearTimeout(showToast.timeout);
  showToast.timeout = setTimeout(() => {
    toast.classList.remove("show");
  }, 2800);
}

function downloadFile(content, filename, type) {
  const blob = new Blob([content], { type });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");

  link.href = url;
  link.download = filename;
  document.body.appendChild(link);
  link.click();
  link.remove();

  setTimeout(() => URL.revokeObjectURL(url), 500);
}

function loadFromFile(file) {
  if (!file) return;

  const reader = new FileReader();

  reader.onload = event => {
    editor.value = event.target.result;
    updatePreview();
    showToast(`${t("loaded")}: ${file.name}`);
  };

  reader.onerror = () => showToast(t("loadError"), true);
  reader.readAsText(file);
}

async function loadFromUrl(url) {
  try {
    new URL(url);
  } catch {
    showToast(t("invalidUrl"), true);
    return;
  }

  try {
    const response = await fetch(url);

    if (!response.ok) {
      throw new Error(`HTTP ${response.status}`);
    }

    editor.value = await response.text();
    updatePreview();

    localStorage.setItem("md_last_url", url);
    lastUrl = url;

    showToast(t("loaded"));
    closeUrlModal();
  } catch (error) {
    showToast(`${t("loadError")}: ${error.message}`, true);
  }
}

function openUrlModal() {
  urlInput.value = lastUrl;
  urlModal.classList.add("show");
  setTimeout(() => urlInput.focus(), 100);
}

function closeUrlModal() {
  urlModal.classList.remove("show");
}

function exportHtml() {
  const html = `<!DOCTYPE html>
<html lang="${currentLang}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Markdown Export</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/${theme === "dark" ? "atom-one-dark" : "atom-one-light"}.min.css">
<style>
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; line-height: 1.7; color: #333; overflow-wrap: anywhere; }
h1, h2, h3 { color: #7c3aed; }
code { background: #f4f4f4; padding: 2px 6px; border-radius: 4px; overflow-wrap: anywhere; }

pre code { background: transparent; padding: 0; }
blockquote { border-left: 4px solid #7c3aed; padding-left: 16px; color: #666; }

img { max-width: 100%; height: auto; }
</style>
</head>
<body>
${preview.innerHTML}
</body>
</html>`;

  downloadFile(html, "markdown-export.html", "text/html;charset=utf-8");
  showToast(t("exported"));
}

async function waitForPdfImages(container) {
  const images = [...container.querySelectorAll("img")];

  await Promise.all(images.map(image => new Promise(resolve => {
    if (image.complete) {
      resolve();
      return;
    }

    image.addEventListener("load", resolve, { once: true });
    image.addEventListener("error", resolve, { once: true });
    setTimeout(resolve, 5000);
  })));
}

function getPdfPageSlices(source, pageHeightPx) {
  const sourceRect = source.getBoundingClientRect();
  const totalHeight = Math.ceil(source.scrollHeight);
  const minSliceHeight = Math.max(180, Math.floor(pageHeightPx * .35));

  const blockSelector = [
    "h1", "h2", "h3", "h4", "h5", "h6",
    "p", "pre", "blockquote", "table",
    "ul", "ol", "hr", "img"
  ].join(",");

  const safeBreaks = [...source.querySelectorAll(blockSelector)]
    .map(element => {
      const rect = element.getBoundingClientRect();
      return Math.ceil(rect.bottom - sourceRect.top);
    })
    .filter(position => position > 0 && position < totalHeight)
    .sort((a, b) => a - b);

  const slices = [];
  let start = 0;

  while (start < totalHeight) {
    const preferredEnd = Math.min(start + pageHeightPx, totalHeight);

    if (preferredEnd >= totalHeight) {
      const remaining = totalHeight - start;
      if (remaining > 2) {
        slices.push({ y: start, height: remaining });
      }
      break;
    }

    let end = 0;

    for (const point of safeBreaks) {
      if (point <= preferredEnd && point - start >= minSliceHeight) {
        end = point;
      }
    }

    if (!end) {
      end = preferredEnd;
    }

    if (end <= start) {
      end = Math.min(start + pageHeightPx, totalHeight);
    }

    const height = end - start;

    if (height > 2) {
      slices.push({ y: start, height });
    }

    start = end;
  }

  return slices;
}

/*
  Captures one page-sized clipping viewport at a time.

  This is intentionally different from using html2canvas's x/y crop options:
  those options can produce empty canvases in some browsers when the PDF
  source is outside the viewport. A cloned source is shifted inside a normal
  clipping viewport instead, making every resulting PDF page reliable.
*/
async function capturePdfSlice(source, slice, sourceWidth) {
  const stage = document.createElement("div");
  stage.className = `pdf-source pdf-capture-stage pdf-theme-${theme}`;
  stage.style.width = `${sourceWidth}px`;
  stage.style.height = `${Math.ceil(slice.height)}px`;

  const content = source.cloneNode(true);
  content.removeAttribute("id");
  content.className = "pdf-capture-content";
  content.style.top = `${-Math.floor(slice.y)}px`;
  content.style.left = "0";

  stage.appendChild(content);
  document.body.appendChild(stage);

  try {
    await new Promise(resolve => requestAnimationFrame(resolve));

    return await html2canvas(stage, {
      backgroundColor: "#ffffff",
      scale: 2,
      useCORS: true,
      allowTaint: false,
      logging: false,
      width: sourceWidth,
      height: Math.max(1, Math.ceil(slice.height)),
      windowWidth: sourceWidth,
      windowHeight: Math.max(1, Math.ceil(slice.height)),
      scrollX: 0,
      scrollY: 0
    });
  } finally {
    stage.remove();
  }
}

async function exportPdf() {
  if (!window.html2canvas || !window.jspdf) {
    showToast("PDF libraries could not be loaded.", true);
    return;
  }

  try {
    exportPdfBtn.disabled = true;
    showToast(t("generatingPdf"));

    const markdown = editor.value.trim();

    pdfSource.className = `pdf-source pdf-theme-${theme}`;
    pdfSource.innerHTML = markdown ? marked.parse(markdown) : "<p>&nbsp;</p>";
    highlightCode(pdfSource);

    await waitForPdfImages(pdfSource);

    await new Promise(resolve => {
      requestAnimationFrame(() => requestAnimationFrame(resolve));
    });

    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({
      orientation: "portrait",
      unit: "mm",
      format: "a4",
      compress: true
    });

    const pdfWidth = pdf.internal.pageSize.getWidth();
    const pdfHeight = pdf.internal.pageSize.getHeight();
    const sourceWidth = Math.ceil(pdfSource.getBoundingClientRect().width);
    const pageHeightPx = Math.floor(sourceWidth * (pdfHeight / pdfWidth));
    const slices = getPdfPageSlices(pdfSource, pageHeightPx);

    for (let index = 0; index < slices.length; index++) {
      const slice = slices[index];

      if (index > 0) {
        pdf.addPage();
      }

      const canvas = await capturePdfSlice(pdfSource, slice, sourceWidth);
      const imageData = canvas.toDataURL("image/jpeg", .93);
      const imageHeightMm = (canvas.height * pdfWidth) / canvas.width;

      pdf.addImage(
        imageData,
        "JPEG",
        0,
        0,
        pdfWidth,
        Math.min(imageHeightMm, pdfHeight),
        undefined,
        "FAST"
      );

      await new Promise(resolve => setTimeout(resolve, 0));
    }

    pdf.setProperties({
      title: t("title"),
      author: "Markdown Previewer",
      creator: "Markdown Previewer",
      subject: "Markdown export"
    });

    pdf.save("markdown-export.pdf");
    showToast(t("exported"));
  } catch (error) {
    console.error("PDF export failed:", error);
    showToast(`${t("loadError")}: ${error.message || error}`, true);
  } finally {
    pdfSource.innerHTML = "";
    pdfSource.className = "pdf-source";
    exportPdfBtn.disabled = false;
  }
}

editor.addEventListener("input", updatePreview);
langToggle.addEventListener("click", toggleLanguage);
themeToggle.addEventListener("click", toggleTheme);

document.getElementById("toggleOrientation").addEventListener("click", () => {
  setOrientation(orientation === "horizontal" ? "vertical" : "horizontal");
});

document.getElementById("clearBtn").addEventListener("click", () => {
  if (confirm(t("confirmClear"))) {
    editor.value = "";
    updatePreview();
    showToast(t("cleared"));
  }
});

document.getElementById("sampleBtn").addEventListener("click", () => {
  editor.value = sampleText[currentLang];
  updatePreview();
});

document.getElementById("copyBtn").addEventListener("click", async () => {
  try {
    await navigator.clipboard.writeText(preview.innerHTML);
    showToast(t("copied"));
  } catch {
    showToast("Clipboard access was denied.", true);
  }
});

document.getElementById("exportMd").addEventListener("click", () => {
  downloadFile(editor.value, "document.md", "text/markdown;charset=utf-8");
  showToast(t("exported"));
});

document.getElementById("exportHtml").addEventListener("click", exportHtml);
exportPdfBtn.addEventListener("click", exportPdf);

document.getElementById("loadFileBtn").addEventListener("click", () => fileInput.click());

fileInput.addEventListener("change", event => {
  loadFromFile(event.target.files[0]);
  event.target.value = "";
});

document.getElementById("loadUrlBtn").addEventListener("click", openUrlModal);
document.getElementById("urlCancel").addEventListener("click", closeUrlModal);
document.getElementById("urlLoad").addEventListener("click", () => loadFromUrl(urlInput.value.trim()));

urlInput.addEventListener("keydown", event => {
  if (event.key === "Enter") loadFromUrl(urlInput.value.trim());
  if (event.key === "Escape") closeUrlModal();
});

urlModal.addEventListener("click", event => {
  if (event.target === urlModal) closeUrlModal();
});

document.addEventListener("dragover", event => event.preventDefault());

document.addEventListener("drop", event => {
  event.preventDefault();
  const file = event.dataTransfer.files[0];
  if (file) loadFromFile(file);
});

editor.addEventListener("keydown", event => {
  if (event.key !== "Tab") return;

  event.preventDefault();

  const start = editor.selectionStart;
  const end = editor.selectionEnd;

  editor.value =
    editor.value.substring(0, start) +
    "  " +
    editor.value.substring(end);

  editor.selectionStart = editor.selectionEnd = start + 2;
  updatePreview();
});

applyTheme(theme);
setOrientation(orientation);
applyTranslations();

const savedContent = localStorage.getItem("md_content");
editor.value = savedContent !== null ? savedContent : sampleText[currentLang];
updatePreview();
</script>
