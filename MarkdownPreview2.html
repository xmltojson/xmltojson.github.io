* {

}

:root {

  --text-primary: #e6edf3;
  --text-secondary: #8b949e;
  --border: #30363d;

  --danger: #f85149;

[data-theme="light"] {

  --border: #d0d7de;
  --success: #1a7f37;

}

body {
  font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
  overflow: hidden;
  transition: background 0.3s, color 0.3s;
  background-image:

}

.app {

  flex-direction: column;
  height: 100vh;
}

header {
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--border);
  padding: 12px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
  box-shadow: 0 2px 20px var(--shadow);
}

.logo {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 1.4rem;
  font-weight: 700;
}

.logo-icon {
  width: 38px;
  height: 38px;
  background: var(--gradient);
  border-radius: 10px;
  display: grid;
  place-items: center;
  font-size: 20px;
  box-shadow: 0 4px 12px rgba(124, 58, 237, 0.4);
}

.logo-text {
  background: var(--gradient);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.toolbar {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
}

.btn {
  background: var(--bg-tertiary);
  color: var(--text-primary);
  border: 1px solid var(--border);
  padding: 8px 14px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 0.875rem;
  transition: all 0.2s;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-weight: 500;
  font-family: inherit;
}

.btn:hover {
  background: var(--accent);
  border-color: var(--accent);
  color: white;
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(124, 58, 237, 0.3);
}

.btn.primary {
  background: var(--gradient);
  border: none;
  color: white;
}

.btn.primary:hover {
  filter: brightness(1.1);
}

.btn:disabled {
  opacity: 0.55;
  cursor: not-allowed;
  transform: none;
}

.btn.lang-toggle,
.btn.theme-toggle {
  min-width: 44px;
  justify-content: center;
  font-weight: 700;
}

.main {
  flex: 1;
  display: flex;
  overflow: hidden;
  padding: 16px;
  gap: 16px;
}

.main.vertical {
  flex-direction: column;
}

.panel {
  flex: 1;
  background: var(--bg-secondary);
  border-radius: 12px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  box-shadow: 0 4px 20px var(--shadow);
  border: 1px solid var(--border);
  min-height: 0;
  min-width: 0;
}

.panel-header {
  background: var(--bg-tertiary);
  padding: 10px 16px;
  font-size: 0.875rem;
  font-weight: 600;
  color: var(--text-secondary);
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.badge {
  background: var(--accent);
  color: white;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 0.7rem;
}

.editor {
  flex: 1;

  background: transparent;
  color: var(--text-primary);
  border: none;
  outline: none;
  padding: 20px;

  font-size: 14px;
  line-height: 1.6;
  resize: none;
  tab-size: 2;
}

.preview {
  flex: 1;
  padding: 24px;
  overflow-y: auto;
  line-height: 1.7;
}

.preview h1,
.preview h2,
.preview h3,
.preview h4 {
  margin-top: 1em;
  margin-bottom: 0.5em;
  color: var(--accent-light);
}

.preview h1 {
  font-size: 2em;
  border-bottom: 2px solid var(--border);
  padding-bottom: 0.3em;
}

.preview h2 {
  font-size: 1.5em;
  border-bottom: 1px solid var(--border);
  padding-bottom: 0.3em;
}

.preview h3 {
  font-size: 1.25em;
}

.preview p {
  margin: 0.8em 0;
}

.preview a {
  color: var(--accent-light);
  text-decoration: none;
}

.preview a:hover {
  text-decoration: underline;
}

.preview ul,
.preview ol {
  margin: 0.8em 0;
  padding-left: 2em;
}

.preview li {
  margin: 0.3em 0;
}

.preview blockquote {
  border-left: 4px solid var(--accent);
  padding: 0.5em 1em;
  margin: 1em 0;
  background: rgba(124, 58, 237, 0.1);
  border-radius: 0 8px 8px 0;
  color: var(--text-secondary);
}

.preview :not(pre) > code {
  background: var(--bg-tertiary);
  padding: 2px 6px;
  border-radius: 4px;
  font-family: "Fira Code", "Cascadia Code", Consolas, monospace;
  font-size: 0.9em;
  color: var(--accent-light);
}

.preview pre {
  position: relative;
  background: var(--code-bg);
  border: 1px solid var(--border);
  padding: 16px;
  border-radius: 8px;
  overflow-x: auto;
  margin: 1em 0;
  line-height: 1.5;
}

.preview pre code.hljs {
  display: block;
  background: transparent;
  color: inherit;
  padding: 0;
  font-family: "Fira Code", "Cascadia Code", Consolas, monospace;
  font-size: 13px;
  tab-size: 2;
}

.code-toolbar {
  position: absolute;
  top: 8px;
  right: 8px;
  display: flex;
  gap: 6px;
  z-index: 2;
}

.code-language {
  background: rgba(110, 118, 129, 0.25);
  color: var(--text-secondary);
  border: 1px solid var(--border);
  padding: 3px 7px;
  border-radius: 5px;
  font-size: 10px;
  text-transform: uppercase;
  font-family: "Fira Code", Consolas, monospace;
}

.copy-code-btn {
  background: rgba(110, 118, 129, 0.25);
  color: var(--text-primary);
  border: 1px solid var(--border);

  border-radius: 5px;
  font-size: 11px;

  font-family: inherit;
}

.copy-code-btn:hover {
  background: var(--accent);
  border-color: var(--accent);
  color: white;
}

.preview table {
  border-collapse: collapse;
  margin: 1em 0;
  width: 100%;
}

.preview th,
.preview td {
  border: 1px solid var(--border);
  padding: 8px 12px;
  text-align: left;
}

.preview th {
  background: var(--bg-tertiary);
  color: var(--accent-light);
}

.preview img {
  max-width: 100%;
  border-radius: 8px;
  margin: 1em 0;
}

.preview hr {
  border: none;
  border-top: 1px solid var(--border);
  margin: 2em 0;
}

.preview::-webkit-scrollbar,
.editor::-webkit-scrollbar {
  width: 10px;
  height: 10px;
}

.preview::-webkit-scrollbar-track,
.editor::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.preview::-webkit-scrollbar-thumb,
.editor::-webkit-scrollbar-thumb {
  background: var(--accent);
  border-radius: 5px;
}

.status-bar {
  background: var(--bg-secondary);
  border-top: 1px solid var(--border);
  padding: 6px 20px;
  font-size: 0.8rem;
  color: var(--text-secondary);
  display: flex;
  justify-content: space-between;
  gap: 20px;
  flex-wrap: wrap;
}

.status-bar span {
  display: flex;
  align-items: center;
  gap: 6px;
}

.status-dot {
  width: 8px;
  height: 8px;
  background: var(--success);
  border-radius: 50%;
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

.toast {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: var(--gradient);
  color: white;
  padding: 12px 20px;
  border-radius: 8px;
  box-shadow: 0 8px 24px rgba(124, 58, 237, 0.4);
  transform: translateY(100px);
  opacity: 0;
  transition: all 0.3s;
  z-index: 1000;
  max-width: 90vw;
}

.toast.show {
  transform: translateY(0);
  opacity: 1;
}

.toast.error {
  background: linear-gradient(135deg, #ef4444 0%, #f97316 100%);
}

.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.7);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 2000;
  backdrop-filter: blur(4px);
}

.modal-overlay.show {
  display: flex;
}

.modal {
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 24px;
  min-width: 320px;
  max-width: 500px;
  width: 90%;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
}

.modal h3 {
  margin-bottom: 16px;
  color: var(--accent-light);
}

  font-size: 0.9rem;
  outline: none;
  font-family: inherit;
}

.modal input[type="url"]:focus {
  border-color: var(--accent);
}

.modal-buttons {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
  margin-top: 16px;
}

@media (max-width: 768px) {
  header {

    padding: 6px 10px;
    font-size: 0.8rem;
  }

  .main {
    padding: 8px;
    gap: 8px;
  }
}

  "theme": "GitHub Dark / GitHub Light",

> **Tip:** Specify a language after the opening code fence, such as \`javascript\`, \`python\`, \`php\`, \`html\`, \`css\`, \`json\`, or \`sql\`.`
};

let currentLang = localStorage.getItem("md_lang") || "uk";
let orientation = localStorage.getItem("md_orientation") || "horizontal";
let theme = localStorage.getItem("md_theme") || "dark";
let lastUrl = localStorage.getItem("md_last_url") || "";

const editor = document.getElementById("editor");
const preview = document.getElementById("preview");
const mainContainer = document.getElementById("mainContainer");
const langToggle = document.getElementById("langToggle");
const themeToggle = document.getElementById("themeToggle");
const charCount = document.getElementById("charCount");
const stats = document.getElementById("stats");
const orientIcon = document.getElementById("orientIcon");
const fileInput = document.getElementById("fileInput");
const urlModal = document.getElementById("urlModal");
const urlInput = document.getElementById("urlInput");
const exportPdfBtn = document.getElementById("exportPdf");

marked.setOptions({
  breaks: true,
  gfm: true
});

function t(key) {
  return translations[currentLang][key] || key;
}

function applyTranslations() {
  document.documentElement.lang = currentLang;

  document.querySelectorAll("[data-i18n]").forEach(element => {
    element.textContent = t(element.dataset.i18n);
  });

  document.title = t("title");
  langToggle.textContent = currentLang === "uk" ? "UA" : "EN";

  updateStats();
  updateCodeButtonsLanguage();
}

function toggleLanguage() {
  currentLang = currentLang === "uk" ? "en" : "uk";
  localStorage.setItem("md_lang", currentLang);
  applyTranslations();
}

function applyTheme(newTheme) {
  theme = newTheme;
  document.documentElement.setAttribute("data-theme", newTheme);

  themeToggle.textContent = newTheme === "dark" ? "🌙" : "☀️";

  const darkSheet = document.getElementById("hljs-dark");
  const lightSheet = document.getElementById("hljs-light");

  darkSheet.disabled = newTheme !== "dark";
  lightSheet.disabled = newTheme === "dark";

  localStorage.setItem("md_theme", newTheme);

  const metaTheme = document.querySelector('meta[name="theme-color"]');
  if (metaTheme) {
    metaTheme.content = newTheme === "dark" ? "#0d1117" : "#f6f8fa";
  }
}

function toggleTheme() {
  applyTheme(theme === "dark" ? "light" : "dark");
}

function normalizeLanguage(language) {
  if (!language) return "";

  const aliases = {
    js: "javascript",
    jsx: "javascript",
    ts: "typescript",
    py: "python",
    rb: "ruby",
    sh: "bash",
    shell: "bash",
    yml: "yaml",
    csharp: "csharp",
    cs: "csharp",
    cpp: "cpp",
    "c++": "cpp",
    html: "xml",
    svg: "xml",
    vue: "xml"
  };

  const normalized = language.trim().toLowerCase();
  return aliases[normalized] || normalized;
}

function highlightCodeBlocks() {
  preview.querySelectorAll("pre code").forEach(codeBlock => {
    const classNames = Array.from(codeBlock.classList);
    const languageClass = classNames.find(className =>
      className.startsWith("language-") || className.startsWith("lang-")
    );

    let requestedLanguage = "";

    if (languageClass) {
      requestedLanguage = languageClass
        .replace("language-", "")
        .replace("lang-", "");
    }

    const language = normalizeLanguage(requestedLanguage);

    codeBlock.classList.remove("hljs");

    if (language && hljs.getLanguage(language)) {
      codeBlock.className = `hljs language-${language}`;
      codeBlock.innerHTML = hljs.highlight(
        codeBlock.textContent,
        { language, ignoreIllegals: true }
      ).value;
    } else {
      codeBlock.className = "hljs";
      codeBlock.innerHTML = hljs.highlightAuto(codeBlock.textContent).value;
    }

    addCodeToolbar(codeBlock, language || "auto");
  });
}

function addCodeToolbar(codeBlock, language) {
  const pre = codeBlock.parentElement;

  if (!pre || pre.querySelector(".code-toolbar")) {
    return;
  }

  const toolbar = document.createElement("div");
  toolbar.className = "code-toolbar";

  const languageBadge = document.createElement("span");
  languageBadge.className = "code-language";
  languageBadge.textContent = language;

  const copyButton = document.createElement("button");
  copyButton.type = "button";
  copyButton.className = "copy-code-btn";
  copyButton.textContent = t("copyCode");

  copyButton.addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(codeBlock.textContent);
      copyButton.textContent = "✓";
      showToast(t("codeCopied"));

      setTimeout(() => {
        copyButton.textContent = t("copyCode");
      }, 1300);
    } catch {
      showToast(t("loadError"), true);
    }
  });

  toolbar.appendChild(languageBadge);
  toolbar.appendChild(copyButton);
  pre.appendChild(toolbar);
}

function updateCodeButtonsLanguage() {
  document.querySelectorAll(".copy-code-btn").forEach(button => {
    if (button.textContent !== "✓") {
      button.textContent = t("copyCode");
    }
  });
}

function updatePreview() {
  const markdown = editor.value;

  preview.innerHTML = marked.parse(markdown);
  highlightCodeBlocks();

  updateStats();
  localStorage.setItem("md_content", markdown);
}

function updateStats() {
  const text = editor.value;
  const chars = text.length;
  const words = text.trim() ? text.trim().split(/\s+/).length : 0;
  const lines = text.split("\n").length;

  charCount.textContent = chars;
  stats.textContent = `${words} ${t("words")} · ${chars} ${t("chars")} · ${lines} ${t("lines")}`;
}

function setOrientation(orient) {
  orientation = orient;

  if (orient === "vertical") {
    mainContainer.classList.add("vertical");
    orientIcon.textContent = "⬍";
  } else {
    mainContainer.classList.remove("vertical");
    orientIcon.textContent = "⬌";
  }

  localStorage.setItem("md_orientation", orient);
}

function showToast(message, isError = false) {
  const toast = document.getElementById("toast");

  toast.textContent = message;
  toast.classList.toggle("error", isError);
  toast.classList.add("show");

  setTimeout(() => {
    toast.classList.remove("show");
  }, 2800);
}

function downloadFile(content, filename, type) {
  const blob = new Blob([content], { type });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");

  link.href = url;
  link.download = filename;
  link.click();

  URL.revokeObjectURL(url);
}

function loadFromFile(file) {
  if (!file) return;

  const reader = new FileReader();

  reader.onload = event => {
    editor.value = event.target.result;
    updatePreview();
    showToast(`${t("loaded")}: ${file.name}`);
  };

  reader.onerror = () => showToast(t("loadError"), true);
  reader.readAsText(file);
}

async function loadFromUrl(url) {
  try {
    new URL(url);
  } catch {
    showToast(t("invalidUrl"), true);
    return;
  }

  try {
    const response = await fetch(url);

    if (!response.ok) {
      throw new Error(`HTTP ${response.status}`);
    }

    editor.value = await response.text();
    updatePreview();

    localStorage.setItem("md_last_url", url);
    lastUrl = url;

    showToast(t("loaded"));
    closeUrlModal();
  } catch (error) {
    showToast(`${t("loadError")}: ${error.message}`, true);
  }
}

function openUrlModal() {
  urlInput.value = lastUrl;
  urlModal.classList.add("show");

  setTimeout(() => urlInput.focus(), 100);
}

function closeUrlModal() {
  urlModal.classList.remove("show");
}

function exportHtml() {
  const html = `<!DOCTYPE html>
<html lang="${currentLang}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Markdown Export</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github.min.css">

<style>
body {
  max-width: 900px;
  margin: 40px auto;
  padding: 20px;
  font-family: Arial, "Segoe UI", sans-serif;
  line-height: 1.7;
  color: #24292f;
}
h1, h2, h3, h4 { color: #7c3aed; }
h1, h2 { border-bottom: 1px solid #d0d7de; padding-bottom: .3em; }
pre {
  padding: 16px;
  border: 1px solid #d0d7de;
  border-radius: 8px;
  overflow-x: auto;
}

  font-family: Consolas, "Cascadia Code", monospace;
}
:not(pre) > code {
  padding: 2px 5px;
  background: #f6f8fa;
  border-radius: 4px;
}

  color: #57606a;
}

  width: 100%;
  border-collapse: collapse;

  background: #f6f8fa;

</style>
</head>
<body>
${preview.innerHTML}

</html>`;

  downloadFile(html, "markdown-export.html", "text/html;charset=utf-8");
  showToast(t("exported"));
}

/*
  PDF uses pdfmake and native Roboto fonts.
  Text remains selectable and searchable, including Ukrainian/Cyrillic.
  No canvas or image screenshots are used.
*/
function exportPdf() {
  try {
    exportPdfBtn.disabled = true;
    showToast(t("generatingPdf"));

    const plainRenderedHtml = marked.parse(editor.value);

    const pdfContent = htmlToPdfmake(plainRenderedHtml, {
      window: window,
      defaultStyles: {
        h1: {
          fontSize: 24,
          bold: true,
          color: "#6d28d9",
          margin: [0, 12, 0, 8]
        },
        h2: {
          fontSize: 19,
          bold: true,
          color: "#6d28d9",
          margin: [0, 10, 0, 7]
        },
        h3: {
          fontSize: 16,
          bold: true,
          color: "#6d28d9",
          margin: [0, 8, 0, 6]
        },
        h4: {
          fontSize: 14,
          bold: true,
          color: "#6d28d9",
          margin: [0, 6, 0, 5]
        },
        p: {
          margin: [0, 4, 0, 7]
        },
        ul: {
          margin: [0, 4, 0, 7]
        },
        ol: {
          margin: [0, 4, 0, 7]
        },
        blockquote: {
          color: "#555555",
          margin: [10, 8, 0, 8]
        },
        pre: {
          font: "Roboto",
          fontSize: 8,
          color: "#24292f",
          fillColor: "#f6f8fa",
          margin: [0, 8, 0, 8]
        },
        code: {
          font: "Roboto",
          fontSize: 9,
          color: "#9a1750"
        },
        table: {
          margin: [0, 8, 0, 8]
        }
      }
    });

    const documentDefinition = {
      pageSize: "A4",
      pageMargins: [42, 48, 42, 48],

      info: {
        title: t("title"),
        author: "Markdown Previewer",
        creator: "Markdown Previewer",
        subject: "Markdown PDF Export"
      },

      defaultStyle: {
        font: "Roboto",
        fontSize: 11,
        lineHeight: 1.3,
        color: "#24292f"
      },

      content: pdfContent
    };

    pdfMake.createPdf(documentDefinition).download("markdown-export.pdf");
    showToast(t("exported"));
  } catch (error) {
    console.error(error);
    showToast(`${t("loadError")}: ${error.message}`, true);
  } finally {
    exportPdfBtn.disabled = false;
  }
}

/* Event listeners */
editor.addEventListener("input", updatePreview);

langToggle.addEventListener("click", toggleLanguage);
themeToggle.addEventListener("click", toggleTheme);

document.getElementById("toggleOrientation").addEventListener("click", () => {
  setOrientation(orientation === "horizontal" ? "vertical" : "horizontal");
});

document.getElementById("clearBtn").addEventListener("click", () => {
  if (confirm(t("confirmClear"))) {
    editor.value = "";
    updatePreview();
    showToast(t("cleared"));
  }
});

document.getElementById("sampleBtn").addEventListener("click", () => {
  editor.value = sampleText[currentLang];
  updatePreview();
});

document.getElementById("copyBtn").addEventListener("click", async () => {
  try {
    await navigator.clipboard.writeText(preview.innerHTML);
    showToast(t("copied"));
  } catch {
    showToast(t("loadError"), true);
  }
});

document.getElementById("exportMd").addEventListener("click", () => {
  downloadFile(editor.value, "document.md", "text/markdown;charset=utf-8");
  showToast(t("exported"));
});

document.getElementById("exportHtml").addEventListener("click", exportHtml);
exportPdfBtn.addEventListener("click", exportPdf);

document.getElementById("loadFileBtn").addEventListener("click", () => {
  fileInput.click();
});

fileInput.addEventListener("change", event => {
  loadFromFile(event.target.files[0]);
  event.target.value = "";
});

document.getElementById("loadUrlBtn").addEventListener("click", openUrlModal);
document.getElementById("urlCancel").addEventListener("click", closeUrlModal);

document.getElementById("urlLoad").addEventListener("click", () => {
  loadFromUrl(urlInput.value.trim());
});

urlInput.addEventListener("keydown", event => {
  if (event.key === "Enter") {
    loadFromUrl(urlInput.value.trim());
  }

  if (event.key === "Escape") {
    closeUrlModal();
  }
});

urlModal.addEventListener("click", event => {
  if (event.target === urlModal) {
    closeUrlModal();
  }
});

document.addEventListener("dragover", event => {
  event.preventDefault();
});

document.addEventListener("drop", event => {
  event.preventDefault();

  const file = event.dataTransfer.files[0];

  if (file) {
    loadFromFile(file);
  }
});

editor.addEventListener("keydown", event => {
  if (event.key === "Tab") {
    event.preventDefault();

    const start = editor.selectionStart;
    const end = editor.selectionEnd;

    editor.value =
      editor.value.substring(0, start) +
      "  " +
      editor.value.substring(end);

    editor.selectionStart = editor.selectionEnd = start + 2;
    updatePreview();
  }
});

/* Initial application state */
applyTheme(theme);
setOrientation(orientation);
applyTranslations();

const savedContent = localStorage.getItem("md_content");
editor.value = savedContent !== null ? savedContent : sampleText[currentLang];

updatePreview();
</script>

</html>
