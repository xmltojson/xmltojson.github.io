<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Markdown Переглядач — Живий редактор Markdown з експортом</title>
<meta name="description" content="Безкоштовний онлайн Markdown редактор з живим попереднім переглядом, підсвіткою синтаксису та експортом у PDF, HTML і MD.">
<meta name="theme-color" content="#7c3aed">

<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%237c3aed'/%3E%3Ctext x='50' y='68' font-size='55' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'%3EM%E2%86%93%3C/text%3E%3C/svg%3E">

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

<!-- Native-text PDF generation -->
<!-- pdfmake includes Roboto fonts with Cyrillic/Ukrainian glyph support -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.10/pdfmake.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.10/vfs_fonts.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html-to-pdfmake/browser.js"></script>

<link id="hljs-dark" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<link id="hljs-light" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-light.min.css" disabled>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg-primary: #0f0f1e;
  --bg-secondary: #1a1a2e;
  --bg-tertiary: #252540;
  --accent: #7c3aed;
  --accent-hover: #9333ea;
  --accent-light: #a78bfa;
  --text-primary: #e4e4e7;
  --text-secondary: #a1a1aa;
  --border: #3f3f5f;
  --success: #10b981;
  --gradient: linear-gradient(135deg, #7c3aed 0%, #ec4899 100%);
  --code-bg: #282c34;
  --code-text: #f472b6;
  --shadow: rgba(0,0,0,.3);
}

[data-theme="light"] {
  --bg-primary: #f5f5fa;
  --bg-secondary: #fff;
  --bg-tertiary: #f0f0f5;
  --accent: #7c3aed;
  --accent-hover: #6d28d9;
  --accent-light: #6d28d9;
  --text-primary: #1a1a2e;
  --text-secondary: #64748b;
  --border: #e2e8f0;
  --code-bg: #f6f8fa;
  --code-text: #d81b60;
  --shadow: rgba(0,0,0,.08);
}

body {
  font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
  overflow: hidden;
  transition: background .3s, color .3s;
  background-image:
    radial-gradient(circle at 20% 30%, rgba(124,58,237,.15) 0%, transparent 50%),
    radial-gradient(circle at 80% 70%, rgba(236,72,153,.1) 0%, transparent 50%);
}

.app { display: flex; flex-direction: column; height: 100vh; }

header {
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--border);
  padding: 12px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
  box-shadow: 0 2px 20px var(--shadow);
}

.logo { display: flex; align-items: center; gap: 12px; font-size: 1.4rem; font-weight: 700; }
.logo-icon {
  width: 38px;
  height: 38px;
  background: var(--gradient);
  border-radius: 10px;
  display: grid;
  place-items: center;
  font-size: 20px;
}
.logo-text {
  background: var(--gradient);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.btn {
  background: var(--bg-tertiary);
  color: var(--text-primary);
  border: 1px solid var(--border);
  padding: 8px 14px;
  border-radius: 8px;
  cursor: pointer;
  font-size: .875rem;
  font-family: inherit;
  font-weight: 500;
  transition: all .2s;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.btn:hover {
  background: var(--accent);
  border-color: var(--accent);
  color: white;
  transform: translateY(-1px);
}

.btn.primary {
  background: var(--gradient);
  border: none;
  color: white;
}

.btn:disabled { opacity: .55; cursor: not-allowed; transform: none; }

.main {
  flex: 1;
  display: flex;
  overflow: hidden;
  padding: 16px;
  gap: 16px;
}

.main.vertical { flex-direction: column; }

.panel {
  flex: 1;
  min-width: 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: 12px;
  box-shadow: 0 4px 20px var(--shadow);
}

.panel-header {
  padding: 10px 16px;
  background: var(--bg-tertiary);
  border-bottom: 1px solid var(--border);
  color: var(--text-secondary);
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: .875rem;
  font-weight: 600;
}

.badge {
  background: var(--accent);
  color: white;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: .7rem;
}

.editor {
  width: 100%;
  flex: 1;
  resize: none;
  border: none;
  outline: none;
  padding: 20px;
  color: var(--text-primary);
  background: transparent;
  font-family: "Fira Code", Consolas, monospace;
  font-size: 14px;
  line-height: 1.6;
}

.preview {
  flex: 1;
  padding: 24px;
  overflow-y: auto;
  line-height: 1.7;
}

.preview h1, .preview h2, .preview h3, .preview h4 {
  margin: 1em 0 .5em;
  color: var(--accent-light);
}

.preview h1 { font-size: 2em; border-bottom: 2px solid var(--border); padding-bottom: .3em; }
.preview h2 { font-size: 1.5em; border-bottom: 1px solid var(--border); padding-bottom: .3em; }
.preview h3 { font-size: 1.25em; }
.preview p { margin: .8em 0; }
.preview a { color: var(--accent-light); }
.preview ul, .preview ol { margin: .8em 0; padding-left: 2em; }
.preview li { margin: .3em 0; }

.preview blockquote {
  border-left: 4px solid var(--accent);
  padding: .5em 1em;
  margin: 1em 0;
  background: rgba(124,58,237,.1);
  color: var(--text-secondary);
  border-radius: 0 8px 8px 0;
}

.preview code {
  background: var(--bg-tertiary);
  color: var(--code-text);
  padding: 2px 6px;
  border-radius: 4px;
  font-family: Consolas, monospace;
  font-size: .9em;
}

.preview pre {
  background: var(--code-bg);
  padding: 16px;
  border-radius: 8px;
  overflow-x: auto;
  margin: 1em 0;
}

.preview pre code { background: transparent; color: inherit; padding: 0; }
.preview table { border-collapse: collapse; margin: 1em 0; width: 100%; }
.preview th, .preview td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; }
.preview th { background: var(--bg-tertiary); color: var(--accent-light); }
.preview img { max-width: 100%; border-radius: 8px; }
.preview hr { border: none; border-top: 1px solid var(--border); margin: 2em 0; }

.status-bar {
  padding: 6px 20px;
  background: var(--bg-secondary);
  border-top: 1px solid var(--border);
  color: var(--text-secondary);
  display: flex;
  justify-content: space-between;
  gap: 20px;
  flex-wrap: wrap;
  font-size: .8rem;
}

.status-dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  background: var(--success);
  border-radius: 50%;
  margin-right: 6px;
}

.toast {
  position: fixed;
  right: 20px;
  bottom: 20px;
  max-width: 90vw;
  z-index: 1000;
  color: white;
  background: var(--gradient);
  padding: 12px 20px;
  border-radius: 8px;
  opacity: 0;
  transform: translateY(100px);
  transition: all .3s;
}

.toast.show { opacity: 1; transform: translateY(0); }
.toast.error { background: linear-gradient(135deg, #ef4444, #f97316); }

.modal-overlay {
  position: fixed;
  inset: 0;
  z-index: 2000;
  display: none;
  align-items: center;
  justify-content: center;
  background: rgba(0,0,0,.7);
}

.modal-overlay.show { display: flex; }

.modal {
  width: 90%;
  max-width: 500px;
  min-width: 320px;
  padding: 24px;
  color: var(--text-primary);
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: 12px;
}

.modal h3 { margin-bottom: 16px; color: var(--accent-light); }

.modal input {
  width: 100%;
  padding: 10px 14px;
  color: var(--text-primary);
  background: var(--bg-tertiary);
  border: 1px solid var(--border);
  border-radius: 8px;
  outline: none;
}

.modal-buttons { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }

@media (max-width: 768px) {
  header { padding: 10px; }
  .logo { font-size: 1.1rem; }
  .btn { padding: 6px 10px; font-size: .8rem; }
  .main { padding: 8px; gap: 8px; }
}
</style>
</head>

<body>
<div class="app">
  <header>
    <div class="logo">
      <div class="logo-icon">📝</div>
      <div class="logo-text" data-i18n="title">Markdown Переглядач</div>
    </div>

    <div class="toolbar">
      <button class="btn" id="langToggle">UA</button>
      <button class="btn" id="themeToggle">🌙</button>
      <button class="btn" id="toggleOrientation">
        <span id="orientIcon">⬌</span>
        <span data-i18n="layout">Розташування</span>
      </button>
      <button class="btn" id="loadFileBtn">📂 <span data-i18n="loadFile">Файл</span></button>
      <button class="btn" id="loadUrlBtn">🔗 URL</button>
      <button class="btn" id="clearBtn">🗑 <span data-i18n="clear">Очистити</span></button>
      <button class="btn" id="sampleBtn">✨ <span data-i18n="sample">Приклад</span></button>
      <button class="btn" id="copyBtn">📋 <span data-i18n="copy">Копіювати HTML</span></button>
      <button class="btn" id="exportMd">💾 MD</button>
      <button class="btn" id="exportHtml">🌐 HTML</button>
      <button class="btn primary" id="exportPdf">📄 PDF</button>
      <input type="file" id="fileInput" accept=".md,.markdown,.txt" hidden>
    </div>
  </header>

  <div class="main" id="mainContainer">
    <div class="panel">
      <div class="panel-header">
        <span data-i18n="editor">✍️ Редактор</span>
        <span class="badge" id="charCount">0</span>
      </div>
      <textarea class="editor" id="editor" spellcheck="false"></textarea>
    </div>

    <div class="panel">
      <div class="panel-header">
        <span data-i18n="preview">👁 Попередній перегляд</span>
        <span class="badge" data-i18n="live">Наживо</span>
      </div>
      <div class="preview" id="preview"></div>
    </div>
  </div>

  <div class="status-bar">
    <span><span class="status-dot"></span><span data-i18n="autosave">Автозбереження увімкнено</span></span>
    <span id="stats"></span>
    <span>Markdown Previewer v1.0</span>
  </div>
</div>

<div class="modal-overlay" id="urlModal">
  <div class="modal">
    <h3 data-i18n="urlModalTitle">Завантажити з URL</h3>
    <input type="url" id="urlInput" placeholder="https://example.com/file.md">
    <div class="modal-buttons">
      <button class="btn" id="urlCancel" data-i18n="cancel">Скасувати</button>
      <button class="btn primary" id="urlLoad" data-i18n="load">Завантажити</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const translations = {
  uk: {
    title: "Markdown Переглядач",
    layout: "Розташування",
    loadFile: "Файл",
    clear: "Очистити",
    sample: "Приклад",
    copy: "Копіювати HTML",
    editor: "✍️ Редактор",
    preview: "👁 Попередній перегляд",
    live: "Наживо",
    autosave: "Автозбереження увімкнено",
    copied: "HTML скопійовано в буфер обміну!",
    cleared: "Редактор очищено",
    exported: "Файл експортовано",
    loaded: "Файл завантажено",
    loadError: "Помилка завантаження",
    generatingPdf: "Генерація PDF з текстом...",
    words: "слів",
    chars: "символів",
    lines: "рядків",
    confirmClear: "Ви впевнені, що хочете очистити текст?",
    urlModalTitle: "Завантажити з URL",
    cancel: "Скасувати",
    load: "Завантажити",
    invalidUrl: "Невірний URL"
  },
  en: {
    title: "Markdown Previewer",
    layout: "Layout",
    loadFile: "File",
    clear: "Clear",
    sample: "Sample",
    copy: "Copy HTML",
    editor: "✍️ Editor",
    preview: "👁 Preview",
    live: "Live",
    autosave: "Autosave enabled",
    copied: "HTML copied to clipboard!",
    cleared: "Editor cleared",
    exported: "File exported",
    loaded: "File loaded",
    loadError: "Load failed",
    generatingPdf: "Generating text PDF...",
    words: "words",
    chars: "chars",
    lines: "lines",
    confirmClear: "Are you sure you want to clear the text?",
    urlModalTitle: "Load from URL",
    cancel: "Cancel",
    load: "Load",
    invalidUrl: "Invalid URL"
  }
};

const sampleText = {
  uk: `# Ласкаво просимо до Markdown Переглядача!

## Основні можливості

- **Живий попередній перегляд**
- Підтримка української та англійської мов
- Світла та темна теми
- Експорт у MD, HTML та PDF
- PDF містить справжній кириличний текст, а не зображення

## Приклад коду

\`\`\`javascript
function привіт(імʼя) {
  console.log(\`Привіт, \${імʼя}!\`);
  return true;
}

привіт("Світ");
\`\`\`

> **Порада:** PDF можна виділяти, копіювати та шукати в ньому текст.

### Таблиця

| Функція | Опис | Статус |
|---|---|---|
| Редактор | Написання тексту | ✅ |
| PDF | Нативний текст | ✅ |

---

**Створено з любов'ю в Україні**`,
  en: `# Welcome to Markdown Previewer!

## Features

- **Live preview**
- Ukrainian and English support
- Light and dark themes
- Export to MD, HTML and PDF
- PDF contains native selectable text

## Code example

\`\`\`javascript
function hello(name) {
  console.log(\`Hello, \${name}!\`);
}
\`\`\`

> PDF text can be searched, copied and selected.`
};

let currentLang = localStorage.getItem("md_lang") || "uk";
let orientation = localStorage.getItem("md_orientation") || "horizontal";
let theme = localStorage.getItem("md_theme") || "dark";
let lastUrl = localStorage.getItem("md_last_url") || "";

const editor = document.getElementById("editor");
const preview = document.getElementById("preview");
const mainContainer = document.getElementById("mainContainer");
const charCount = document.getElementById("charCount");
const stats = document.getElementById("stats");
const exportPdfBtn = document.getElementById("exportPdf");
const langToggle = document.getElementById("langToggle");
const themeToggle = document.getElementById("themeToggle");
const orientIcon = document.getElementById("orientIcon");
const fileInput = document.getElementById("fileInput");
const urlModal = document.getElementById("urlModal");
const urlInput = document.getElementById("urlInput");

marked.setOptions({
  breaks: true,
  gfm: true,
  highlight(code, lang) {
    if (lang && hljs.getLanguage(lang)) {
      return hljs.highlight(code, { language: lang }).value;
    }
    return hljs.highlightAuto(code).value;
  }
});

function t(key) {
  return translations[currentLang][key] || key;
}

function showToast(message, isError = false) {
  const toast = document.getElementById("toast");
  toast.textContent = message;
  toast.classList.toggle("error", isError);
  toast.classList.add("show");
  setTimeout(() => toast.classList.remove("show"), 2800);
}

function applyTranslations() {
  document.documentElement.lang = currentLang;
  document.title = t("title");

  document.querySelectorAll("[data-i18n]").forEach(element => {
    element.textContent = t(element.dataset.i18n);
  });

  langToggle.textContent = currentLang === "uk" ? "UA" : "EN";
  updateStats();
}

function applyTheme(newTheme) {
  theme = newTheme;
  document.documentElement.setAttribute("data-theme", theme);
  themeToggle.textContent = theme === "dark" ? "🌙" : "☀️";

  document.getElementById("hljs-dark").disabled = theme !== "dark";
  document.getElementById("hljs-light").disabled = theme === "dark";

  localStorage.setItem("md_theme", theme);
}

function setOrientation(value) {
  orientation = value;
  mainContainer.classList.toggle("vertical", value === "vertical");
  orientIcon.textContent = value === "vertical" ? "⬍" : "⬌";
  localStorage.setItem("md_orientation", value);
}

function updateStats() {
  const text = editor.value;
  const chars = text.length;
  const words = text.trim() ? text.trim().split(/\s+/).length : 0;
  const lines = text.split("\n").length;

  charCount.textContent = chars;
  stats.textContent = `${words} ${t("words")} · ${chars} ${t("chars")} · ${lines} ${t("lines")}`;
}

function updatePreview() {
  preview.innerHTML = marked.parse(editor.value);

  preview.querySelectorAll("pre code").forEach(block => {
    hljs.highlightElement(block);
  });

  updateStats();
  localStorage.setItem("md_content", editor.value);
}

function downloadFile(content, filename, type) {
  const blob = new Blob([content], { type });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");

  link.href = url;
  link.download = filename;
  link.click();

  URL.revokeObjectURL(url);
}

function exportHtml() {
  const html = `<!DOCTYPE html>
<html lang="${currentLang}">
<head>
<meta charset="UTF-8">
<title>Markdown Export</title>
<style>
body { max-width: 850px; margin: 40px auto; padding: 20px; font-family: Arial, sans-serif; line-height: 1.7; color: #222; }
h1,h2,h3 { color: #7c3aed; }
pre { background: #282c34; color: #fff; padding: 16px; border-radius: 8px; overflow:auto; }
code { background:#f3f3f3; padding:2px 5px; border-radius:4px; }
pre code { background:transparent; padding:0; }
blockquote { border-left:4px solid #7c3aed; padding-left:16px; color:#666; }
table { border-collapse:collapse; width:100%; }
td,th { border:1px solid #ddd; padding:8px; text-align:left; }
</style>
</head>
<body>
${preview.innerHTML}
</body>
</html>`;

  downloadFile(html, "markdown-export.html", "text/html;charset=utf-8");
  showToast(t("exported"));
}

/*
  Native PDF export:
  - html-to-pdfmake converts HTML into PDF text nodes.
  - pdfmake writes actual text into the PDF.
  - Roboto font from vfs_fonts supports Cyrillic including Ukrainian.
  - No canvas, html2canvas, screenshots, or image embedding are used.
*/
function exportPdf() {
  try {
    exportPdfBtn.disabled = true;
    showToast(t("generatingPdf"));

    const renderedHtml = marked.parse(editor.value);

    const pdfContent = htmlToPdfmake(renderedHtml, {
      window: window,
      defaultStyles: {
        h1: { fontSize: 24, bold: true, color: "#7c3aed", margin: [0, 12, 0, 8] },
        h2: { fontSize: 19, bold: true, color: "#7c3aed", margin: [0, 10, 0, 7] },
        h3: { fontSize: 16, bold: true, color: "#7c3aed", margin: [0, 8, 0, 6] },
        h4: { fontSize: 14, bold: true, color: "#7c3aed", margin: [0, 6, 0, 5] },
        p: { margin: [0, 4, 0, 7] },
        ul: { margin: [0, 4, 0, 7] },
        ol: { margin: [0, 4, 0, 7] },
        blockquote: {
          color: "#555555",
          margin: [10, 8, 0, 8]
        },
        pre: {
          font: "Roboto",
          fontSize: 9,
          color: "#222222",
          fillColor: "#f2f2f2",
          margin: [0, 8, 0, 8]
        },
        code: {
          font: "Roboto",
          fontSize: 9,
          color: "#b42362"
        },
        table: {
          margin: [0, 8, 0, 8]
        }
      }
    });

    const documentDefinition = {
      pageSize: "A4",
      pageMargins: [42, 48, 42, 48],
      info: {
        title: t("title"),
        author: "Markdown Previewer",
        subject: "Markdown export",
        creator: "Markdown Previewer"
      },
      defaultStyle: {
        font: "Roboto",
        fontSize: 11,
        lineHeight: 1.3,
        color: "#1a1a2e"
      },
      styles: {
        tableHeader: {
          bold: true,
          fillColor: "#f1ebff",
          color: "#5b21b6"
        }
      },
      content: pdfContent
    };

    pdfMake.createPdf(documentDefinition).download("markdown-export.pdf");
    showToast(t("exported"));
  } catch (error) {
    console.error(error);
    showToast(`${t("loadError")}: ${error.message}`, true);
  } finally {
    exportPdfBtn.disabled = false;
  }
}

function loadFromFile(file) {
  if (!file) return;

  const reader = new FileReader();

  reader.onload = event => {
    editor.value = event.target.result;
    updatePreview();
    showToast(`${t("loaded")}: ${file.name}`);
  };

  reader.onerror = () => showToast(t("loadError"), true);
  reader.readAsText(file);
}

async function loadFromUrl(url) {
  try {
    new URL(url);
  } catch {
    showToast(t("invalidUrl"), true);
    return;
  }

  try {
    const response = await fetch(url);
    if (!response.ok) throw new Error(`HTTP ${response.status}`);

    editor.value = await response.text();
    updatePreview();

    lastUrl = url;
    localStorage.setItem("md_last_url", url);
    urlModal.classList.remove("show");
    showToast(t("loaded"));
  } catch (error) {
    showToast(`${t("loadError")}: ${error.message}`, true);
  }
}

editor.addEventListener("input", updatePreview);

langToggle.addEventListener("click", () => {
  currentLang = currentLang === "uk" ? "en" : "uk";
  localStorage.setItem("md_lang", currentLang);
  applyTranslations();
});

themeToggle.addEventListener("click", () => {
  applyTheme(theme === "dark" ? "light" : "dark");
});

document.getElementById("toggleOrientation").addEventListener("click", () => {
  setOrientation(orientation === "horizontal" ? "vertical" : "horizontal");
});

document.getElementById("clearBtn").addEventListener("click", () => {
  if (confirm(t("confirmClear"))) {
    editor.value = "";
    updatePreview();
    showToast(t("cleared"));
  }
});

document.getElementById("sampleBtn").addEventListener("click", () => {
  editor.value = sampleText[currentLang];
  updatePreview();
});

document.getElementById("copyBtn").addEventListener("click", async () => {
  try {
    await navigator.clipboard.writeText(preview.innerHTML);
    showToast(t("copied"));
  } catch {
    showToast(t("loadError"), true);
  }
});

document.getElementById("exportMd").addEventListener("click", () => {
  downloadFile(editor.value, "document.md", "text/markdown;charset=utf-8");
  showToast(t("exported"));
});

document.getElementById("exportHtml").addEventListener("click", exportHtml);
document.getElementById("exportPdf").addEventListener("click", exportPdf);

document.getElementById("loadFileBtn").addEventListener("click", () => fileInput.click());

fileInput.addEventListener("change", event => {
  loadFromFile(event.target.files[0]);
  event.target.value = "";
});

document.getElementById("loadUrlBtn").addEventListener("click", () => {
  urlInput.value = lastUrl;
  urlModal.classList.add("show");
  setTimeout(() => urlInput.focus(), 100);
});

document.getElementById("urlCancel").addEventListener("click", () => {
  urlModal.classList.remove("show");
});

document.getElementById("urlLoad").addEventListener("click", () => {
  loadFromUrl(urlInput.value.trim());
});

urlInput.addEventListener("keydown", event => {
  if (event.key === "Enter") loadFromUrl(urlInput.value.trim());
  if (event.key === "Escape") urlModal.classList.remove("show");
});

urlModal.addEventListener("click", event => {
  if (event.target === urlModal) urlModal.classList.remove("show");
});

document.addEventListener("dragover", event => event.preventDefault());

document.addEventListener("drop", event => {
  event.preventDefault();
  loadFromFile(event.dataTransfer.files[0]);
});

editor.addEventListener("keydown", event => {
  if (event.key === "Tab") {
    event.preventDefault();

    const start = editor.selectionStart;
    const end = editor.selectionEnd;

    editor.value =
      editor.value.substring(0, start) +
      "  " +
      editor.value.substring(end);

    editor.selectionStart = editor.selectionEnd = start + 2;
    updatePreview();
  }
});

applyTheme(theme);
setOrientation(orientation);
applyTranslations();

const savedContent = localStorage.getItem("md_content");
editor.value = savedContent !== null ? savedContent : sampleText[currentLang];
updatePreview();
</script>
</body>
</html>
