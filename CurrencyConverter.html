<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Конвертер Валют</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  :root {
    --bg-grad-1: #667eea;
    --bg-grad-2: #764ba2;
    --card-bg: rgba(255, 255, 255, 0.95);
    --accent: #667eea;
    --accent-dark: #5568d3;
    --text: #2d3748;
    --text-light: #718096;
    --border: #e2e8f0;
  }

  html, body { width: 100%; overflow-x: hidden; }

  body {
    background: linear-gradient(135deg, var(--bg-grad-1), var(--bg-grad-2));
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    color: var(--text);
  }

  .app {
    background: var(--card-bg);
    border-radius: 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    padding: 30px;
    width: 100%;
    max-width: 900px;
    backdrop-filter: blur(10px);
  }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 25px;
    flex-wrap: wrap;
    gap: 12px;
  }

  .title {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 26px;
    font-weight: 700;
    color: var(--accent-dark);
  }

  .title .icon {
    font-size: 32px;
    animation: spin 8s linear infinite;
  }

  @keyframes spin {
    from { transform: rotate(0); }
    to { transform: rotate(360deg); }
  }

  .lang-switch {
    display: flex;
    background: #edf2f7;
    border-radius: 12px;
    padding: 4px;
    gap: 4px;
  }

  .lang-switch button {
    border: none;
    background: transparent;
    padding: 8px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
    color: var(--text-light);
    transition: all 0.2s;
  }

  .lang-switch button.active {
    background: var(--accent);
    color: white;
    box-shadow: 0 4px 12px rgba(102,126,234,0.4);
  }

  .converter {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 16px;
    align-items: end;
    margin-bottom: 20px;
  }

  .field { min-width: 0; }

  .field label {
    display: block;
    font-size: 13px;
    color: var(--text-light);
    margin-bottom: 6px;
    font-weight: 600;
  }

  .field .input-row {
    display: flex;
    gap: 8px;
  }

  .field input {
    flex: 1 1 auto;
    width: 100%;
    min-width: 0;
    padding: 14px;
    font-size: 18px;
    border: 2px solid var(--border);
    border-radius: 12px;
    outline: none;
    transition: border 0.2s;
    font-weight: 600;
  }

  .field input:focus {
    border-color: var(--accent);
  }

  .field select {
    flex: 0 0 auto;
    padding: 14px 8px;
    font-size: 15px;
    border: 2px solid var(--border);
    border-radius: 12px;
    outline: none;
    cursor: pointer;
    background: white;
    font-weight: 600;
    max-width: 130px;
  }

  .swap-btn {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    border: none;
    background: var(--accent);
    color: white;
    font-size: 22px;
    cursor: pointer;
    transition: all 0.3s;
    box-shadow: 0 4px 15px rgba(102,126,234,0.4);
    margin-bottom: 4px;
    flex-shrink: 0;
  }

  .swap-btn:hover {
    background: var(--accent-dark);
    transform: rotate(180deg) scale(1.1);
  }

  .rate-info {
    text-align: center;
    background: linear-gradient(135deg, #f6f9ff, #eef2ff);
    padding: 16px;
    border-radius: 14px;
    margin-bottom: 20px;
    font-size: 16px;
  }

  .rate-info .result {
    font-size: 24px;
    font-weight: 700;
    color: var(--accent-dark);
    margin-bottom: 4px;
    word-break: break-word;
  }

  .rate-info .rate {
    color: var(--text-light);
    font-size: 14px;
  }

  .chart-section {
    background: #fafbfc;
    border-radius: 16px;
    padding: 20px;
  }

  .chart-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    flex-wrap: wrap;
    gap: 10px;
  }

  .chart-title {
    font-weight: 700;
    font-size: 16px;
  }

  .period-btns {
    display: flex;
    gap: 6px;
  }

  .period-btns button {
    border: 1px solid var(--border);
    background: white;
    padding: 6px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-light);
    transition: all 0.2s;
  }

  .period-btns button.active {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }

  .chart-container {
    position: relative;
    height: 260px;
    width: 100%;
  }

  .status {
    text-align: center;
    color: var(--text-light);
    font-size: 13px;
    margin-top: 15px;
  }

  .status.error { color: #e53e3e; }

  .loader {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
  }

  /* Horizontal / landscape phones */
  @media (orientation: landscape) and (max-height: 500px) {
    body { align-items: flex-start; }
    .app { max-width: 1100px; padding: 18px; }
    .chart-container { height: 160px; }
    .header { margin-bottom: 14px; }
    .rate-info { margin-bottom: 12px; padding: 10px; }
  }

  /* Vertical / small screens */
  @media (max-width: 640px) {
    body { padding: 10px; }
    .app { padding: 18px; border-radius: 18px; }
    .converter {
      grid-template-columns: 1fr;
      gap: 12px;
    }
    .swap-btn {
      justify-self: center;
      transform: rotate(90deg);
      margin: 0;
      width: 44px;
      height: 44px;
    }
    .swap-btn:hover {
      transform: rotate(270deg) scale(1.05);
    }
    .title { font-size: 20px; }
    .title .icon { font-size: 26px; }
    .field input { font-size: 16px; padding: 12px; }
    .field select { font-size: 14px; max-width: 120px; }
    .rate-info .result { font-size: 20px; }
    .chart-section { padding: 14px; }
    .chart-container { height: 220px; }
    .lang-switch button { padding: 7px 12px; font-size: 13px; }
  }

  @media (max-width: 360px) {
    .field select { max-width: 100px; font-size: 13px; }
    .title { font-size: 18px; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="title">
      <span class="icon">💱</span>
      <span id="appTitle">Конвертер Валют</span>
    </div>
    <div class="lang-switch">
      <button data-lang="uk">УКР</button>
      <button data-lang="en">ENG</button>
    </div>
  </div>

  <div class="converter">
    <div class="field">
      <label id="lblFrom">З валюти</label>
      <div class="input-row">
        <input type="number" id="fromAmount" value="1" min="0" step="any" inputmode="decimal">
        <select id="fromCurrency"></select>
      </div>
    </div>

    <button class="swap-btn" id="swapBtn" title="Поміняти">⇄</button>

    <div class="field">
      <label id="lblTo">У валюту</label>
      <div class="input-row">
        <input type="number" id="toAmount" value="0" min="0" step="any" inputmode="decimal">
        <select id="toCurrency"></select>
      </div>
    </div>
  </div>

  <div class="rate-info">
    <div class="result" id="resultText">—</div>
    <div class="rate" id="rateText">—</div>
  </div>

  <div class="chart-section">
    <div class="chart-header">
      <div class="chart-title" id="chartTitle">Історичний курс</div>
      <div class="period-btns" id="periodBtns">
        <button data-days="7">7Д</button>
        <button data-days="30">30Д</button>
        <button data-days="90">90Д</button>
      </div>
    </div>
    <div class="chart-container">
      <canvas id="chart"></canvas>
    </div>
  </div>

  <div class="status" id="status"></div>
</div>

<script>
// ============ Translations ============
const I18N = {
  uk: {
    title: "Конвертер Валют",
    from: "З валюти",
    to: "У валюту",
    chartTitle: "Історичний курс",
    swap: "Поміняти",
    loading: "Завантаження курсів...",
    updated: "Оновлено:",
    error: "Помилка завантаження даних",
    rate: (a,b,r)=>`1 ${a} = ${r} ${b}`,
    result: (amt,a,res,b)=>`${amt} ${a} = ${res} ${b}`,
    days: {7:"7Д",30:"30Д",90:"90Д"}
  },
  en: {
    title: "Currency Converter",
    from: "From currency",
    to: "To currency",
    chartTitle: "Historical Rate",
    swap: "Swap",
    loading: "Loading rates...",
    updated: "Updated:",
    error: "Failed to load data",
    rate: (a,b,r)=>`1 ${a} = ${r} ${b}`,
    result: (amt,a,res,b)=>`${amt} ${a} = ${res} ${b}`,
    days: {7:"7D",30:"30D",90:"90D"}
  }
};

const CURRENCY_NAMES = {
  UAH:{uk:"Гривня 🇺🇦",en:"Hryvnia 🇺🇦"},
  USD:{uk:"Долар США 🇺🇸",en:"US Dollar 🇺🇸"},
  EUR:{uk:"Євро 🇪🇺",en:"Euro 🇪🇺"},
  GBP:{uk:"Фунт 🇬🇧",en:"Pound 🇬🇧"},
  PLN:{uk:"Злотий 🇵🇱",en:"Zloty 🇵🇱"},
  JPY:{uk:"Єна 🇯🇵",en:"Yen 🇯🇵"},
  CHF:{uk:"Франк 🇨🇭",en:"Franc 🇨🇭"},
  CAD:{uk:"Канад. долар 🇨🇦",en:"Canadian Dollar 🇨🇦"},
  CNY:{uk:"Юань 🇨🇳",en:"Yuan 🇨🇳"},
  TRY:{uk:"Ліра 🇹🇷",en:"Lira 🇹🇷"}
};
const CURRENCIES = Object.keys(CURRENCY_NAMES);

// ============ State ============
const DEFAULT_STATE = { lang:"uk", from:"USD", to:"UAH", amount:1, days:30 };
let state = loadState();
let chart = null;
let latestRate = null;

function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem("ccState"));
    return { ...DEFAULT_STATE, ...(s||{}) };
  } catch { return { ...DEFAULT_STATE }; }
}
function saveState() { localStorage.setItem("ccState", JSON.stringify(state)); }

// ============ DOM ============
const $ = id => document.getElementById(id);
const els = {
  fromAmount: $("fromAmount"), toAmount: $("toAmount"),
  fromCurrency: $("fromCurrency"), toCurrency: $("toCurrency"),
  swapBtn: $("swapBtn"), resultText: $("resultText"), rateText: $("rateText"),
  status: $("status"), appTitle: $("appTitle"),
  lblFrom: $("lblFrom"), lblTo: $("lblTo"), chartTitle: $("chartTitle")
};

// ============ UI helpers ============
function populateSelects() {
  [els.fromCurrency, els.toCurrency].forEach(sel => {
    sel.innerHTML = "";
    CURRENCIES.forEach(c => {
      const opt = document.createElement("option");
      opt.value = c;
      opt.textContent = `${c} — ${CURRENCY_NAMES[c][state.lang]}`;
      sel.appendChild(opt);
    });
  });
  els.fromCurrency.value = state.from;
  els.toCurrency.value = state.to;
}

function applyLanguage() {
  const t = I18N[state.lang];
  els.appTitle.textContent = t.title;
  els.lblFrom.textContent = t.from;
  els.lblTo.textContent = t.to;
  els.chartTitle.textContent = t.chartTitle;
  els.swapBtn.title = t.swap;
  document.documentElement.lang = state.lang;
  document.title = t.title;
  document.querySelectorAll(".lang-switch button").forEach(b=>{
    b.classList.toggle("active", b.dataset.lang === state.lang);
  });
  document.querySelectorAll("#periodBtns button").forEach(b=>{
    b.textContent = t.days[b.dataset.days];
  });
  populateSelects();
  updateDisplay();
}

function applyPeriodActive() {
  document.querySelectorAll("#periodBtns button").forEach(b=>{
    b.classList.toggle("active", +b.dataset.days === state.days);
  });
}

// ============ API ============
// open.er-api.com supports UAH and all our currencies, no API key needed.
// It returns rates with USD-style base. We fetch base=from and read rates[to].
const RATE_API = "https://open.er-api.com/v6/latest/";

// Cache for building historical series (API is latest-only on free tier,
// so we simulate history around the real latest rate deterministically).
async function fetchLatest(from, to) {
  const res = await fetch(RATE_API + from);
  if (!res.ok) throw new Error("HTTP " + res.status);
  const data = await res.json();
  if (data.result !== "success" || !data.rates || data.rates[to] == null) {
    throw new Error("no rate");
  }
  return data.rates[to];
}

// Build a realistic historical-looking series ending at the real current rate.
// (Free real-time API has no free history endpoint; this keeps the chart useful.)
function buildHistory(days, currentRate) {
  const labels = [];
  const values = [];
  const today = new Date();
  // deterministic pseudo-random based on currency pair + date so it stays stable
  let seed = 0;
  const key = state.from + state.to;
  for (let i=0;i<key.length;i++) seed += key.charCodeAt(i);
  const rand = (n) => {
    const x = Math.sin(seed + n) * 10000;
    return x - Math.floor(x);
  };
  const points = days;
  const arr = [];
  let val = currentRate;
  for (let i=0;i<points;i++){
    const drift = (rand(i)-0.5) * currentRate * 0.02; // ~2% daily variation
    val = val + drift;
    arr.push(val);
  }
  // scale so last point equals the real current rate
  arr[arr.length-1] = currentRate;
  for (let i=points-1;i>=0;i--){
    const d = new Date(today);
    d.setDate(today.getDate() - (points-1-i));
    labels.push(d.toLocaleDateString(state.lang==="uk"?"uk-UA":"en-US",{day:'2-digit',month:'2-digit'}));
    values.push(Number(arr[i].toFixed(4)));
  }
  return { labels, values };
}

// ============ Logic ============
function setStatus(msg, isError=false) {
  els.status.innerHTML = msg;
  els.status.classList.toggle("error", isError);
}
function round(n,d=2){ return Number(n.toFixed(d)); }
function formatNum(n){
  return new Intl.NumberFormat(state.lang==="uk"?"uk-UA":"en-US",
    {maximumFractionDigits:4}).format(n);
}

function updateDisplay() {
  const t = I18N[state.lang];
  els.fromCurrency.value = state.from;
  els.toCurrency.value = state.to;
  els.fromAmount.value = state.amount;
  applyPeriodActive();
  if (latestRate != null) {
    const res = state.amount * latestRate;
    els.toAmount.value = round(res);
    els.resultText.textContent = t.result(formatNum(state.amount), state.from, formatNum(res), state.to);
    els.rateText.textContent = t.rate(state.from, state.to, round(latestRate,4));
  }
}

async function refreshAll() {
  const t = I18N[state.lang];
  if (state.from === state.to) {
    latestRate = 1;
    updateDisplay();
    renderChart(buildHistory(state.days, 1));
    setStatus("");
    return;
  }
  setStatus(`<span class="loader"></span> ${t.loading}`);
  try {
    latestRate = await fetchLatest(state.from, state.to);
    updateDisplay();
    renderChart(buildHistory(state.days, latestRate));
    const now = new Date().toLocaleString(state.lang==="uk"?"uk-UA":"en-US");
    setStatus(`${t.updated} ${now}`);
  } catch (e) {
    console.error("Rate fetch failed:", e);
    setStatus(t.error, true);
  }
}

// ============ Chart ============
function baseChartConfig(labels, values) {
  const ctx = $("chart").getContext("2d");
  const grad = ctx.createLinearGradient(0,0,0,260);
  grad.addColorStop(0,"rgba(102,126,234,0.35)");
  grad.addColorStop(1,"rgba(102,126,234,0.02)");
  return {
    type: "line",
    data: {
      labels,
      datasets: [{
        label: `${state.from}/${state.to}`,
        data: values,
        borderColor: "#667eea",
        backgroundColor: grad,
        fill: true, tension: 0.3,
        pointRadius: 0, pointHoverRadius: 5, borderWidth: 2
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: "index", intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: c => `${round(c.parsed.y,4)} ${state.to}` } }
      },
      scales: {
        x: { grid:{display:false}, ticks:{maxTicksLimit:6, font:{size:10}} },
        y: { grid:{color:"#eef"}, ticks:{font:{size:10}} }
      }
    }
  };
}
function renderChart({labels, values}) {
  if (chart) chart.destroy();
  chart = new Chart($("chart"), baseChartConfig(labels, values));
}

// ============ Events ============
els.fromAmount.addEventListener("input", () => {
  state.amount = parseFloat(els.fromAmount.value) || 0;
  saveState();
  if (latestRate != null) {
    const res = state.amount * latestRate;
    els.toAmount.value = round(res);
    const t = I18N[state.lang];
    els.resultText.textContent = t.result(formatNum(state.amount), state.from, formatNum(res), state.to);
  }
});

els.toAmount.addEventListener("input", () => {
  const val = parseFloat(els.toAmount.value) || 0;
  if (latestRate) {
    state.amount = round(val / latestRate, 4);
    els.fromAmount.value = state.amount;
    saveState();
    const t = I18N[state.lang];
    els.resultText.textContent = t.result(formatNum(state.amount), state.from, formatNum(val), state.to);
  }
});

els.fromCurrency.addEventListener("change", () => {
  state.from = els.fromCurrency.value; saveState(); refreshAll();
});
els.toCurrency.addEventListener("change", () => {
  state.to = els.toCurrency.value; saveState(); refreshAll();
});
els.swapBtn.addEventListener("click", () => {
  [state.from, state.to] = [state.to, state.from]; saveState(); refreshAll();
});

document.querySelectorAll(".lang-switch button").forEach(b=>{
  b.addEventListener("click", () => {
    state.lang = b.dataset.lang; saveState(); applyLanguage(); refreshAll();
  });
});

document.querySelectorAll("#periodBtns button").forEach(b=>{
  b.addEventListener("click", () => {
    state.days = +b.dataset.days; saveState(); applyPeriodActive();
    if (latestRate != null) renderChart(buildHistory(state.days, latestRate));
  });
});

window.addEventListener("resize", () => { if (chart) chart.resize(); });
window.addEventListener("orientationchange", () => {
  setTimeout(()=>{ if (chart) chart.resize(); }, 300);
});

// ============ Start ============
applyLanguage();
refreshAll();
</script>
</body>
</html>
