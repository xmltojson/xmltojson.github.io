<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>Ukr.net viewer</title>
<style>
:root{
  --bg:#0b1020; --bg2:#121a33; --card:#161f3d; --card2:#1c2750; --line:#26335f;
  --text:#e8ecff; --muted:#93a0c8; --accent:#ffd500; --accent2:#3b82f6; --ok:#22c55e; --err:#ef4444;
  --shadow:0 10px 30px rgba(0,0,0,.35); --radius:16px;
  --grad:linear-gradient(135deg,#0057b7 0%,#3b82f6 45%,#ffd500 100%);
}
[data-theme="light"]{
  --bg:#f3f5fb; --bg2:#ffffff; --card:#ffffff; --card2:#eef2fb; --line:#dbe2f1;
  --text:#14193a; --muted:#5d6890; --shadow:0 8px 24px rgba(20,30,80,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif;background:var(--bg);color:var(--text);
  background-image:radial-gradient(circle at 10% -10%,rgba(0,87,183,.25),transparent 40%),radial-gradient(circle at 110% 10%,rgba(255,213,0,.12),transparent 35%);
  background-attachment:fixed;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}

/* top bar */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:10px 18px;
  padding-top:max(10px,env(safe-area-inset-top));background:color-mix(in srgb,var(--bg) 82%,transparent);
  backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:40px;height:40px;border-radius:12px;background:var(--grad);display:grid;place-items:center;font-weight:900;color:#fff;
  font-size:20px;box-shadow:0 4px 14px rgba(59,130,246,.45);flex-shrink:0}
.brand h1{font-size:18px;letter-spacing:.2px;white-space:nowrap}
.brand small{color:var(--muted);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.btn{padding:9px 14px;border-radius:11px;background:var(--card2);border:1px solid var(--line);font-weight:600;font-size:14px;
  display:inline-flex;align-items:center;gap:6px;transition:.15s}
.btn:hover{transform:translateY(-1px);border-color:var(--accent2)}
.btn.primary{background:var(--accent2);border-color:transparent;color:#fff}
.btn.warn{color:var(--err)}
.btn:disabled{opacity:.6;cursor:wait}
.icon-btn{width:38px;height:38px;border-radius:11px;background:var(--card2);border:1px solid var(--line);display:grid;place-items:center;font-size:18px}
.seg{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:3px}
.seg button{padding:5px 10px;border-radius:8px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--accent);color:#14193a}
.status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.dot.err{background:var(--err)}
.dot.load{background:var(--accent);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
.spin{display:inline-block}
.loading .spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* layout */
.layout{display:grid;grid-template-columns:270px 1fr;gap:18px;padding:18px;max-width:1500px;margin:0 auto}
aside{position:sticky;top:78px;align-self:start;max-height:calc(100vh - 96px);overflow:auto;display:flex;flex-direction:column;gap:14px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}
.panel h3{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:10px}
.sec-list{display:flex;flex-direction:column;gap:2px}
.sec-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;text-align:left;font-size:14px;color:var(--text)}
.sec-item:hover{background:var(--card2)}
.sec-item.on{background:linear-gradient(90deg,rgba(59,130,246,.25),transparent);box-shadow:inset 3px 0 0 var(--accent)}
.sec-item .ic{width:22px;text-align:center}
.sec-item .cnt{margin-left:auto;font-size:11px;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
.field label{font-size:12px;color:var(--muted)}
.field select,.field input{padding:9px 10px;border-radius:10px;background:var(--bg2);border:1px solid var(--line);outline:none;width:100%}
.field input:focus,.field select:focus{border-color:var(--accent2)}
.hint{font-size:11px;color:var(--muted);line-height:1.4}
.btn-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.btn-grid .btn{justify-content:center;font-size:13px;padding:8px}

main{min-width:0}
.tabs{display:flex;gap:6px;margin-bottom:14px;background:var(--card);border:1px solid var(--line);padding:5px;border-radius:14px;width:max-content;max-width:100%;overflow:auto}
.tab{padding:8px 16px;border-radius:10px;font-weight:600;color:var(--muted);white-space:nowrap;font-size:14px}
.tab.on{background:var(--card2);color:var(--text);box-shadow:inset 0 -2px 0 var(--accent)}
.badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:#14193a;font-size:11px;font-weight:800;margin-left:4px;text-align:center}
.view{display:none;animation:fade .25s}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}}

/* chips (mobile sections) */
.chips{display:none;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:7px 12px;border-radius:20px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:600}
.chip.on{background:var(--accent);color:#14193a;border-color:transparent}

/* toolbar */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.search{flex:1;min-width:180px;position:relative}
.search input{width:100%;padding:11px 12px 11px 38px;border-radius:12px;background:var(--card);border:1px solid var(--line);outline:none}
.search input:focus{border-color:var(--accent2)}
.search::before{content:"🔍";position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:14px;opacity:.7}
.toolbar select{padding:10px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.toggle{display:flex;align-items:center;gap:6px;padding:0 12px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:13px;cursor:pointer;user-select:none}
.meta{font-size:12px;color:var(--muted);margin-bottom:12px;display:flex;flex-wrap:wrap;gap:12px}
.notice{padding:10px 14px;border-radius:12px;background:rgba(255,213,0,.12);border:1px solid rgba(255,213,0,.35);font-size:13px;margin-bottom:12px}
.notice.err{background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.4)}

/* news cards */
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 14px 10px;display:flex;flex-direction:column;gap:8px;
  transition:.15s;position:relative;overflow:hidden}
.card:hover{transform:translateY(-2px);border-color:var(--accent2);box-shadow:var(--shadow)}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--src-color,var(--accent2))}
.card.read{opacity:.55}
.card .top{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.time{font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.src{padding:2px 8px;border-radius:8px;background:var(--card2);font-weight:600;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card h4{font-size:15.5px;line-height:1.38;font-weight:650}
.card h4 a:hover{color:var(--accent2)}
.card .acts{display:flex;gap:4px;margin-top:auto;align-items:center}
.card .acts button{padding:5px 8px;border-radius:8px;font-size:13px;color:var(--muted)}
.card .acts button:hover{background:var(--card2);color:var(--text)}
.card .acts .fav.on{color:var(--accent)}
.rel{font-size:12px;color:var(--muted)}
.rel summary{cursor:pointer;list-style:none}
.rel summary::before{content:"▸ "}
.rel[open] summary::before{content:"▾ "}
.rel ul{margin:6px 0 0 14px;display:flex;flex-direction:column;gap:4px}
.rel a:hover{color:var(--accent2)}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty .big{font-size:48px;margin-bottom:10px}
.skel{height:120px;border-radius:var(--radius);background:linear-gradient(90deg,var(--card) 25%,var(--card2) 50%,var(--card) 75%);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}

/* analytics */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;right:-30px;top:-30px;width:90px;height:90px;border-radius:50%;background:var(--grad);opacity:.15}
.kpi .v{font-size:28px;font-weight:800;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.chart{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;min-width:0}
.chart h3{font-size:14px;margin-bottom:14px}
.hbar{display:grid;grid-template-columns:minmax(80px,38%) 1fr 34px;align-items:center;gap:8px;margin-bottom:7px;font-size:13px}
.hbar .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar .track{height:12px;border-radius:6px;background:var(--card2);overflow:hidden}
.hbar .fill{height:100%;border-radius:6px;background:var(--grad);transform-origin:left;animation:grow .6s ease-out}
@keyframes grow{from{transform:scaleX(0)}}
.hbar .c{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.vbars{display:flex;align-items:flex-end;gap:3px;height:170px;padding-top:10px}
.vbar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;min-width:0}
.vbar .b{width:100%;border-radius:4px 4px 0 0;background:linear-gradient(180deg,var(--accent),var(--accent2));min-height:2px;animation:growY .6s ease-out;transform-origin:bottom}
@keyframes growY{from{transform:scaleY(0)}}
.vbar span{font-size:9px;color:var(--muted)}
.donut-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.legend{display:flex;flex-direction:column;gap:6px;font-size:13px;flex:1;min-width:150px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.cloud{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:center;padding:10px;line-height:1.1}
.cloud span{cursor:pointer;font-weight:700;transition:.15s}
.cloud span:hover{color:var(--accent)!important;transform:scale(1.08)}

/* log */
.log{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px;max-height:320px;overflow:auto;white-space:pre-wrap;word-break:break-all}
.log .e{color:var(--err)} .log .s{color:var(--ok)} .log .i{color:var(--muted)}
.stats-table{width:100%;border-collapse:collapse;font-size:13px}
.stats-table td{padding:6px 4px;border-bottom:1px solid var(--line)}
.stats-table td:last-child{text-align:right;font-weight:700}

/* bottom nav */
.bottomnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:40;background:color-mix(in srgb,var(--bg2) 92%,transparent);
  backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px max(6px,env(safe-area-inset-bottom))}
.bottomnav .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;padding:6px 2px}
.bottomnav .tab b{font-size:20px;font-weight:400}
.mobile-only{display:none}
#backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:45}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);background:var(--card2);border:1px solid var(--line);
  padding:10px 18px;border-radius:12px;box-shadow:var(--shadow);z-index:60;transition:.3s;font-size:14px}
#toast.show{transform:translateX(-50%) translateY(0)}

/* responsive */
@media (max-width:1100px){ .kpis{grid-template-columns:repeat(2,1fr)} .grid2{grid-template-columns:1fr} }
@media (max-width:820px){
  .layout{grid-template-columns:1fr;padding:12px 12px 90px}
  aside{position:fixed;top:0;left:0;bottom:0;width:min(300px,86vw);max-height:none;z-index:50;background:var(--bg);padding:16px;
    padding-top:max(16px,env(safe-area-inset-top));transform:translateX(-105%);transition:.25s;border-right:1px solid var(--line)}
  body.drawer aside{transform:none}
  body.drawer #backdrop{display:block}
  .mobile-only{display:grid}
  .chips.mobile-only{display:flex}
  .bottomnav{display:flex}
  main > .tabs{display:none}
  .list{grid-template-columns:1fr}
  .brand small,.status .txt,#refreshBtn .lbl{display:none}
  .topbar{padding:8px 12px;gap:8px}
  .brand h1{font-size:16px}
  #toast{bottom:84px}
}
@media (max-width:420px){ .kpi .v{font-size:22px} .seg button{padding:5px 7px} }
/* small screens in landscape */
@media (orientation:landscape) and (max-height:520px){
  .topbar{padding:4px 12px;padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right))}
  .logo{width:32px;height:32px;font-size:16px}
  .brand small{display:none}
  .layout{padding:8px max(12px,env(safe-area-inset-left)) 70px}
  .list{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
  .bottomnav{padding:2px 6px}
  .bottomnav .tab{flex-direction:row;gap:6px;font-size:12px;padding:6px}
  .bottomnav .tab b{font-size:16px}
  .kpis{grid-template-columns:repeat(4,1fr)}
  .grid2{grid-template-columns:1fr 1fr}
  .vbars{height:120px}
  .card{padding:10px 12px 6px}
}
</style>
</head>
<body>

<header class="topbar">
  <button id="menuBtn" class="icon-btn mobile-only" aria-label="menu">☰</button>
  <div class="brand">
    <div class="logo">U</div>
    <div><h1>Ukr.net viewer</h1><small data-i18n="tagline"></small></div>
  </div>
  <div class="top-actions">
    <span class="status"><span id="statusDot" class="dot"></span><span class="txt" id="statusTxt"></span></span>
    <button id="refreshBtn" class="btn primary"><span class="spin">⟳</span><span class="lbl" data-i18n="refresh"></span></button>
    <div class="seg" id="langSeg"><button data-lang="uk">UA</button><button data-lang="en">EN</button></div>
    <button id="themeBtn" class="icon-btn" aria-label="theme">◐</button>
  </div>
</header>

<div class="layout">
  <aside id="sidebar">
    <div class="panel">
      <h3 data-i18n="sections"></h3>
      <div class="sec-list" id="secList"></div>
    </div>
    <div class="panel">
      <h3 data-i18n="settings"></h3>
      <div class="field">
        <label data-i18n="proxy"></label>
        <select id="proxySel">
          <option value="auto" data-i18n="proxyAuto"></option>
          <option value="allorigins">AllOrigins</option>
          <option value="corsproxy">corsproxy.io</option>
          <option value="codetabs">CodeTabs</option>
          <option value="jina">r.jina.ai (Reader)</option>
          <option value="custom" data-i18n="customProxy"></option>
        </select>
      </div>
      <div class="field" id="customWrap">
        <input id="customProxy" placeholder="https://my-proxy/?url={url}">
        <span class="hint" data-i18n="customHint"></span>
      </div>
      <div class="field">
        <label data-i18n="autoRefresh"></label>
        <select id="autoSel"></select>
      </div>
      <div class="btn-grid">
        <button class="btn" id="demoBtn">🧪 <span data-i18n="demo"></span></button>
        <button class="btn" id="expJson">⬇ JSON</button>
        <button class="btn" id="expCsv">⬇ CSV</button>
        <button class="btn warn" id="clearBtn">🗑 <span data-i18n="clear"></span></button>
      </div>
    </div>
    <div class="panel hint" data-i18n="about"></div>
  </aside>

  <main>
    <nav class="tabs" id="tabs"></nav>
    <div class="chips mobile-only" id="chips"></div>

    <section class="view" id="view-news">
      <div class="toolbar">
        <div class="search"><input id="q" type="search" autocomplete="off"></div>
        <select id="sortSel"></select>
        <label class="toggle"><input type="checkbox" id="unreadChk"><span data-i18n="unreadOnly"></span></label>
      </div>
      <div id="newsNotice"></div>
      <div class="meta" id="newsMeta"></div>
      <div class="list" id="newsList"></div>
    </section>

    <section class="view" id="view-analytics"></section>
    <section class="view" id="view-saved"><div class="list" id="savedList"></div></section>
    <section class="view" id="view-log"></section>
  </main>
</div>

<nav class="bottomnav" id="bottomnav"></nav>
<div id="backdrop"></div>
<div id="toast"></div>

<script>

async function fetchText(proxy, url, timeout=15000){
  const ctrl = new AbortController(); const timer = setTimeout(()=>ctrl.abort(), timeout);

    if(!r.ok) throw new Error("HTTP "+r.status);
    const txt = await r.text();
    if(!txt || txt.length<50) throw new Error("empty response");
    return txt;
  } finally { clearTimeout(timer); }
}

/* ================= parsing ================= */
function parseAny(txt, proxy){
  const s = txt.trim();
  if(s[0]==="{" || s[0]==="["){
    try{ const items = parseJSON(JSON.parse(s)); return {items, method:"JSON API", links:items.length}; }catch{}
  }
  if(proxy==="jina" || !/<(html|body|div|article|a)\b/i.test(s)) return parseMarkdown(s);
  return parseHTML(s);
}
function toTime(v){
  if(v==null||v==="") return null;
  if(typeof v==="number" || /^\d{9,13}$/.test(v)){ const n=+v; return n<1e12 ? n*1000 : n; }
  const m = String(v).match(/^\s*(\d{1,2}):(\d{2})\s*$/);
  if(m){ const d=new Date(); d.setHours(+m[1],+m[2],0,0); if(d-Date.now()>3600e3) d.setDate(d.getDate()-1); return d.getTime(); }
  const p = Date.parse(v); return isNaN(p)?null:p;
}
function absUrl(u){ try{ const x=new URL(u, "https://www.ukr.net/"); return /^https?:$/.test(x.protocol)?x.href:null; }catch{ return null; } }
function cleanSrc(s){ if(!s) return ""; if(typeof s==="object") s = s.title||s.Title||s.name||s.Name||""; return String(s).replace(/^\s*\(|\)\s*$/g,"").trim(); }
function mkItem(o){
  const url = absUrl(o.url); if(!url) return null;
  const title = String(o.title).replace(/\s+/g," ").trim(); if(title.length<12) return null;
  let src = cleanSrc(o.source);
  if(!src){ try{ src = new URL(url).hostname.replace(/^www\./,""); }catch{} }
  return {id:url, title, url, source:src||"—", time:toTime(o.time), count:+o.count||0, related:o.related||[]};
}
function dedupe(arr){ const seen=new Set(); return arr.filter(x=>x && !seen.has(x.id) && seen.add(x.id)); }

function parseJSON(root){
  const out=[];
  const lk = o => { const r={}; for(const k in o) r[k.toLowerCase()]=o[k]; return r; };
  (function walk(n,d){
    if(!n||d>9) return;
    if(Array.isArray(n)){ n.forEach(x=>walk(x,d+1)); return; }
    if(typeof n!=="object") return;
    const k = lk(n);
    const title = k.title||k.name, url = k.url||k.link||k.href;
    if(typeof title==="string" && typeof url==="string"){
      const rel = Array.isArray(k.news) ? k.news.map(x=>{const y=lk(x||{}); return {title:y.title, url:absUrl(y.url||y.link||""), source:cleanSrc(y.partnertitle||y.partner||y.source)};}).filter(x=>x.title&&x.url) : [];
      const it = mkItem({title,url,source:k.partnertitle||k.partner||k.sourcetitle||k.source||k.media,
        time:k.datecreated||k.datelast||k.date||k.time||k.pubdate, count:k.newscount||k.count||rel.length, related:rel.slice(0,15)});
      if(it){ out.push(it); return; }
    }
    for(const v of Object.values(n)) if(v&&typeof v==="object") walk(v,d+1);
  })(root,0);
  return dedupe(out);
}
function parseHTML(html){
  const doc = new DOMParser().parseFromString(html,"text/html");
  const tags={}; doc.querySelectorAll("*").forEach(e=>{tags[e.tagName.toLowerCase()]=(tags[e.tagName.toLowerCase()]||0)+1;});
  const dom = Object.entries(tags).sort((a,b)=>b[1]-a[1]).slice(0,10);
  const links = doc.querySelectorAll("a[href]").length;
  let out=[];
  // ukr.net specific markup
  doc.querySelectorAll("section.im, .im, article section").forEach(sec=>{
    const a = sec.querySelector(".im-tl a, .im-tl_a, a"); if(!a) return;
    out.push(mkItem({title:a.textContent, url:a.getAttribute("href"),
      time:(sec.querySelector(".im-tm, time")||{}).textContent,
      source:(sec.querySelector(".im-pr, .im-pr_a")||{}).textContent}));
  });
  out = dedupe(out); let method = "HTML (ukr.net markup)";
  if(out.length<3){
    method = "HTML (generic)"; out=[];
    doc.querySelectorAll("a[href]").forEach(a=>{
      const title=a.textContent.replace(/\s+/g," ").trim(); const href=a.getAttribute("href")||"";
      if(title.length<25||title.length>300||/^(javascript|mailto|#)/i.test(href)) return;
      const box = a.closest("article,li,section") || a.parentElement?.parentElement || a.parentElement;
      const txt = (box?.textContent||"").slice(0,600);
      const tm = txt.match(/\b([01]?\d|2[0-3]):[0-5]\d\b/);
      const srcEl = box?.querySelector("[class*=pr],[class*=source],[class*=partner]");
      const pm = txt.match(/\(([^()]{2,40})\)\s*$/);
      out.push(mkItem({title,url:href,time:tm&&tm[0],source:srcEl?srcEl.textContent:(pm&&pm[1])}));
    });
    out = dedupe(out);
  }
  return {items:out, method, dom, links};
}
function parseMarkdown(md){
  const out=[]; let links=0;
  md.split("\n").forEach(line=>{
    const re=/\[([^\]]{20,300})\]\((https?:\/\/[^)\s]+)\)/g; let m;
    while((m=re.exec(line))){
      links++;
      const title=m[1].replace(/!\[.*?\]\(.*?\)/g,"").replace(/[*_`]/g,"").trim();
      const rest=line.slice(m.index+m[0].length);
      const tm=line.match(/\b([01]?\d|2[0-3]):[0-5]\d\b/);
      const pm=rest.match(/\(([^()]{2,40})\)/) || rest.match(/\[([^\]]{2,40})\]\(/);
      out.push(mkItem({title,url:m[2],time:tm&&tm[0],source:pm&&pm[1]}));
    }
  });
  return {items:dedupe(out), method:"Markdown (r.jina.ai)", links};
}

  let acc=0; const C=2*Math.PI*60;
  const arcs=parts.map(([n,v],k)=>{ const len=v/items.length*C; const s=`<circle r="60" cx="80" cy="80" fill="none" stroke="${k<6?palette[k]:"#64748b"}" stroke-width="26" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-acc}"/>`; acc+=len; return s; }).join("");

  const curH=new Date().getHours();
  el.innerHTML=`
  <div class="kpis">
    <div class="kpi"><div class="l">${t("kpiTotal")}</div><div class="v">${items.length}</div></div>
    <div class="kpi"><div class="l">${t("kpiSources")}</div><div class="v">${srcs.length}</div></div>
    <div class="kpi"><div class="l">${t("kpiTop")}</div><div class="v" style="font-size:20px" title="${esc(srcs[0][0])}">${esc(srcs[0][0])}</div></div>
    <div class="kpi"><div class="l">${t("kpiPerHour")}</div><div class="v">${(times.length/span).toFixed(1)}</div></div>
  </div>
  <div class="grid2">
    <div class="chart"><h3>🏆 ${t("topSources")}</h3>
      ${srcs.slice(0,10).map(([n,v])=>`<div class="hbar"><span class="n" title="${esc(n)}">${esc(n)}</span><div class="track"><div class="fill" style="width:${v/maxS*100}%"></div></div><span class="c">${v}</span></div>`).join("")}
    </div>
    <div class="chart"><h3>🕒 ${t("byHour")}</h3>
      <div class="vbars">${hours.map((v,h)=>`<div class="vbar" title="${h}:00 — ${v}"><div class="b" style="height:${v/maxH*100}%;${h===curH?"background:var(--ok)":""}"></div><span>${h%3===0?h:""}</span></div>`).join("")}</div>
    </div>
    <div class="chart"><h3>🍩 ${t("share")}</h3>
      <div class="donut-wrap">
        <svg viewBox="0 0 160 160" width="160" height="160" style="transform:rotate(-90deg)">${arcs}</svg>
        <div class="legend">${parts.map(([n,v],k)=>`<div><i style="background:${k<6?palette[k]:"#64748b"}"></i>${esc(n)} — <b>${Math.round(v/items.length*100)}%</b></div>`).join("")}</div>
      </div>
    </div>
    <div class="chart"><h3>☁️ ${t("keywords")}</h3>
      <div class="cloud">${kw.map(([w,v],k)=>`<span data-kw="${esc(w)}" title="${t("filterKw")}: ${v}" style="font-size:${12+v/maxK*22}px;color:${palette[k%palette.length]};opacity:${.55+v/maxK*.45}">${esc(w)}</span>`).join("") || "—"}</div>
    </div>
  </div>`;
}

/* parser log */
function renderLog(){
  const m=lastMeta||{};
  const rows=[[t("method"),m.method],[t("proxyUsed"),m.proxy],[t("bytes"),m.bytes?(m.bytes/1024).toFixed(1)+" KB":null],
    [t("duration"),m.ms?m.ms+" ms":null],[t("linksFound"),m.links],[t("kpiTotal"),items.length],["URL",m.url]].filter(r=>r[1]!=null);
  $("#view-log").innerHTML=`
  <div class="grid2">
    <div class="chart"><h3>📋 ${t("parseStats")}</h3>
      <table class="stats-table">${rows.map(([a,b])=>`<tr><td>${esc(a)}</td><td style="word-break:break-all">${esc(b)}</td></tr>`).join("")||"<tr><td>—</td></tr>"}</table>
      ${m.dom?`<h3 style="margin-top:16px">🏷️ ${t("domTags")}</h3>${m.dom.map(([tg,c])=>`<div class="hbar"><span class="n">&lt;${esc(tg)}&gt;</span><div class="track"><div class="fill" style="width:${c/m.dom[0][1]*100}%"></div></div><span class="c">${c}</span></div>`).join("")}`:""}
    </div>
    <div class="chart"><h3>🧾 ${t("logTitle")}</h3>
      <div class="log">${logLines.map(l=>`<div class="${l.cls}">[${l.ts}] ${esc(l.msg)}</div>`).join("")||"—"}</div>
    </div>
  </div>
  <div class="chart" style="margin-top:14px"><h3>🔤 ${t("rawPreview")}</h3><div class="log">${esc(lastRaw.slice(0,4000))||"—"}</div></div>`;
  const lg=document.querySelector("#view-log .log"); if(lg) lg.scrollTop=lg.scrollHeight;
}

/* ================= helpers ================= */
function setStatus(s){
  $("#statusDot").className="dot "+(s==="load"?"load":s);
  $("#statusTxt").textContent = s==="load"?t("loading"):s==="err"?t("failed"):t("ready");
  document.body.classList.toggle("loading", s==="load"); $("#refreshBtn").disabled = s==="load";
}
let toastT; function toast(msg){ const el=$("#toast"); el.textContent=msg; el.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove("show"),2200); }
function applyTheme(){ document.documentElement.dataset.theme=state.theme; document.querySelector('meta[name=theme-color]').content = state.theme==="light"?"#f3f5fb":"#0b1020"; }
function setupAuto(){ clearInterval(refreshTimer); if(+state.autoRefresh) refreshTimer=setInterval(()=>loadSection(true), state.autoRefresh*60000); }
function download(name, data, type){ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([data],{type})); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); }
function findItem(id){ return items.find(i=>i.id===id) || state.favorites.find(i=>i.id===id); }
function markRead(id){ if(!state.read.includes(id)){ state.read.push(id); if(state.read.length>3000) state.read=state.read.slice(-2000); save(); } }
function closeDrawer(){ document.body.classList.remove("drawer"); }

/* ================= events ================= */
document.addEventListener("click", e=>{
  const sec=e.target.closest("[data-sec]");
  if(sec){ if(state.section!==sec.dataset.sec){ state.section=sec.dataset.sec; save(); items=[]; lastMeta={}; renderSections(); if(state.view!=="news"){state.view="news"; renderTabs();} renderView(); loadSection(); } closeDrawer(); return; }
  const v=e.target.closest("[data-view]");
  if(v){ state.view=v.dataset.view; save(); renderTabs(); renderView(); window.scrollTo({top:0,behavior:"smooth"}); return; }
  const kw=e.target.closest("[data-kw]");
  if(kw){ state.query=kw.dataset.kw; $("#q").value=state.query; state.view="news"; save(); renderTabs(); renderView(); return; }
  const act=e.target.closest("[data-act]");
  if(act){
    const card=act.closest(".card"); const it=card&&findItem(card.dataset.id); if(!it) return;
    if(act.dataset.act==="open"){ markRead(it.id); card.classList.add("read"); if(act.tagName==="BUTTON") window.open(it.url,"_blank","noopener"); }
    if(act.dataset.act==="copy"){ navigator.clipboard?.writeText(it.url).then(()=>toast(t("copied"))).catch(()=>toast(it.url)); }
    if(act.dataset.act==="fav"){
      const ix=state.favorites.findIndex(f=>f.id===it.id);
      if(ix>=0){ state.favorites.splice(ix,1); toast(t("removed")); } else { state.favorites.push(it); toast("★ "+t("savedT")); }
      save(); renderTabs(); state.view==="saved"?renderSaved():renderNews();
    }
  }
});
$("#refreshBtn").onclick=()=>loadSection(true);
$("#menuBtn").onclick=()=>document.body.classList.add("drawer");
$("#backdrop").onclick=closeDrawer;
$("#themeBtn").onclick=()=>{ state.theme=state.theme==="dark"?"light":"dark"; save(); applyTheme(); };
$("#langSeg").onclick=e=>{ const b=e.target.closest("button"); if(!b) return; state.lang=b.dataset.lang; save(); applyI18n(); setStatus(busy?"load":lastMeta.failed?"err":"ok"); };
let qT; $("#q").oninput=e=>{ clearTimeout(qT); qT=setTimeout(()=>{ state.query=e.target.value; save(); renderNews(); },150); };
$("#sortSel").onchange=e=>{ state.sort=e.target.value; save(); renderNews(); };
$("#unreadChk").onchange=e=>{ state.unread=e.target.checked; save(); renderNews(); };
$("#proxySel").onchange=e=>{ state.proxy=e.target.value; $("#customWrap").style.display=state.proxy==="custom"?"":"none"; save(); };
$("#customProxy").onchange=e=>{ state.customProxy=e.target.value; save(); };
$("#autoSel").onchange=e=>{ state.autoRefresh=+e.target.value; save(); setupAuto(); };
$("#demoBtn").onclick=()=>{ state.demo=!state.demo; save(); $("#demoBtn").classList.toggle("primary",state.demo); items=[]; loadSection(true); };
$("#clearBtn").onclick=()=>{ if(!confirm(t("confirmClear"))) return; localStorage.removeItem(LS_KEY); state=load(); init(); toast(t("cleared")); };
$("#expJson").onclick=()=>{ if(!items.length) return toast(t("noExport")); download(`ukrnet-${state.section}-${Date.now()}.json`, JSON.stringify({section:state.section,meta:lastMeta,items},null,2),"application/json"); toast(t("exported")); };
$("#expCsv").onclick=()=>{ if(!items.length) return toast(t("noExport"));
  const q=s=>`"${String(s??"").replace(/"/g,'""')}"`;
  const csv="\ufefftime,source,title,url,count\n"+items.map(i=>[i.time?new Date(i.time).toISOString():"",i.source,i.title,i.url,i.count].map(q).join(",")).join("\n");
  download(`ukrnet-${state.section}-${Date.now()}.csv`, csv, "text/csv"); toast(t("exported")); };
document.addEventListener("keydown", e=>{
  if(e.target.matches("input,select,textarea")) { if(e.key==="Escape") e.target.blur(); return; }
  if(e.key==="/"){ e.preventDefault(); if(state.view!=="news"){state.view="news";renderTabs();renderView();} $("#q").focus(); }
  if(e.key==="r") loadSection(true);
  if(e.key==="Escape") closeDrawer();
});
// swipe to close drawer
let sx=null; $("#sidebar").addEventListener("touchstart",e=>sx=e.touches[0].clientX,{passive:true});
$("#sidebar").addEventListener("touchend",e=>{ if(sx!==null && sx-e.changedTouches[0].clientX>60) closeDrawer(); sx=null; });
matchMedia("(orientation: portrait)").addEventListener?.("change", ()=>{ closeDrawer(); if(state.view==="analytics") renderAnalytics(); });
// refresh relative times every minute
setInterval(()=>{ if(state.view==="news" && items.length) renderNews(); }, 60000);

/* ================= init ================= */
function init(){
  applyTheme();
  $("#q").value=state.query; $("#unreadChk").checked=state.unread;
  $("#proxySel").value=state.proxy; $("#customProxy").value=state.customProxy;
  $("#customWrap").style.display=state.proxy==="custom"?"":"none";
  $("#demoBtn").classList.toggle("primary",state.demo);
  items=[]; lastMeta={};
  applyI18n(); setupAuto(); loadSection();
}
init();
</script>
</body>
</html>
