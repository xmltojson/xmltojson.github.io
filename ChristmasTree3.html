<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#091a23">

    <title>Frohe Weihnachten!</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #09151e;
            --panel: #112630;
            --text: #f5f3e9;
            --muted: #b4c7ce;
            --gold: #efd29b;
            --border: rgba(219, 231, 223, .17);
        }

        * { box-sizing: border-box; }
        html { min-height: 100%; }

        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: var(--text);
            background:
                radial-gradient(ellipse at 50% 0%, #22434b 0%, transparent 65%),
                var(--bg);
        }

        body.settings-open { overflow: hidden; }

        button, select, input { font: inherit; }
        button, select { -webkit-tap-highlight-color: transparent; }

        button, select {
            min-height: 44px;
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            background: #19323c;
        }

        button {
            padding: 10px 15px;
            cursor: pointer;
            transition: background .2s, border-color .2s, transform .2s;
        }

        button:hover:not(:disabled) {
            background: #244650;
            border-color: #9badab;
            transform: translateY(-1px);
        }

        button:active:not(:disabled) { transform: translateY(0); }

        button[aria-pressed="true"] {
            background: #30453c;
            border-color: #a68d5c;
            color: #ffe7b8;
        }

        button:disabled { opacity: .5; cursor: not-allowed; }

        :focus-visible {
            outline: 3px solid var(--gold);
            outline-offset: 3px;
        }

        select { padding: 8px 30px 8px 12px; cursor: pointer; }
        option { color: var(--text); background: var(--panel); }
        input { accent-color: var(--gold); }

        input[type="range"] {
            width: 150px;
            max-width: 60%;
            min-width: 0;
            min-height: 32px;
            cursor: pointer;
        }

        .app {
            width: min(1440px, 100%);
            min-height: 100vh;
            min-height: 100dvh;
            margin: auto;
            padding: clamp(12px, 1.5vw, 22px);
            display: grid;
            grid-template-rows: auto auto minmax(0, 1fr);
            gap: 14px;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            min-width: 0;
        }

        .brand {
            color: var(--gold);
            font-size: .76rem;
            font-weight: 650;
            letter-spacing: .17em;
            text-transform: uppercase;
            line-height: 1.5;
        }

        .topbar-actions {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 8px;
            flex-shrink: 0;
        }

        .settings-trigger, .resume-trigger {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            font-size: .86rem;
            background: #19323cbb;
        }

        .settings-trigger svg {
            width: 19px;
            height: 19px;
            flex-shrink: 0;
        }

        .resume-trigger {
            color: var(--gold);
            border-color: #a68d5c88;
        }

        [hidden] { display: none !important; }

        header { text-align: center; }

        h1 {
            margin: 0 0 6px;
            color: #f7ead1;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(2rem, 3.8vw, 3.5rem);
            font-weight: 400;
            line-height: 1.12;
            letter-spacing: -.035em;
            text-shadow: 0 3px 24px #d7b97322;
        }

        header p {
            margin: 0;
            color: var(--muted);
            line-height: 1.5;
            font-size: .93rem;
        }

        .scene {
            width: min(100%, 1100px);
            margin: 0 auto;
            position: relative;
            overflow: hidden;
            min-width: 0;
            min-height: 0;
            border-radius: 24px;
            border: 1px solid var(--border);
            background: radial-gradient(ellipse at center, #19333e, #0c1c29 75%);
            box-shadow: 0 20px 55px #0004;
            display: grid;
            grid-template-rows: minmax(0, 1fr) auto;
        }

        .canvas-wrap {
            position: relative;
            min-width: 0;
            min-height: 0;
            aspect-ratio: 900 / 820;
        }

        #treeCanvas {
            position: absolute;
            inset: 0;
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        figcaption {
            padding: 12px 16px;
            background: #10232d;
            color: #d3e0e2;
            text-align: center;
            font-size: .84rem;
            line-height: 1.5;
            border-top: 1px solid var(--border);
        }

        .settings-dialog {
            width: min(780px, calc(100% - 32px));
            max-height: calc(100vh - 32px);
            max-height: calc(100dvh - 32px);
            margin: auto;
            padding: 0;
            overflow: auto;
            overscroll-behavior: contain;
            border: 1px solid #66817b66;
            border-radius: 24px;
            color: var(--text);
            background:
                radial-gradient(ellipse at 50% 0%, #24434a 0%, transparent 70%),
                #10232d;
            box-shadow: 0 32px 100px #0009;
        }

        .settings-dialog::backdrop {
            background: #030b12bb;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .dialog-header {
            position: sticky;
            top: 0;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            background: #142c35;
        }

        .dialog-title {
            margin: 0;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 1.55rem;
            font-weight: 400;
            color: #f7ead1;
            letter-spacing: 0;
            text-transform: none;
        }

        .close-button {
            display: grid;
            place-items: center;
            width: 44px;
            height: 44px;
            padding: 0;
            flex-shrink: 0;
            font-size: 1.7rem;
            line-height: 1;
            background: #ffffff08;
        }

        .dialog-body { padding: 18px 20px 20px; }

        .language-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 16px;
            padding: 0 2px;
        }

        .language-row label {
            color: var(--gold);
            font-size: .86rem;
            font-weight: 600;
        }

        .language-row select {
            width: min(240px, 65%);
            min-width: 0;
        }

        .settings-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            align-items: stretch;
            gap: 16px;
        }

        .panel {
            min-width: 0;
            padding: 18px;
            border-radius: 18px;
            border: 1px solid var(--border);
            background: linear-gradient(145deg, #18323be8, #10232ded);
        }

        .scene-panel { display: flex; flex-direction: column; }

        h2, h3 {
            margin: 0 0 14px;
            font-size: .8rem;
            line-height: 1.4;
            letter-spacing: .1em;
            text-transform: uppercase;
            color: var(--gold);
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 9px;
        }

        .controls button {
            min-width: 0;
            padding: 10px 6px;
            font-size: .83rem;
            overflow-wrap: anywhere;
        }

        .controls .wide { grid-column: 1 / -1; }

        .small {
            font-size: .78rem;
            color: var(--muted);
            line-height: 1.5;
        }

        .panel > .small:last-child { margin-bottom: 0; }
        .count { margin: 12px 0 0; text-align: center; }

        .check {
            display: flex;
            gap: 9px;
            align-items: center;
            min-height: 44px;
            font-size: .83rem;
            line-height: 1.4;
            color: #d0dcde;
            cursor: pointer;
        }

        .check input {
            width: 17px;
            height: 17px;
            margin: 0;
            flex-shrink: 0;
        }

        .motion { margin-top: 8px; }

        .scene-panel .hint {
            margin-top: auto;
            padding-top: 16px;
        }

        #musicBtn {
            width: 100%;
            margin-bottom: 12px;
            padding-inline: 8px;
            font-size: .86rem;
        }

        .songs { display: grid; gap: 7px; }

        .song-btn {
            min-width: 0;
            min-height: 40px;
            text-align: left;
            font-size: .8rem;
            line-height: 1.35;
            padding: 8px 10px;
            background: #ffffff05;
            overflow-wrap: anywhere;
        }

        .volume {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-top: 10px;
            font-size: .8rem;
            color: var(--muted);
        }

        .playing {
            margin: 10px 0 0;
            min-height: 3em;
            font-size: .76rem;
            color: var(--gold);
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .visualizer {
            height: 20px;
            display: flex;
            justify-content: center;
            align-items: end;
            gap: 4px;
            margin-top: 6px;
            opacity: .35;
        }

        .visualizer.active { opacity: 1; }

        .visualizer span {
            width: 5px;
            height: 3px;
            border-radius: 3px;
            background: linear-gradient(#ffe3a8, #7baf9a);
        }

        .storage-note {
            margin: 12px 2px 0;
            color: #efd29b;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        noscript p {
            padding: 20px;
            color: #fff;
            background: #653b2c;
            text-align: center;
        }

        @media (min-width: 761px) and (min-height: 480px) {
            .app {
                height: 100vh;
                height: 100dvh;
                gap: clamp(8px, 1.5vh, 16px);
            }
            .canvas-wrap { aspect-ratio: auto; }
        }

        @media (min-width: 761px) and (max-height: 800px) {
            .app { padding: 12px 16px; gap: 10px; }
            h1 { font-size: clamp(2rem, 3vw, 2.7rem); }
            header p { font-size: .85rem; }
            figcaption { padding: 10px 14px; }
        }

        @media (min-width: 601px) and (max-height: 800px) {
            .dialog-header { padding: 12px 16px; }
            .dialog-body { padding: 14px 16px 16px; }
            .language-row { margin-bottom: 12px; }
            .settings-grid { gap: 12px; }
            .panel { padding: 14px; }
            h3 { margin-bottom: 10px; letter-spacing: .06em; }
            .songs {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 6px;
            }
            .song-btn { padding: 7px; font-size: .76rem; }
            .song-btn:last-child { grid-column: 1 / -1; }
            #musicBtn { margin-bottom: 9px; }
            .volume { margin-top: 7px; }
            .playing { margin-top: 7px; min-height: 0; }
            .visualizer, .audio-note { display: none; }
        }

        @media (max-width: 760px) {
            .app {
                max-width: 700px;
                min-height: 0;
                padding: 14px 12px 20px;
            }
            .brand { font-size: .65rem; letter-spacing: .09em; }
            .canvas-wrap { max-height: 68vh; max-height: 68dvh; }
        }

        @media (max-width: 600px) {
            .settings-dialog {
                width: calc(100% - 20px);
                max-height: calc(100vh - 20px);
                max-height: calc(100dvh - 20px);
                border-radius: 20px;
            }
            .dialog-header { padding: 12px 14px; }
            .dialog-body { padding: 14px; }
            .settings-grid { grid-template-columns: 1fr; gap: 12px; }
            .panel { padding: 16px; }
            .songs { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .song-btn:last-child { grid-column: 1 / -1; }
            .scene-panel .hint { margin-top: 8px; padding-top: 0; }
        }

        @media (max-width: 480px) {
            .topbar { gap: 10px; }
            .brand { max-width: 58%; }
            .settings-trigger, .resume-trigger { width: 44px; padding: 0; }
            .topbar-actions .button-label { display: none; }
            .scene { border-radius: 18px; }
            header p { font-size: .84rem; }
            figcaption { font-size: .79rem; padding: 10px 12px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                scroll-behavior: auto !important;
                transition: none !important;
            }
        }
    </style>
</head>

<main class="app">
    <div class="topbar">
        <div class="brand" data-i18n="brand">Ein wenig Weihnachtszauber</div>
        <div class="topbar-actions">
            <button id="resumeMusicBtn" class="resume-trigger" type="button"
                    aria-label="Musik fortsetzen" hidden>
                <span aria-hidden="true">♫</span>
                <span class="button-label" data-i18n="resume">Musik fortsetzen</span>
            </button>
            <button id="settingsBtn" class="settings-trigger" type="button"
                    aria-haspopup="dialog" aria-controls="settingsDialog"
                    aria-label="Einstellungen öffnen">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="1.7" stroke-linecap="round"
                     aria-hidden="true">
                    <path d="M4 7h16M4 17h16"/>
                    <circle cx="9" cy="7" r="3" fill="#19323c"/>
                    <circle cx="15" cy="17" r="3" fill="#19323c"/>
                </svg>
                <span class="button-label" data-i18n="settings">Einstellungen</span>
            </button>
        </div>
    </div>

    <header>
        <h1 data-i18n="title">Frohe Weihnachten!</h1>
        <p data-i18n="subtitle">Ein stiller Winterabend, ein wenig Licht und ein kleiner Zauber.</p>
    </header>

    <figure class="scene">
        <div class="canvas-wrap" id="canvasWrap">
            <canvas id="treeCanvas" width="900" height="820" role="img"
                    aria-label="Ein geschmückter Weihnachtsbaum im verschneiten Wald bei Mondschein, mit goldenen Lichtern, glänzenden Kugeln und Geschenken.">
                Ein geschmückter Weihnachtsbaum im verschneiten Wald bei Mondschein.
            </canvas>
        </div>
        <figcaption data-i18n="wish">Möge dein Zuhause voller Wärme, Frieden und Freude sein. ✨</figcaption>
    </figure>
</main>

<dialog id="settingsDialog" class="settings-dialog" aria-labelledby="settingsTitle">
    <div class="dialog-header">
        <h2 id="settingsTitle" class="dialog-title" data-i18n="settings">Einstellungen</h2>
        <button id="closeSettingsBtn" class="close-button" type="button"
                aria-label="Einstellungen schließen" autofocus>
            <span aria-hidden="true">×</span>
        </button>
    </div>

    <div class="dialog-body">
        <div class="language-row">
            <label for="language" data-i18n="language">Sprache</label>
            <select id="language">
                <option value="de" lang="de" selected>Deutsch</option>
                <option value="uk" lang="uk">Українська</option>
                <option value="en" lang="en">English</option>
            </select>
        </div>

        <div class="settings-grid">
            <section class="panel scene-panel" aria-labelledby="sceneHeading">
                <h3 id="sceneHeading" data-i18n="sceneHeading">Dein Weihnachtsbaum</h3>
                <div class="controls">
                    <button id="snowBtn" type="button" aria-pressed="true">
                        ❄ <span data-i18n="snow">Schneefall</span>
                    </button>
                    <button id="lightsBtn" type="button" aria-pressed="true">
                        ✦ <span data-i18n="lights">Lichterkette</span>
                    </button>
                    <button id="addBtn" type="button" class="wide">
                        🎁 <span data-i18n="add">Eine Kugel hinzufügen</span>
                    </button>
                    <button id="resetBtn" type="button" class="wide" data-i18n="reset">
                        Schmuck zurücksetzen
                    </button>
                </div>
                <p class="small count" id="ornamentCount"></p>
                <label class="check motion">
                    <input id="motion" type="checkbox">
                    <span data-i18n="motion">Sanfte Animation</span>
                </label>
                <p class="small hint" data-i18n="hint">Schmücke deinen Baum und wähle eine Weihnachtsmelodie.</p>
            </section>

            <section class="panel music-panel" aria-labelledby="musicHeading">
                <h3 id="musicHeading" data-i18n="musicHeading">Weihnachtsmelodien</h3>
                <button id="musicBtn" type="button" aria-pressed="false">♫ Musik abspielen</button>
                <div class="songs" id="songSelector" role="group" aria-label="Eine Melodie auswählen"></div>

                <label class="volume">
                    <span data-i18n="volume">Lautstärke</span>
                    <input id="volume" type="range" min="0" max="100" value="35" aria-label="Lautstärke">
                </label>
                <label class="check">
                    <input id="autoplay" type="checkbox" checked>
                    <span data-i18n="autoplay">Alle Melodien abspielen</span>
                </label>

                <div class="visualizer" id="visualizer" aria-hidden="true"></div>
                <p class="playing" id="nowPlaying" role="status" aria-live="polite"></p>
                <p class="small audio-note" data-i18n="audioNote">Sanfte Instrumentalarrangements, direkt im Browser erzeugt.</p>
            </section>
        </div>

        <p id="storageNote" class="small storage-note" role="status" hidden></p>
        <p id="announcement" class="sr-only" role="status" aria-live="polite"></p>
    </div>
</dialog>

<noscript>
    <p>Bitte JavaScript aktivieren. / Увімкніть JavaScript, щоб побачити інтерактивну ялинку. / Enable JavaScript to view the interactive tree.</p>
</noscript>

    let storageAvailable = true;

    function loadState() {
        try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (raw) {
                const parsed = JSON.parse(raw);
                if (parsed && typeof parsed === "object" && parsed.version === 1) {
                    return parsed;
                }
            }
        } catch {
            // Invalid JSON is ignored; storage access is tested when saving.
        }

        // Migrate language and volume from the previous page version.
        try {
            const oldLanguage = localStorage.getItem("winter-tree-language");
            const oldVolume = localStorage.getItem("winter-tree-volume");
            return {
                language: oldLanguage,
                volume: oldVolume === null ? 35 : Number(oldVolume)
            };
        } catch {
            storageAvailable = false;
            return {};
        }
    }

    const saved = loadState();
    const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");
    const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
    const savedBoolean = (value, fallback) =>
        typeof value === "boolean" ? value : fallback;

    let language = Object.prototype.hasOwnProperty.call(translations, saved.language)
        ? saved.language : "de";
    let text = translations[language];

    let motionPreference = typeof saved.motion === "boolean" ? saved.motion : null;
    let motionEnabled = motionPreference === null
        ? !reducedMotion.matches : motionPreference;
    let snowEnabled = savedBoolean(saved.snow, true);
    let lightsEnabled = savedBoolean(saved.lights, true);
    let playAll = savedBoolean(saved.playAll, true);
    let volume = Number.isFinite(saved.volume) ? clamp(saved.volume, 0, 100) : 35;
    let currentSong = Number.isInteger(saved.currentSong)
        ? clamp(saved.currentSong, 0, 4) : 0;

    // User intent is separate from actual playback. Browser autoplay rules
    // must not overwrite the saved intention to resume music.
    let musicWanted = savedBoolean(saved.musicWanted, false);
    let musicPlaying = false;
    let audioFailed = false;
    let audioBusy = false;
    let extraCount = 0;
    let pageActive = !document.hidden;

    const settingsDialog = $("settingsDialog");

    function openSettings() {
        if (settingsDialog.open) return;
        settingsDialog.showModal();
        document.body.classList.add("settings-open");
        settingsDialog.scrollTop = 0;
        refresh();
    }

    function closeSettings() {
        if (settingsDialog.open) settingsDialog.close();
    }

    $("settingsBtn").addEventListener("click", openSettings);
    $("closeSettingsBtn").addEventListener("click", closeSettings);

    settingsDialog.addEventListener("close", () => {
        document.body.classList.remove("settings-open");
        $("settingsBtn").focus({preventScroll: true});
        refresh();
    });

    let pointerStartedOnBackdrop = false;

    function isBackdropPointer(event) {
        if (event.target !== settingsDialog) return false;
        const rect = settingsDialog.getBoundingClientRect();
        return event.clientX < rect.left ||
            event.clientX > rect.right ||
            event.clientY < rect.top ||
            event.clientY > rect.bottom;
    }

    settingsDialog.addEventListener("pointerdown", event => {
        pointerStartedOnBackdrop = isBackdropPointer(event);
    });

    settingsDialog.addEventListener("click", event => {
        if (pointerStartedOnBackdrop && isBackdropPointer(event)) closeSettings();
        pointerStartedOnBackdrop = false;
    });

    function updateStorageNotice() {
        $("storageNote").hidden = storageAvailable;
        $("storageNote").textContent = storageAvailable ? "" : text.storageError;
    }

    function updateUI() {
        text = translations[language];
        document.documentElement.lang = language;
        document.title = text.title;
        $("language").value = language;

        document.querySelectorAll("[data-i18n]").forEach(el => {
            el.textContent = text[el.dataset.i18n];
        });

        $("settingsBtn").setAttribute("aria-label", text.openSettings);
        $("closeSettingsBtn").setAttribute("aria-label", text.closeSettings);
        $("resumeMusicBtn").setAttribute("aria-label", text.resume);
        $("resumeMusicBtn").title = text.resumeNote;
        $("resumeMusicBtn").hidden = !musicWanted || musicPlaying || audioFailed;
        $("resumeMusicBtn").disabled = audioBusy;

        $("volume").setAttribute("aria-label", text.volume);
        $("volume").value = volume;
        $("autoplay").checked = playAll;
        $("songSelector").setAttribute("aria-label", text.choose);
        $("treeCanvas").setAttribute("aria-label", text.scene);
        $("treeCanvas").textContent = text.scene;
        $("snowBtn").setAttribute("aria-pressed", String(snowEnabled));
        $("lightsBtn").setAttribute("aria-pressed", String(lightsEnabled));

        $("musicBtn").setAttribute("aria-pressed", String(musicPlaying));
        $("musicBtn").textContent = musicPlaying
            ? text.stop
            : musicWanted || playback.index > 0 || playback.offset > 0
                ? "♫ " + text.resume
                : text.play;
        $("musicBtn").disabled = audioBusy;
        $("motion").checked = motionEnabled;
        $("addBtn").disabled = extraCount >= MAX_EXTRA;

        $("ornamentCount").textContent = text.count.replace(
            "{n}", new Intl.NumberFormat(language).format(ornaments.length)
        );

        [...$("songSelector").children].forEach((button, index) => {
            button.textContent = ["🔔 ", "🌲 ", "🌙 ", "❄ ", "🎄 "][index] +
                text.songs[index];
            button.setAttribute("aria-pressed", String(index === currentSong));
        });

        const songName = text.songs[currentSong];
        $("nowPlaying").textContent = audioFailed
            ? text.error
            : musicPlaying
                ? text.playing + songName
                : musicWanted
                    ? text.paused + songName + ". " + text.resumeNote
                    : text.ready + songName;

        $("visualizer").classList.toggle("active", musicPlaying);
        updateStorageNotice();
    }

    // Deterministic artwork.
    function seededRandom(seed) {
        return () => {
            seed |= 0;
            seed = seed + 0x6D2B79F5 | 0;
            let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
            t ^= t + Math.imul(t ^ t >>> 7, 61 | t);
            return ((t ^ t >>> 14) >>> 0) / 4294967296;
        };
    }

    function ellipse(g, x, y, rx, ry, color, rotation = 0) {
        g.fillStyle = color;
        g.beginPath();
        g.ellipse(x, y, rx, ry, rotation, 0, TAU);
        g.fill();
    }

    function line(g, x1, y1, x2, y2, color, width = 1) {
        g.strokeStyle = color;
        g.lineWidth = width;
        g.beginPath();
        g.moveTo(x1, y1);
        g.lineTo(x2, y2);
        g.stroke();
    }

    function glow(g, x, y, radius, color) {
        const gradient = g.createRadialGradient(x, y, 0, x, y, radius);
        gradient.addColorStop(0, color);
        gradient.addColorStop(1, "rgba(255,210,130,0)");
        ellipse(g, x, y, radius, radius, gradient);
    }

    function halfWidth(y) {
        return Math.max(0, (y - TOP) / (BOTTOM - TOP)) * 245;
    }

    const canvas = $("treeCanvas");
    const ctx = canvas.getContext("2d");
    const background = document.createElement("canvas");
    const decorations = document.createElement("canvas");
    const bg = background.getContext("2d");
    const dg = decorations.getContext("2d");

    let scale = 1;
    let frameId = 0;
    let previousFrame = 0;
    let sceneTime = 0;

    function drawDistantPine(g, x, y, size, color, rand) {
        g.fillStyle = color;
        g.beginPath();
        g.moveTo(x, y - size);

        for (let i = 1; i <= 11; i++) {
            const t = i / 11;
            const width = size * .27 * t;
            g.lineTo(x + width, y - size + size * t);
            g.lineTo(x + width * .64, y - size + size * t - size * .025);
        }

        g.lineTo(x + size * .025, y);
        g.lineTo(x - size * .025, y);

        for (let i = 11; i >= 1; i--) {
            const t = i / 11;
            const width = size * .27 * t * (.93 + rand() * .1);
            g.lineTo(x - width, y - size + size * t);
            g.lineTo(x - width * .62, y - size + size * t - size * .025);
        }

        g.closePath();
        g.fill();
    }

    function sprig(g, x1, y1, x2, y2, light, rand) {
        const dx = x2 - x1, dy = y2 - y1;
        const length = Math.hypot(dx, dy);
        if (length < 1) return;

        const ux = dx / length, uy = dy / length;
        line(g, x1, y1, x2, y2, "#274435", 1.2);

        for (let i = 0; i < 15; i++) {
            const t = i / 15;
            const x = x1 + dx * t, y = y1 + dy * t;
            const n = (5 + rand() * 8) * (1 - t * .5);

            for (const side of [-1, 1]) {
                const green = Math.floor(55 + light * 38 + rand() * 27);
                const color = `rgb(${Math.floor(green * .38)},${green},${Math.floor(green * .75)})`;
                line(g, x, y,
                    x + ux * n * .65 - uy * n * side,
                    y + uy * n * .65 + ux * n * side,
                    color, .7 + rand() * .55);
            }
        }
    }

    function drawFoliage(g, rand) {
        const trunk = g.createLinearGradient(CX - 17, 0, CX + 17, 0);
        trunk.addColorStop(0, "#30251f");
        trunk.addColorStop(.4, "#776044");
        trunk.addColorStop(1, "#271e1a");
        g.fillStyle = trunk;
        g.fillRect(CX - 16, 596, 32, 139);

        for (let i = 0; i < 9; i++) {
            const x = CX - 14 + rand() * 28;
            line(g, x, 606, x + rand() * 4, 733, "#251e1a88", 1);
        }

        const core = g.createLinearGradient(210, 200, 680, 630);
        core.addColorStop(0, "#244c40");
        core.addColorStop(.42, "#12382c");
        core.addColorStop(1, "#071c18");
        g.fillStyle = core;
        g.beginPath();
        g.moveTo(CX, TOP);

        for (let i = 1; i <= 35; i++) {
            const y = TOP + i / 35 * (BOTTOM - TOP);
            g.lineTo(CX + halfWidth(y) * (i % 2 ? .94 : .82), y);
        }

        g.quadraticCurveTo(CX, 723, CX - 235, BOTTOM);

        for (let i = 35; i >= 1; i--) {
            const y = TOP + i / 35 * (BOTTOM - TOP);
            g.lineTo(CX - halfWidth(y) * (i % 2 ? .95 : .83), y);
        }

        g.closePath();
        g.fill();

        for (let tier = 29; tier >= 0; tier--) {
            const t = tier / 29;
            const y = TOP + 8 + t * 513;
            const width = 8 + t * 237;

            for (let b = 0; b < 7; b++) {
                const side = b % 2 ? -1 : 1;
                const reach = b < 2 ? .98 : .3 + rand() * .66;
                const x1 = CX + (rand() - .5) * width * .2;
                const y1 = y + (rand() - .5) * 14;
                const x2 = CX + side * width * reach;
                const y2 = y1 + 13 + t * 24 + rand() * 12;

                line(g, x1, y1, x2, y2, "#112d23", 3.8);

                for (let j = 0; j <= 11; j++) {
                    const u = j / 11;
                    const x = x1 + (x2 - x1) * u;
                    const yy = y1 + (y2 - y1) * u;
                    const twig = (12 + t * 20) * (1 - u * .36);
                    const light = side < 0 ? .95 : .35;

                    sprig(g, x, yy,
                        x + side * twig * (.5 + rand() * .6),
                        yy - twig * (.35 + rand() * .5),
                        light, rand);

                    sprig(g, x, yy,
                        x + side * twig * .65,
                        yy + twig * (.18 + rand() * .4),
                        light * .65, rand);
                }

                if (b < 3 && tier % 3 === 0 && tier > 2) {
                    for (let s = 0; s < 7; s++) {
                        const u = .35 + s * .075;
                        const x = x1 + (x2 - x1) * u;
                        const yy = y1 + (y2 - y1) * u - 6;

                        ellipse(g, x, yy, 5 + rand() * 8, 1.5 + rand() * 2,
                            "rgba(204,222,222,.66)", side * .14);
                        ellipse(g, x - 1, yy - 1, 4 + rand() * 5, 1.1,
                            "rgba(246,250,242,.64)", side * .14);
                    }
                }
            }
        }

        sprig(g, CX, TOP + 30, CX, TOP - 10, 1, rand);
    }

    function drawGift(g, x, y, w, h, front, side, ribbon) {
        const depth = w * .2;
        ellipse(g, x + w / 2, y + h + 6, w * .75, 12, "#142a3645");

        g.fillStyle = side;
        g.beginPath();
        g.moveTo(x + w, y);
        g.lineTo(x + w + depth, y - depth * .55);
        g.lineTo(x + w + depth, y + h - depth * .55);
        g.lineTo(x + w, y + h);
        g.closePath();
        g.fill();

        const frontGradient = g.createLinearGradient(x, y, x + w, y + h);
        frontGradient.addColorStop(0, front);
        frontGradient.addColorStop(1, side);
        g.fillStyle = frontGradient;
        g.fillRect(x, y, w, h);

        g.fillStyle = front;
        g.beginPath();
        g.moveTo(x, y);
        g.lineTo(x + depth, y - depth * .55);
        g.lineTo(x + w + depth, y - depth * .55);
        g.lineTo(x + w, y);
        g.closePath();
        g.fill();

        g.fillStyle = ribbon;
        g.fillRect(x + w * .43, y, w * .13, h);
        g.fillRect(x, y + h * .37, w, h * .12);
        line(g, x, y + 2, x + w, y + 2, "#ffffff40", 2);

        g.strokeStyle = ribbon;
        g.lineWidth = 3;

        for (const direction of [-1, 1]) {
            g.beginPath();
            g.ellipse(x + w * .5 + direction * 10, y - 6, 12, 5,
                direction * -.45, 0, TAU);
            g.stroke();
        }

        ellipse(g, x + w * .5, y - 2, 4, 3, ribbon);
    }

    function drawBackground() {
        const g = bg;
        const rand = seededRandom(20251225);
        g.setTransform(scale, 0, 0, scale, 0, 0);
        g.clearRect(0, 0, W, H);

        const sky = g.createLinearGradient(0, 0, 0, H);
        sky.addColorStop(0, "#081724");
        sky.addColorStop(.55, "#264557");
        sky.addColorStop(1, "#7c99a7");
        g.fillStyle = sky;
        g.fillRect(0, 0, W, H);

        const haze = g.createRadialGradient(710, 130, 5, 710, 130, 270);
        haze.addColorStop(0, "#b7d6db2c");
        haze.addColorStop(1, "#b7d6db00");
        g.fillStyle = haze;
        g.fillRect(0, 0, W, H);

        for (let i = 0; i < 110; i++) {
            const x = rand() * W, y = rand() * 450;
            ellipse(g, x, y, .4 + rand() * 1.1, .4 + rand() * 1.1,
                `rgba(227,239,239,${.15 + rand() * .55})`);
        }

        const moon = g.createRadialGradient(701, 112, 2, 711, 128, 36);
        moon.addColorStop(0, "#fffce8");
        moon.addColorStop(.85, "#d6e0d8");
        moon.addColorStop(1, "#aac2c5");
        ellipse(g, 710, 127, 35, 35, moon);

        for (let i = 0; i < 16; i++) {
            const a = rand() * TAU, r = rand() * 25;
            ellipse(g, 710 + Math.cos(a) * r, 127 + Math.sin(a) * r,
                2 + rand() * 4, 1 + rand() * 3, "#728b9218");
        }

        for (let layer = 0; layer < 3; layer++) {
            for (let i = 0; i < 19; i++) {
                const x = i * 54 - 30 + rand() * 25;
                const y = 590 + layer * 32 + rand() * 15;
                const size = 105 + rand() * 130 + layer * 35;
                drawDistantPine(g, x, y, size,
                    ["#355362", "#244552", "#183641"][layer], rand);
            }
        }

        const snow = g.createLinearGradient(0, 585, 0, H);
        snow.addColorStop(0, "#849eaa");
        snow.addColorStop(.48, "#c0d0d7");
        snow.addColorStop(1, "#e0e9e8");
        g.fillStyle = snow;
        g.beginPath();
        g.moveTo(0, 631);
        g.bezierCurveTo(200, 583, 330, 672, 525, 619);
        g.bezierCurveTo(720, 576, 810, 630, 900, 612);
        g.lineTo(W, H);
        g.lineTo(0, H);
        g.closePath();
        g.fill();

        g.strokeStyle = "#f4f7ef35";
        g.lineWidth = 2;
        g.beginPath();
        g.moveTo(0, 700);
        g.bezierCurveTo(300, 635, 500, 765, 900, 685);
        g.stroke();

        for (let i = 0; i < 2300; i++) {
            const x = rand() * W, y = 646 + rand() * 174;
            ellipse(g, x, y, .3 + rand() * .9, .3,
                rand() > .5 ? "#ffffff36" : "#45647320");
        }

        const shadow = g.createRadialGradient(CX, 724, 8, CX, 724, 260);
        shadow.addColorStop(0, "#122c3b90");
        shadow.addColorStop(.5, "#243e4d45");
        shadow.addColorStop(1, "#243e4d00");

        g.save();
        g.translate(CX, 728);
        g.scale(1, .21);
        g.translate(-CX, -724);
        ellipse(g, CX, 724, 270, 270, shadow);
        g.restore();

        drawFoliage(g, rand);
        ellipse(g, CX, 737, 36, 7, "#d3deda");

        drawGift(g, 312, 718, 72, 53, "#a44242", "#61252e", "#dac18b");
        drawGift(g, 501, 727, 82, 48, "#c6ae7e", "#857453", "#853b3e");
        drawGift(g, 580, 713, 46, 54, "#3e6b6e", "#24474c", "#e0ce9d");
        drawGift(g, 386, 753, 50, 31, "#637a8e", "#3c526b", "#d9e0d9");

        const vignette = g.createRadialGradient(450, 425, 250, 450, 425, 620);
        vignette.addColorStop(0, "#030d1500");
        vignette.addColorStop(1, "#030d1566");
        g.fillStyle = vignette;
        g.fillRect(0, 0, W, H);
    }

    const palette = [
        ["#ffe0ba", "#bf303e", "#450c1e"],
        ["#fff8c9", "#d7a545", "#705023"],
        ["#ffffff", "#b3c4cb", "#4c6573"],
        ["#d3f2ed", "#397f84", "#103f47"],
        ["#f4c3b8", "#9c3647", "#390f22"]
    ];

    let ornaments = [];

    function makeOrnament(rand, index) {
        const y = 236 + rand() * 427;
        return {
            x: CX + (rand() * 2 - 1) * halfWidth(y) * .81,
            y,
            r: 7 + rand() * 5,
            color: index % palette.length
        };
    }

    function resetOrnaments() {
        const rand = seededRandom(7415);
        ornaments = [];

        for (let i = 0; i < BASE_ORNAMENTS; i++) {
            let ornament;

            for (let attempt = 0; attempt < 60; attempt++) {
                ornament = makeOrnament(rand, i);
                if (ornaments.every(o =>
                    Math.hypot(o.x - ornament.x, o.y - ornament.y) >
                    o.r + ornament.r + 9
                )) break;
            }

            ornaments.push(ornament);
        }

        extraCount = 0;
    }

    function restoreOrnaments() {
        resetOrnaments();

        if (!Array.isArray(saved.ornaments) ||
            saved.ornaments.length < BASE_ORNAMENTS ||
            saved.ornaments.length > BASE_ORNAMENTS + MAX_EXTRA) return;

        const valid = saved.ornaments.every(o =>
            o && Number.isFinite(o.x) && Number.isFinite(o.y) &&
            Number.isFinite(o.r) && Number.isInteger(o.color) &&
            o.y >= 236 && o.y <= 663 &&
            Math.abs(o.x - CX) <= halfWidth(o.y) * .82 &&
            o.r >= 7 && o.r <= 12 &&
            o.color >= 0 && o.color < palette.length
        );

        if (valid) {
            ornaments = saved.ornaments.map(({x, y, r, color}) => ({
                x, y, r, color
            }));
            extraCount = ornaments.length - BASE_ORNAMENTS;
        }
    }

    const lights = [];

    for (let i = 0; i < 125; i++) {
        const t = i / 124;
        const y = 186 + t * 489;
        const angle = t * TAU * 5.3;

        lights.push({
            x: CX + Math.sin(angle) * halfWidth(y) * .88,
            y,
            front: Math.cos(angle) > -.2,
            phase: i * 1.71,
            r: 1.4 + (i % 3) * .25
        });
    }

    function drawStar(g) {
        const x = CX, y = 135, outer = 28, inner = 12;
        const points = [];

        for (let i = 0; i < 10; i++) {
            const angle = -Math.PI / 2 + i * Math.PI / 5;
            const r = i % 2 ? inner : outer;
            points.push([x + Math.cos(angle) * r, y + Math.sin(angle) * r]);
        }

        line(g, x, y + 16, x, y + 35, "#aa8a48", 3);

        for (let i = 0; i < 10; i++) {
            g.fillStyle = ["#ffeab0", "#ac7e37", "#e7bd68", "#fff3c2"][i % 4];
            g.beginPath();
            g.moveTo(x, y);
            g.lineTo(...points[i]);
            g.lineTo(...points[(i + 1) % 10]);
            g.closePath();
            g.fill();
        }
    }

    function drawDecorations() {
        const g = dg;
        g.setTransform(scale, 0, 0, scale, 0, 0);
        g.clearRect(0, 0, W, H);

        g.strokeStyle = "#82754b99";
        g.lineWidth = 1.1;
        g.beginPath();

        lights.forEach((l, i) => {
            if (!i) g.moveTo(l.x, l.y);
            else g.lineTo(l.x, l.y);
        });

        g.stroke();

        for (const o of ornaments) {
            const {x, y, r} = o;
            const colors = palette[o.color];

            line(g, x, y - r - 12, x, y - r, "#c8b78599", .8);
            ellipse(g, x + 3, y + 4, r + 2, r + 1, "#00100c77");

            const ball = g.createRadialGradient(
                x - r * .38, y - r * .43, .3, x, y, r
            );
            ball.addColorStop(0, colors[0]);
            ball.addColorStop(.28, colors[1]);
            ball.addColorStop(.73, colors[1]);
            ball.addColorStop(1, colors[2]);
            ellipse(g, x, y, r, r, ball);

            ellipse(g, x - r * .31, y - r * .4,
                r * .23, r * .14, "#ffffffb0", -.5);

            g.strokeStyle = "#d0e9eb65";
            g.lineWidth = .9;
            g.beginPath();
            g.arc(x, y, r * .81, .3, 1.6);
            g.stroke();

            const cap = g.createLinearGradient(x - 3, 0, x + 3, 0);
            cap.addColorStop(0, "#8a733f");
            cap.addColorStop(.5, "#f9e4aa");
            cap.addColorStop(1, "#9f854d");
            g.fillStyle = cap;
            g.fillRect(x - 3, y - r - 3, 6, 4);
        }

        for (const l of lights) {
            ellipse(g, l.x, l.y, l.r, l.r * 1.25, "#c2aa7077");
        }

        drawStar(g);
    }

    const snowRandom = seededRandom(6151);
    const flakes = Array.from({length: 155}, () => ({
        x: snowRandom() * W,
        y: snowRandom() * H,
        r: .7 + snowRandom() * 2.6,
        speed: 13 + snowRandom() * 40,
        drift: snowRandom() * TAU,
        alpha: .25 + snowRandom() * .55
    }));

    const bars = [];

    for (let i = 0; i < 18; i++) {
        const bar = document.createElement("span");
        $("visualizer").appendChild(bar);
        bars.push(bar);
    }

    function render(dt) {
        ctx.setTransform(scale, 0, 0, scale, 0, 0);
        ctx.clearRect(0, 0, W, H);
        ctx.drawImage(background, 0, 0, W, H);
        ctx.drawImage(decorations, 0, 0, W, H);

        if (lightsEnabled) {
            ctx.save();
            ctx.globalCompositeOperation = "screen";
            glow(ctx, CX, 135, 74, "rgba(255,203,98,.28)");
            glow(ctx, CX, 135, 32, "rgba(255,222,146,.32)");

            for (const l of lights) {
                const brightness = l.front ? .85 : .38;
                const shimmer = motionEnabled
                    ? .88 + .12 * Math.sin(sceneTime * 1.3 + l.phase)
                    : 1;

                glow(ctx, l.x, l.y, 15,
                    `rgba(255,189,82,${brightness * shimmer * .3})`);
                glow(ctx, l.x, l.y, 6,
                    `rgba(255,221,142,${brightness * shimmer * .6})`);
                ellipse(ctx, l.x, l.y, l.r, l.r * 1.15,
                    `rgba(255,244,200,${brightness})`);
            }

            ctx.restore();
        }

        if (snowEnabled) {
            for (const f of flakes) {
                if (motionEnabled && dt) {
                    f.y += f.speed * dt;
                    f.x += (7 + Math.sin(sceneTime * .35 + f.drift) * 8) * dt;

                    if (f.y > H + 5) f.y = -5;
                    if (f.x > W + 5) f.x = -5;
                    if (f.x < -5) f.x = W + 5;
                }

                ellipse(ctx, f.x, f.y, f.r, f.r,
                    `rgba(244,249,249,${f.alpha})`);
            }
        }

        if (!settingsDialog.open) return;

        if (musicPlaying && analyser && motionEnabled) {
            analyser.getByteFrequencyData(frequencyData);
            bars.forEach((bar, i) => {
                const value = frequencyData[3 + i * 3] || 0;
                bar.style.height = (3 + value / 255 * 17) + "px";
            });
        } else {
            bars.forEach((bar, i) => {
                bar.style.height = musicPlaying
                    ? (5 + (i % 4) * 3) + "px" : "3px";
            });
        }
    }

    function shouldAnimate() {
        return pageActive && !document.hidden && motionEnabled &&
            (snowEnabled || lightsEnabled || (musicPlaying && settingsDialog.open));
    }

    function frame(timestamp) {
        frameId = 0;
        if (!shouldAnimate()) return;
        if (!previousFrame) previousFrame = timestamp;

        const elapsed = timestamp - previousFrame;

        if (elapsed >= 1000 / 30) {
            const dt = Math.min(elapsed / 1000, .07);
            previousFrame = timestamp;
            sceneTime += dt;
            render(dt);
        }

        frameId = requestAnimationFrame(frame);
    }

    function refresh() {
        render(0);

        if (shouldAnimate() && !frameId) {
            previousFrame = 0;
            frameId = requestAnimationFrame(frame);
        } else if (!shouldAnimate() && frameId) {
            cancelAnimationFrame(frameId);
            frameId = 0;
            previousFrame = 0;
        }
    }

    function resizeCanvas() {
        const bounds = $("canvasWrap").getBoundingClientRect();
        if (bounds.width <= 0 || bounds.height <= 0) return;

        const fittedWidth = Math.min(bounds.width, bounds.height * W / H);
        const nextScale = Math.max(
            .5,
            Math.min(2, window.devicePixelRatio || 1) * fittedWidth / W
        );
        const pixelsW = Math.round(W * nextScale);
        const pixelsH = Math.round(H * nextScale);

        if (
            canvas.width === pixelsW &&
            canvas.height === pixelsH &&
            background.width === pixelsW
        ) return;

        scale = nextScale;

        for (const c of [canvas, background, decorations]) {
            c.width = pixelsW;
            c.height = pixelsH;
        }

        drawBackground();
        drawDecorations();
        refresh();
    }

    // Public-domain carol melodies. Numbers after ":" are beat lengths.
    const songs = [
        {
            bpm: 145,
            notes: "E4 E4 E4:2 E4 E4 E4:2 E4 G4 C4 D4 E4:4 F4 F4 F4 F4 F4 E4 E4 E4:.5 E4:.5 E4 D4 D4 E4 D4:2 G4:2 E4 E4 E4:2 E4 E4 E4:2 E4 G4 C4 D4 E4:4 F4 F4 F4 F4 F4 E4 E4 E4:.5 E4:.5 G4 G4 F4 D4 C4:4"
        },
        {
            bpm: 112,
            notes: "C4 F4 F4 F4:1.5 G4:.5 A4 A4:1.5 A4:.5 G4 A4 Bb4 E4 G4 F4:2 C4 F4 F4 F4:1.5 G4:.5 A4 A4:1.5 A4:.5 G4 A4 Bb4 E4 G4 F4:2 C5 C5 A4 D5:1.5 C5:.5 C5 Bb4 Bb4 G4 C5:1.5 Bb4:.5 Bb4 A4 A4 F4 Bb4:1.5 A4:.5 A4 G4 G4 C4 F4:3"
        },
        {
            bpm: 82,
            notes: "G4:1.5 A4:.5 G4 E4:3 G4:1.5 A4:.5 G4 E4:3 D5:2 D5 B4:3 C5:2 C5 G4:3 A4:2 A4 C5:1.5 B4:.5 A4 G4:1.5 A4:.5 G4 E4:3 A4:2 A4 C5:1.5 B4:.5 A4 G4:1.5 A4:.5 G4 E4:3 D5:2 D5 F5:1.5 D5:.5 B4 C5:3 E5:3 C5 G4 E4 G4:1.5 F4:.5 D4 C4:3"
        },
        {
            bpm: 132,
            notes: "G4:1.5 F4:.5 E4 D4 C4 D4 E4 C4 D4:.5 E4:.5 F4:.5 D4:.5 E4:1.5 D4:.5 C4 B3 C4:2 G4:1.5 F4:.5 E4 D4 C4 D4 E4 C4 D4:.5 E4:.5 F4:.5 D4:.5 E4:1.5 D4:.5 C4 B3 C4:2 D4:1.5 E4:.5 F4 D4 E4:1.5 F4:.5 G4 D4 E4:.5 F4:.5 G4 A4:.5 B4:.5 C5 B4 A4 G4:2 G4:1.5 F4:.5 E4 D4 C4 D4 E4 C4 A4:.5 A4:.5 A4:.5 A4:.5 G4:1.5 F4:.5 E4 D4 C4:3"
        },
        {
            bpm: 138,
            notes: "D4 G4 G4:.5 A4:.5 G4:.5 F#4:.5 E4 E4 E4 A4 A4:.5 B4:.5 A4:.5 G4:.5 F#4 D4 D4 B4 B4:.5 C5:.5 B4:.5 A4:.5 G4 E4 D4:.5 D4:.5 E4 A4 F#4 G4:2 D4 G4 G4 G4 F#4:2 F#4 G4 F#4 E4 D4:2 D4 A4 B4 A4:.5 G4:.5 D5 D4 D4:.5 D4:.5 E4 A4 F#4 G4:3"
        }
    ].map(song => ({
        ...song,
        melody: song.notes.split(/\s+/).map(token => {
            const [note, beats] = token.split(":");
            return {note, beats: beats ? Number(beats) : 1};
        })
    }));

    function normalizePlayback(value) {
        const song = songs[currentSong];
        const index = value && Number.isInteger(value.index)
            ? clamp(value.index, 0, song.melody.length) : 0;
        const duration = index < song.melody.length
            ? song.melody[index].beats * 60 / song.bpm : 0;
        const offset = value && Number.isFinite(value.offset)
            ? clamp(value.offset, 0, duration) : 0;
        const gap = value && Number.isFinite(value.gap)
            ? clamp(value.gap, 0, 1.1) : 1.1;

        if (index < song.melody.length && offset >= duration) {
            return {index: index + 1, offset: 0, gap: 1.1};
        }
        return {index, offset, gap};
    }

    let playback = normalizePlayback(saved.playback);
    let audioContext = null;
    let master = null;
    let analyser = null;
    let frequencyData = null;
    let schedulerTimer = null;
    let checkpointTimer = null;
    let nextNoteTime = 0;
    let noteIndex = 0;
    let firstNoteOffset = 0;
    let endedAt = 0;
    let scheduledNotes = [];
    let resumeRequestId = 0;
    let resumeWatchdog = null;
    const activeVoices = new Set();

    // Capture the note being heard, not the next note scheduled ahead.
    function capturePlayback() {
        if (!musicPlaying || !audioContext) return {...playback};

        const now = audioContext.currentTime;

        for (const entry of scheduledNotes) {
            if (now < entry.end) {
                return {
                    index: entry.index,
                    offset: entry.offset + clamp(now - entry.start, 0, entry.end - entry.start),
                    gap: 1.1
                };
            }
        }

        if (endedAt && now >= nextNoteTime) {
            return {
                index: songs[currentSong].melody.length,
                offset: 0,
                gap: clamp(endedAt - now, 0, 1.1)
            };
        }

        return {index: noteIndex, offset: firstNoteOffset, gap: 1.1};
    }

    function persistState() {
        const state = {
            version: 1,
            language,
            snow: snowEnabled,
            lights: lightsEnabled,
            motion: motionPreference,
            volume,
            playAll,
            currentSong,
            musicWanted,
            playback: capturePlayback(),
            ornaments,
            updatedAt: Date.now()
        };

        try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
            storageAvailable = true;
        } catch {
            storageAvailable = false;
        }

        updateStorageNotice();
    }

    function frequency(note) {
        const match = /^([A-G])([#b]?)(\d)$/.exec(note);
        const semitones = {C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11};
        const midi = (Number(match[3]) + 1) * 12 + semitones[match[1]]
            + (match[2] === "#" ? 1 : match[2] === "b" ? -1 : 0);
        return 440 * 2 ** ((midi - 69) / 12);
    }

    function initializeAudio() {
        if (audioContext && audioContext.state !== "closed") return;

        const AudioAPI = window.AudioContext || window.webkitAudioContext;
        if (!AudioAPI) throw new Error("Web Audio unavailable");

        audioContext = new AudioAPI();
        master = audioContext.createGain();
        master.gain.value = volume / 100;

        const compressor = audioContext.createDynamicsCompressor();
        compressor.threshold.value = -18;
        compressor.ratio.value = 4;

        analyser = audioContext.createAnalyser();
        analyser.fftSize = 256;
        analyser.smoothingTimeConstant = .75;
        frequencyData = new Uint8Array(analyser.frequencyBinCount);

        master.connect(compressor);
        compressor.connect(analyser);
        analyser.connect(audioContext.destination);

        audioContext.addEventListener("statechange", () => {
            if (audioContext.state === "running") {
                if (musicWanted && pageActive && !document.hidden && !musicPlaying) {
                    startPlayback();
                }
            } else if (musicPlaying) {
                // Preserve the position if the browser interrupts audio.
                pauseRuntime();
            }
        });
    }

    function playTone(hz, time, duration) {
        [1, 2, 3.01].forEach((partial, index) => {
            const oscillator = audioContext.createOscillator();
            const envelope = audioContext.createGain();
            const amplitude = [.2, .047, .012][index];
            const tail = Math.min(2.4, duration + .65);

            oscillator.type = "sine";
            oscillator.frequency.value = hz * partial;
            envelope.gain.setValueAtTime(.0001, time);
            envelope.gain.exponentialRampToValueAtTime(amplitude, time + .012);
            envelope.gain.exponentialRampToValueAtTime(.0001, time + tail);

            oscillator.connect(envelope);
            envelope.connect(master);

            const voice = {oscillator, envelope};
            activeVoices.add(voice);

            oscillator.onended = () => {
                oscillator.disconnect();
                envelope.disconnect();
                activeVoices.delete(voice);
            };

            oscillator.start(time);
            oscillator.stop(time + tail + .02);
        });
    }

    function stopVoices() {
        for (const voice of activeVoices) {
            try { voice.oscillator.stop(); } catch {}
            voice.oscillator.disconnect();
            voice.envelope.disconnect();
        }
        activeVoices.clear();
    }

    function prepareTimeline() {
        playback = normalizePlayback(playback);
        scheduledNotes = [];
        noteIndex = playback.index;
        firstNoteOffset = playback.offset;
        nextNoteTime = audioContext.currentTime + .06;
        endedAt = noteIndex >= songs[currentSong].melody.length
            ? nextNoteTime + playback.gap : 0;
    }

    function advanceSong() {
        if (playAll) currentSong = (currentSong + 1) % songs.length;
        playback = {index: 0, offset: 0, gap: 1.1};
        prepareTimeline();
        updateUI();
        persistState();
    }

    function scheduleMusic() {
        if (!musicPlaying || !audioContext || audioContext.state !== "running") return;

        const now = audioContext.currentTime;

        if (endedAt && now >= endedAt) advanceSong();

        const song = songs[currentSong];

        // Discard old timeline entries; keep current and future notes.
        scheduledNotes = scheduledNotes.filter(entry => entry.end > now);

        if (noteIndex < song.melody.length && nextNoteTime < now - .1) {
            nextNoteTime = now + .04;
        }

        while (noteIndex < song.melody.length && nextNoteTime < now + .18) {
            const index = noteIndex++;
            const note = song.melody[index];
            const fullDuration = note.beats * 60 / song.bpm;
            const offset = firstNoteOffset;
            const duration = Math.max(.01, fullDuration - offset);
            firstNoteOffset = 0;

            playTone(frequency(note.note), nextNoteTime, duration);
            scheduledNotes.push({
                index,
                start: nextNoteTime,
                end: nextNoteTime + duration,
                offset
            });
            nextNoteTime += duration;
        }

        if (noteIndex === song.melody.length && !endedAt) {
            endedAt = nextNoteTime + 1.1;
        }
    }

    function clearPlaybackTimers() {
        clearInterval(schedulerTimer);
        clearInterval(checkpointTimer);
        schedulerTimer = null;
        checkpointTimer = null;
    }

    function startPlayback() {
        if (musicPlaying || !musicWanted || !pageActive ||
            document.hidden || !audioContext ||
            audioContext.state !== "running") return;

        clearTimeout(resumeWatchdog);
        audioBusy = false;
        audioFailed = false;
        musicPlaying = true;
        prepareTimeline();
        scheduleMusic();

        clearPlaybackTimers();
        schedulerTimer = setInterval(scheduleMusic, 45);
        checkpointTimer = setInterval(persistState, 1000);

        updateUI();
        persistState();
        refresh();
    }

    /*
     * Autoplay cannot be guaranteed after reload. Try it when permitted;
     * otherwise retain the saved position and resume on a user gesture.
     * A suspended resume() promise must not leave the controls disabled.
     */
    function requestMusicResume(userInitiated = false) {
        if (!musicWanted || musicPlaying || !pageActive || document.hidden) return;

        const requestId = ++resumeRequestId;
        clearTimeout(resumeWatchdog);
        audioFailed = false;
        audioBusy = userInitiated;
        updateUI();

        try {
            initializeAudio();

            if (audioContext.state === "running") {
                startPlayback();
                return;
            }

            const promise = audioContext.resume();

            resumeWatchdog = setTimeout(() => {
                if (requestId !== resumeRequestId || musicPlaying) return;
                audioBusy = false;
                updateUI();
            }, 700);

            Promise.resolve(promise).then(() => {
                if (requestId !== resumeRequestId) return;
                clearTimeout(resumeWatchdog);
                audioBusy = false;

                if (audioContext.state === "running") startPlayback();
                else updateUI();
            }).catch(error => {
                if (requestId !== resumeRequestId) return;
                clearTimeout(resumeWatchdog);
                audioBusy = false;
                // Autoplay denial is recoverable with a click.
                audioFailed = error && error.name !== "NotAllowedError";
                updateUI();
            });
        } catch {
            clearTimeout(resumeWatchdog);
            audioBusy = false;
            audioFailed = true;
            updateUI();
        }
    }

    // Runtime pause does NOT change musicWanted: reloads and hidden tabs
    // retain the user's playback intent and saved musical position.
    function pauseRuntime() {
        if (musicPlaying) playback = capturePlayback();

        musicPlaying = false;
        audioBusy = false;
        resumeRequestId++;
        clearTimeout(resumeWatchdog);
        clearPlaybackTimers();
        stopVoices();
        scheduledNotes = [];

        persistState();
        updateUI();
        refresh();
    }

    function toggleMusic() {
        if (musicPlaying) {
            musicWanted = false;
            pauseRuntime();
        } else {
            musicWanted = true;
            audioFailed = false;
            persistState();
            requestMusicResume(true);
        }
    }

    songs.forEach((_, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "song-btn";

        button.addEventListener("click", () => {
            if (index === currentSong) {
                if (musicWanted && !musicPlaying) requestMusicResume(true);
                return;
            }

            const wasPlaying = musicPlaying;
            if (wasPlaying) {
                musicPlaying = false;
                clearPlaybackTimers();
                stopVoices();
            }

            currentSong = index;
            playback = {index: 0, offset: 0, gap: 1.1};
            scheduledNotes = [];
            endedAt = 0;
            audioFailed = false;

            updateUI();
            persistState();

            if (musicWanted) requestMusicResume(true);
            refresh();
        });

        $("songSelector").appendChild(button);
    });

    $("language").addEventListener("change", event => {
        language = event.target.value;
        $("announcement").textContent = "";
        updateUI();
        persistState();
        requestAnimationFrame(resizeCanvas);
    });

    $("snowBtn").addEventListener("click", () => {
        snowEnabled = !snowEnabled;
        updateUI();
        persistState();
        refresh();
    });

    $("lightsBtn").addEventListener("click", () => {
        lightsEnabled = !lightsEnabled;
        updateUI();
        persistState();
        refresh();
    });

    $("addBtn").addEventListener("click", () => {
        if (extraCount >= MAX_EXTRA) return;

        let ornament;

        for (let attempt = 0; attempt < 80; attempt++) {
            ornament = makeOrnament(
                Math.random,
                Math.floor(Math.random() * palette.length)
            );
            if (ornaments.every(o =>
                Math.hypot(o.x - ornament.x, o.y - ornament.y) >
                o.r + ornament.r + 3
            )) break;
        }

        ornaments.push(ornament);
        extraCount++;
        drawDecorations();
        updateUI();
        persistState();

        $("announcement").textContent = extraCount === MAX_EXTRA
            ? text.limit
            : text.added + " " + $("ornamentCount").textContent;

        refresh();
    });

    $("resetBtn").addEventListener("click", () => {
        resetOrnaments();
        drawDecorations();
        updateUI();
        persistState();
        $("announcement").textContent = text.resetDone;
        refresh();
    });

    $("motion").addEventListener("change", event => {
        motionPreference = event.target.checked;
        motionEnabled = motionPreference;
        persistState();
        refresh();
    });

    function handleMotionPreference(event) {
        // Follow system changes only until the user chooses explicitly.
        if (motionPreference !== null) return;
        motionEnabled = !event.matches;
        updateUI();
        refresh();
    }

    if (reducedMotion.addEventListener) {
        reducedMotion.addEventListener("change", handleMotionPreference);
    } else {
        reducedMotion.addListener(handleMotionPreference);
    }

    $("musicBtn").addEventListener("click", toggleMusic);

    $("resumeMusicBtn").addEventListener("click", () => {
        musicWanted = true;
        persistState();
        requestMusicResume(true);
    });

    $("volume").addEventListener("input", event => {
        volume = Number(event.target.value);

        if (master && audioContext && audioContext.state !== "closed") {
            master.gain.setTargetAtTime(volume / 100, audioContext.currentTime, .035);
        }

        persistState();
    });

    $("autoplay").addEventListener("change", event => {
        playAll = event.target.checked;
        persistState();
    });

    // Resume only previously requested music, never music the user stopped.
    // Exclude playback/song controls so their own click handlers run once.
    function resumeOnInteraction(event) {
        if (!event.isTrusted || !musicWanted || musicPlaying ||
            audioFailed || audioBusy || document.hidden) return;

        if (event.type === "keydown" &&
            (event.repeat || event.ctrlKey || event.altKey ||
             event.metaKey || ["Escape", "Tab", "Shift", "Control", "Alt", "Meta"].includes(event.key))) {
            return;
        }

        const target = event.target instanceof Element ? event.target : null;
        if (target && target.closest("#musicBtn, #resumeMusicBtn, #songSelector")) return;

        requestMusicResume(true);
    }

    document.addEventListener("click", resumeOnInteraction);
    document.addEventListener("keydown", resumeOnInteraction);

    function deactivatePage() {
        pageActive = false;
        pauseRuntime();
    }

    function activatePage() {
        pageActive = !document.hidden;
        resizeCanvas();
        refresh();

        if (pageActive && musicWanted && !musicPlaying) {
            requestMusicResume(false);
        }
    }

    document.addEventListener("visibilitychange", () => {
        if (document.hidden) deactivatePage();
        else activatePage();
    });

    // Save synchronously before navigation/reload without saving "stopped".
    window.addEventListener("pagehide", deactivatePage);
    window.addEventListener("pageshow", activatePage);

    restoreOrnaments();
    updateUI();
    resizeCanvas();
    persistState();

    if ("ResizeObserver" in window) {
        new ResizeObserver(resizeCanvas).observe($("canvasWrap"));
    }

    window.addEventListener("resize", resizeCanvas, {passive: true});

    // Attempt automatic restoration; the visible Resume button is the
    // fallback if the browser requires a new user gesture after reloading.
    if (musicWanted && pageActive) requestMusicResume(false);
})();
</script>
</body>
</html>
