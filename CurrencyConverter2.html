<script>
// ============ Translations ============
const I18N = {
  uk: {
    title: "Конвертер Валют",
    from: "З валюти", to: "У валюту",
    chartTitle: "Історичний курс", swap: "Поміняти",
    loading: "Завантаження курсів...", updated: "Оновлено:",
    error: "Помилка завантаження даних",
    rate: (a,b,r)=>`1 ${a} = ${r} ${b}`,
    result: (amt,a,res,b)=>`${amt} ${a} = ${res} ${b}`,
    note: "* Історичні дані змодельовано на основі поточного курсу",
    noteJan2020: "* Передвстановлений курс UAH: від 200 до значення станом на січень 2020",
    days: {7:"7Д",30:"30Д",90:"90Д",180:"180Д",270:"270Д",365:"1Р",1095:"3Р",1825:"5Р",3650:"10Р","jan2020":"Січ 2020"}
  },
  en: {
    title: "Currency Converter",
    from: "From currency", to: "To currency",
    chartTitle: "Historical Rate", swap: "Swap",
    loading: "Loading rates...", updated: "Updated:",
    error: "Failed to load data",
    rate: (a,b,r)=>`1 ${a} = ${r} ${b}`,
    result: (amt,a,res,b)=>`${amt} ${a} = ${res} ${b}`,
    note: "* Historical data simulated based on current rate",
    noteJan2020: "* Predefined UAH rate: from 200 up to the January 2020 value",
    days: {7:"7D",30:"30D",90:"90D",180:"180D",270:"270D",365:"1Y",1095:"3Y",1825:"5Y",3650:"10Y","jan2020":"Jan 2020"}
  }
};

// ============ 20 Currencies ============
const CURRENCY_NAMES = {
  UAH:{uk:"Гривня 🇺🇦",en:"Hryvnia 🇺🇦"},
  USD:{uk:"Долар США 🇺🇸",en:"US Dollar 🇺🇸"},
  EUR:{uk:"Євро 🇪🇺",en:"Euro 🇪🇺"},
  GBP:{uk:"Фунт 🇬🇧",en:"Pound 🇬🇧"},
  PLN:{uk:"Злотий 🇵🇱",en:"Zloty 🇵🇱"},
  JPY:{uk:"Єна 🇯🇵",en:"Yen 🇯🇵"},
  CHF:{uk:"Франк 🇨🇭",en:"Franc 🇨🇭"},
  CAD:{uk:"Канад. долар 🇨🇦",en:"Canadian Dollar 🇨🇦"},
  CNY:{uk:"Юань 🇨🇳",en:"Yuan 🇨🇳"},
  TRY:{uk:"Ліра 🇹🇷",en:"Lira 🇹🇷"},
  AUD:{uk:"Австрал. долар 🇦🇺",en:"Australian Dollar 🇦🇺"},
  NZD:{uk:"Новозел. долар 🇳🇿",en:"NZ Dollar 🇳🇿"},
  SEK:{uk:"Крона (SEK) 🇸🇪",en:"Swedish Krona 🇸🇪"},
  NOK:{uk:"Крона (NOK) 🇳🇴",en:"Norwegian Krone 🇳🇴"},
  DKK:{uk:"Крона (DKK) 🇩🇰",en:"Danish Krone 🇩🇰"},
  CZK:{uk:"Чеська крона 🇨🇿",en:"Czech Koruna 🇨🇿"},
  HUF:{uk:"Форинт 🇭🇺",en:"Forint 🇭🇺"},
  INR:{uk:"Рупія 🇮🇳",en:"Indian Rupee 🇮🇳"},
  KRW:{uk:"Вона 🇰🇷",en:"Won 🇰🇷"},
  MXN:{uk:"Песо 🇲🇽",en:"Mexican Peso 🇲🇽"}
};
const CURRENCIES = Object.keys(CURRENCY_NAMES);

// ============ Predefined UAH rate (Jan 2020) ============
// Rate goes from a baseline of 200 up to the January 2020 target value.
// The target is expressed in UAH per 1 unit of the counter currency.
const UAH_JAN2020_TARGET = {
  USD: 240,   // ~24.0 UAH → scaled representation ending near Jan 2020 level
  EUR: 268,
  GBP: 315,
  PLN: 63,
  JPY: 2.2,
  CHF: 247,
  CAD: 184,
  CNY: 34,
  TRY: 40,
  AUD: 166,
  NZD: 160,
  SEK: 25,
  NOK: 27,
  DKK: 36,
  CZK: 10,
  HUF: 0.81,
  INR: 3.4,
  KRW: 0.21,
  MXN: 12.7,
  UAH: 1
};
const UAH_JAN2020_START = 200; // predefined starting reference value

// ============ State ============
const DEFAULT_STATE = { lang:"uk", from:"USD", to:"UAH", amount:1, days:30 };
let state = loadState();
let chart = null, latestRate = null;

function loadState() {
  try { return { ...DEFAULT_STATE, ...(JSON.parse(localStorage.getItem("ccState"))||{}) }; }
  catch { return { ...DEFAULT_STATE }; }
}
function saveState() { localStorage.setItem("ccState", JSON.stringify(state)); }

// ============ DOM ============
const $ = id => document.getElementById(id);
const els = {
  fromAmount: $("fromAmount"), toAmount: $("toAmount"),
  fromCurrency: $("fromCurrency"), toCurrency: $("toCurrency"),
  swapBtn: $("swapBtn"), resultText: $("resultText"), rateText: $("rateText"),
  status: $("status"), appTitle: $("appTitle"), lblFrom: $("lblFrom"),
  lblTo: $("lblTo"), chartTitle: $("chartTitle"), chartNote: $("chartNote")
};

// ============ UI ============
function populateSelects() {
  [els.fromCurrency, els.toCurrency].forEach(sel => {
    sel.innerHTML = "";
    CURRENCIES.forEach(c => {
      const opt = document.createElement("option");
      opt.value = c;
      opt.textContent = `${c} — ${CURRENCY_NAMES[c][state.lang]}`;
      sel.appendChild(opt);
    });
  });
  els.fromCurrency.value = state.from;
  els.toCurrency.value = state.to;
}

function isJan2020() { return state.days === "jan2020"; }

function updateChartNote() {
  const t = I18N[state.lang];
  els.chartNote.textContent = isJan2020() ? t.noteJan2020 : t.note;
}

function applyLanguage() {
  const t = I18N[state.lang];
  els.appTitle.textContent = t.title;
  els.lblFrom.textContent = t.from;
  els.lblTo.textContent = t.to;
  els.chartTitle.textContent = t.chartTitle;
  updateChartNote();
  els.swapBtn.title = t.swap;
  document.documentElement.lang = state.lang;
  document.title = state.lang === "uk"
    ? "Конвертер Валют — Live Currency Converter"
    : "Currency Converter — Live Exchange Rates";
  document.querySelectorAll(".lang-switch button").forEach(b=>
    b.classList.toggle("active", b.dataset.lang === state.lang));
  document.querySelectorAll("#periodBtns button").forEach(b=>
    b.textContent = t.days[b.dataset.days]);
  populateSelects();
  updateDisplay();
}

function applyPeriodActive() {
  document.querySelectorAll("#periodBtns button").forEach(b=>
    b.classList.toggle("active", String(b.dataset.days) === String(state.days)));
}

// ============ API ============
const RATE_API = "https://open.er-api.com/v6/latest/";

async function fetchLatest(from, to) {
  const res = await fetch(RATE_API + from);
  if (!res.ok) throw new Error("HTTP " + res.status);
  const data = await res.json();
  if (data.result !== "success" || !data.rates || data.rates[to] == null)
    throw new Error("no rate");
  return data.rates[to];
}

// ============ Predefined Jan 2020 UAH history ============
// Builds a monotonic-ish trajectory from START (200) toward the Jan 2020 target.
function buildJan2020History() {
  // Determine target: prefer UAH pairs; otherwise fall back to counter currency mapping.
  let target;
  if (state.to === "UAH") {
    target = UAH_JAN2020_TARGET[state.from] ?? UAH_JAN2020_START;
  } else if (state.from === "UAH") {
    const t = UAH_JAN2020_TARGET[state.to] ?? UAH_JAN2020_START;
    target = t ? 1 / t : UAH_JAN2020_START;
  } else {
    target = latestRate != null ? latestRate : UAH_JAN2020_START;
  }

  const start = (state.to === "UAH") ? UAH_JAN2020_START
              : (state.from === "UAH") ? 1 / UAH_JAN2020_START
              : UAH_JAN2020_START;

  const points = 24;                // ~2 years monthly leading up to Jan 2020
  const endDate = new Date(2020, 0, 1); // January 2020
  const labels = [], values = [];
  const loc = state.lang === "uk" ? "uk-UA" : "en-US";
  const opts = { year: '2-digit', month: 'short' };

  // seeded noise for a realistic wiggle
  let seed = 0;
  const key = "jan2020" + state.from + state.to;
  for (let i=0;i<key.length;i++) seed += key.charCodeAt(i);
  const rand = n => { const x = Math.sin(seed + n*1.37)*10000; return x - Math.floor(x); };

  for (let i=0;i<points;i++){
    const frac = i/(points-1);
    // smooth ease toward target
    const eased = frac*frac*(3-2*frac);
    let val = start + (target - start) * eased;
    // add small noise (skip endpoints)
    if (i>0 && i<points-1) val += (rand(i)-0.5) * (target-start) * 0.04;

    const d = new Date(endDate);
    d.setMonth(endDate.getMonth() - (points-1-i));
    labels.push(d.toLocaleDateString(loc, opts));
    values.push(Number(val.toFixed(4)));
  }
  values[values.length-1] = Number(target.toFixed(4));
  return { labels, values, jan2020: true, target };
}

// Build realistic historical series anchored to real current rate.
function buildHistory(days, currentRate) {
  if (days === "jan2020") return buildJan2020History();

  let points, stepDays;
  if (days <= 90) { points = days; stepDays = 1; }
  else if (days <= 365) { points = 60; stepDays = days/60; }
  else { points = 80; stepDays = days/80; }

  let seed = 0;
  const key = state.from + state.to + days;
  for (let i=0;i<key.length;i++) seed += key.charCodeAt(i);
  const rand = n => { const x = Math.sin(seed + n*1.37)*10000; return x - Math.floor(x); };

  const vol = Math.min(0.35, 0.015 * Math.sqrt(days/30));
  const arr = [];
  let val = currentRate;
  for (let i=0;i<points;i++){
    const drift = (rand(i)-0.5) * currentRate * vol;
    val = Math.max(currentRate*0.4, val + drift);
    arr.push(val);
  }
  arr[arr.length-1] = currentRate;

  const today = new Date();
  const labels = [], values = [];
  const longRange = days > 365;
  const opts = longRange ? {year:'2-digit', month:'short'} : {day:'2-digit', month:'2-digit'};
  const loc = state.lang==="uk"?"uk-UA":"en-US";
  for (let i=points-1;i>=0;i--){
    const d = new Date(today);
    d.setDate(today.getDate() - Math.round((points-1-i)*stepDays));
    labels.push(d.toLocaleDateString(loc, opts));
    values.push(Number(arr[i].toFixed(4)));
  }
  return { labels, values };
}

// ============ Logic ============
function setStatus(msg, err=false){ els.status.innerHTML = msg; els.status.classList.toggle("error", err); }
function round(n,d=2){ return Number(n.toFixed(d)); }
function formatNum(n){
  return new Intl.NumberFormat(state.lang==="uk"?"uk-UA":"en-US",{maximumFractionDigits:4}).format(n);
}

function updateDisplay() {
  const t = I18N[state.lang];
  els.fromCurrency.value = state.from;
  els.toCurrency.value = state.to;
  els.fromAmount.value = state.amount;
  applyPeriodActive();
  updateChartNote();
  if (latestRate != null) {
    const res = state.amount * latestRate;
    els.toAmount.value = round(res);
    els.resultText.textContent = t.result(formatNum(state.amount), state.from, formatNum(res), state.to);
    els.rateText.textContent = t.rate(state.from, state.to, round(latestRate,4));
  }
}

async function refreshAll() {
  const t = I18N[state.lang];
  if (state.from === state.to) {
    latestRate = 1; updateDisplay();
    renderChart(buildHistory(state.days, 1)); setStatus(""); return;
  }
  setStatus(`<span class="loader"></span> ${t.loading}`);
  try {
    latestRate = await fetchLatest(state.from, state.to);
    updateDisplay();
    renderChart(buildHistory(state.days, latestRate));
    setStatus(`${t.updated} ${new Date().toLocaleString(state.lang==="uk"?"uk-UA":"en-US")}`);
  } catch (e) {
    console.error("Rate fetch failed:", e);
    // For the Jan 2020 predefined view we can still render without live data
    if (isJan2020()) {
      renderChart(buildHistory(state.days, latestRate));
      setStatus("");
    } else {
      setStatus(t.error, true);
    }
  }
}

// ============ Chart ============
function baseChartConfig(labels, values) {
  const ctx = $("chart").getContext("2d");
  const grad = ctx.createLinearGradient(0,0,0,280);
  grad.addColorStop(0,"rgba(102,126,234,0.35)");
  grad.addColorStop(1,"rgba(102,126,234,0.02)");
  return {
    type: "line",
    data: { labels, datasets: [{
      label: `${state.from}/${state.to}`, data: values,
      borderColor: "#667eea", backgroundColor: grad,
      fill: true, tension: 0.3, pointRadius: 0, pointHoverRadius: 5, borderWidth: 2
    }]},
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode:"index", intersect:false },
      plugins: {
        legend:{display:false},
        tooltip:{ callbacks:{ label:c=>`${round(c.parsed.y,4)} ${state.to}` } }
      },
      scales: {
        x:{ grid:{display:false}, ticks:{maxTicksLimit:7, font:{size:10}, autoSkip:true} },
        y:{ grid:{color:"#eef"}, ticks:{font:{size:10}} }
      }
    }
  };
}
function renderChart({labels, values}) {
  if (chart) chart.destroy();
  chart = new Chart($("chart"), baseChartConfig(labels, values));
}

// ============ Events ============
els.fromAmount.addEventListener("input", () => {
  state.amount = parseFloat(els.fromAmount.value) || 0; saveState();
  if (latestRate != null) {
    const res = state.amount * latestRate;
    els.toAmount.value = round(res);
    const t = I18N[state.lang];
    els.resultText.textContent = t.result(formatNum(state.amount), state.from, formatNum(res), state.to);
  }
});
els.toAmount.addEventListener("input", () => {
  const val = parseFloat(els.toAmount.value) || 0;
  if (latestRate) {
    state.amount = round(val / latestRate, 4);
    els.fromAmount.value = state.amount; saveState();
    const t = I18N[state.lang];
    els.resultText.textContent = t.result(formatNum(state.amount), state.from, formatNum(val), state.to);
  }
});
els.fromCurrency.addEventListener("change", () => { state.from = els.fromCurrency.value; saveState(); refreshAll(); });
els.toCurrency.addEventListener("change", () => { state.to = els.toCurrency.value; saveState(); refreshAll(); });
els.swapBtn.addEventListener("click", () => { [state.from, state.to] = [state.to, state.from]; saveState(); refreshAll(); });

document.querySelectorAll(".lang-switch button").forEach(b=>
  b.addEventListener("click", () => { state.lang = b.dataset.lang; saveState(); applyLanguage(); refreshAll(); }));

document.querySelectorAll("#periodBtns button").forEach(b=>
  b.addEventListener("click", () => {
    const d = b.dataset.days;
    state.days = (d === "jan2020") ? "jan2020" : +d;
    saveState(); applyPeriodActive(); updateChartNote();
    if (state.days === "jan2020") {
      renderChart(buildHistory(state.days, latestRate));
    } else if (latestRate != null) {
      renderChart(buildHistory(state.days, latestRate));
    }
  }));

window.addEventListener("resize", () => { if (chart) chart.resize(); });
window.addEventListener("orientationchange", () => setTimeout(()=>{ if (chart) chart.resize(); }, 300));

// ============ Start ============
applyLanguage();
refreshAll();
</script>
</body>
</html>
