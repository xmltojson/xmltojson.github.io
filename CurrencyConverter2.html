const HIST_MIN_YEAR = 2000, HIST_MAX_YEAR = 2020;

// Returns the predefined UAH-based rate for the current pair on a given date,
// or null if not applicable / outside 2000–2020.
function getHistoricalRate(date) {
  const y = date.getFullYear();
  if (y < HIST_MIN_YEAR || y > HIST_MAX_YEAR) return null;

  let base, invert = false;
  if (state.to === "UAH" && UAH_HISTORY[state.from]) {
    base = state.from;
  } else if (state.from === "UAH" && UAH_HISTORY[state.to]) {
    base = state.to; invert = true;
  } else {
    return null;
  }

  const table = UAH_HISTORY[base];
  // linear interpolation between yearly anchors using month fraction
  const yr = Math.min(HIST_MAX_YEAR, y);
  const nextYr = Math.min(HIST_MAX_YEAR, y + 1);
  const v0 = table[yr];
  const v1 = table[nextYr] ?? v0;
  const frac = date.getMonth() / 12;
  let val = v0 + (v1 - v0) * frac;
  if (invert) val = val ? 1 / val : null;
  return val;
}

function pairHasHistory() {
  return (state.to === "UAH" && UAH_HISTORY[state.from]) ||
         (state.from === "UAH" && UAH_HISTORY[state.to]);
}

// ============ State ============
const DEFAULT_STATE = { lang:"uk", from:"USD", to:"UAH", amount:1, days:30 };
let state = loadState();
let chart = null, latestRate = null;

function loadState() {
  try { return { ...DEFAULT_STATE, ...(JSON.parse(localStorage.getItem("ccState"))||{}) }; }
  catch { return { ...DEFAULT_STATE }; }
}
function saveState() { localStorage.setItem("ccState", JSON.stringify(state)); }

// ============ DOM ============
const $ = id => document.getElementById(id);
const els = {
  fromAmount: $("fromAmount"), toAmount: $("toAmount"),
  fromCurrency: $("fromCurrency"), toCurrency: $("toCurrency"),
  swapBtn: $("swapBtn"), resultText: $("resultText"), rateText: $("rateText"),
  status: $("status"), appTitle: $("appTitle"), lblFrom: $("lblFrom"),
  lblTo: $("lblTo"), chartTitle: $("chartTitle"), chartNote: $("chartNote")
};

// Track whether the last rendered chart used predefined historical data
let usedHistory = false;

// ============ UI ============
function populateSelects() {
  [els.fromCurrency, els.toCurrency].forEach(sel => {
    sel.innerHTML = "";
    CURRENCIES.forEach(c => {
      const opt = document.createElement("option");
      opt.value = c;
      opt.textContent = `${c} — ${CURRENCY_NAMES[c][state.lang]}`;
      sel.appendChild(opt);
    });
  });
  els.fromCurrency.value = state.from;
  els.toCurrency.value = state.to;
}

function updateChartNote() {
  const t = I18N[state.lang];
  els.chartNote.textContent = usedHistory ? t.noteHist : t.note;
}

function applyLanguage() {
  const t = I18N[state.lang];
  els.appTitle.textContent = t.title;
  els.lblFrom.textContent = t.from;
  els.lblTo.textContent = t.to;
  els.chartTitle.textContent = t.chartTitle;
  updateChartNote();
  els.swapBtn.title = t.swap;
  document.documentElement.lang = state.lang;
  document.title = state.lang === "uk"
    ? "Конвертер Валют — Live Currency Converter"
    : "Currency Converter — Live Exchange Rates";
  document.querySelectorAll(".lang-switch button").forEach(b=>
    b.classList.toggle("active", b.dataset.lang === state.lang));
  document.querySelectorAll("#periodBtns button").forEach(b=>
    b.textContent = t.days[b.dataset.days]);
  populateSelects();
  updateDisplay();
}

function applyPeriodActive() {
  document.querySelectorAll("#periodBtns button").forEach(b=>
    b.classList.toggle("active", +b.dataset.days === state.days));
}

// ============ API ============
const RATE_API = "https://open.er-api.com/v6/latest/";

async function fetchLatest(from, to) {
  const res = await fetch(RATE_API + from);
  if (!res.ok) throw new Error("HTTP " + res.status);
  const data = await res.json();
  if (data.result !== "success" || !data.rates || data.rates[to] == null)
    throw new Error("no rate");
  return data.rates[to];
}

// Build historical series. For long ranges on UAH pairs, blend predefined
// 2000–2020 data with the live/simulated recent portion.
function buildHistory(days, currentRate) {
  usedHistory = false;

  let points, stepDays;
  if (days <= 90) { points = days; stepDays = 1; }
  else if (days <= 365) { points = 60; stepDays = days/60; }
  else { points = 80; stepDays = days/80; }

  let seed = 0;
  const key = state.from + state.to + days;
  for (let i=0;i<key.length;i++) seed += key.charCodeAt(i);
  const rand = n => { const x = Math.sin(seed + n*1.37)*10000; return x - Math.floor(x); };

  const vol = Math.min(0.35, 0.015 * Math.sqrt(days/30));

  const today = new Date();
  const labels = [], values = [];
  const longRange = days > 365;
  const opts = longRange ? {year:'2-digit', month:'short'} : {day:'2-digit', month:'2-digit'};
  const loc = state.lang==="uk"?"uk-UA":"en-US";

  // Simulated recent-walk fallback anchored to current rate
  const simArr = [];
  let val = currentRate;
  for (let i=0;i<points;i++){
    const drift = (rand(i)-0.5) * currentRate * vol;
    val = Math.max(currentRate*0.4, val + drift);
    simArr.push(val);
  }
  simArr[simArr.length-1] = currentRate;

  const canBlend = longRange && pairHasHistory();

  for (let i=points-1;i>=0;i--){
    const d = new Date(today);
    d.setDate(today.getDate() - Math.round((points-1-i)*stepDays));

    let value;
    const hist = canBlend ? getHistoricalRate(d) : null;
    if (hist != null) {
      // add tiny seeded wiggle so it doesn't look perfectly flat
      const wiggle = (rand(i)-0.5) * hist * 0.02;
      value = hist + wiggle;
      usedHistory = true;
    } else {
      value = simArr[points-1 - (points-1-i)];
    }

    labels.push(d.toLocaleDateString(loc, opts));
    values.push(Number(value.toFixed(4)));
  }

  // Ensure the most recent point matches the live rate for continuity
  values[values.length-1] = Number(currentRate.toFixed(4));

  return { labels, values };
}

// ============ Logic ============
function setStatus(msg, err=false){ els.status.innerHTML = msg; els.status.classList.toggle("error", err); }
function round(n,d=2){ return Number(n.toFixed(d)); }
function formatNum(n){
  return new Intl.NumberFormat(state.lang==="uk"?"uk-UA":"en-US",{maximumFractionDigits:4}).format(n);
}

function updateDisplay() {
  const t = I18N[state.lang];
  els.fromCurrency.value = state.from;
  els.toCurrency.value = state.to;
  els.fromAmount.value = state.amount;
  applyPeriodActive();
  if (latestRate != null) {
    const res = state.amount * latestRate;
    els.toAmount.value = round(res);
    els.resultText.textContent = t.result(formatNum(state.amount), state.from, formatNum(res), state.to);
    els.rateText.textContent = t.rate(state.from, state.to, round(latestRate,4));
  }
}

async function refreshAll() {
  const t = I18N[state.lang];
  if (state.from === state.to) {
    latestRate = 1; updateDisplay();
    renderChart(buildHistory(state.days, 1)); updateChartNote(); setStatus(""); return;
  }
  setStatus(`<span class="loader"></span> ${t.loading}`);
  try {
    latestRate = await fetchLatest(state.from, state.to);
    updateDisplay();
    renderChart(buildHistory(state.days, latestRate));
    updateChartNote();
    setStatus(`${t.updated} ${new Date().toLocaleString(state.lang==="uk"?"uk-UA":"en-US")}`);
  } catch (e) {
    console.error("Rate fetch failed:", e);
    setStatus(t.error, true);
  }
}

// ============ Chart ============
function baseChartConfig(labels, values) {
  const ctx = $("chart").getContext("2d");
  const grad = ctx.createLinearGradient(0,0,0,280);
  grad.addColorStop(0,"rgba(102,126,234,0.35)");
  grad.addColorStop(1,"rgba(102,126,234,0.02)");
  return {
    type: "line",
    data: { labels, datasets: [{
      label: `${state.from}/${state.to}`, data: values,
      borderColor: "#667eea", backgroundColor: grad,
      fill: true, tension: 0.3, pointRadius: 0, pointHoverRadius: 5, borderWidth: 2
    }]},
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode:"index", intersect:false },
      plugins: {
        legend:{display:false},
        tooltip:{ callbacks:{ label:c=>`${round(c.parsed.y,4)} ${state.to}` } }
      },
      scales: {
        x:{ grid:{display:false}, ticks:{maxTicksLimit:7, font:{size:10}, autoSkip:true} },
        y:{ grid:{color:"#eef"}, ticks:{font:{size:10}} }
      }
    }
  };
}
function renderChart({labels, values}) {
  if (chart) chart.destroy();
  chart = new Chart($("chart"), baseChartConfig(labels, values));
}

// ============ Events ============
els.fromAmount.addEventListener("input", () => {
  state.amount = parseFloat(els.fromAmount.value) || 0; saveState();
  if (latestRate != null) {
    const res = state.amount * latestRate;
    els.toAmount.value = round(res);
    const t = I18N[state.lang];
    els.resultText.textContent = t.result(formatNum(state.amount), state.from, formatNum(res), state.to);
  }
});
els.toAmount.addEventListener("input", () => {
  const val = parseFloat(els.toAmount.value) || 0;
  if (latestRate) {
    state.amount = round(val / latestRate, 4);
    els.fromAmount.value = state.amount; saveState();
    const t = I18N[state.lang];
    els.resultText.textContent = t.result(formatNum(state.amount), state.from, formatNum(val), state.to);
  }
});
els.fromCurrency.addEventListener("change", () => { state.from = els.fromCurrency.value; saveState(); refreshAll(); });
els.toCurrency.addEventListener("change", () => { state.to = els.toCurrency.value; saveState(); refreshAll(); });
els.swapBtn.addEventListener("click", () => { [state.from, state.to] = [state.to, state.from]; saveState(); refreshAll(); });

document.querySelectorAll(".lang-switch button").forEach(b=>
  b.addEventListener("click", () => { state.lang = b.dataset.lang; saveState(); applyLanguage(); refreshAll(); }));

document.querySelectorAll("#periodBtns button").forEach(b=>
  b.addEventListener("click", () => {
    state.days = +b.dataset.days; saveState(); applyPeriodActive();
    if (latestRate != null) { renderChart(buildHistory(state.days, latestRate)); updateChartNote(); }
  }));

window.addEventListener("resize", () => { if (chart) chart.resize(); });
window.addEventListener("orientationchange", () => setTimeout(()=>{ if (chart) chart.resize(); }, 300));

// ============ Start ============
applyLanguage();
refreshAll();
</script>
</body>
</html>
