<script>
// ============ Translations ============
const I18N = {
  uk: {
    title: "Конвертер Валют",
    from: "З валюти", to: "У валюту",
    chartTitle: "Історичний курс", swap: "Поміняти",
    loading: "Завантаження курсів...", loadingHist: "Завантаження історії...",

    noteMixed: "* Історичні дані на основі реальних курсів (ЄЦБ + опорні точки НБУ)",
    noteModel: "* Дані змодельовано (історія недоступна)",
    min:"Мін", max:"Макс", change:"Зміна",
    days: {7:"7Д",30:"30Д",90:"90Д",180:"180Д",270:"270Д",365:"1Р",1095:"3Р",1825:"5Р",3650:"10Р"}
  },
  en: {
    title: "Currency Converter",
    from: "From currency", to: "To currency",
    chartTitle: "Historical Rate", swap: "Swap",
    loading: "Loading rates...", loadingHist: "Loading history...",
    updated: "Updated:",
    error: "Failed to load data",
    rate: (a,b,r)=>`1 ${a} = ${r} ${b}`,
    result: (amt,a,res,b)=>`${amt} ${a} = ${res} ${b}`,
    noteReal: "* Real historical data (ECB / Frankfurter API)",
    noteMixed: "* Historical data from real rates (ECB + NBU reference points)",
    noteModel: "* Data modeled (history unavailable)",
    min:"Min", max:"Max", change:"Change",
    days: {7:"7D",30:"30D",90:"90D",180:"180D",270:"270D",365:"1Y",1095:"3Y",1825:"5Y",3650:"10Y"}
  }
};

// ============ 20 Currencies ============
const CURRENCY_NAMES = {
  UAH:{uk:"Гривня 🇺🇦",en:"Hryvnia 🇺🇦"},
  USD:{uk:"Долар США 🇺🇸",en:"US Dollar 🇺🇸"},
  EUR:{uk:"Євро 🇪🇺",en:"Euro 🇪🇺"},
  GBP:{uk:"Фунт 🇬🇧",en:"Pound 🇬🇧"},
  PLN:{uk:"Злотий 🇵🇱",en:"Zloty 🇵🇱"},
  JPY:{uk:"Єна 🇯🇵",en:"Yen 🇯🇵"},
  CHF:{uk:"Франк 🇨🇭",en:"Franc 🇨🇭"},
  CAD:{uk:"Канад. долар 🇨🇦",en:"Canadian Dollar 🇨🇦"},
  CNY:{uk:"Юань 🇨🇳",en:"Yuan 🇨🇳"},
  TRY:{uk:"Ліра 🇹🇷",en:"Lira 🇹🇷"},
  AUD:{uk:"Австрал. долар 🇦🇺",en:"Australian Dollar 🇦🇺"},
  NZD:{uk:"Новозел. долар 🇳🇿",en:"NZ Dollar 🇳🇿"},
  SEK:{uk:"Крона (SEK) 🇸🇪",en:"Swedish Krona 🇸🇪"},
  NOK:{uk:"Крона (NOK) 🇳🇴",en:"Norwegian Krone 🇳🇴"},
  DKK:{uk:"Крона (DKK) 🇩🇰",en:"Danish Krone 🇩🇰"},
  CZK:{uk:"Чеська крона 🇨🇿",en:"Czech Koruna 🇨🇿"},
  HUF:{uk:"Форинт 🇭🇺",en:"Forint 🇭🇺"},
  INR:{uk:"Рупія 🇮🇳",en:"Indian Rupee 🇮🇳"},
  KRW:{uk:"Вона 🇰🇷",en:"Won 🇰🇷"},
  MXN:{uk:"Песо 🇲🇽",en:"Mexican Peso 🇲🇽"}
};
const CURRENCIES = Object.keys(CURRENCY_NAMES);

// Currencies with REAL daily history in Frankfurter (ECB reference rates).
const FRANKFURTER_SUPPORTED = new Set([
  "USD","EUR","GBP","PLN","JPY","CHF","CAD","CNY",
  "AUD","NZD","SEK","NOK","DKK","CZK","HUF","INR","MXN","TRY"
]);
// NOT supported (no ECB history): UAH, KRW. Handled via reference anchor tables below.

// ============ Real historical anchor tables (USD per unit) ============
// Approximate yearly average / reference USD exchange rates for currencies
// NOT covered by ECB history. Values are UNITS PER 1 USD.
// Used to reconstruct historically-correct curves for UAH & KRW.
// Sources: NBU / historical market averages (approximate reference points).
const UAH_PER_USD = {
  2013: 8.15, 2014: 11.9, 2015: 21.8, 2016: 25.6, 2017: 26.6,
  2018: 27.2, 2019: 25.8, 2020: 27.0, 2021: 27.3, 2022: 32.3,
  2023: 36.6, 2024: 39.6, 2025: 41.5
};
const KRW_PER_USD = {
  2013: 1095, 2014: 1053, 2015: 1131, 2016: 1160, 2017: 1130,
  2018: 1100, 2019: 1165, 2020: 1180, 2021: 1144, 2022: 1291,
  2023: 1306, 2024: 1360, 2025: 1380
};

// Interpolate a per-USD value for a given date from a yearly anchor table.
function interpAnchor(table, date) {
  const y = date.getFullYear();
  const frac = (date - new Date(y,0,1)) / (new Date(y+1,0,1) - new Date(y,0,1));
  const years = Object.keys(table).map(Number).sort((a,b)=>a-b);
  const minY = years[0], maxY = years[years.length-1];
  if (y <= minY) return table[minY];
  if (y >= maxY) {
    // extrapolate slightly toward next using last slope, else clamp
    return table[maxY];
  }
  const v0 = table[y] ?? table[minY];
  const v1 = table[y+1] ?? v0;
  return v0 + (v1 - v0) * frac;
}

// ============ State ============
const DEFAULT_STATE = { lang:"uk", from:"USD", to:"UAH", amount:1, days:30 };
let state = loadState();
let chart = null, latestRate = null;
const histCache = {};

function loadState() {
  try { return { ...DEFAULT_STATE, ...(JSON.parse(localStorage.getItem("ccState"))||{}) }; }
  catch { return { ...DEFAULT_STATE }; }
}
function saveState() { localStorage.setItem("ccState", JSON.stringify(state)); }

// ============ DOM ============
const $ = id => document.getElementById(id);
const els = {
  fromAmount: $("fromAmount"), toAmount: $("toAmount"),
  fromCurrency: $("fromCurrency"), toCurrency: $("toCurrency"),
  swapBtn: $("swapBtn"), resultText: $("resultText"), rateText: $("rateText"),
  status: $("status"), appTitle: $("appTitle"), lblFrom: $("lblFrom"),
  lblTo: $("lblTo"), chartTitle: $("chartTitle"), chartNote: $("chartNote"),
  chartStats: $("chartStats")
};

// ============ UI ============
function populateSelects() {
  [els.fromCurrency, els.toCurrency].forEach(sel => {
    sel.innerHTML = "";
    CURRENCIES.forEach(c => {
      const opt = document.createElement("option");
      opt.value = c;
      opt.textContent = `${c} — ${CURRENCY_NAMES[c][state.lang]}`;
      sel.appendChild(opt);
    });
  });
  els.fromCurrency.value = state.from;
  els.toCurrency.value = state.to;
}

function applyLanguage() {
  const t = I18N[state.lang];
  els.appTitle.textContent = t.title;
  els.lblFrom.textContent = t.from;
  els.lblTo.textContent = t.to;
  els.chartTitle.textContent = t.chartTitle;
  els.swapBtn.title = t.swap;
  document.documentElement.lang = state.lang;
  document.title = state.lang === "uk"
    ? "Конвертер Валют — Live Currency Converter"
    : "Currency Converter — Live Exchange Rates";
  document.querySelectorAll(".lang-switch button").forEach(b=>
    b.classList.toggle("active", b.dataset.lang === state.lang));
  document.querySelectorAll("#periodBtns button").forEach(b=>
    b.textContent = t.days[b.dataset.days]);
  populateSelects();
  updateDisplay();
}

function applyPeriodActive() {
  document.querySelectorAll("#periodBtns button").forEach(b=>
    b.classList.toggle("active", +b.dataset.days === state.days));
}

// ============ APIs ============
const LIVE_API = "https://open.er-api.com/v6/latest/";
const FRANK_API = "https://api.frankfurter.app";

// Live rate for the current pair (all 20 currencies).
async function fetchLatest(from, to) {
  const res = await fetch(LIVE_API + from);
  if (!res.ok) throw new Error("HTTP " + res.status);
  const data = await res.json();
  if (data.result !== "success" || !data.rates || data.rates[to] == null)
    throw new Error("no rate");
  return data.rates[to];
}

// Fetch daily ECB history for a set of symbols relative to USD base.
// Returns { dates:[...], rates:{date:{SYM:val,...}} } where val = SYM per 1 USD.
async function fetchUsdBasedHistory(symbols, days) {
  const end = new Date();
  const start = new Date();
  start.setDate(end.getDate() - days);
  const fmt = d => d.toISOString().slice(0,10);
  const symList = [...symbols].filter(s => s !== "USD");
  // Frankfurter: base=USD, to=... returns "SYM per 1 USD"
  const url = `${FRANK_API}/${fmt(start)}..${fmt(end)}?from=USD&to=${symList.join(",")}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error("hist HTTP " + res.status);
  const data = await res.json();
  const rates = data.rates || {};
  const dates = Object.keys(rates).sort();
  if (!dates.length) throw new Error("no hist dates");
  return { dates, rates };
}

// Get "units of CUR per 1 USD" for a given date.
// - USD -> 1
// - Frankfurter-supported -> from ECB history (rates[date][CUR])
// - UAH / KRW -> interpolated from anchor tables (real reference points)
function perUsd(cur, date, ecbRatesForDate) {
  if (cur === "USD") return 1;
  if (FRANKFURTER_SUPPORTED.has(cur)) {
    const v = ecbRatesForDate ? ecbRatesForDate[cur] : null;
    return (v != null && isFinite(v)) ? v : null;
  }
  if (cur === "UAH") return interpAnchor(UAH_PER_USD, date);
  if (cur === "KRW") return interpAnchor(KRW_PER_USD, date);
  return null;
}

// Build historically-correct series for from->to over `days`.
// value(date) = (to per USD) / (from per USD)
async function buildHistory(from, to, days) {
  const key = `${from}|${to}|${days}`;
  if (histCache[key]) return histCache[key];

  const t = I18N[state.lang];
  let result;

  try {
    // Which symbols need ECB data?
    const needECB = new Set();
    if (FRANKFURTER_SUPPORTED.has(from)) needECB.add(from);
    if (FRANKFURTER_SUPPORTED.has(to)) needECB.add(to);
    needECB.add("EUR"); // harmless anchor, ensures valid request if only one symbol

    let ecb = null;
    let dates = null;

    // Only fetch if at least one endpoint is ECB-supported (need date backbone).
    if (needECB.size > 0) {
      ecb = await fetchUsdBasedHistory(needECB, days);
      dates = ecb.dates;
    }

    // If neither endpoint is ECB-supported (e.g. UAH<->KRW), build daily calendar.
    const usesAnchorOnly = !FRANKFURTER_SUPPORTED.has(from) && !FRANKFURTER_SUPPORTED.has(to);
    if (usesAnchorOnly || !dates) {
      dates = [];
      const end = new Date(), start = new Date(); start.setDate(end.getDate()-days);
      const stepD = Math.max(1, Math.round(days/160));
      for (let d = new Date(start); d <= end; d.setDate(d.getDate()+stepD))
        dates.push(new Date(d).toISOString().slice(0,10));
    }

    // Down-sample long ranges
    let maxPoints = days <= 90 ? dates.length : (days <= 365 ? 130 : 170);
    if (dates.length > maxPoints) {
      const step = dates.length / maxPoints;
      const sampled = [];
      for (let i=0;i<dates.length;i+=step) sampled.push(dates[Math.floor(i)]);
      const lastD = dates[dates.length-1];
      if (sampled[sampled.length-1] !== lastD) sampled.push(lastD);
      dates = sampled;
    }

    const usedAnchor = !FRANKFURTER_SUPPORTED.has(from) || !FRANKFURTER_SUPPORTED.has(to);

    const series = [];
    for (const dStr of dates) {
      const date = new Date(dStr);
      const ecbForDate = ecb ? ecb.rates[dStr] : null;
      const fromPU = perUsd(from, date, ecbForDate);
      const toPU   = perUsd(to,   date, ecbForDate);
      if (fromPU == null || toPU == null || fromPU === 0) continue;
      const v = toPU / fromPU; // to per 1 from
      if (isFinite(v)) series.push({ d: dStr, v });
    }
    if (!series.length) throw new Error("empty series");

    // Gentle calibration: nudge the LAST point to match live rate WITHOUT
    // distorting older data. Apply a tiny linear correction that fades to 0
    // going back in time, so 2017 stays ~27 while today matches the live API.
    if (latestRate != null && series.length > 1) {
      const lastV = series[series.length-1].v;
      const ratio = latestRate / lastV;
      if (isFinite(ratio) && ratio > 0 && Math.abs(ratio-1) < 0.4) {
        const n = series.length;
        series.forEach((p, i) => {
          const w = i / (n - 1);            // 0 at oldest -> 1 at newest
          const factor = 1 + (ratio - 1) * w; // full correction only at newest
          p.v = p.v * factor;
        });
      }
    }

    const loc = state.lang==="uk"?"uk-UA":"en-US";
    const longRange = days > 365;
    const opts = longRange ? {year:'2-digit', month:'short'} : {day:'2-digit', month:'2-digit'};
    const labels = [], values = [];
    for (const p of series) {
      labels.push(new Date(p.d).toLocaleDateString(loc, opts));
      values.push(Number(p.v.toFixed(4)));
    }

    result = { labels, values, real: !usedAnchor, mixed: usedAnchor };
  } catch (e) {
    console.warn("Real history failed, modeled fallback:", e);
    result = buildModeledHistory(from, to, days);
  }

  histCache[key] = result;
  return result;
}

// Fallback modeled history (only if all APIs fail)
function buildModeledHistory(from, to, days) {
  let points, stepDays;
  if (days <= 90) { points = days; stepDays = 1; }
  else if (days <= 365) { points = 60; stepDays = days/60; }
  else { points = 90; stepDays = days/90; }
  let seed = 0; const key = from + to + days;
  for (let i=0;i<key.length;i++) seed += key.charCodeAt(i);
  const rand = n => { const x = Math.sin(seed + n*1.37)*10000; return x - Math.floor(x); };
  const base = latestRate || 1;
  const vol = Math.min(0.35, 0.015 * Math.sqrt(days/30));
  const arr = []; let val = base;
  for (let i=0;i<points;i++){ val = Math.max(base*0.4, val + (rand(i)-0.5)*base*vol); arr.push(val); }
  arr[arr.length-1] = base;
  const today = new Date();
  const labels = [], values = [];
  const longRange = days > 365;
  const opts = longRange ? {year:'2-digit', month:'short'} : {day:'2-digit', month:'2-digit'};
  const loc = state.lang==="uk"?"uk-UA":"en-US";
  for (let i=points-1;i>=0;i--){
    const d = new Date(today); d.setDate(today.getDate() - Math.round((points-1-i)*stepDays));
    labels.push(d.toLocaleDateString(loc, opts));
    values.push(Number(arr[i].toFixed(4)));
  }
  return { labels, values, real:false, mixed:false };
}

// ============ Logic ============
function setStatus(msg, err=false){ els.status.innerHTML = msg; els.status.classList.toggle("error", err); }
function round(n,d=2){ return Number(n.toFixed(d)); }
function formatNum(n){
  return new Intl.NumberFormat(state.lang==="uk"?"uk-UA":"en-US",{maximumFractionDigits:4}).format(n);
}

function updateDisplay() {
  const t = I18N[state.lang];
  els.fromCurrency.value = state.from;
  els.toCurrency.value = state.to;
  els.fromAmount.value = state.amount;
  applyPeriodActive();
  if (latestRate != null) {
    const res = state.amount * latestRate;
    els.toAmount.value = round(res);
    els.resultText.textContent = t.result(formatNum(state.amount), state.from, formatNum(res), state.to);
    els.rateText.textContent = t.rate(state.from, state.to, round(latestRate,4));
  }
}

function renderStats(values) {
  if (!values || !values.length) { els.chartStats.innerHTML = ""; return; }
  const t = I18N[state.lang];
  const min = Math.min(...values), max = Math.max(...values);
  const first = values[0], last = values[values.length-1];
  const chg = first ? ((last-first)/first*100) : 0;
  const cls = chg >= 0 ? "up" : "down";
  const sign = chg >= 0 ? "▲" : "▼";
  els.chartStats.innerHTML =
    `<span>${t.min}: <b>${round(min,4)}</b></span>` +
    `<span>${t.max}: <b>${round(max,4)}</b></span>` +
    `<span>${t.change}: <b class="${cls}">${sign} ${Math.abs(chg).toFixed(2)}%</b></span>`;
}

async function loadHistoryAndRender() {
  const t = I18N[state.lang];
  setStatus(`<span class="loader"></span> ${t.loadingHist}`);
  try {
    const hist = await buildHistory(state.from, state.to, state.days);
    renderChart(hist);
    renderStats(hist.values);
    els.chartNote.textContent = hist.real ? t.noteReal : (hist.mixed ? t.noteMixed : t.noteModel);
    setStatus(`${t.updated} ${new Date().toLocaleString(state.lang==="uk"?"uk-UA":"en-US")}`);
  } catch (e) {
    console.error(e);
    setStatus(t.error, true);
  }
}

async function refreshAll() {
  const t = I18N[state.lang];
  if (state.from === state.to) {
    latestRate = 1; updateDisplay();
    renderChart({labels:["—"], values:[1]});
    els.chartStats.innerHTML=""; els.chartNote.textContent="";
    setStatus(""); return;
  }
  setStatus(`<span class="loader"></span> ${t.loading}`);
  try {
    latestRate = await fetchLatest(state.from, state.to);
    updateDisplay();
    await loadHistoryAndRender();
  } catch (e) {
    console.error("Rate fetch failed:", e);
    setStatus(t.error, true);
  }
}

// ============ Chart ============
function baseChartConfig(labels, values) {
  const ctx = $("chart").getContext("2d");
  const grad = ctx.createLinearGradient(0,0,0,280);
  grad.addColorStop(0,"rgba(102,126,234,0.35)");
  grad.addColorStop(1,"rgba(102,126,234,0.02)");
  return {
    type: "line",
    data: { labels, datasets: [{
      label: `${state.from}/${state.to}`, data: values,
      borderColor: "#667eea", backgroundColor: grad,
      fill: true, tension: 0.25, pointRadius: 0, pointHoverRadius: 5, borderWidth: 2
    }]},
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode:"index", intersect:false },
      plugins: {
        legend:{display:false},
        tooltip:{ callbacks:{ label:c=>`${round(c.parsed.y,4)} ${state.to}` } }
      },
      scales: {
        x:{ grid:{display:false}, ticks:{maxTicksLimit:8, font:{size:10}, autoSkip:true} },
        y:{ grid:{color:"#eef"}, ticks:{font:{size:10}} }
      }
    }
  };
}
function renderChart({labels, values}) {
  if (chart) chart.destroy();
  chart = new Chart($("chart"), baseChartConfig(labels, values));
}

// ============ Events ============
els.fromAmount.addEventListener("input", () => {
  state.amount = parseFloat(els.fromAmount.value) || 0; saveState();
  if (latestRate != null) {
    const res = state.amount * latestRate;
    els.toAmount.value = round(res);
    const t = I18N[state.lang];
    els.resultText.textContent = t.result(formatNum(state.amount), state.from, formatNum(res), state.to);
  }
});
els.toAmount.addEventListener("input", () => {
  const val = parseFloat(els.toAmount.value) || 0;
  if (latestRate) {
    state.amount = round(val / latestRate, 4);
    els.fromAmount.value = state.amount; saveState();
    const t = I18N[state.lang];
    els.resultText.textContent = t.result(formatNum(state.amount), state.from, formatNum(val), state.to);
  }
});
els.fromCurrency.addEventListener("change", () => { state.from = els.fromCurrency.value; saveState(); refreshAll(); });
els.toCurrency.addEventListener("change", () => { state.to = els.toCurrency.value; saveState(); refreshAll(); });
els.swapBtn.addEventListener("click", () => { [state.from, state.to] = [state.to, state.from]; saveState(); refreshAll(); });

document.querySelectorAll(".lang-switch button").forEach(b=>
  b.addEventListener("click", () => { state.lang = b.dataset.lang; saveState(); applyLanguage(); refreshAll(); }));

document.querySelectorAll("#periodBtns button").forEach(b=>
  b.addEventListener("click", () => {
    state.days = +b.dataset.days; saveState(); applyPeriodActive();
    if (latestRate != null && state.from !== state.to) loadHistoryAndRender();
  }));

window.addEventListener("resize", () => { if (chart) chart.resize(); });
window.addEventListener("orientationchange", () => setTimeout(()=>{ if (chart) chart.resize(); }, 300));

// ============ Start ============
applyLanguage();
refreshAll();
</script>
</body>
</html>
