<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bewerbungs-Generator</title>
<style>
:root{--bg:#f3f5fb;--card:#fff;--ink:#1b2234;--muted:#6a7389;--line:#dde2ee;--accent:#2f5bea;--accent-d:#2447c4;--danger:#d23b3b;--ok:#1f9d63;--radius:14px}
*{box-sizing:border-box}
html,body{margin:0;-webkit-text-size-adjust:100%}
body{font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 16px;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{display:flex;gap:10px;align-items:center;min-width:0}
.logo{flex:none;width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#2f5bea,#7a4bff);color:#fff;display:grid;place-items:center;font-weight:700;font-size:19px}
.brand b{display:block;font-size:16px;white-space:nowrap}
.brand small{color:var(--muted);display:block;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top-actions{display:flex;gap:6px;align-items:center;flex:none}
.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;max-width:1500px;margin:0 auto;padding:18px}
.layout>*{min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:0 1px 2px rgba(20,30,60,.04)}
.card h2{margin:0 0 12px;font-size:16px;display:flex;align-items:center;gap:8px}
.card h2 .n{flex:none;width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;font-size:13px;display:grid;place-items:center}
.hint{color:var(--muted);font-size:13px;margin:-6px 0 10px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid .full{grid-column:1/-1}
.grid.g2{grid-template-columns:1fr 1fr}
label{display:block;font-size:13px;color:var(--muted);min-width:0}
label>span{display:block;margin-bottom:4px}
label.req>span::after{content:" *";color:var(--danger)}
input,select,textarea{width:100%;min-width:0;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);outline:none;transition:.15s}
input[type=month],input[type=date]{min-height:40px}
textarea{resize:vertical;min-height:70px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,91,234,.15)}
.invalid{border-color:var(--danger)!important;box-shadow:0 0 0 3px rgba(210,59,59,.15)!important}
input:disabled{background:#f1f3f8}
.check{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;color:var(--ink)}
.check input{width:auto;margin-top:3px;flex:none}
.entry{border:1px dashed var(--line);border-radius:12px;padding:12px;margin-bottom:12px;background:#fafbff}
.entry-head{display:flex;justify-content:space-between;margin-bottom:8px;font-size:13px}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;cursor:pointer;transition:.15s;display:inline-flex;gap:6px;align-items:center;justify-content:center;min-height:38px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.primary:hover{background:var(--accent-d);color:#fff}
.btn.big{padding:13px 18px;font-size:16px;width:100%;min-height:48px}
.btn.busy{background:#46506b;border-color:#46506b}
.btn:disabled{opacity:.6;cursor:not-allowed}
.link{background:none;border:0;padding:4px 0;cursor:pointer;color:var(--accent);font-size:13px}
.link.danger{color:var(--danger)}
.spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.5);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.photo-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.photo-row input[type=file]{flex:1 1 180px;width:auto;max-width:100%;padding:6px}
.photo-prev{width:60px;height:80px;border-radius:8px;border:1px solid var(--line);background:#f1f3f8 center/cover;flex:none}
.retention{font-size:12.5px;color:var(--muted);margin:10px 2px 0;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.col-preview{position:sticky;top:64px;align-self:start}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tab{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:#fff;cursor:pointer}
.tab.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.dl-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.dl-bar select{width:auto;flex:1 1 150px}
.preview-box{position:relative;border:1px solid var(--line);border-radius:var(--radius);background:#dfe3ee;overflow:hidden}
.preview-scroll{max-height:calc(100vh - 200px);min-height:420px;overflow:auto;padding:14px}
.empty{display:grid;place-items:center;text-align:center;color:var(--muted);min-height:380px;padding:20px}
.paper-wrap{position:relative;overflow:hidden;box-shadow:0 4px 18px rgba(20,30,60,.18);background:#fff}
.paper{width:794px;min-height:1123px;background:#fff;color:#111;padding:76px 76px 76px 94px;font:14px/1.38 Arial,Helvetica,sans-serif;transform-origin:0 0}
.locked .paper{filter:blur(3.5px);user-select:none;pointer-events:none}
.lock-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;padding:14px}
.lock-card{pointer-events:auto;background:#fff;border-radius:16px;padding:20px;max-width:330px;text-align:center;box-shadow:0 10px 40px rgba(20,30,60,.3)}
.lock-card .ic{font-size:28px}.lock-card h3{margin:6px 0}.lock-card p{margin:0 0 14px;color:var(--muted);font-size:13.5px}
.p-sender{margin-bottom:34px}.p-recipient{margin-bottom:34px}.p-date{text-align:right;margin-bottom:22px}.p-subject{font-weight:700;margin-bottom:18px}
.paper p{margin:0 0 11px}.p-close{margin-top:6px;margin-bottom:46px!important}.p-encl{font-size:13px;margin-top:26px}
.cv-photo{float:right;width:132px;height:176px;object-fit:cover;margin:0 0 10px 18px}
.paper h1{font-size:28px;margin:0 0 18px}.paper section{display:flow-root;margin-bottom:14px}
.paper h3{font-size:16px;margin:0 0 8px;padding-bottom:3px;border-bottom:1px solid #111}
.cv-row{display:grid;grid-template-columns:170px 1fr;gap:8px;margin-bottom:8px;font-size:13.8px}
.cv-row ul{margin:3px 0 0;padding:0;list-style:none}.cv-row li{padding-left:14px;position:relative}.cv-row li::before{content:"–";position:absolute;left:0}
.cv-sign{margin-top:30px}
dialog{border:0;border-radius:16px;padding:0;max-width:520px;width:calc(100% - 24px);box-shadow:0 20px 60px rgba(20,30,60,.35)}
dialog::backdrop{background:rgba(15,20,40,.5)}
.dlg{padding:18px}.dlg h3{margin:0 0 12px}.dlg .row{margin-bottom:12px}
.dlg .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}
.pw{display:flex;gap:6px}
#toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:100;max-width:380px}
.toast{background:var(--ink);color:#fff;padding:10px 14px;border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.25);font-size:14px;animation:in .2s;word-break:break-word}
.toast.err{background:var(--danger)}.toast.ok{background:var(--ok)}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.small{font-size:12.5px;color:var(--muted)}.hidden{display:none!important}

@media(max-width:1000px){
  .layout{grid-template-columns:1fr;padding:12px;gap:8px}
  .col-preview{position:static}
  .preview-scroll{max-height:none;min-height:300px}
  .brand small{display:none}
}
@media(max-width:600px){
  body{font-size:16px}
  .top{padding:6px 10px}
  .layout{padding:8px}
  .card{padding:12px;border-radius:12px;margin-bottom:10px}
  .grid{grid-template-columns:1fr;gap:10px}
  .grid.g2{grid-template-columns:1fr 1fr}
  input,select,textarea{font-size:16px;padding:10px 11px}
  .btn{min-height:44px}
  #btnSettings .lbl{display:none}
  #uiLang{max-width:110px}
  .preview-scroll{padding:6px}
  .dl-bar .btn{flex:1 1 40%}
  .dl-bar select{flex:1 1 100%}
  .tab{flex:1;text-align:center}
  .entry{padding:10px}
  #toasts{left:10px;right:10px;bottom:10px;max-width:none}
  .retention{flex-direction:column}
  dialog{width:calc(100% - 16px)}
  .dlg .foot .btn{flex:1}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><div class="logo">B</div><div><b data-i18n="appTitle"></b><small data-i18n="tagline"></small></div></div>
  <div class="top-actions">
    <select id="uiLang" style="width:auto" aria-label="Language"><option value="ru">Русский</option><option value="uk">Українська</option><option value="en">English</option><option value="de">Deutsch</option></select>
    <button class="btn" id="btnSettings" type="button" aria-label="Settings">⚙<span class="lbl" data-i18n="settings"></span></button>
  </div>
</header>

<main class="layout">
<form id="form" autocomplete="off" novalidate>
  <section class="card">
    <h2><span class="n">1</span><span data-i18n="secTarget"></span></h2>
    <div class="grid">
      <label class="req"><span data-i18n="jobType"></span><select data-k="jobType"><option value="Minijob" data-i18n="jobMinijob"></option><option value="Ausbildung" data-i18n="jobAusbildung"></option><option value="Vollzeit" data-i18n="jobVollzeit"></option></select></label>
      <label class="req"><span data-i18n="jobTitle"></span><input data-k="jobTitle" data-i18n-ph="jobTitlePh"></label>
      <label class="req"><span data-i18n="company"></span><input data-k="company"></label>
      <label><span data-i18n="companyContact"></span><input data-k="companyContact" data-i18n-ph="companyContactPh"></label>
      <label class="full"><span data-i18n="companyAddress"></span><input data-k="companyAddress" data-i18n-ph="companyAddressPh"></label>
      <label class="full"><span data-i18n="startDate"></span><input data-k="startDate" data-i18n-ph="startDatePh"></label>
      <label class="full"><span data-i18n="notes"></span><textarea data-k="notes" data-i18n-ph="notesPh"></textarea></label>
    </div>
  </section>
  <section class="card">
    <h2><span class="n">2</span><span data-i18n="secPersonal"></span></h2>
    <div class="grid">
      <label class="req"><span data-i18n="firstName"></span><input data-k="firstName"></label>
      <label class="req"><span data-i18n="lastName"></span><input data-k="lastName"></label>
      <label><span data-i18n="birthDate"></span><input type="date" data-k="birthDate"></label>
      <label><span data-i18n="birthPlace"></span><input data-k="birthPlace"></label>
      <label><span data-i18n="nationality"></span><input data-k="nationality"></label>
      <label><span data-i18n="phone"></span><input type="tel" data-k="phone"></label>
      <label class="full"><span data-i18n="email"></span><input type="email" data-k="email"></label>
      <label class="full"><span data-i18n="street"></span><input data-k="street"></label>
      <label><span data-i18n="zip"></span><input data-k="zip" inputmode="numeric"></label>
      <label class="req"><span data-i18n="city"></span><input data-k="city"></label>
      <div class="full">
        <span class="small" data-i18n="photo"></span>
        <div class="photo-row"><div class="photo-prev" id="photoPrev"></div><input type="file" id="photoInput" accept="image/*"><button type="button" class="link danger hidden" id="photoRemove" data-i18n="photoRemove"></button></div>
        <div class="small" data-i18n="photoHint"></div>
      </div>
    </div>
  </section>
  <section class="card">
    <h2><span class="n">3</span><span data-i18n="secExperience"></span></h2>
    <div class="hint" data-i18n="secExperienceHint"></div>
    <div id="expList"></div>
    <button type="button" class="btn" data-act="add" data-list="experience">+ <span data-i18n="addExperience"></span></button>
  </section>
  <section class="card">
    <h2><span class="n">4</span><span data-i18n="secEducation"></span></h2>
    <div id="eduList"></div>
    <button type="button" class="btn" data-act="add" data-list="education">+ <span data-i18n="addEducation"></span></button>
  </section>
  <section class="card">
    <h2><span class="n">5</span><span data-i18n="secLanguages"></span></h2>
    <div id="langList"></div>
    <button type="button" class="btn" data-act="add" data-list="languages">+ <span data-i18n="addLanguage"></span></button>
  </section>
  <section class="card">
    <h2><span class="n">6</span><span data-i18n="secSkills"></span></h2>
    <div class="grid">
      <label class="full"><span data-i18n="skills"></span><textarea data-k="skills" data-i18n-ph="skillsPh"></textarea></label>
      <label class="full"><span data-i18n="interests"></span><textarea data-k="interests" data-i18n-ph="interestsPh" style="min-height:50px"></textarea></label>
    </div>
  </section>
  <section class="card">
    <label class="check"><input type="checkbox" data-k="consent"><span data-i18n="consent"></span></label>
    <div style="height:14px"></div>
    <button type="button" class="btn primary big" id="btnGenerate"><span id="genLabel"></span></button>
    <div class="retention"><span id="retentionInfo"></span><button type="button" class="link danger" id="btnDelete" data-i18n="deleteData"></button></div>
  </section>
</form>

<aside class="col-preview" id="previewCol">
  <div class="tabs hidden" id="tabs"><button type="button" class="tab" data-tab="letter" data-i18n="tabLetter"></button><button type="button" class="tab" data-tab="cv" data-i18n="tabCv"></button></div>
  <div class="dl-bar hidden" id="dlBar">
    <select id="dlParts"><option value="both" data-i18n="docsAll"></option><option value="letter" data-i18n="docsLetter"></option><option value="cv" data-i18n="docsCv"></option></select>
    <button type="button" class="btn primary" id="btnPdf">⬇ PDF</button>
    <button type="button" class="btn" id="btnDocx">⬇ DOCX</button>
  </div>
  <div class="preview-box">
    <div class="preview-scroll" id="stage"></div>
    <div class="lock-overlay hidden" id="lockOverlay"><div class="lock-card"><div class="ic">🔒</div><h3 data-i18n="lockedTitle"></h3><p data-i18n="lockedText"></p><button type="button" class="btn primary" id="btnUnlock" data-i18n="unlock"></button></div></div>
  </div>
</aside>
</main>

<dialog id="settingsDlg"><div class="dlg">
  <h3 data-i18n="settingsTitle"></h3>
  <div class="row"><label><span data-i18n="apiKey"></span><div class="pw"><input type="password" id="setKey" autocomplete="off" spellcheck="false"><button type="button" class="btn" id="setShow">👁</button></div></label><div class="small" data-i18n="apiKeyHint"></div></div>
  <div class="row"><label><span data-i18n="model"></span><input id="setModel" list="modelList" spellcheck="false" autocapitalize="off"></label>
    <datalist id="modelList"><option value="gemini-3.8-flash"><option value="gemini-3.8-pro"><option value="gemini-2.5-flash"><option value="gemini-2.5-pro"><option value="gemini-2.0-flash"></datalist>
    <div class="small" data-i18n="modelHint"></div></div>
  <div class="foot"><button type="button" class="btn" id="setClear" data-i18n="clearKey"></button><button type="button" class="btn primary" id="setSave" data-i18n="save"></button></div>
</div></dialog>

<dialog id="unlockDlg"><div class="dlg">
  <h3 data-i18n="unlockTitle"></h3><p data-i18n="unlockText"></p>
  <div id="payBox" class="hidden"><p><a class="btn primary" id="payLink" target="_blank" rel="noopener" data-i18n="payGo"></a></p>
    <label><span data-i18n="codeLabel"></span><div class="pw"><input id="codeInput" autocomplete="off"><button type="button" class="btn" id="codeApply" data-i18n="codeApply"></button></div></label></div>
  <div class="foot"><button type="button" class="btn" id="unlockCancel" data-i18n="cancel"></button><button type="button" class="btn primary" id="unlockDemoBtn" data-i18n="unlockDemo"></button></div>
</div></dialog>

<div id="toasts"></div>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.js"></script>

/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const debounce=(fn,ms)=>{let h;return(...a)=>{clearTimeout(h);h=setTimeout(()=>fn(...a),ms);};};
const nextFrame=()=>new Promise(r=>requestAnimationFrame(()=>setTimeout(r,0)));
function guessLang(){const l=(navigator.language||'en').slice(0,2).toLowerCase();return['ru','uk','de'].includes(l)?l:'en';}
let settings={uiLang:guessLang(),apiKey:'',model:DEFAULT_MODEL};
try{Object.assign(settings,JSON.parse(localStorage.getItem(LS_SETTINGS)||'{}'));}catch{}
if(!I18N[settings.uiLang])settings.uiLang='en';
if(!settings.model||settings.model==='gemini-2.5-flash')settings.model=DEFAULT_MODEL; // migrate old default
const saveSettings=()=>{try{localStorage.setItem(LS_SETTINGS,JSON.stringify(settings));}catch{}};
function t(k,v){let s=(I18N[settings.uiLang]||I18N.en)[k]??I18N.en[k]??k;if(v)for(const x in v)s=s.replace(`{${x}}`,v[x]);return s;}
function applyI18n(){
  $$('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));
  $$('[data-i18n-ph]').forEach(el=>el.placeholder=t(el.dataset.i18nPh));
  document.documentElement.lang=settings.uiLang;document.title=t('appTitle');$('#uiLang').value=settings.uiLang;
}
function toast(msg,type=''){const d=document.createElement('div');d.className='toast '+type;d.textContent=msg;$('#toasts').appendChild(d);setTimeout(()=>d.remove(),type==='err'?8000:3500);}

/* ---------- state ---------- */
const blankExp=()=>({id:uid(),from:'',to:'',current:false,position:'',employer:'',city:'',description:''});
const blankEdu=()=>({id:uid(),from:'',to:'',institution:'',degree:'',city:'',details:''});
const blankLang=()=>({id:uid(),language:'',level:'B1'});
const defaultForm=()=>({jobType:'Minijob',jobTitle:'',company:'',companyContact:'',companyAddress:'',startDate:'',notes:'',firstName:'',lastName:'',birthDate:'',birthPlace:'',nationality:'',street:'',zip:'',city:'',phone:'',email:'',photo:'',experience:[],education:[blankEdu()],languages:[blankLang()],skills:'',interests:'',consent:false});
const freshData=()=>({createdAt:null,updatedAt:null,form:defaultForm(),result:null,unlocked:false,tab:'letter'});
let data=freshData();
function purgeStorage(){try{localStorage.removeItem(LS_DATA);}catch{}data=freshData();}
function loadData(){
  try{
    const raw=localStorage.getItem(LS_DATA);if(!raw)return;
    const d=JSON.parse(raw),age=Date.now()-d.createdAt;
    if(!d.createdAt||age>RETENTION_MS||age<-86400000){purgeStorage();toast(t('expiredToast'));return;}
    data=Object.assign(freshData(),d);data.form=Object.assign(defaultForm(),d.form||{});
  }catch{purgeStorage();}
}
function saveData(){
  if(!data.createdAt)data.createdAt=Date.now(); // 30 days count from first save, never extended
  data.updatedAt=Date.now();
  try{localStorage.setItem(LS_DATA,JSON.stringify(data));}catch(e){console.warn('save failed',e);}
  updateRetention();
}
const saveSoon=debounce(saveData,300);
function checkExpiry(){if(data.createdAt&&Date.now()-data.createdAt>RETENTION_MS){purgeStorage();refreshAll();toast(t('expiredToast'));}}
function updateRetention(){
  $('#retentionInfo').textContent=data.createdAt?t('retention',{date:new Date(data.createdAt+RETENTION_MS).toLocaleDateString(LOCALES[settings.uiLang])}):t('retentionNone');
}

/* ---------- form ---------- */
const LEVELS=['native','C2','C1','B2','B1','A2','A1'];
function fld(list,i,f,label,val,o={}){
  const a=`data-list="${list}" data-i="${i}" data-f="${f}"`;
  const c=o.area?`<textarea ${a} placeholder="${esc(o.ph||'')}">${esc(val)}</textarea>`
    :`<input ${a} type="${o.type||'text'}" value="${esc(val)}" placeholder="${esc(o.ph||'')}" ${o.disabled?'disabled':''}>`;
  return `<label class="${o.full?'full':''}"><span>${esc(label)}</span>${c}</label>`;
}
const head=(list,i)=>`<div class="entry-head"><b>${esc(t('entry'))} ${i+1}</b><button type="button" class="link danger" data-act="remove" data-list="${list}" data-i="${i}">${esc(t('remove'))}</button></div>`;
function renderLists(){
  const f=data.form;
  $('#expList').innerHTML=f.experience.map((e,i)=>`<div class="entry">${head('experience',i)}<div class="grid">
    <div class="grid g2 full">${fld('experience',i,'from',t('from'),e.from,{type:'month'})}${fld('experience',i,'to',t('to'),e.to,{type:'month',disabled:e.current})}</div>
    <label class="check full"><input type="checkbox" data-list="experience" data-i="${i}" data-f="current" ${e.current?'checked':''}><span>${esc(t('current'))}</span></label>
    ${fld('experience',i,'position',t('position'),e.position)}${fld('experience',i,'employer',t('employer'),e.employer)}
    ${fld('experience',i,'city',t('location'),e.city,{full:true})}
    ${fld('experience',i,'description',t('description'),e.description,{area:true,full:true,ph:t('descriptionPh')})}</div></div>`).join('');
  $('#eduList').innerHTML=f.education.map((e,i)=>`<div class="entry">${head('education',i)}<div class="grid">
    <div class="grid g2 full">${fld('education',i,'from',t('from'),e.from,{type:'month'})}${fld('education',i,'to',t('to'),e.to,{type:'month'})}</div>
    ${fld('education',i,'institution',t('institution'),e.institution)}${fld('education',i,'degree',t('degree'),e.degree)}
    ${fld('education',i,'city',t('location'),e.city,{full:true})}${fld('education',i,'details',t('details'),e.details,{area:true,full:true})}</div></div>`).join('');
  $('#langList').innerHTML=f.languages.map((l,i)=>`<div class="entry">${head('languages',i)}<div class="grid g2">
    ${fld('languages',i,'language',t('language'),l.language)}
    <label><span>${esc(t('level'))}</span><select data-list="languages" data-i="${i}" data-f="level">${LEVELS.map(v=>`<option value="${v}" ${l.level===v?'selected':''}>${v==='native'?esc(t('native')):v}</option>`).join('')}</select></label></div></div>`).join('');
}
function syncForm(){
  $$('[data-k]').forEach(el=>{const v=data.form[el.dataset.k];if(el.type==='checkbox')el.checked=!!v;else el.value=v??'';});
  updatePhoto();
}
function updatePhoto(){const p=data.form.photo;$('#photoPrev').style.backgroundImage=p?`url(${p})`:'';$('#photoRemove').classList.toggle('hidden',!p);}
function onField(e){
  const el=e.target;
  if(el.dataset.k){data.form[el.dataset.k]=el.type==='checkbox'?el.checked:el.value;el.classList.remove('invalid');saveSoon();}
  else if(el.dataset.list){
    const it=data.form[el.dataset.list][+el.dataset.i];if(!it)return;
    if(el.type==='checkbox'){it[el.dataset.f]=el.checked;if(e.type==='change')renderLists();}else it[el.dataset.f]=el.value;
    saveSoon();
  }
}
const formEl=$('#form');
formEl.addEventListener('input',onField);formEl.addEventListener('change',onField);
formEl.addEventListener('submit',e=>e.preventDefault());
formEl.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const list=b.dataset.list;
  if(b.dataset.act==='add')data.form[list].push({experience:blankExp,education:blankEdu,languages:blankLang}[list]());
  else data.form[list].splice(+b.dataset.i,1);
  renderLists();saveSoon();
});
function processPhoto(file){
  return new Promise((res,rej)=>{
    const img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{const W=300,H=400,c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,W,H);
      const s=Math.max(W/img.width,H/img.height),w=img.width*s,h=img.height*s;g.drawImage(img,(W-w)/2,(H-h)/2,w,h);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',.85));};
    img.onerror=()=>rej(new Error('image'));img.src=url;
  });
}
$('#photoInput').addEventListener('change',async e=>{
  const f=e.target.files[0];if(!f)return;
  try{data.form.photo=await processPhoto(f);updatePhoto();saveSoon();}catch{toast('Image error','err');}
  e.target.value='';
});
$('#photoRemove').addEventListener('click',()=>{data.form.photo='';updatePhoto();saveSoon();});

/* ---------- Gemini ---------- */
const SYSTEM=`You are an expert German HR writer who creates application documents (Anschreiben and tabellarischer Lebenslauf) in correct, natural, professional German following DIN 5008 conventions.
The applicant's input may be in Russian, Ukrainian, English or German. Translate ALL content into German. Transliterate Cyrillic names, streets and cities into Latin letters using German conventions (e.g. Сергей -> Sergej, Харків -> Charkiw).
Strict rules:
- Never invent facts: no employers, positions, dates, diplomas, grades, numbers or skills that are not in the input. You may describe typical tasks of a stated position in modest, plausible wording.
- No placeholders such as [Name] or XXX. If information is missing, leave it out.
- Do not mention age, religion or marital status.
- Return ONLY one valid JSON object (no markdown) matching exactly the schema from the user.`;
const GUIDE={
  Minijob:'Minijob (geringfügige Beschäftigung): emphasise reliability, flexibility, availability (use hours/days from the notes if given), quick learning, friendly manner and relevant experience. Do not mention salary.',
  Ausbildung:'Ausbildung: emphasise motivation for the profession and company, school education, strengths, interest, willingness to learn, teamwork. With little work experience, highlight school, internships and hobbies. Subject: "Bewerbung um einen Ausbildungsplatz als ...".',

const SCHEMA=`{"personal":{"fullName":"","street":"","zip":"","city":"","phone":"","email":"","birthDate":"DD.MM.YYYY","birthPlace":"","nationality":"(German, e.g. ukrainisch)"},

"letter":{"subject":"","salutation":"Sehr geehrte Damen und Herren, (personal only if gender is clear)","paragraphs":["3-4 paragraphs, 200-260 words in total"],"closing":"Mit freundlichen Grüßen"},
"cv":{"experience":[{"period":"MM/YYYY – MM/YYYY or MM/YYYY – heute","title":"","employer":"","location":"","bullets":["2-4 short points"]}],
"education":[{"period":"","degree":"","institution":"","location":"","details":["optional"]}],
"languages":[{"language":"German name","level":"Muttersprache | Grundkenntnisse (A1) | Grundkenntnisse (A2) | Gute Kenntnisse (B1) | Gute Kenntnisse (B2) | Fließend (C1) | Verhandlungssicher (C2)"}],
"skills":[{"label":"e.g. EDV-Kenntnisse, Führerschein","value":""}],"interests":"comma separated or empty"}}`;

const fmtMonth=v=>/^\d{4}-\d{2}$/.test(v||'')?v.slice(5)+'/'+v.slice(0,4):(v||'');
function buildPrompt(f){

    experience:f.experience.filter(e=>e.position||e.employer).map(e=>({from:fmtMonth(e.from),to:e.current?'heute':fmtMonth(e.to),position:e.position,employer:e.employer,city:e.city,description:e.description})),
    education:f.education.filter(e=>e.institution||e.degree).map(e=>({from:fmtMonth(e.from),to:fmtMonth(e.to),institution:e.institution,degree:e.degree,city:e.city,details:e.details})),
    languages:f.languages.filter(l=>l.language.trim()).map(l=>({language:l.language,level:l.level==='native'?'native speaker':l.level})),
    skills:f.skills,interests:f.interests};
  return `Create a German Anschreiben and a tabellarischer Lebenslauf.
Job type guidance: ${GUIDE[f.jobType]||''}
Newest entries first. Keep given dates exactly (MM/YYYY). The letter must fit on one A4 page, be personal and concrete, use formal "Sie".

${SCHEMA}

APPLICANT DATA:
${JSON.stringify(p)}`;

function parseJson(txt){
  const s=txt.trim().replace(/^```(?:json)?/i,'').replace(/```$/,'').trim(),a=s.indexOf('{'),b=s.lastIndexOf('}');

let abortCtl=null,userCancelled=false;
async function callGemini(f){
  const model=(settings.model||'').trim().replace(/^models\//,'')||DEFAULT_MODEL;
  const url=`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`;
  const prompt=buildPrompt(f);
  let lean=false;
  for(let attempt=0;attempt<4;attempt++){
    const body=lean?{contents:[{role:'user',parts:[{text:SYSTEM+'\n\n'+prompt}]}],generationConfig:{temperature:.6}}
      :{systemInstruction:{parts:[{text:SYSTEM}]},contents:[{role:'user',parts:[{text:prompt}]}],generationConfig:{temperature:.6,responseMimeType:'application/json'}};
    abortCtl=new AbortController();
    let timedOut=false;const timer=setTimeout(()=>{timedOut=true;abortCtl.abort();},TIMEOUT_MS);
    let res,j;
    try{
      res=await fetch(url,{method:'POST',signal:abortCtl.signal,headers:{'Content-Type':'application/json','x-goog-api-key':settings.apiKey.trim()},body:JSON.stringify(body)});
      j=await res.json().catch(()=>({}));
    }catch(e){
      clearTimeout(timer);
      if(userCancelled)throw new Error(t('cancelled'));
      if(timedOut)throw new Error(t('errTimeout'));
      throw new Error(t('errNetwork'));
    }
    clearTimeout(timer);
    if(!res.ok){
      const msg=(j.error&&j.error.message)||('HTTP '+res.status);
      if(res.status===404||/not found|not supported/i.test(msg)&&res.status!==400)throw new Error(`$${t('errModel')} $${model}`);
      if(res.status===400&&!lean&&/json|instruction|mime/i.test(msg)){lean=true;continue;}
      if((res.status===503||res.status===429||res.status===500)&&attempt<3){await sleep(1500*(attempt+1));continue;}
      throw new Error(`$${t('errApi')}: $${msg}`);
    }
    const text=(((j.candidates||[])[0]||{}).content?.parts||[]).filter(p=>!p.thought).map(p=>p.text||'').join('');
    if(!text)throw new Error(`$${t('errApi')}: $${(j.promptFeedback&&j.promptFeedback.blockReason)||'empty response'}`);
    const ai=parseJson(text);
    if(!ai.letter||!Array.isArray(ai.letter.paragraphs)||!ai.letter.paragraphs.length)throw new Error(t('errParse'));
    return ai;
  }
  throw new Error(t('errApi'));
}

  sections.push({heading:'Persönliche Daten',items:rows.map(([l,v])=>({left:l,leftFixed:true,title:v}))});
  const exp=A(CV.experience).map(e=>({left:S(e.period),title:S(e.title),bold:true,sub:[S(e.employer),S(e.location)].filter(Boolean).join(', '),bullets:A(e.bullets).map(S).filter(Boolean)})).filter(i=>i.title||i.sub);
  if(exp.length)sections.push({heading:'Berufserfahrung',items:exp});
  const edu=A(CV.education).map(e=>({left:S(e.period),title:S(e.degree)||S(e.institution),bold:true,sub:(S(e.degree)?[S(e.institution),S(e.location)]:[S(e.location)]).filter(Boolean).join(', '),bullets:A(e.details).map(S).filter(Boolean)})).filter(i=>i.title);

let busy=false,tick=null,startedAt=0;
function setGenUi(){

function validate(){
  const f=data.form;$$('.invalid').forEach(x=>x.classList.remove('invalid'));
  const miss=['firstName','lastName','city','jobTitle','company'].filter(k=>!String(f[k]||'').trim());
  if(miss.length){miss.forEach(k=>$$(`[data-k="$${k}"]`).classList.add('invalid'));$$(`[data-k="$${miss[0]}"]`).scrollIntoView({behavior:'smooth',block:'center'});toast(t('errRequired'),'err');return false;}

  if(!settings.apiKey.trim()){toast(t('errKey'),'err');openSettings();return false;}

}
async function generate(){
  if(busy){userCancelled=true;if(abortCtl)abortCtl.abort();return;}
  if(!validate())return;
  busy=true;userCancelled=false;startedAt=Date.now();setGenUi();
  tick=setInterval(setGenUi,1000);
  await nextFrame(); // let the spinner paint before any heavy work
  try{
    const ai=await callGemini(data.form);

function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);}
const pdfSafe=s=>translit(String(s??'')).replace(/[–—‑]/g,'-').replace(/[„“”«»]/g,'"').replace(/[‘’‚]/g,"'").replace(/…/g,'...').replace(/[•·]/g,'-').replace(/€/g,'EUR').replace(/[^\x20-\x7E\xA0-\xFF]/g,'?');
function buildPdf(doc,parts){
  const{jsPDF}=window.jspdf,pdf=new jsPDF({unit:'mm',format:'a4',compress:true});
  const ML=25,MR=20,TOP=20,BOT=20,PW=210,PH=297,W=PW-ML-MR,PT=.3528,BS=10.5;let y=TOP;
  const setF=(s,b)=>{pdf.setFont('helvetica',b?'bold':'normal');pdf.setFontSize(s);};
  const lh=s=>s*PT*1.32,wrap=(str,s,b,w)=>{setF(s,b);return pdf.splitTextToSize(pdfSafe(str),w);};
  const newPage=()=>{pdf.addPage();y=TOP;};
  function write(str,o={}){
    const s=o.size||BS,b=!!o.bold,x=o.x??ML,w=o.width||W,h=lh(s);
    wrap(str,s,b,w).forEach(l=>{if(y+h>PH-BOT)newPage();setF(s,b);if(o.align==='right')pdf.text(l,x+w,y+s*PT,{align:'right'});else pdf.text(l,x,y+s*PT);y+=h;});
    y+=o.after||0;
  }
  function letter(){
    const L=doc.letter;
    L.senderLines.forEach((l,i)=>write(l,{bold:i===0,size:i===0?12:10}));
    y=Math.max(y+8,48);L.recipientLines.forEach(l=>write(l));y+=8;
    write(L.dateLine,{align:'right',after:8});write(L.subject,{bold:true,after:5});write(L.salutation,{after:3});
    L.paragraphs.forEach(p=>write(p,{after:3.5}));write(L.closing,{after:14});write(L.signatureName,{after:8});write(L.enclosure,{size:9.5});
  }
  function cv(){
    const pw=35,ph=45,LC=45;let phB=0;
    write('Lebenslauf',{size:20,bold:true,after:4});
    if(doc.photo){try{pdf.addImage(doc.photo,'JPEG',PW-MR-pw,TOP,pw,ph);phB=TOP+ph+3;}catch(e){console.warn(e);}}
    const curW=()=>y<phB?W-pw-6:W;
    doc.cv.sections.forEach(sec=>{
      y+=3;if(y+22>PH-BOT)newPage();
      write(sec.heading,{size:12,bold:true,width:curW()});
      pdf.setDrawColor(0);pdf.setLineWidth(.3);pdf.line(ML,y-.5,ML+curW(),y-.5);y+=2.5;
      sec.items.forEach(it=>{
        const rw=curW()-LC-2,bl=[];
        if(it.title)bl.push({ls:wrap(it.title,BS,!!it.bold,rw),bold:!!it.bold,x:ML+LC});
        if(it.sub)bl.push({ls:wrap(it.sub,BS,false,rw),bold:false,x:ML+LC});
        (it.bullets||[]).forEach(b=>bl.push({ls:wrap(b,BS,false,rw-4),bold:false,x:ML+LC+4,mark:true}));
        const total=bl.reduce((a,b)=>a+b.ls.length*lh(BS),0);
        if(y+Math.min(total,20)>PH-BOT)newPage();
        const sy=y,sp=pdf.internal.getNumberOfPages(),leftLs=it.left?wrap(it.left,BS,false,LC-3):[];
        setF(BS,false);leftLs.forEach((l,k)=>pdf.text(l,ML,sy+BS*PT+k*lh(BS)));
        bl.forEach(b=>b.ls.forEach((l,k)=>{if(y+lh(BS)>PH-BOT)newPage();setF(BS,b.bold);if(b.mark&&k===0)pdf.text('-',b.x-3,y+BS*PT);pdf.text(l,b.x,y+BS*PT);y+=lh(BS);}));
        if(pdf.internal.getNumberOfPages()===sp)y=Math.max(y,sy+leftLs.length*lh(BS));
        y+=2;

    });
    y+=8;if(y+30>PH-BOT)newPage();

  }

  if(parts!=='letter'){if(parts!=='cv')newPage();cv();}
  pdf.save(doc.fileBase+'.pdf');
}

        cell(6500,[para('Lebenslauf',{bold:true,size:40})]),
        cell(2854,[new D.Paragraph({alignment:D.AlignmentType.RIGHT,children:[new D.ImageRun({data:bytes,type:'jpg',transformation:{width:132,height:176}})]})])
      ]})],[6500,2854]));
    }else c.push(para('Lebenslauf',{bold:true,size:40,after:120}));
    doc.cv.sections.forEach(sec=>{
      c.push(new D.Paragraph({children:[run(sec.heading,{bold:true,size:24})],keepNext:true,spacing:{before:300,after:120},
        border:{bottom:{style:D.BorderStyle.SINGLE,size:6,color:'000000',space:2}}}));
      c.push(table(sec.items.map(itemRow),[2550,6804]));
    });
    c.push(para(doc.cv.dateLine,{before:500}));
    c.push(para(doc.cv.name,{before:700}));
    return c;
  }
  const props={page:{size:{width:11906,height:16838},margin:{top:1134,bottom:1134,left:1417,right:1134}}};
  const sections=[];
  if(parts!=='cv')sections.push({properties:props,children:letter()});
  if(parts!=='letter')sections.push({properties:props,children:cv()});
  const d=new D.Document({creator:'Bewerbungs-Generator',styles:{default:{document:{run:{font:F,size:21}}}},sections});
  download(await D.Packer.toBlob(d),doc.fileBase+'.docx');
}

});
