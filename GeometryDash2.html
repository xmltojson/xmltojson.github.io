<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geometry Dash</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Segoe UI', Tahoma, sans-serif;
        user-select: none;
    }

    body {
        background: linear-gradient(135deg, #1a1a2e, #16213e);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        overflow: hidden;
    }

    #gameContainer {
        position: relative;
        box-shadow: 0 0 50px rgba(0, 200, 255, 0.4);
        border-radius: 10px;
        overflow: hidden;
    }

    canvas {
        display: block;
        background: #000;
    }

    #ui {
        position: absolute;
        top: 15px;
        left: 15px;
        color: #fff;
        font-size: 18px;
        text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        z-index: 10;
    }

    #ui div { margin-bottom: 5px; }

    .progress-bar {
        position: absolute;
        top: 15px;
        left: 50%;
        transform: translateX(-50%);
        width: 300px;
        height: 18px;
        background: rgba(0,0,0,0.4);
        border-radius: 10px;
        overflow: hidden;
        border: 2px solid rgba(255,255,255,0.3);
        z-index: 10;
    }

    .progress-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #00ffcc, #00ccff);
        transition: width 0.1s linear;
    }

    .progress-text {
        position: absolute;
        top: 0; left: 0;
        width: 100%; text-align: center;
        color: #fff; font-size: 12px; line-height: 18px;
        font-weight: bold; text-shadow: 1px 1px 2px #000;
    }

    #menu {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: rgba(10, 10, 30, 0.95);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        z-index: 20;
        padding: 30px;
        overflow-y: auto;
    }

    #menu h1 {
        font-size: 48px;
        background: linear-gradient(90deg, #00ffcc, #00ccff, #ff00cc);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 10px;
        text-align: center;
    }

    #menu p.subtitle {
        color: #aaa;
        margin-bottom: 25px;
    }

    .levels-grid {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 15px;
        max-width: 700px;
    }

    .level-card {
        width: 110px;
        height: 130px;
        border-radius: 12px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: transform 0.2s, box-shadow 0.2s;
        position: relative;
        color: #fff;
        border: 3px solid rgba(255,255,255,0.2);
    }

    .level-card:hover {
        transform: scale(1.08);
        box-shadow: 0 0 20px rgba(0, 200, 255, 0.7);
    }

    .level-card .num {
        font-size: 36px;
        font-weight: bold;
    }

    .level-card .name {
        font-size: 11px;
        margin-top: 5px;
        text-align: center;
    }

    .level-card .best {
        font-size: 10px;
        margin-top: 5px;
        color: #ffe600;
    }

    .level-card.locked {
        opacity: 0.4;
        cursor: not-allowed;
        filter: grayscale(1);
    }

    .level-card.completed::after {
        content: '★';
        position: absolute;
        top: 5px; right: 8px;
        color: #ffe600;
        font-size: 20px;
    }

    #overlay {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: rgba(0,0,0,0.75);
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 15;
        color: #fff;
    }

    #overlay h2 {
        font-size: 42px;
        margin-bottom: 15px;
    }

    #overlay p { font-size: 20px; margin-bottom: 20px; }

    button {
        background: linear-gradient(90deg, #00ccff, #0088ff);
        color: #fff;
        border: none;
        padding: 12px 30px;
        font-size: 18px;
        border-radius: 8px;
        cursor: pointer;
        margin: 5px;
        transition: transform 0.15s;
        font-weight: bold;
    }

    button:hover { transform: scale(1.05); }

    .reset-btn {
        background: linear-gradient(90deg, #ff5555, #cc0000);
        margin-top: 25px;
        padding: 8px 20px;
        font-size: 14px;
    }

    .attempt-badge {
        position: absolute;
        bottom: 15px; right: 15px;
        color: #fff; font-size: 16px;
        text-shadow: 1px 1px 3px #000;
        z-index: 10;
    }

    .hint {
        position: absolute;
        bottom: 40%; left: 50%;
        transform: translateX(-50%);
        color: rgba(255,255,255,0.7);
        font-size: 22px;
        z-index: 5;
        animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
        0%,100% { opacity: 0.4; }
        50% { opacity: 1; }
    }
</style>
</head>
<body>
<div id="gameContainer">
    <canvas id="game" width="800" height="500"></canvas>

    <div id="ui">
        <div id="levelName">Level 1</div>
        <div id="modeInfo"></div>
    </div>

    <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
        <div class="progress-text" id="progressText">0%</div>
    </div>

    <div class="attempt-badge" id="attemptBadge">Attempt 1</div>
    <div class="hint" id="hint">Press SPACE / Click to Jump</div>

    <div id="menu">
        <h1>GEOMETRY DASH</h1>
        <p class="subtitle">Jump, Fly, Survive — 10 Levels Await</p>
        <div class="levels-grid" id="levelsGrid"></div>
        <button class="reset-btn" onclick="game.resetProgress()">Reset Progress</button>
    </div>

    <div id="overlay">
        <h2 id="overlayTitle">Game Over</h2>
        <p id="overlayText"></p>
        <div>
            <button onclick="game.retry()">Retry</button>
            <button onclick="game.nextLevel()" id="nextBtn" style="display:none">Next Level</button>
            <button onclick="game.toMenu()">Menu</button>
        </div>
    </div>
</div>

<script>
// ============ GAME STATE / STORAGE ============
const STORAGE_KEY = 'geometryDashState';

function defaultState() {
    return {
        unlocked: 1,          // highest unlocked level (>=1 always)
        completed: {},        // {levelIndex: true}
        best: {},             // {levelIndex: percent}
        attempts: {},         // {levelIndex: count}
        currentLevel: null    // level being played (for restore)
    };
}

function loadState() {
    try {
        const s = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (s && typeof s === 'object') {
            // Sanitize — ensure required fields exist & Level 1 always unlocked
            const d = defaultState();
            return {
                unlocked: (typeof s.unlocked === 'number' && s.unlocked >= 1) ? s.unlocked : 1,
                completed: s.completed || d.completed,
                best: s.best || d.best,
                attempts: s.attempts || d.attempts,
                currentLevel: (s.currentLevel !== undefined) ? s.currentLevel : null
            };
        }
    } catch(e){}
    return defaultState();
}

function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

let state = loadState();

// ============ LEVEL DEFINITIONS ============
const THEMES = [
    {name:"Stereo Madness", bg:["#1e3c72","#2a5298"], player:"#00ffcc", ground:"#0a1a3a"},
    {name:"Back On Track",  bg:["#8e2de2","#4a00e0"], player:"#ffcc00", ground:"#2a0a4a"},
    {name:"Polargeist",     bg:["#134e5e","#71b280"], player:"#ff5e62", ground:"#0a3a2a"},
    {name:"Dry Out",        bg:["#c94b4b","#4b134f"], player:"#00ffff", ground:"#3a0a2a"},
    {name:"Base After Base",bg:["#ff512f","#dd2476"], player:"#00ff88", ground:"#4a1a0a"},
    {name:"Cant Let Go",    bg:["#2b5876","#4e4376"], player:"#ffee00", ground:"#0a1a3a"},
    {name:"Jumper",         bg:["#eb3349","#f45c43"], player:"#00ccff", ground:"#4a0a1a"},
    {name:"Time Machine",   bg:["#141e30","#243b55"], player:"#ff44cc", ground:"#0a0a2a"},
    {name:"Cycles",         bg:["#0f0c29","#302b63"], player:"#44ffaa", ground:"#141230"},
    {name:"xStep Fury",     bg:["#000428","#004e92"], player:"#ff2200", ground:"#000a2a"},
];

const GROUND_Y = 420;
const TILE = 40;

function generateLevel(idx) {
    const rng = mulberry32(idx * 9999 + 12345);
    const objects = [];
    const difficulty = idx;
    let x = 600;
    const length = 5000 + idx * 800;

    while (x < length) {
        const r = rng();
        const gap = 180 - difficulty * 8 + rng() * 100;

        if (idx >= 4 && r < 0.12) {
            objects.push({type:'portal', mode:'fly', x:x});
            let fx = x + 100;
            const flyLen = 800 + rng()*600;
            while (fx < x + flyLen) {
                objects.push({type:'block', x:fx, y: GROUND_Y - 100 - rng()*180, w:TILE, h:TILE});
                if (rng() < 0.5)
                    objects.push({type:'block', x:fx, y: GROUND_Y - 350 - rng()*40, w:TILE, h:TILE});
                fx += 160 + rng()*120;
            }
            objects.push({type:'portal', mode:'cube', x:fx});
            x = fx + 200;
        } else if (r < 0.25 + difficulty*0.02) {
            const count = 1 + Math.floor(rng() * (1 + difficulty*0.4));
            for (let i=0;i<count;i++){
                objects.push({type:'spike', x:x + i*TILE, y:GROUND_Y});
            }
            x += count*TILE + gap;
        } else if (r < 0.5) {
            const h = TILE * (1 + Math.floor(rng()*2));
            objects.push({type:'block', x:x, y:GROUND_Y - h, w:TILE, h:h});
            if (rng() < 0.3 && idx > 2)
                objects.push({type:'spike', x:x, y:GROUND_Y - h});
            x += TILE + gap;
        } else if (r < 0.65 && idx > 1) {
            objects.push({type:'orb', x:x, y:GROUND_Y - 120 - rng()*60});
            objects.push({type:'spike', x:x + 60, y:GROUND_Y});
            x += gap + 60;
        } else if (r < 0.8) {
            const steps = 2 + Math.floor(rng()*2);
            for (let i=0;i<steps;i++){
                const h = TILE*(i+1);
                objects.push({type:'block', x:x + i*TILE, y:GROUND_Y-h, w:TILE, h:h});
            }
            x += steps*TILE + gap;
        } else {
            objects.push({type:'spike', x:x, y:GROUND_Y});
            if (idx > 3) objects.push({type:'spike', x:x+TILE, y:GROUND_Y});
            x += gap + TILE;
        }
    }
    return {length: length + 400, objects, theme: THEMES[idx]};
}

function mulberry32(a){
    return function(){
        a |= 0; a = a + 0x6D2B79F5 | 0;
        let t = Math.imul(a ^ a >>> 15, 1 | a);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
    }
}

// ============ GAME ENGINE ============
class Game {
    constructor() {
        this.canvas = document.getElementById('game');
        this.ctx = this.canvas.getContext('2d');
        this.W = this.canvas.width;
        this.H = this.canvas.height;
        this.running = false;
        this.levelIdx = 0;
        this.particles = [];
        this.bgOffset = 0;
        this.setupInput();
        this.buildMenu();
        this.loop = this.loop.bind(this);
        requestAnimationFrame(this.loop);
    }

    buildMenu() {
        const grid = document.getElementById('levelsGrid');
        grid.innerHTML = '';
        for (let i=0;i<10;i++){
            const card = document.createElement('div');
            card.className = 'level-card';
            const th = THEMES[i];
            card.style.background = `linear-gradient(135deg, ${th.bg[0]}, ${th.bg[1]})`;

            // FIX: Level index i is unlocked when (i+1) <= state.unlocked.
            // Level 1 (i=0) => 1 <= unlocked (min 1) => always unlocked.
            const unlocked = (i + 1) <= state.unlocked;

            if (!unlocked) card.classList.add('locked');
            if (state.completed[i]) card.classList.add('completed');
            const best = state.best[i] || 0;
            card.innerHTML = `<div class="num">${i+1}</div>
                <div class="name">${th.name}</div>
                <div class="best">${unlocked ? 'Best: '+best+'%' : '🔒 Locked'}</div>`;
            if (unlocked) {
                card.onclick = () => this.startLevel(i);
            }
            grid.appendChild(card);
        }
    }

    startLevel(idx) {
        this.levelIdx = idx;
        this.level = generateLevel(idx);
        state.currentLevel = idx;
        if (state.attempts[idx] === undefined) state.attempts[idx] = 0;
        saveState();
        document.getElementById('menu').style.display = 'none';
        document.getElementById('overlay').style.display = 'none';
        this.resetRun();
    }

    resetRun() {
        state.attempts[this.levelIdx] = (state.attempts[this.levelIdx]||0)+1;
        saveState();
        this.player = {
            x: 100, y: GROUND_Y - TILE, vy: 0, size: TILE-4,
            onGround: true, rotation: 0, mode: 'cube', dead: false
        };
        this.camX = 0;
        this.speed = 5.5 + this.levelIdx * 0.2;
        this.progress = 0;
        this.particles = [];
        this.running = true;
        this.won = false;
        document.getElementById('levelName').textContent = `Level ${this.levelIdx+1}: ${this.level.theme.name}`;
        document.getElementById('attemptBadge').textContent = `Attempt ${state.attempts[this.levelIdx]}`;
        document.getElementById('hint').style.display = 'block';
    }

    setupInput() {
        const jump = () => {
            if (this.running && !this.player.dead) {
                this.doJump();
            }
        };
        window.addEventListener('keydown', (e)=>{
            if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); this.pressing=true; jump(); }
        });
        window.addEventListener('keyup', (e)=>{
            if (e.code === 'Space' || e.code === 'ArrowUp') this.pressing=false;
        });
        this.canvas.addEventListener('mousedown', ()=>{ this.pressing=true; jump(); });
        this.canvas.addEventListener('mouseup', ()=>{ this.pressing=false; });
        this.canvas.addEventListener('touchstart', (e)=>{ e.preventDefault(); this.pressing=true; jump(); });
        this.canvas.addEventListener('touchend', ()=>{ this.pressing=false; });
    }

    doJump() {
        const p = this.player;
        document.getElementById('hint').style.display = 'none';
        if (p.mode === 'cube') {
            let usedOrb = false;
            for (const o of this.level.objects) {
                if (o.type==='orb') {
                    if (Math.abs(o.x - this.camX - p.x) < 45 && Math.abs(o.y - (p.y+p.size/2)) < 60) {
                        p.vy = -13; usedOrb = true;
                        this.spawnParticles(p.x, p.y, '#ffff00', 12);
                        break;
                    }
                }
            }
            if (!usedOrb && p.onGround) {
                p.vy = -13.5;
                p.onGround = false;
            }
        }
    }

    update() {
        if (!this.running) return;
        const p = this.player;
        if (p.dead) return;

        this.camX += this.speed;
        p.x = 100;

        if (p.mode === 'cube') {
            p.vy += 0.75;
            p.y += p.vy;
            if (!p.onGround) p.rotation += this.speed * 0.9;
        } else {
            if (this.pressing) p.vy -= 0.6; else p.vy += 0.55;
            p.vy = Math.max(-8, Math.min(8, p.vy));
            p.y += p.vy;
            p.rotation = p.vy * 2;
        }

        const groundTop = GROUND_Y - p.size;
        if (p.y >= groundTop && p.mode==='cube') {
            p.y = groundTop; p.vy = 0;
            if (!p.onGround) { p.rotation = Math.round(p.rotation/90)*90; }
            p.onGround = true;
        } else if (p.mode==='cube') {
            p.onGround = false;
        }
        if (p.mode==='fly') {
            if (p.y < 40) { p.y=40; p.vy=0; }
            if (p.y > groundTop) { p.y=groundTop; p.vy=0; }
        }

        const px = p.x, py = p.y, ps = p.size;
        for (const o of this.level.objects) {
            const ox = o.x - this.camX;
            if (ox < -100 || ox > this.W+100) continue;

            if (o.type === 'portal') {
                if (Math.abs(ox - px) < 30 && p.mode !== o.mode) {
                    p.mode = o.mode;
                    p.vy = 0;
                    this.spawnParticles(px, py, o.mode==='fly'?'#00ffff':'#ffaa00', 20);
                }
            } else if (o.type === 'spike') {
                const sx = ox;
                if (px + ps*0.75 > sx && px + ps*0.25 < sx + TILE) {
                    if (py + ps > o.y - TILE*0.5) {
                        this.die();
                    }
                }
            } else if (o.type === 'block') {
                const bx=ox, by=o.y, bw=o.w, bh=o.h;
                if (px+ps > bx+4 && px < bx+bw-4 && py+ps > by && py < by+bh) {
                    if (p.vy >= 0 && py + ps - p.vy <= by + 12) {
                        p.y = by - ps; p.vy=0; p.onGround=true;
                        if (p.mode==='cube') p.rotation = Math.round(p.rotation/90)*90;
                    } else {
                        this.die();
                    }
                }
            }
        }

        this.progress = Math.min(100, Math.floor((this.camX / (this.level.length - this.W)) * 100));
        document.getElementById('progressFill').style.width = this.progress + '%';
        document.getElementById('progressText').textContent = this.progress + '%';

        if (this.camX >= this.level.length - this.W) {
            this.win();
        }

        for (const pt of this.particles) {
            pt.x += pt.vx; pt.y += pt.vy; pt.vy += 0.2; pt.life--;
        }
        this.particles = this.particles.filter(p=>p.life>0);

        if (Math.random()<0.7)
            this.particles.push({x:px, y:py+ps/2, vx:-this.speed*0.3, vy:(Math.random()-0.5)*1.5,
                life:20, color:this.level.theme.player, size:5});
    }

    die() {
        const p = this.player;
        p.dead = true;
        this.running = false;
        this.spawnParticles(p.x, p.y, this.level.theme.player, 40);
        if (this.progress > (state.best[this.levelIdx]||0)) {
            state.best[this.levelIdx] = this.progress;
        }
        saveState();
        setTimeout(()=>{
            document.getElementById('overlayTitle').textContent = 'Game Over';
            document.getElementById('overlayText').textContent =
                `You reached ${this.progress}%  |  Best: ${state.best[this.levelIdx]||0}%`;
            document.getElementById('nextBtn').style.display = 'none';
            document.getElementById('overlay').style.display = 'flex';
        }, 600);
    }

    win() {
        this.running = false;
        this.won = true;
        state.completed[this.levelIdx] = true;
        state.best[this.levelIdx] = 100;
        if (this.levelIdx+1 >= state.unlocked && this.levelIdx < 9) {
            state.unlocked = this.levelIdx + 2;
        }
        saveState();
        document.getElementById('overlayTitle').textContent = '🎉 Level Complete!';
        document.getElementById('overlayText').textContent =
            `${this.level.theme.name} cleared in ${state.attempts[this.levelIdx]} attempts!`;
        document.getElementById('nextBtn').style.display =
            (this.levelIdx < 9) ? 'inline-block' : 'none';
        document.getElementById('overlay').style.display = 'flex';
    }

    spawnParticles(x,y,color,n) {
        for (let i=0;i<n;i++){
            const a = Math.random()*Math.PI*2;
            const s = Math.random()*6+2;
            this.particles.push({x,y,vx:Math.cos(a)*s, vy:Math.sin(a)*s,
                life:30+Math.random()*20, color, size:Math.random()*6+3});
        }
    }

    retry() {
        document.getElementById('overlay').style.display='none';
        this.resetRun();
    }
    nextLevel() {
        if (this.levelIdx < 9) this.startLevel(this.levelIdx+1);
    }
    toMenu() {
        this.running=false;
        state.currentLevel=null;
        saveState();
        document.getElementById('overlay').style.display='none';
        this.buildMenu();
        document.getElementById('menu').style.display='flex';
    }

    resetProgress() {
        if (confirm('Reset all progress? This cannot be undone.')) {
            state = defaultState();
            saveState();
            this.buildMenu();
        }
    }

    draw() {
        const ctx = this.ctx;
        const th = this.level ? this.level.theme : THEMES[0];

        const g = ctx.createLinearGradient(0,0,0,this.H);
        g.addColorStop(0, th.bg[0]);
        g.addColorStop(1, th.bg[1]);
        ctx.fillStyle = g;
        ctx.fillRect(0,0,this.W,this.H);

        if (!this.level) return;

        this.bgOffset -= 0.5;
        ctx.save();
        ctx.globalAlpha = 0.08;
        ctx.fillStyle = '#fff';
        for (let i=0;i<10;i++){
            const bx = ((i*220 + this.bgOffset)%1000+1000)%1000 - 100;
            ctx.fillRect(bx, 60 + (i%3)*90, 120, 120);
        }
        ctx.restore();

        for (const o of this.level.objects) {
            const ox = o.x - this.camX;
            if (ox < -60 || ox > this.W+60) continue;

            if (o.type==='spike') {
                ctx.fillStyle = '#fff';
                ctx.strokeStyle = 'rgba(0,0,0,0.4)';
                ctx.beginPath();
                ctx.moveTo(ox, o.y);
                ctx.lineTo(ox+TILE/2, o.y-TILE);
                ctx.lineTo(ox+TILE, o.y);
                ctx.closePath();
                ctx.fill(); ctx.stroke();
            } else if (o.type==='block') {
                ctx.fillStyle = '#111';
                ctx.fillRect(ox, o.y, o.w, o.h);
                ctx.strokeStyle = th.player;
                ctx.lineWidth = 3;
                ctx.strokeRect(ox+1.5, o.y+1.5, o.w-3, o.h-3);
                ctx.lineWidth = 1;
            } else if (o.type==='orb') {
                const t = Date.now()/200;
                ctx.save();
                ctx.translate(ox, o.y);
                ctx.fillStyle = 'rgba(255,255,0,0.3)';
                ctx.beginPath(); ctx.arc(0,0,18+Math.sin(t)*3,0,7); ctx.fill();
                ctx.fillStyle = '#ffee00';
                ctx.beginPath(); ctx.arc(0,0,11,0,7); ctx.fill();
                ctx.restore();
            } else if (o.type==='portal') {
                ctx.save();
                ctx.translate(ox, GROUND_Y-90);
                const col = o.mode==='fly'?'#00ffff':'#ffaa00';
                ctx.strokeStyle = col; ctx.lineWidth=6;
                ctx.globalAlpha=0.9;
                ctx.beginPath(); ctx.ellipse(0,0,22,55,0,0,7); ctx.stroke();
                ctx.globalAlpha=0.2; ctx.fillStyle=col;
                ctx.beginPath(); ctx.ellipse(0,0,22,55,0,0,7); ctx.fill();
                ctx.restore();
            }
        }

        ctx.fillStyle = th.ground;
        ctx.fillRect(0, GROUND_Y, this.W, this.H-GROUND_Y);
        ctx.strokeStyle = th.player;
        ctx.lineWidth=3;
        ctx.beginPath(); ctx.moveTo(0,GROUND_Y); ctx.lineTo(this.W,GROUND_Y); ctx.stroke();
        ctx.strokeStyle='rgba(255,255,255,0.08)';
        ctx.lineWidth=2;
        for(let i=0;i<20;i++){
            const lx = ((i*60 - this.camX*0.5)%1200+1200)%1200 - 100;
            ctx.beginPath(); ctx.moveTo(lx, GROUND_Y); ctx.lineTo(lx-30, this.H); ctx.stroke();
        }

        for (const pt of this.particles) {
            ctx.globalAlpha = Math.max(0, pt.life/40);
            ctx.fillStyle = pt.color;
            ctx.fillRect(pt.x-pt.size/2, pt.y-pt.size/2, pt.size, pt.size);
        }
        ctx.globalAlpha=1;

        if (!this.player.dead || this.won) {
            const p = this.player;
            ctx.save();
            ctx.translate(p.x + p.size/2, p.y + p.size/2);
            ctx.rotate(p.rotation * Math.PI/180);
            ctx.shadowColor = th.player;
            ctx.shadowBlur = 15;
            ctx.fillStyle = th.player;
            ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size);
            ctx.shadowBlur=0;
            ctx.fillStyle = 'rgba(255,255,255,0.85)';
            ctx.fillRect(-p.size/4, -p.size/4, p.size/2, p.size/2);
            ctx.strokeStyle = '#000';
            ctx.lineWidth=2;
            ctx.strokeRect(-p.size/2, -p.size/2, p.size, p.size);
            ctx.restore();
        }

        document.getElementById('modeInfo').textContent =
            this.player.mode==='fly' ? '✈ FLY MODE' : '';
    }

    loop() {
        this.update();
        this.draw();
        requestAnimationFrame(this.loop);
    }
}

const game = new Game();
</script>
